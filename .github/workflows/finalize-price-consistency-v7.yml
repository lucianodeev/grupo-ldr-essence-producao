name: Finalize price consistency v7
on:
  push:
    paths:
      - 'tools/finalize_price_consistency_v7.py'
      - '.github/workflows/finalize-price-consistency-v7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/finalize_price_consistency_v7.py
      - name: Commit changes
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx \
                  apps/painel-ldr/src/lib/training-commerce.server.ts \
                  apps/painel-ldr/src/components/training-launch-page-v2.tsx \
                  apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: align individual one-time product prices"
          git push origin main