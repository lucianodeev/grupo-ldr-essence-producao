name: Fix regional pricing v2
on:
  push:
    paths:
      - '.github/workflows/fix-regional-pricing-v2-20260825.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch regional prices safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          s = p.read_bytes().decode('utf-8', errors='replace')
          before = s
          s = s.replace('🇧🇷 Brasil — <strong>R$ 4,90</strong> &nbsp;•&nbsp; 🌍 Mundo — <strong>€ 4,90</strong>', '<strong id="ebookPriceNote">€ 4,90</strong>')
          s = s.replace('🇧🇷 Brasil — R$ 4,90 &nbsp;&nbsp;•&nbsp;&nbsp; 🌍 Resto do mundo — € 4,90', '<span id="ebookPriceNote">€ 4,90</span>')
          s = s.replace("function newBookPriceDisplay(){return '🇧🇷 Brasil — R$ 49,90 &nbsp;•&nbsp; 🌍 Mundo — € 20,00';}", 'function newBookPriceDisplay(){return newBookPriceText();}')
          s = s.replace("noteEl.innerHTML = 'Valores de referência: 🇧🇷 Brasil — <strong>R$ 4,90</strong> &nbsp;&nbsp;•&nbsp;&nbsp; 🌍 Resto do mundo — <strong>€ 4,90</strong>. O checkout correto continuará sendo selecionado automaticamente de acordo com sua região.';", "noteEl.innerHTML = userRegion === 'BR' ? 'Preço no Brasil: <strong>R$ 9,90</strong>' : 'Preço internacional: <strong>€ 4,90</strong>';")
          s = s.replace('Brasil — <strong>R$ 4,90</strong>', 'Brasil — <strong>R$ 9,90</strong>')
          s = s.replace('Brasil — R$ 4,90', 'Brasil — R$ 9,90')
          # If a static ebookPriceNote element exists, update it from the already-resolved userRegion.
          marker = "const ebookPriceNote = document.getElementById('ebookPriceNote');"
          if marker not in s and 'function applyRegion()' in s:
              inject = "\n    const ebookPriceNote = document.getElementById('ebookPriceNote');\n    if (ebookPriceNote) ebookPriceNote.innerHTML = userRegion === 'BR' ? '<strong>R$ 9,90</strong>' : '<strong>€ 4,90</strong>';"
              pos = s.find('function applyRegion()')
              brace = s.find('{', pos)
              s = s[:brace+1] + inject + s[brace+1:]
          if s == before:
              print('No textual changes were needed')
          else:
              p.write_bytes(s.encode('utf-8'))
              print('Regional pricing patch applied')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then echo 'No changes needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix regional pricing on production platform'
          git push
