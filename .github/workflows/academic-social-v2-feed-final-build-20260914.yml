name: Academic Social V2 Final Consolidated Build 2026-09-14
on:
  push:
    branches: [feature/rede-academica-social-v2-20260914]
    paths:
      - 'tools/patch_academic_social_v2_feed_20260914.py'
      - 'apps/painel-ldr/supabase/migrations/20260914183500_academic_diary_anon_hardening.sql'
      - '.github/workflows/academic-social-v2-feed-final-build-20260914.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply validated feed pagination and filters patch
        run: python tools/patch_academic_social_v2_feed_20260914.py
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Build Academy
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Commit validated feed integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/lib/academic-network.server.ts apps/painel-ldr/src/lib/academic-network.functions.ts apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "feat(academy): finalize paginated academic feed"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Confirm clean generated integration
        run: git status --short
