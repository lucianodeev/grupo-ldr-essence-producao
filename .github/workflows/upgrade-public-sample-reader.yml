name: Upgrade public sample reader UX

on:
  push:
    branches:
      - feat/public-sample-reader-ux-20260825
    paths:
      - '.github/workflows/upgrade-public-sample-reader.yml'

permissions:
  contents: write

jobs:
  upgrade-reader:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-sample-reader-ux-20260825
          fetch-depth: 0

      - name: Upgrade only the public ebook sample reader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/luciano-empreendedor/index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'ldr-sample-reader-premium-20260825'

          if marker in text:
              print('Premium reader already installed.')
              raise SystemExit(0)
          if 'id="amostra-gratis-ebook"' not in text:
              raise SystemExit('Public sample section not found; refusing to modify.')

          css = r'''
          <style id="ldr-sample-reader-premium-20260825">
          #amostra-gratis-ebook.ldr-v3-sample{
            position:relative;
            padding:clamp(54px,7vw,96px) 18px 150px!important;
            background:
              radial-gradient(circle at 12% 12%,rgba(199,164,90,.14),transparent 28%),
              linear-gradient(145deg,#26070e 0%,#4b101d 55%,#2b0a11 100%)!important;
            color:#f7f2e8;
            overflow:hidden;
          }
          #amostra-gratis-ebook .ldr-v3-wrap{max-width:980px;margin:0 auto;text-align:center}
          #amostra-gratis-ebook .ldr-v3-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(199,164,90,.55);border-radius:999px;background:rgba(199,164,90,.08);color:#e2c67f;font-weight:800;letter-spacing:.12em;font-size:.75rem}
          #amostra-gratis-ebook .ldr-v3-eyebrow{margin:22px 0 7px;color:#e2c67f!important;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
          #amostra-gratis-ebook #sample-title{max-width:760px;margin:0 auto 12px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(2rem,4.3vw,3.55rem);line-height:1.08;color:#fff8e9!important}
          #amostra-gratis-ebook .ldr-v3-sub{max-width:700px;margin:0 auto 30px!important;color:#eadfd7!important;font-size:clamp(1rem,1.7vw,1.12rem);line-height:1.65}
          #amostra-gratis-ebook .ldr-v3-reader{
            --sample-font:19px;
            max-width:790px;
            min-height:560px;
            margin:34px auto 0;
            padding:0!important;
            overflow:hidden;
            text-align:left;
            border:1px solid rgba(199,164,90,.72)!important;
            border-radius:26px!important;
            background:#fffaf0!important;
            color:#2f2020!important;
            box-shadow:0 28px 80px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.65);
          }
          #amostra-gratis-ebook .ldr-reader-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid #e8dcc7;background:#f7eddd;color:#5a2830}
          #amostra-gratis-ebook .ldr-reader-book{min-width:0;display:flex;flex-direction:column;gap:2px}
          #amostra-gratis-ebook .ldr-reader-book strong{font-family:Georgia,'Times New Roman',serif;font-size:1rem;color:#4b101d}
          #amostra-gratis-ebook .ldr-reader-book span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#856d5e}
          #amostra-gratis-ebook .ldr-reader-tools{display:flex;gap:7px;flex-shrink:0}
          #amostra-gratis-ebook .ldr-reader-tool{min-width:38px;height:38px;border:1px solid #d8c8ac;border-radius:12px;background:#fffaf0;color:#4b101d;font-weight:800;cursor:pointer;transition:.18s ease}
          #amostra-gratis-ebook .ldr-reader-tool:hover,#amostra-gratis-ebook .ldr-reader-tool:focus-visible{border-color:#b88d3b;outline:3px solid rgba(199,164,90,.22);transform:translateY(-1px)}
          #amostra-gratis-ebook .ldr-reader-content{padding:clamp(28px,5vw,58px) clamp(24px,7vw,74px) 34px}
          #amostra-gratis-ebook .ldr-v3-chapter-label{margin:0 0 8px!important;color:#a2762b!important;font-size:.75rem!important;font-weight:900!important;letter-spacing:.16em!important;text-transform:uppercase}
          #amostra-gratis-ebook .ldr-v3-reader h3{margin:0 0 28px!important;color:#351017!important;font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(1.75rem,3.3vw,2.5rem)!important;line-height:1.18!important}
          #amostra-gratis-ebook .ldr-sample-pages{position:relative}
          #amostra-gratis-ebook .ldr-sample-page{display:none;animation:ldrPageIn .24s ease}
          #amostra-gratis-ebook .ldr-sample-page.is-active{display:block}
          #amostra-gratis-ebook .ldr-sample-page p{margin:0;color:#382d2b!important;font-family:Georgia,'Times New Roman',serif!important;font-size:var(--sample-font)!important;line-height:1.92!important;letter-spacing:.004em!important;text-align:left!important;max-width:none!important}
          #amostra-gratis-ebook .ldr-sample-page p::first-letter{float:left;margin:.08em .12em 0 0;font-size:3.3em;line-height:.78;color:#a2762b;font-weight:700}
          #amostra-gratis-ebook .ldr-reader-footer{padding:18px clamp(20px,5vw,44px) 22px;border-top:1px solid #e8dcc7;background:#f7eddd}
          #amostra-gratis-ebook .ldr-reader-progress-track{height:5px;border-radius:999px;background:#ded1ba;overflow:hidden;margin-bottom:13px}
          #amostra-gratis-ebook .ldr-reader-progress-bar{display:block;height:100%;width:0;background:linear-gradient(90deg,#b2863c,#d9ba72);transition:width .25s ease}
          #amostra-gratis-ebook .ldr-reader-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
          #amostra-gratis-ebook .ldr-reader-nav button{min-height:42px;padding:9px 14px;border:1px solid #ccb994;border-radius:13px;background:#fffaf0;color:#4b101d;font-weight:800;cursor:pointer}
          #amostra-gratis-ebook .ldr-reader-nav button:last-child{justify-self:end}
          #amostra-gratis-ebook .ldr-reader-nav button:disabled{opacity:.35;cursor:not-allowed}
          #amostra-gratis-ebook .ldr-reader-page-indicator{text-align:center;color:#786458;font-size:.8rem;font-weight:800;white-space:nowrap}
          #amostra-gratis-ebook .ldr-v3-end{margin:22px auto 0!important;padding:15px 18px!important;max-width:790px;border:1px solid rgba(199,164,90,.42)!important;border-radius:15px!important;background:rgba(199,164,90,.09)!important;color:#f5e8c8!important;text-align:center!important;line-height:1.55}
          #amostra-gratis-ebook .ldr-v3-actions{justify-content:center!important;margin-top:22px!important}
          #amostra-gratis-ebook .ldr-v3-gold{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:50px!important;padding:12px 22px!important;border-radius:999px!important;background:linear-gradient(135deg,#d5b56d,#b88d3b)!important;color:#25180c!important;font-weight:900!important;text-decoration:none!important;box-shadow:0 12px 28px rgba(0,0,0,.22)!important}
          #amostra-gratis-ebook .ldr-reader-dark{background:#211418!important;color:#f6ecdd!important}
          #amostra-gratis-ebook .ldr-reader-dark .ldr-reader-topbar,#amostra-gratis-ebook .ldr-reader-dark .ldr-reader-footer{background:#321820!important;border-color:#5d303a!important;color:#f6ecdd}
          #amostra-gratis-ebook .ldr-reader-dark .ldr-reader-book strong,#amostra-gratis-ebook .ldr-reader-dark .ldr-v3-reader h3{color:#f8e8bf!important}
          #amostra-gratis-ebook .ldr-reader-dark .ldr-reader-book span,#amostra-gratis-ebook .ldr-reader-dark .ldr-reader-page-indicator{color:#cdbdaf!important}
          #amostra-gratis-ebook .ldr-reader-dark .ldr-reader-tool,#amostra-gratis-ebook .ldr-reader-dark .ldr-reader-nav button{background:#42222b;color:#f8e8bf;border-color:#76505a}
          #amostra-gratis-ebook .ldr-reader-dark .ldr-sample-page p{color:#f1e8dc!important}
          #amostra-gratis-ebook .ldr-reader-dark .ldr-reader-progress-track{background:#5c4248}
          @keyframes ldrPageIn{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
          @media(max-width:760px){
            #amostra-gratis-ebook.ldr-v3-sample{padding:48px 12px 160px!important}
            #amostra-gratis-ebook .ldr-v3-reader{min-height:0;border-radius:20px!important;margin-top:24px}
            #amostra-gratis-ebook .ldr-reader-topbar{align-items:flex-start;padding:13px}
            #amostra-gratis-ebook .ldr-reader-book strong{font-size:.9rem}
            #amostra-gratis-ebook .ldr-reader-tools{gap:5px}
            #amostra-gratis-ebook .ldr-reader-tool{min-width:35px;height:35px;border-radius:10px}
            #amostra-gratis-ebook .ldr-reader-content{padding:30px 22px 28px}
            #amostra-gratis-ebook .ldr-sample-page p{font-size:var(--sample-font)!important;line-height:1.82!important}
            #amostra-gratis-ebook .ldr-reader-nav{grid-template-columns:1fr 1fr}
            #amostra-gratis-ebook .ldr-reader-page-indicator{grid-column:1/-1;grid-row:1}
            #amostra-gratis-ebook .ldr-reader-nav button{grid-row:2;width:100%}
            #amostra-gratis-ebook .ldr-reader-nav button:last-child{justify-self:stretch}
            body .ldr-floating{right:10px!important;bottom:10px!important}
          }
          </style>
          '''

          js = r'''
          <script id="ldr-sample-reader-premium-js-20260825">
          (() => {
            const init = () => {
              const section = document.getElementById('amostra-gratis-ebook');
              if (!section || section.dataset.premiumReader === '1') return;
              const reader = section.querySelector('.ldr-v3-reader');
              if (!reader) return;
              const chapterLabel = reader.querySelector('.ldr-v3-chapter-label');
              const heading = reader.querySelector('h3');
              const body = Array.from(reader.querySelectorAll('p')).find(p => !p.classList.contains('ldr-v3-chapter-label'));
              const end = reader.querySelector('.ldr-v3-end');
              if (!chapterLabel || !heading || !body) return;

              section.dataset.premiumReader = '1';
              const source = body.textContent.trim();
              const sentences = source.match(/[^.!?]+[.!?]+(?:[”’\"])?|[^.!?]+$/g) || [source];
              const pageCount = Math.min(4, Math.max(3, Math.ceil(sentences.length / 6)));
              const perPage = Math.ceil(sentences.length / pageCount);
              const chunks = [];
              for (let i = 0; i < sentences.length; i += perPage) chunks.push(sentences.slice(i, i + perPage).join(' ').trim());

              const topbar = document.createElement('div');
              topbar.className = 'ldr-reader-topbar';
              topbar.innerHTML = '<div class="ldr-reader-book"><strong>A Coragem de Começar</strong><span>Amostra gratuita · Capítulo 1</span></div><div class="ldr-reader-tools" aria-label="Controles de leitura"><button type="button" class="ldr-reader-tool" data-reader-action="smaller" aria-label="Diminuir tamanho da letra">A−</button><button type="button" class="ldr-reader-tool" data-reader-action="larger" aria-label="Aumentar tamanho da letra">A+</button><button type="button" class="ldr-reader-tool" data-reader-action="theme" aria-label="Alternar modo de leitura">◐</button></div>';

              const content = document.createElement('div');
              content.className = 'ldr-reader-content';
              chapterLabel.parentNode.insertBefore(topbar, chapterLabel);
              content.appendChild(chapterLabel);
              content.appendChild(heading);

              const pages = document.createElement('div');
              pages.className = 'ldr-sample-pages';
              chunks.forEach((txt, index) => {
                const page = document.createElement('article');
                page.className = 'ldr-sample-page' + (index === 0 ? ' is-active' : '');
                page.setAttribute('aria-hidden', index === 0 ? 'false' : 'true');
                const p = document.createElement('p');
                p.textContent = txt;
                page.appendChild(p);
                pages.appendChild(page);
              });
              body.remove();
              content.appendChild(pages);
              reader.appendChild(content);

              const footer = document.createElement('div');
              footer.className = 'ldr-reader-footer';
              footer.innerHTML = '<div class="ldr-reader-progress-track" aria-hidden="true"><span class="ldr-reader-progress-bar"></span></div><div class="ldr-reader-nav"><button type="button" data-reader-nav="prev" aria-label="Página anterior">← Anterior</button><span class="ldr-reader-page-indicator" aria-live="polite"></span><button type="button" data-reader-nav="next" aria-label="Próxima página">Próxima →</button></div>';
              reader.appendChild(footer);
              if (end) reader.parentNode.insertBefore(end, reader.nextSibling);

              let current = 0;
              let font = window.innerWidth <= 760 ? 18 : 19;
              const pageEls = [...pages.children];
              const indicator = footer.querySelector('.ldr-reader-page-indicator');
              const progress = footer.querySelector('.ldr-reader-progress-bar');
              const prev = footer.querySelector('[data-reader-nav="prev"]');
              const next = footer.querySelector('[data-reader-nav="next"]');
              const render = () => {
                pageEls.forEach((el, i) => { el.classList.toggle('is-active', i === current); el.setAttribute('aria-hidden', i === current ? 'false' : 'true'); });
                indicator.textContent = `Página ${current + 1} de ${pageEls.length}`;
                progress.style.width = `${((current + 1) / pageEls.length) * 100}%`;
                prev.disabled = current === 0;
                next.disabled = current === pageEls.length - 1;
              };
              prev.addEventListener('click', () => { if (current > 0) { current--; render(); reader.scrollIntoView({behavior:'smooth',block:'center'}); } });
              next.addEventListener('click', () => { if (current < pageEls.length - 1) { current++; render(); reader.scrollIntoView({behavior:'smooth',block:'center'}); } });
              topbar.addEventListener('click', e => {
                const action = e.target.closest('[data-reader-action]')?.dataset.readerAction;
                if (!action) return;
                if (action === 'smaller') font = Math.max(16, font - 1);
                if (action === 'larger') font = Math.min(24, font + 1);
                if (action === 'theme') reader.classList.toggle('ldr-reader-dark');
                reader.style.setProperty('--sample-font', `${font}px`);
              });
              reader.style.setProperty('--sample-font', `${font}px`);
              render();
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true}); else init();
          })();
          </script>
          '''

          if '</head>' not in text or '</body>' not in text:
              raise SystemExit('Unexpected HTML structure; refusing to modify.')
          text = text.replace('</head>', css + '\n</head>', 1)
          text = text.replace('</body>', js + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Premium public sample reader installed without modifying protected systems.')
          PY

      - name: Validate scope and protected systems
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('apps/luciano-empreendedor/index.html').read_text(encoding='utf-8')
          required = ['ldr-sample-reader-premium-20260825','id="amostra-gratis-ebook"','CAPÍTULO 1','painel.ldrrhestrategia.com/cliente/login']
          for token in required:
              if token not in t:
                  raise SystemExit(f'Missing required token: {token}')
          for token in ['stripe','supabase','id="library"']:
              if token.lower() not in t.lower():
                  raise SystemExit(f'Preservation check failed: {token}')
          print('Scope validation passed.')
          PY

      - name: Commit reader UX
        run: |
          if git diff --quiet -- apps/luciano-empreendedor/index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/luciano-empreendedor/index.html
          git commit -m "feat: upgrade public ebook sample to premium reader"
          git push origin HEAD:feat/public-sample-reader-ux-20260825
