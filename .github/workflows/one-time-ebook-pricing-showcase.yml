name: one-time-ebook-pricing-showcase

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-ebook-pricing-showcase.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Load scoped patch from isolated branch
        run: |
          git fetch origin codex/ebook-pricing-showcase-20260914
          git show origin/codex/ebook-pricing-showcase-20260914:scripts/apply-ebook-pricing-showcase.py > scripts/apply-ebook-pricing-showcase.py
      - name: Apply requested ebook pricing and showcase changes
        run: python scripts/apply-ebook-pricing-showcase.py
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build Academy
        run: npm run build:painel
      - name: Commit only after successful build
        run: |
          rm -f scripts/apply-ebook-pricing-showcase.py
          git rm .github/workflows/one-time-ebook-pricing-showcase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr
          git commit -m "feat: update ebook pricing and sales showcase"
          git push origin HEAD:main
