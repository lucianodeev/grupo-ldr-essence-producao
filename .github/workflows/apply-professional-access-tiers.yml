name: Apply Professional Access Tiers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-professional-access-tiers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply free, Pro and 360 access UX
        run: |
          python - <<'PY'
          from pathlib import Path

          # Server-side entitlement enforcement.
          p=Path('apps/painel-ldr/src/lib/professional-network.server.ts')
          s=p.read_text()
          s=s.replace('db.from("professional_events").select("id,event_type,title,description,instructor,starts_at,ends_at,timezone,published").eq("published", true).gte("starts_at", new Date().toISOString()).order("starts_at").limit(8)', 'db.from("professional_events").select("id,event_type,title,description,instructor,starts_at,ends_at,timezone,published,access_tier").eq("published", true).eq("access_tier", "free").gte("starts_at", new Date().toISOString()).order("starts_at").limit(8)')
          s=s.replace('db.from("professional_events").select("id,event_type,title,description,instructor,starts_at,ends_at,timezone,meeting_url,published").eq("published", true).gte("starts_at", new Date().toISOString()).order("starts_at").limit(12)', 'db.from("professional_events").select("id,event_type,title,description,instructor,starts_at,ends_at,timezone,meeting_url,published,access_tier").eq("published", true).gte("starts_at", new Date().toISOString()).order("starts_at").limit(12)')
          s=s.replace('db.from("community_posts").select("id,post_type,title,body,locale,published_at,created_at").eq("published", true).order("published_at", { ascending: false }).limit(20)', 'db.from("community_posts").select("id,post_type,title,body,locale,published_at,created_at,access_tier").eq("published", true).order("published_at", { ascending: false }).limit(20)')
          old='return { account, profile, subscription: subscription ?? null, plans: plans ?? [], bookings: bookings ?? [], payments: payments ?? [], balances: balances ?? [], payouts: payouts ?? [], documents: documents ?? [], events: events ?? [], community: community ?? [], services: services ?? [], availability: availability ?? [], categories: categories ?? [], config: config ?? [] };'
          new='''const planCode = subscription?.status === "active" ? subscription?.subscription_plans?.plan_code : null;\n  const allowedTiers = new Set<string>(["free"]);\n  if (planCode === "pro" || planCode === "360") allowedTiers.add("pro");\n  if (planCode === "360") allowedTiers.add("360");\n  const visibleEvents = (events ?? []).filter((item: any) => allowedTiers.has(item.access_tier || "pro"));\n  const visibleCommunity = (community ?? []).filter((item: any) => allowedTiers.has(item.access_tier || "pro"));\n  const access = { planCode, free: true, community: planCode === "pro" || planCode === "360", liveTraining: planCode === "pro" || planCode === "360", mentoriaS8: planCode === "360" };\n  return { account, profile, subscription: subscription ?? null, plans: plans ?? [], bookings: bookings ?? [], payments: payments ?? [], balances: balances ?? [], payouts: payouts ?? [], documents: documents ?? [], events: visibleEvents, community: visibleCommunity, services: services ?? [], availability: availability ?? [], categories: categories ?? [], config: config ?? [], access };'''
          if old in s: s=s.replace(old,new)
          p.write_text(s)

          # Sales page: clear free funnel and plan gating.
          p=Path('apps/painel-ldr/src/routes/para-profissionais.tsx')
          s=p.read_text()
          s=s.replace('Perfil profissional, estrutura digital, treinamentos ao vivo, comunidade e ferramentas reunidas em um único ambiente.', 'Perfil profissional e estrutura digital em um único ambiente. Comunidade, treinamentos ao vivo e ferramentas avançadas são liberados conforme o plano contratado.')
          marker='   <section className="mx-auto max-w-7xl px-4 py-14 sm:px-6"><p className="text-xs font-black uppercase tracking-[.18em] text-primary">Rede LDR</p>'
          free='''   <section className="border-b bg-secondary/10"><div className="mx-auto max-w-7xl px-4 py-10 sm:px-6"><div className="grid gap-5 lg:grid-cols-[1.2fr_.8fr]"><div><p className="text-xs font-black uppercase tracking-[.18em] text-primary">COMECE GRATUITAMENTE</p><h2 className="mt-2 font-serif text-3xl">Mesmo sem assinatura, você continua dentro do ecossistema.</h2><p className="mt-3 max-w-3xl text-sm leading-6 text-muted-foreground">Acesse palestras e eventos marcados como gratuitos, conteúdos abertos e orientação inicial pelo WhatsApp. Quando quiser ampliar sua estrutura profissional, escolha o plano que combina com seu momento.</p><div className="mt-5 flex flex-wrap gap-3"><a href="https://chat.whatsapp.com/IMk7F1zg2rZJdj9NWC664G?s=cl&p=i&ilr=0" target="_blank" rel="noreferrer" className="rounded-xl bg-primary px-5 py-3 font-black text-primary-foreground">PALESTRA / GRUPO GRATUITO</a><a href="https://wa.me/32492923605?text=Ol%C3%A1%21%20Quero%20uma%20orienta%C3%A7%C3%A3o%20inicial%20sobre%20a%20Rede%20de%20Profissionais%20LDR." target="_blank" rel="noreferrer" className="rounded-xl border border-primary px-5 py-3 font-black text-primary">FALAR NO WHATSAPP</a></div></div><div className="rounded-3xl border bg-card p-6"><p className="text-xs font-black uppercase tracking-wide text-primary">ESCADA DE VALOR</p><div className="mt-4 space-y-3 text-sm"><p><b>Gratuito:</b> palestras/eventos gratuitos + conteúdos abertos + orientação inicial.</p><p><b>Profissional:</b> perfil + agenda + checkout + financeiro.</p><p><b>Pro:</b> tudo do Profissional + comunidade + treinamentos ao vivo.</p><p><b>360:</b> tudo do Pro + Mentoria LDR + S8 + ferramentas ampliadas.</p></div></div></div></div></section>\n'''
          if 'COMECE GRATUITAMENTE' not in s and marker in s: s=s.replace(marker,free+marker)
          s=s.replace('<p className="mt-2 text-xs leading-5 text-muted-foreground">Pagamento mensal. Cancele a renovação quando quiser e continue usando até o fim do ciclo já pago.</p>', '<p className="mt-2 text-xs leading-5 text-muted-foreground">Pagamento mensal. Cancele a renovação quando quiser e continue usando até o fim do ciclo já pago.</p><p className="mt-3 rounded-xl bg-muted px-3 py-2 text-xs font-bold">{p.plan_code==="professional"?"Comunidade e treinamentos premium ficam disponíveis no Pro e no 360. Recursos gratuitos continuam acessíveis.":p.plan_code==="pro"?"Inclui comunidade profissional e treinamentos ao vivo.":"Inclui comunidade, treinamentos ao vivo, Mentoria LDR, S8 e ferramentas ampliadas."}</p>')
          p.write_text(s)

          # Professional dashboard: make access status obvious and keep free path visible.
          p=Path('apps/painel-ldr/src/routes/profissional-painel.tsx')
          s=p.read_text()
          needle='<Link to="/profissional-ferramentas" className="mt-3 inline-block text-sm font-black text-primary underline">ABRIR FERRAMENTAS</Link></div></section>'
          replacement='''<Link to="/profissional-ferramentas" className="mt-3 inline-block text-sm font-black text-primary underline">ABRIR FERRAMENTAS</Link></div><div className="mt-3 grid gap-3 lg:grid-cols-2"><div className="rounded-2xl border bg-card p-4"><p className="text-xs font-black uppercase tracking-wide text-primary">ACESSO GRATUITO SEMPRE DISPONÍVEL</p><p className="mt-2 text-sm text-muted-foreground">Palestras e eventos marcados como gratuitos, conteúdos abertos e orientação inicial no WhatsApp continuam disponíveis mesmo sem Pro ou 360.</p><div className="mt-3 flex flex-wrap gap-2"><a href="https://chat.whatsapp.com/IMk7F1zg2rZJdj9NWC664G?s=cl&p=i&ilr=0" target="_blank" rel="noreferrer" className="text-sm font-black text-primary underline">PALESTRA / GRUPO GRATUITO</a><a href="https://wa.me/32492923605?text=Quero%20orienta%C3%A7%C3%A3o%20sobre%20a%20Rede%20LDR" target="_blank" rel="noreferrer" className="text-sm font-black text-primary underline">WHATSAPP</a></div></div><div className="rounded-2xl border bg-card p-4"><p className="text-xs font-black uppercase tracking-wide text-primary">O QUE ESTÁ INCLUÍDO NO MEU PLANO</p><p className="mt-2 text-sm text-muted-foreground">{data?.access?.community?"✓ Comunidade LDR liberada":"🔒 Comunidade LDR — disponível no Pro e 360"}</p><p className="mt-1 text-sm text-muted-foreground">{data?.access?.liveTraining?"✓ Treinamentos ao vivo liberados":"🔒 Treinamentos ao vivo — disponíveis no Pro e 360"}</p><p className="mt-1 text-sm text-muted-foreground">{data?.access?.mentoriaS8?"✓ Mentoria LDR + S8 liberados":"🔒 Mentoria LDR + S8 — disponíveis no 360"}</p><Link to="/profissional-assinatura" className="mt-3 inline-block text-sm font-black text-primary underline">VER PLANOS E RECURSOS</Link></div></div></section>'''
          if needle in s: s=s.replace(needle,replacement)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "ldr-rh-campanhas"
            git config user.email "llucianouam@gmail.com"
            git add apps/painel-ldr/src/lib/professional-network.server.ts apps/painel-ldr/src/routes/para-profissionais.tsx apps/painel-ldr/src/routes/profissional-painel.tsx
            git commit -m "feat(network): aplica acesso gratuito e benefícios por plano"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/painel-ldr
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: apps/painel-ldr
        run: npm run build
