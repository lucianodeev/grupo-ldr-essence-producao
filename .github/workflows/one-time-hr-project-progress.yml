name: One time HR paid project progress
on:
  push:
    paths: ['.github/workflows/one-time-hr-project-progress.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch HR project and progress
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/painel-ldr/src/lib/legacy-training-projects.server.ts');s=p.read_text();m='  "psicanalise-internacional-neurodiversidade-autismo":{productKey:"curso_psicanalise_internacional_neurodiversidade_autismo",title:"Psicanálise Internacional, Neurodiversidade e Autismo"},\n';a='  "formacao-gratuita-gestao-pessoas-rh":{productKey:"formacao_gestao_pessoas_rh",title:"Formação em Gestão de Pessoas e Recursos Humanos"},\n';s=s if '"formacao-gratuita-gestao-pessoas-rh"' in s else s.replace(m,m+a,1);p.write_text(s)
          p=Path('apps/painel-ldr/src/routes/_clientarea.tsx');s=p.read_text();m='  if(pathname==="/cliente/treinamentos/psicanalise-internacional")return "psicanalise-internacional-neurodiversidade-autismo";\n';a='  if(pathname==="/cliente/formacoes/gestao-pessoas-rh")return "formacao-gratuita-gestao-pessoas-rh";\n';s=s if 'return "formacao-gratuita-gestao-pessoas-rh"' in s else s.replace(m,m+a,1);p.write_text(s)
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.formacoes.gestao-pessoas-rh.tsx');s=p.read_text()
          s=s.replace('import{clientCreateHrFormationCheckout,clientFreeHrFormation}from"@/lib/free-hr-formation.functions";','import{clientCreateHrFormationCheckout,clientFreeHrFormation}from"@/lib/free-hr-formation.functions";import{clientSaveProgress}from"@/lib/learning.functions";')
          s=s.replace('function Course(){const offerFn=useServerFn(clientFreeHrFormation),checkoutFn=useServerFn(clientCreateHrFormationCheckout);','function Course(){const offerFn=useServerFn(clientFreeHrFormation),checkoutFn=useServerFn(clientCreateHrFormationCheckout),saveProgressFn=useServerFn(clientSaveProgress);')
          old='onClick={()=>setS(v=>({...v,completed:v.completed.includes(u.id)?v.completed:[...v.completed,u.id]}))}'
          new='onClick={()=>setS(v=>{const completed=v.completed.includes(u.id)?v.completed:[...v.completed,u.id];const progressPercent=Math.round(completed.length/FREE_HR_UNITS.length*100);saveProgressFn({data:{productKey:"formacao_gestao_pessoas_rh",progressPercent,currentLocation:u.id}});return{...v,completed}})}'
          s=s.replace(old,new,1);p.write_text(s)
      - name: Commit
        run: |
          git config user.name ldr-rh-campanhas
          git config user.email llucianouam@gmail.com
          git add apps/painel-ldr/src/lib/legacy-training-projects.server.ts apps/painel-ldr/src/routes/_clientarea.tsx apps/painel-ldr/src/routes/_clientarea.cliente.formacoes.gestao-pessoas-rh.tsx
          git commit -m "fix: require project flow for paid HR formation" || exit 0
          git push
