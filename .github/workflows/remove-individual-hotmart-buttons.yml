name: Remove individual Hotmart buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-individual-hotmart-buttons.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Hotmart only on combo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          anchor='''<a href={HOTMART_CHECKOUT_URL} target="_blank" rel="noopener noreferrer" className="mt-2 inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl bg-[#ff5a1f] px-4 py-3 text-sm font-bold text-white"><ShoppingCart className="h-4 w-4"/>{HOTMART_LABEL[locale]}</a>'''
          count=s.count(anchor)
          if count < 2:
              raise SystemExit(f'Expected at least 2 individual Hotmart buttons, found {count}')
          # These rounded-xl anchors are the individual product/training cards only.
          # The combo keeps its distinct rounded-2xl Hotmart button unchanged.
          s=s.replace(anchor,'')
          p.write_text(s)
          PY
      - name: Commit focused cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet || git commit -m "fix: keep Hotmart checkout only on combo offer"
          git push
