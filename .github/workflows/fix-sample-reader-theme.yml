name: Polish sample reader theme
on:
  push:
    branches: [feat/public-sample-reader-ux-20260825]
    paths: ['.github/workflows/fix-sample-reader-theme.yml']
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-sample-reader-ux-20260825
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/luciano-empreendedor/index.html')
          t=p.read_text(encoding='utf-8')
          old="#amostra-gratis-ebook .ldr-reader-dark .ldr-reader-book strong,#amostra-gratis-ebook .ldr-reader-dark .ldr-v3-reader h3{color:#f8e8bf!important}"
          new="#amostra-gratis-ebook .ldr-reader-dark .ldr-reader-book strong,#amostra-gratis-ebook .ldr-reader-dark h3{color:#f8e8bf!important}"
          if old not in t: raise SystemExit('Expected reader theme selector not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/luciano-empreendedor/index.html
          git commit -m "fix: polish dark reading mode heading"
          git push origin HEAD:feat/public-sample-reader-ux-20260825
