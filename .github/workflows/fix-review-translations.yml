          text = text.replace(marker, insert, 1)
          old = '<p className="mt-2 text-sm leading-6">{r.body}</p>'
          new = '<p className="mt-2 text-sm leading-6">{reviewText(r, locale)}</p>'
          if old not in text:
              raise SystemExit('review body marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
