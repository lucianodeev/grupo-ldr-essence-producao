name: Embed training forums and payment contact
on:
  push:
    branches: [main]
    paths:
      - 'tools/embed_forums_and_payment_contact.py'
      - '.github/workflows/embed-forums-payment-contact.yml'
permissions:
  contents: write
jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python tools/embed_forums_and_payment_contact.py
      - name: Validate build
        working-directory: apps/painel-ldr
        run: |
          npm install
          npm run build
      - name: Commit validated changes
        run: |
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src/components/psychoanalysis-training-page.tsx apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.do-mamao-ao-negocio.tsx apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.tsx apps/painel-ldr/src/routes/_clientarea.cliente.tsx apps/painel-ldr/src/routeTree.gen.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: embed forums inside training experiences'
          git push origin main
