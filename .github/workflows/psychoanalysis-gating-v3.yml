name: Psychoanalysis pacing v3
on:
  push:
    paths:
      - 'tools/psychoanalysis_gating_v3.py'
      - '.github/workflows/psychoanalysis-gating-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply pacing and certificate UX
        run: python tools/psychoanalysis_gating_v3.py
      - name: Commit changes
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce psychoanalysis daily pacing and certificate access"
          git push origin main
