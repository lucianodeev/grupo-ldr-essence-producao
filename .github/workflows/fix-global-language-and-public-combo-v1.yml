name: Sincronizar idiomas e combo público
on:
  push:
    paths:
      - '.github/workflows/fix-global-language-and-public-combo-v1.yml'
permissions:
  contents: write
jobs:
  fix-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Corrigir idioma global, leitores e combo público
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('apps/painel-ldr/src')

          # 1) Idioma global: ?lang= tem prioridade e toda troca atualiza a URL.
          p=root/'lib/i18n.tsx'
          t=p.read_text()
          old='''function detect(): Locale {\n  if (typeof window === "undefined") return "pt";\n  const saved = window.localStorage.getItem(STORAGE_KEY);\n  if (saved && (LOCALES as readonly string[]).includes(saved)) return saved as Locale;\n  const nav = window.navigator.language?.slice(0, 2).toLowerCase();\n  return (LOCALES as readonly string[]).includes(nav ?? "") ? (nav as Locale) : "pt";\n}'''
          new='''function detect(): Locale {\n  if (typeof window === "undefined") return "pt";\n  const query = new URLSearchParams(window.location.search).get("lang")?.slice(0, 2).toLowerCase();\n  if (query && (LOCALES as readonly string[]).includes(query)) return query as Locale;\n  const saved = window.localStorage.getItem(STORAGE_KEY);\n  if (saved && (LOCALES as readonly string[]).includes(saved)) return saved as Locale;\n  const nav = window.navigator.language?.slice(0, 2).toLowerCase();\n  return (LOCALES as readonly string[]).includes(nav ?? "") ? (nav as Locale) : "pt";\n}'''
          assert old in t, 'detect() não encontrado'
          t=t.replace(old,new)
          old2='''  const setLocale = useCallback((l: Locale) => {\n    setLocaleState(l);\n    try {\n      window.localStorage.setItem(STORAGE_KEY, l);\n    } catch {\n      /* armazenamento indisponível */\n    }\n  }, []);'''
          new2='''  const setLocale = useCallback((l: Locale) => {\n    setLocaleState(l);\n    try {\n      window.localStorage.setItem(STORAGE_KEY, l);\n      const url = new URL(window.location.href);\n      url.searchParams.set("lang", l);\n      window.history.replaceState(window.history.state, "", `${url.pathname}${url.search}${url.hash}`);\n      document.documentElement.lang = l;\n    } catch {\n      /* armazenamento/URL indisponível */\n    }\n  }, []);'''
          assert old2 in t, 'setLocale global não encontrado'
          t=t.replace(old2,new2)
          p.write_text(t)

          # 2) Leitor de eBook/Livro sincroniza com idioma global nos dois sentidos.
          p=root/'components/digital-reader-v2.tsx'
          t=p.read_text()
          old=''' const {locale:appLocale}=useI18n();const initial=(appLocale==="pt"||appLocale==="en"||appLocale==="fr"||appLocale==="es"?appLocale:"pt") as Locale;\n const [locale,setLocale]=useState<Locale>(initial);'''
          new=''' const {locale:appLocale,setLocale:setGlobalLocale}=useI18n();const initial=(appLocale==="pt"||appLocale==="en"||appLocale==="fr"||appLocale==="es"?appLocale:"pt") as Locale;\n const [locale,setLocale]=useState<Locale>(initial);'''
          assert old in t, 'inicialização do leitor não encontrada'
          t=t.replace(old,new)
          anchor=''' useEffect(()=>{try{localStorage.setItem(`ldr-reader-${productKey}-theme`,theme);localStorage.setItem(`ldr-reader-${productKey}-scale`,String(scale));}catch{}},[theme,scale,productKey]);'''
          extra=anchor+'''\n useEffect(()=>{if((appLocale==="pt"||appLocale==="en"||appLocale==="fr"||appLocale==="es")&&appLocale!==locale)setLocale(appLocale as Locale)},[appLocale,locale]);'''
          assert anchor in t, 'anchor de efeitos do leitor não encontrado'
          t=t.replace(anchor,extra)
          oldsel='''<select value={locale} onChange={e=>setLocale(e.target.value as Locale)} className="bg-transparent outline-none">'''
          newsel='''<select value={locale} onChange={e=>{const next=e.target.value as Locale;setLocale(next);setGlobalLocale(next)}} className="bg-transparent outline-none">'''
          assert oldsel in t, 'select do leitor não encontrado'
          t=t.replace(oldsel,newsel)
          p.write_text(t)

          # 3) Card do Combo também na página pública, usando exatamente a identidade vinho/dourado/creme.
          p=root/'components/training-launch-page-v2.tsx'
          t=p.read_text()
          old='''export function TrainingLaunchPageV2(){\n const {locale}=useI18n();const c=COPY[locale];'''
          new='''export function TrainingLaunchPageV2(){\n const {locale}=useI18n();const c=COPY[locale];\n const combo={\n  badge:locale==="pt"?"COMBO DE LANÇAMENTO":locale==="fr"?"COMBO DE LANCEMENT":locale==="es"?"COMBO DE LANZAMIENTO":"LAUNCH COMBO",\n  kicker:locale==="pt"?"3 PRODUTOS PELO PREÇO PROMOCIONAL DA FORMAÇÃO":locale==="fr"?"3 PRODUITS AU PRIX PROMOTIONNEL DE LA FORMATION":locale==="es"?"3 PRODUCTOS POR EL PRECIO PROMOCIONAL DE LA FORMACIÓN":"3 PRODUCTS FOR THE TRAINING LAUNCH PRICE",\n  title:locale==="pt"?"Combo Empreendedor — Formação Completa":locale==="fr"?"Combo Entrepreneur — Formation Complète":locale==="es"?"Combo Emprendedor — Formación Completa":"Entrepreneur Combo — Complete Training",\n  desc:locale==="pt"?"eBook A Coragem de Começar + Livro O Menino que Vendia Mamão + Formação Do Mamão ao Negócio.":locale==="fr"?"eBook Le Courage de Commencer + Livre Le Garçon qui Vendait des Papayes + Formation De la Papaye à l’Entreprise.":locale==="es"?"eBook El Coraje de Empezar + Libro El Niño que Vendía Papayas + Formación De la Papaya al Negocio.":"The Courage to Begin eBook + The Boy Who Sold Papaya book + From Papaya to Business training.",\n  separate:locale==="pt"?"Separadamente: € 74,80":locale==="fr"?"Séparément : 74,80 €":locale==="es"?"Por separado: € 74,80":"Separately: €74.80",\n  saving:locale==="pt"?"Economia: € 24,90":locale==="fr"?"Économie : 24,90 €":locale==="es"?"Ahorro: € 24,90":"You save: €24.90",\n  cta:locale==="pt"?"QUERO O COMBO COMPLETO":locale==="fr"?"JE VEUX LE COMBO COMPLET":locale==="es"?"QUIERO EL COMBO COMPLETO":"I WANT THE COMPLETE COMBO",\n  note:locale==="pt"?"Pagamento único · acesso vitalício aos conteúdos digitais":locale==="fr"?"Paiement unique · accès à vie aux contenus numériques":locale==="es"?"Pago único · acceso vitalicio a los contenidos digitales":"One-time payment · lifetime access to digital content"\n };'''
          assert old in t, 'início da página pública não encontrado'
          t=t.replace(old,new)
          anchor='''   <section className="py-10 text-center"><h2 className="font-serif text-3xl font-bold sm:text-4xl">{c.headline}</h2>'''
          combo_jsx='''   <section className="my-8 overflow-hidden rounded-[2rem] border-2 border-[#d7ad54] bg-[#5b0824] p-6 text-white shadow-2xl shadow-[#5b0824]/20 sm:p-8" data-public-combo-card="v1">\n    <div className="flex flex-wrap items-center gap-2"><span className="rounded-full bg-[#d7ad54] px-3 py-1.5 text-xs font-black uppercase tracking-[.12em] text-[#42111d]">🔥 {combo.badge}</span><span className="rounded-full bg-white/10 px-3 py-1.5 text-xs font-bold">{combo.kicker}</span></div>\n    <h2 className="mt-5 font-serif text-3xl font-bold text-[#fff5df] sm:text-4xl">{combo.title}</h2><p className="mt-3 max-w-3xl text-base leading-7 text-[#f5dfac]">{combo.desc}</p>\n    <div className="mt-6 grid gap-3 sm:grid-cols-3"><div className="rounded-2xl bg-white/10 p-4"><strong>📘 eBook</strong><p className="mt-1 text-sm text-[#f5dfac]">A Coragem de Começar</p></div><div className="rounded-2xl bg-white/10 p-4"><strong>📕 {locale==="fr"?"Livre":locale==="en"?"Book":locale==="es"?"Libro":"Livro"}</strong><p className="mt-1 text-sm text-[#f5dfac]">O Menino que Vendia Mamão</p></div><div className="rounded-2xl bg-white/10 p-4"><strong>🎓 {locale==="fr"?"Formation":locale==="en"?"Training":locale==="es"?"Formación":"Formação"}</strong><p className="mt-1 text-sm text-[#f5dfac]">90 dias · 300 horas</p></div></div>\n    <div className="mt-7"><p className="text-sm text-white/65 line-through">{combo.separate}</p><strong className="mt-1 block text-4xl text-[#f0ca73]">€ 49,90</strong><p className="mt-2 font-black text-emerald-300">{combo.saving}</p></div>\n    <a href={`${PANEL}/cliente/biblioteca?combo=1&lang=${locale}`} className="mt-7 inline-flex min-h-14 w-full items-center justify-center rounded-2xl bg-[#d7ad54] px-5 py-4 text-center text-sm font-black text-[#42111d] shadow-lg sm:w-auto sm:min-w-[320px]">{combo.cta}<ArrowRight className="ml-2 h-4 w-4"/></a><p className="mt-4 text-sm text-[#f5dfac]">{combo.note}</p>\n   </section>\n'''+anchor
          assert anchor in t, 'anchor para inserir combo público não encontrado'
          t=t.replace(anchor,combo_jsx)
          p.write_text(t)

          # 4) Padronizar visual do card do Combo dentro da Biblioteca com o mesmo vinho/dourado/creme.
          p=root/'routes/_clientarea.cliente.biblioteca.tsx'
          t=p.read_text()
          marker='COMBO DE LANÇAMENTO'
          idx=t.find(marker)
          assert idx!=-1, 'card do combo na Biblioteca não encontrado'
          start=t.rfind('<section',0,idx)
          end=t.find('</section>',idx)
          assert start!=-1 and end!=-1, 'limites do card do combo não encontrados'
          seg=t[start:end+10]
          seg=seg.replace('border-[#d5aa45]','border-[#d7ad54]').replace('border-[#d9aa3f]','border-[#d7ad54]')
          seg=seg.replace('bg-[#4a0a20]','bg-[#5b0824]').replace('bg-[#510b25]','bg-[#5b0824]').replace('bg-[#5a0b27]','bg-[#5b0824]').replace('bg-[#6d0d2e]','bg-[#5b0824]')
          seg=seg.replace('bg-[#d9aa3f]','bg-[#d7ad54]').replace('text-[#3d0818]','text-[#42111d]')
          # Força a superfície principal do card para a mesma cor padrão, sem mexer em cards internos/transparências.
          seg=re.sub(r'(<section[^>]*className="[^"]*)bg-\[[^\]]+\]([^\"]*)"',r'\1bg-[#5b0824]\2"',seg,count=1)
          t=t[:start]+seg+t[end+10:]
          p.write_text(t)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/painel-ldr/package-lock.json
      - name: Instalar dependências
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Validar build
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Publicar correções
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/lib/i18n.tsx apps/painel-ldr/src/components/digital-reader-v2.tsx apps/painel-ldr/src/components/training-launch-page-v2.tsx apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git commit -m "fix: sincronizar idiomas e publicar combo na página do treinamento" || exit 0
          git push origin main
