name: Fix library single combo card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-library-single-combo-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only combo wine card and correct price
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()

          first_start='    {trainingOffer?.launchPromotionActive&&!trainingOffer.entitled?<section className="overflow-hidden rounded-3xl border border-[#d7ad54] bg-[#5b0824]'
          combo_start='    <section className="overflow-hidden rounded-3xl border-2 border-[#d7ad54] bg-gradient-to-br from-[#35101e] to-[#5b0824]'
          i=s.find(first_start)
          j=s.find(combo_start)
          if i<0 or j<0 or j<=i:
              raise SystemExit('Wine-card markers not found')
          s=s[:i]+s[j:]

          old='''<div className="mt-5"><p className="text-sm text-white/70 line-through">{market==="BR"?"Separadamente: R$ 359,79":"Separadamente: € 74,80"}</p><strong className="mt-1 block text-4xl text-[#f1c45d]">{market==="BR"?"R$ 299,99":"€ 65,34"}</strong><p className="mt-1 text-sm font-bold text-emerald-300">{market==="BR"?"Economia: R$ 59,80":"Economia: € 9,46"}</p></div>'''
          new='''<div className="mt-5"><p className="text-xs font-black uppercase tracking-[.12em] text-[#f5dfac]">{locale==="pt"?"3 PRODUTOS POR ESTE VALOR":locale==="fr"?"3 PRODUITS POUR CE PRIX":locale==="es"?"3 PRODUCTOS POR ESTE PRECIO":"3 PRODUCTS FOR THIS PRICE"}</p><strong className="mt-2 block text-4xl text-[#f1c45d]">{market==="BR"?(locale==="pt"?"12x de R$ 31,03":"12x R$ 31.03"):(locale==="fr"?"65,34 €":"€ 65,34")}</strong></div>'''
          if old not in s:
              raise SystemExit('Combo price block not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit library fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet || git commit -m "fix: keep one combo offer card in library"
          git push
