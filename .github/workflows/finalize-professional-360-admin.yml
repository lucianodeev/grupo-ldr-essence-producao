name: Finalize Professional 360 Admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-professional-360-admin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add admin navigation and legal transparency
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/painel-ldr/src/routes/_authenticated/painel-profissional.tsx')
          s=p.read_text(encoding='utf-8')
          if '/painel-profissional/rede-planos' not in s:
            s=s.replace('{ to: "/painel-profissional/rede-servicos", extra: "networkServices", superOnly: true },','{ to: "/painel-profissional/rede-servicos", extra: "networkServices", superOnly: true },\n  { to: "/painel-profissional/rede-planos", extra: "networkPlans", superOnly: true },')
            s=s.replace('networkServices: "Rede · Serviços", networkFinance:', 'networkServices: "Rede · Serviços", networkPlans: "Rede · Planos", networkFinance:')
            s=s.replace('networkServices: "Network · Services", networkFinance:', 'networkServices: "Network · Services", networkPlans: "Network · Plans", networkFinance:')
            s=s.replace('networkServices: "Réseau · Services", networkFinance:', 'networkServices: "Réseau · Services", networkPlans: "Réseau · Plans", networkFinance:')
            s=s.replace('networkServices: "Red · Servicios", networkFinance:', 'networkServices: "Red · Servicios", networkPlans: "Red · Planes", networkFinance:')
          p.write_text(s,encoding='utf-8')

          p=Path('apps/painel-ldr/src/routes/rede-profissionais.termos.tsx')
          s=p.read_text(encoding='utf-8')
          old='["Termos para Profissionais","O profissional é responsável pela veracidade de seus dados, títulos, qualificações, registros e serviços. Títulos sujeitos a requisitos profissionais ou legais podem permanecer em revisão até validação. A assinatura mensal é separada da comissão sobre atendimentos pagos pelo marketplace."],'
          new='["Termos para Profissionais","O profissional é responsável pela veracidade de seus dados, títulos, qualificações, registros e serviços. Títulos sujeitos a requisitos profissionais ou legais podem permanecer em revisão até validação. A assinatura mensal é separada da comissão sobre atendimentos pagos pelo marketplace. Os planos Profissional, Profissional Pro e Profissional 360 LDR funcionam por ciclo mensal: o cancelamento interrompe a próxima renovação, mas mantém o acesso até o fim do período já pago. O 360 pode incluir Mentoria LDR e Sistema S8 enquanto a assinatura elegível estiver ativa."],'
          if old in s: s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          checks=[
            ('apps/painel-ldr/src/routes/_authenticated/painel-profissional.tsx','networkPlans'),
            ('apps/painel-ldr/src/routes/rede-profissionais.termos.tsx','Profissional 360 LDR'),
          ]
          for path,text in checks:
            if text not in Path(path).read_text(encoding='utf-8'):
              raise SystemExit(f'Missing update: {path} -> {text}')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate final build
        working-directory: apps/painel-ldr
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit safely
        run: |
          git restore apps/painel-ldr/package-lock.json 2>/dev/null || true
          if git diff --quiet; then exit 0; fi
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src
          git commit -m 'feat(network): finaliza administração e termos do plano 360'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
