name: LDR ONE Stripe sandbox preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-preflight:
    runs-on: ubuntu-latest
    environment: ldr-one-sandbox
    timeout-minutes: 5
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.LDR_ONE_STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.LDR_ONE_STRIPE_TEST_WEBHOOK_SECRET }}
      TEST_PRICE_INDIVIDUAL_MONTHLY: ${{ vars.LDR_ONE_TEST_PRICE_INDIVIDUAL_MONTHLY }}
      TEST_PRICE_INDIVIDUAL_ANNUAL: ${{ vars.LDR_ONE_TEST_PRICE_INDIVIDUAL_ANNUAL }}
      TEST_PRICE_BUSINESS_MONTHLY: ${{ vars.LDR_ONE_TEST_PRICE_BUSINESS_MONTHLY }}
      TEST_PRICE_BUSINESS_ANNUAL: ${{ vars.LDR_ONE_TEST_PRICE_BUSINESS_ANNUAL }}
    steps:
      - name: Diagnose sandbox configuration without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const checks=[
            ["Stripe test API key", "STRIPE_TEST_SECRET_KEY", /^sk_test_[A-Za-z0-9]+$/],
            ["Stripe test webhook secret", "STRIPE_TEST_WEBHOOK_SECRET", /^whsec_[A-Za-z0-9]+$/],
            ["Individual monthly test price", "TEST_PRICE_INDIVIDUAL_MONTHLY", /^price_[A-Za-z0-9]+$/],
            ["Individual annual test price", "TEST_PRICE_INDIVIDUAL_ANNUAL", /^price_[A-Za-z0-9]+$/],
            ["Business monthly test price", "TEST_PRICE_BUSINESS_MONTHLY", /^price_[A-Za-z0-9]+$/],
            ["Business annual test price", "TEST_PRICE_BUSINESS_ANNUAL", /^price_[A-Za-z0-9]+$/]
          ];
          let failed=false;
          for(const [label,key,pattern] of checks){
            const value=process.env[key]??"";
            const status=!value?"MISSING":pattern.test(value)?"PRESENT":"INVALID FORMAT";
            console.log(label+": "+status);
            if(status!=="PRESENT")failed=true;
          }
          if(failed){
            console.error("Sandbox configuration incomplete. Fix only the items marked MISSING or INVALID FORMAT in the ldr-one-sandbox environment.");
            process.exitCode=1;
          }
          NODE
      - name: Validate Stripe test-only credentials and read-only prices
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const secret=process.env.STRIPE_TEST_SECRET_KEY??"";
          const webhook=process.env.STRIPE_TEST_WEBHOOK_SECRET??"";
          if(!/^sk_test_[A-Za-z0-9]+$/.test(secret))throw Error("Configure a Stripe sk_test_ key in the sandbox environment; live keys are forbidden.");
          if(!/^whsec_[A-Za-z0-9]+$/.test(webhook))throw Error("Configure the isolated test webhook signing secret.");
          const expected=[["TEST_PRICE_INDIVIDUAL_MONTHLY",3990,"month"],["TEST_PRICE_INDIVIDUAL_ANNUAL",39900,"year"],["TEST_PRICE_BUSINESS_MONTHLY",1990,"month"],["TEST_PRICE_BUSINESS_ANNUAL",19900,"year"]];
          const seen=new Set();
          for(const [key,amount,interval] of expected){
            const id=process.env[key]??"";
            if(!/^price_[A-Za-z0-9]+$/.test(id)||seen.has(id))throw Error("Missing, malformed or duplicate test price: "+key);
            seen.add(id);
            const response=await fetch("https://api.stripe.com/v1/prices/"+encodeURIComponent(id),{headers:{Authorization:"Bearer "+secret},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw Error("Stripe test lookup failed for "+key+" (HTTP "+response.status+")");
            const price=await response.json();
            if(price.livemode!==false||price.active!==true||price.currency!=="eur"||price.unit_amount!==amount||price.type!=="recurring"||price.recurring?.interval!==interval||price.recurring?.interval_count!==1)throw Error("Test price configuration mismatch: "+key);
            console.log(key+": verified in Stripe test mode");
          }
          console.log("Four test prices verified with read-only requests; no charges, checkout or production changes.");
          NODE
