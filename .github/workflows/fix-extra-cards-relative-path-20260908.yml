name: Fix extra cards relative path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-extra-cards-relative-path-20260908.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix main relative script path
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/luciano-empreendedor/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="/extra-product-cards-v2.js?v=20260904-v2"','src="./extra-product-cards-v2.js?v=20260908-v4"')
          s=s.replace('src="/extra-product-cards-v2.js?v=20260904-v3"','src="./extra-product-cards-v2.js?v=20260908-v4"')
          s=s.replace('src="/extra-product-cards-v2.js?v=20260904-v4"','src="./extra-product-cards-v2.js?v=20260908-v4"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'src="./extra-product-cards-v2.js?v=20260908-v4"' apps/luciano-empreendedor/index.html
          test -f apps/luciano-empreendedor/extra-product-cards-v2.js

      - name: Commit main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/luciano-empreendedor/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix public: usar caminho relativo nos cards extras'
            git push origin main
          fi

      - name: Fix GitHub Pages relative script path
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gh-pages/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="/extra-product-cards-v2.js?v=20260904-v2"','src="./extra-product-cards-v2.js?v=20260908-v4"')
          s=s.replace('src="/extra-product-cards-v2.js?v=20260904-v3"','src="./extra-product-cards-v2.js?v=20260908-v4"')
          s=s.replace('src="/extra-product-cards-v2.js?v=20260904-v4"','src="./extra-product-cards-v2.js?v=20260908-v4"')
          p.write_text(s,encoding='utf-8')
          PY
          cd /tmp/gh-pages
          grep -q 'src="./extra-product-cards-v2.js?v=20260908-v4"' index.html
          test -f extra-product-cards-v2.js
          git switch -c gh-pages-relative-fix --track origin/gh-pages
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix pages: usar caminho relativo nos cards extras'
            git push origin HEAD:gh-pages
          fi
