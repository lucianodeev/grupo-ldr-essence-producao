name: Fix preview language control desktop
on:
  push:
    paths:
      - '.github/workflows/fix-preview-language-desktop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix desktop language label only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/components/digital-preview-reader.tsx')
          s=p.read_text()
          old='''<label className="inline-flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold"><span className="hidden md:inline">{c.language}</span><select'''
          new='''<label className="inline-flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold lg:min-w-[118px] lg:justify-between"><span className="hidden whitespace-nowrap md:inline">{c.language}</span><select'''
          if old not in s:
              raise SystemExit('Language control marker not found; refusing partial patch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/components/digital-preview-reader.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: prevent desktop language label wrapping"
          git push origin main
