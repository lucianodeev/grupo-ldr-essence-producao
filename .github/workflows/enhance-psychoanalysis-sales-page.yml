name: Enhance psychoanalysis sales page
on:
  push:
    paths:
      - 'tools/enhance_psychoanalysis_sales_page.py'
      - '.github/workflows/enhance-psychoanalysis-sales-page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply sales page enhancements
        run: python tools/enhance_psychoanalysis_sales_page.py
      - name: Commit enhancements
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/components/psychoanalysis-training-page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete psychoanalysis sales details and FAQ"
          git push origin main
