name: Fix Company Portal Reference Once
on:
  push:
    paths:
      - '.github/workflows/fix-company-portal-reference-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix invalid company portal state reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/painel-ldr/src/routes/_portal.empresa.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'if(!loading&&data?.organization&&sellerReferral){window.location.replace(`/assinatura-empresa?seller_ref=${encodeURIComponent(sellerReferral)}`)}},[loading,data?.organization?.id,sellerReferral])'
          new = 'if(!loading&&context?.organization&&sellerReferral){window.location.replace(`/assinatura-empresa?seller_ref=${encodeURIComponent(sellerReferral)}`)}},[loading,context?.organization?.id,sellerReferral])'
          if old not in s:
              raise SystemExit('Expected company portal bug marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate fix
        run: |
          grep -q 'context?.organization&&sellerReferral' apps/painel-ldr/src/routes/_portal.empresa.tsx
          if grep -q 'data?.organization&&sellerReferral' apps/painel-ldr/src/routes/_portal.empresa.tsx; then exit 1; fi
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          rm .github/workflows/fix-company-portal-reference-once.yml
          git add apps/painel-ldr/src/routes/_portal.empresa.tsx .github/workflows/fix-company-portal-reference-once.yml
          git commit -m 'fix(company): repair portal render after login'
          git push
