name: Fix preview language spacing v2
on:
  push:
    paths:
      - '.github/workflows/fix-preview-language-spacing-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Increase desktop language spacing only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/components/digital-preview-reader.tsx')
          s=p.read_text()
          old='''<label className="inline-flex min-h-11 shrink-0 items-center gap-3 whitespace-nowrap rounded-xl border px-4 py-2 text-sm font-bold lg:min-w-[136px] lg:justify-between"><span className="hidden whitespace-nowrap md:inline">{c.language}</span><select value={locale} onChange={e=>{const n=e.target.value as Locale;setLocale(n);setGlobalLocale(n);setPageIndex(0)}} className="bg-transparent outline-none">'''
          new='''<label className="inline-flex min-h-11 shrink-0 items-center gap-4 whitespace-nowrap rounded-xl border px-4 py-2 text-sm font-bold lg:min-w-[164px] lg:justify-between"><span className="hidden whitespace-nowrap md:inline">{c.language}</span><select value={locale} onChange={e=>{const n=e.target.value as Locale;setLocale(n);setGlobalLocale(n);setPageIndex(0)}} className="min-w-[52px] shrink-0 bg-transparent text-right outline-none">'''
          if old not in s:
              raise SystemExit('Current language control marker not found; refusing partial patch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/components/digital-preview-reader.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: increase desktop language selector spacing"
          git push origin main
