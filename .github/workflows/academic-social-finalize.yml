name: Academic social finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academic-social-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Make create buttons focus feed composer
        run: python tools/patch_academic_create_button_focus_20260914.py
      - name: Lint changed Academic Network route
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: npx eslint src/routes/_clientarea.cliente.rede-academica.tsx
      - name: Generate route tree and production build
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Capture Academic TypeScript diagnostics
        working-directory: apps/painel-ldr
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          set -e
          grep -E 'error TS|TS[0-9]{4}' /tmp/typecheck.log > /tmp/errors.log || true
          grep -E 'src/(components/academic-social-v3-feed|lib/academic-(network|media-v2|dm)|routes/_clientarea\.cliente\.rede-academica)' /tmp/errors.log > /tmp/academic-errors.log || true
          cp /tmp/typecheck.log ../../tools/academic-social-typecheck-full.log
          cp /tmp/academic-errors.log ../../tools/academic-social-typecheck-errors.log
          echo "Global legacy typecheck status=$status"
          echo '--- Academic social TypeScript errors ---'
          cat /tmp/academic-errors.log
      - name: Persist Academic TypeScript diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/academic-social-typecheck-full.log tools/academic-social-typecheck-errors.log
          if git diff --cached --quiet; then
            echo 'Diagnostics unchanged.'
          else
            git commit -m 'ci(academic): capture social typecheck diagnostics'
            git push origin main
          fi
      - name: Academic TypeScript gate
        shell: bash
        run: |
          if [ -s tools/academic-social-typecheck-errors.log ]; then
            cat tools/academic-social-typecheck-errors.log
            exit 1
          fi
          echo 'Academic social TypeScript gate passed.'
      - name: Commit validated create-button behavior
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo 'No create-button changes to commit.'
            exit 0
          fi
          git commit -m 'feat(academic): focus create buttons on compact composer'
          git push origin main

# validate only current-main create behavior: 2026-09-14T23:31+02:00
