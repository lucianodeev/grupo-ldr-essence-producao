name: Publish lecture and film card fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-film-card-ux-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cache-bust GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git switch -c gh-pages-livefix --track origin/gh-pages
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='./training-card-v1.js?v=20260905-livefix5'
          s2,n=re.subn(r'(?:/|\./)?training-card-v1\.js(?:\?v=[^"\']*)?', new, s, count=1)
          if n != 1:
              raise SystemExit('training-card reference not found exactly once on gh-pages')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q 'training-card-v1.js?v=20260905-livefix5' index.html
          grep -q 'platform-product-cards-final.js?v=20260905-livefix3' training-card-v1.js
          grep -q '4 encontros ao vivo' platform-product-cards-final.js
          grep -q 'Pagamento único' platform-product-cards-final.js
          grep -q 'Acesso individual' platform-product-cards-final.js
          grep -q 'EM PRODUÇÃO' platform-product-cards-final.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix pages: forçar atualização do card de treinamento'
            git push origin HEAD:gh-pages
          fi
