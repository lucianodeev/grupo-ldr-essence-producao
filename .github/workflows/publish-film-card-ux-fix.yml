name: Publish lecture and film card fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-film-card-ux-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cache-bust main public script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('apps/luciano-empreendedor/index.html')
          s=p.read_text(encoding='utf-8')
          new='/training-card-v1.js?v=20260904-filmux2'
          s2,n=re.subn(r'(?:/|\./)?training-card-v1\.js(?:\?v=[^"\']*)?', new, s, count=1)
          if n != 1:
              raise SystemExit('training-card reference not found exactly once on main')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q 'training-card-v1.js?v=20260904-filmux2' apps/luciano-empreendedor/index.html
          grep -q 'platform-product-cards-final.js?v=20260904-filmux2' apps/luciano-empreendedor/training-card-v1.js
          grep -q 'EM PRODUÇÃO' apps/luciano-empreendedor/platform-product-cards-final.js
          grep -q 'cleanupLecturePrices' apps/luciano-empreendedor/platform-product-cards-final.js

      - name: Commit main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/luciano-empreendedor/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix public: atualizar cache da correção de palestra e filme'
            git push origin main
          fi

      - name: Cache-bust GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git switch -c gh-pages-filmux --track origin/gh-pages
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='./training-card-v1.js?v=20260904-filmux2'
          s2,n=re.subn(r'(?:/|\./)?training-card-v1\.js(?:\?v=[^"\']*)?', new, s, count=1)
          if n != 1:
              raise SystemExit('training-card reference not found exactly once on gh-pages')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q 'training-card-v1.js?v=20260904-filmux2' index.html
          grep -q 'platform-product-cards-final.js?v=20260904-filmux2' training-card-v1.js
          grep -q 'EM PRODUÇÃO' platform-product-cards-final.js
          grep -q 'cleanupLecturePrices' platform-product-cards-final.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix pages: atualizar cache da correção de palestra e filme'
            git push origin HEAD:gh-pages
          fi
