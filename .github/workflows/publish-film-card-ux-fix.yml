name: Publish single platform language engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-film-card-ux-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cache-bust main
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('apps/luciano-empreendedor/index.html')
          s=p.read_text(encoding='utf-8')
          new='/training-card-v1.js?v=20260905-langsync10'
          s2,n=re.subn(r'(?:/|\./)?training-card-v1\.js(?:\?v=[^"\']*)?', new, s, count=1)
          if n != 1: raise SystemExit('main training-card reference not found exactly once')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q 'training-card-v1.js?v=20260905-langsync10' apps/luciano-empreendedor/index.html
          grep -q 'platform-i18n-single.js?v=20260905-platform-single1' apps/luciano-empreendedor/training-card-v1.js
          ! grep -q 'training-card-v1-original' apps/luciano-empreendedor/training-card-v1.js
          ! grep -q 'product-i18n-final-v2' apps/luciano-empreendedor/training-card-v1.js
          grep -q 'luciano.public.locale.v2' apps/luciano-empreendedor/platform-i18n-single.js
          grep -q 'navigator.languages' apps/luciano-empreendedor/platform-i18n-single.js
          grep -q 'luciano:languagechange' apps/luciano-empreendedor/platform-i18n-single.js
          grep -q 'The Courage to Start' apps/luciano-empreendedor/platform-i18n-single.js
          grep -q 'Le Courage de Commencer' apps/luciano-empreendedor/platform-i18n-single.js
          grep -q 'El Coraje de Comenzar' apps/luciano-empreendedor/platform-i18n-single.js
          ! grep -q 'lucianoLang' apps/luciano-empreendedor/global-i18n-reload-v1.js
          ! grep -q 'ldr-language' apps/luciano-empreendedor/global-i18n-reload-v1.js
          ! grep -q 'site.id="palestraView"' apps/luciano-empreendedor/global-i18n-reload-v1.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/luciano-empreendedor/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix public: carregar motor único de idioma'
            git push origin main
          fi

      - name: Cache-bust GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git switch -c gh-pages-langsync10 --track origin/gh-pages
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new='./training-card-v1.js?v=20260905-langsync10'
          s2,n=re.subn(r'(?:/|\./)?training-card-v1\.js(?:\?v=[^"\']*)?', new, s, count=1)
          if n != 1: raise SystemExit('pages training-card reference not found exactly once')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q 'training-card-v1.js?v=20260905-langsync10' index.html
          grep -q 'platform-i18n-single.js?v=20260905-platform-single1' training-card-v1.js
          ! grep -q 'training-card-v1-original' training-card-v1.js
          ! grep -q 'product-i18n-final-v2' training-card-v1.js
          grep -q 'luciano.public.locale.v2' platform-i18n-single.js
          grep -q 'navigator.languages' platform-i18n-single.js
          grep -q 'luciano:languagechange' platform-i18n-single.js
          grep -q 'The Courage to Start' platform-i18n-single.js
          grep -q 'Le Courage de Commencer' platform-i18n-single.js
          grep -q 'El Coraje de Comenzar' platform-i18n-single.js
          ! grep -q 'lucianoLang' global-i18n-reload-v1.js
          ! grep -q 'ldr-language' global-i18n-reload-v1.js
          ! grep -q 'site.id="palestraView"' global-i18n-reload-v1.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix pages: carregar motor único de idioma'
            git push origin HEAD:gh-pages
          fi
