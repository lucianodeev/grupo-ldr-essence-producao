name: LDR ONE sandbox unit checks
on:
  pull_request:
    paths:
      - 'apps/painel-ldr/src/lib/ldr-one-sandbox*'
      - 'apps/painel-ldr/src/lib/ldr-one-checkout-sandbox*'
      - 'apps/painel-ldr/src/lib/ldr-one-events-sandbox*'
      - '.github/workflows/ldr-one-sandbox-unit.yml'
      - 'scripts/ldr-one-stripe-test-webhook*'
      - 'scripts/ldr-one-sandbox-migrate*'
      - 'scripts/ldr-one-sandbox-event-store*'
      - 'scripts/ldr-one-sandbox-webhook-bridge*'
      - 'scripts/ldr-one-sandbox-checkout-service*'
      - 'scripts/ldr-one-sandbox-checkout-integration*'
      - 'scripts/ldr-one-sandbox-stripe-config*'
      - 'scripts/ldr-one-sandbox-authenticated-checkout*'
      - 'scripts/ldr-one-sandbox-customer-subscriptions*'
      - 'docs/ldr-pass/sql/ldr-one-sandbox-schema-REVIEW-ONLY.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated tests without Stripe keys
        working-directory: apps/painel-ldr
        run: node --experimental-strip-types --test src/lib/ldr-one-sandbox.test.ts src/lib/ldr-one-checkout-sandbox.test.ts src/lib/ldr-one-events-sandbox.test.ts
      - name: Verify isolated webhook security
        run: node --test scripts/ldr-one-stripe-test-webhook.test.mjs

      - name: Verify isolated event persistence guards
        run: node --test scripts/ldr-one-sandbox-event-store.test.mjs
      - name: Verify webhook bridge guards
        run: node --test scripts/ldr-one-sandbox-webhook-bridge.test.mjs
      - name: Verify isolated checkout orchestration
        run: node --test scripts/ldr-one-sandbox-checkout-service.test.mjs
      - name: Verify real checkout integration safety guard
        run: node --test scripts/ldr-one-sandbox-checkout-integration.test.mjs
      - name: Verify Stripe test-only configuration
        run: node --test scripts/ldr-one-sandbox-stripe-config.test.mjs
      - name: Verify authenticated checkout and customer-scoped status
        run: node --test scripts/ldr-one-sandbox-authenticated-checkout.test.mjs
      - name: Verify migration safety guards
        run: node --test scripts/ldr-one-sandbox-migrate.test.mjs
