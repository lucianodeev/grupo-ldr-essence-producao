name: LDR ONE sandbox unit checks
on:
  pull_request:
    paths:
      - 'apps/painel-ldr/src/lib/ldr-one-sandbox*'
      - 'apps/painel-ldr/src/lib/ldr-one-checkout-sandbox*'
      - 'apps/painel-ldr/src/lib/ldr-one-events-sandbox*'
      - '.github/workflows/ldr-one-sandbox-unit.yml'
      - 'scripts/ldr-one-stripe-test-webhook*'
      - 'scripts/ldr-one-sandbox-migrate*'
      - 'scripts/ldr-one-sandbox-event-store*'
      - 'docs/ldr-pass/sql/ldr-one-sandbox-schema-REVIEW-ONLY.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated tests without Stripe keys
        working-directory: apps/painel-ldr
        run: node --experimental-strip-types --test src/lib/ldr-one-sandbox.test.ts src/lib/ldr-one-checkout-sandbox.test.ts src/lib/ldr-one-events-sandbox.test.ts
      - name: Verify isolated webhook security
        run: node --test scripts/ldr-one-stripe-test-webhook.test.mjs

      - name: Verify isolated event persistence guards
        run: node --test scripts/ldr-one-sandbox-event-store.test.mjs
      - name: Verify migration safety guards
        run: node --test scripts/ldr-one-sandbox-migrate.test.mjs
