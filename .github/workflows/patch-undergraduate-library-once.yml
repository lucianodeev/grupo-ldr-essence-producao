name: Integrate undergraduate coming-soon section once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused undergraduate integration
        run: |
          python - <<'PY'
          from pathlib import Path

          lib=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=lib.read_text(encoding='utf-8')
          imp='import { UNDERGRADUATE_COURSES } from "@/lib/undergraduate.catalog";\n'
          if imp not in s:
              anchor='import { useI18n } from "@/lib/i18n";\n'
              if anchor not in s: raise SystemExit('library import anchor not found')
              s=s.replace(anchor,anchor+imp)

          if '🎓 Graduações · Em breve' not in s:
              marker='🎓 Pós-Graduações · Lançamento em breve'
              pos=s.find(marker)
              if pos<0: raise SystemExit('postgraduate section marker not found')
              start=s.rfind('<section',0,pos)
              if start<0: raise SystemExit('postgraduate section start not found')
              block='''    <section className="rounded-[28px] border border-[#d6ad63]/40 bg-gradient-to-br from-[#071426] via-[#0b2341] to-[#163b67] p-5 text-white shadow-lg sm:p-7">\n      <div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><div><span className="rounded-full bg-[#d6ad63] px-3 py-1 text-[10px] font-black uppercase tracking-[.15em] text-[#281605]">🎓 Graduações · Em breve</span><h2 className="mt-4 font-serif text-3xl text-[#fff7e7]">Futuras graduações LDR</h2><p className="mt-2 max-w-3xl text-sm leading-6 text-white/75">Propostas acadêmicas preliminares em modelo Live Semipresencial. Conheça as grades e registre seu interesse no lançamento.</p></div><span className="rounded-full border border-white/20 bg-white/10 px-3 py-2 text-xs font-bold">A partir de R$ 99,90/mês*</span></div>\n      <div className="mt-6 grid gap-4 md:grid-cols-2 xl:grid-cols-3">{UNDERGRADUATE_COURSES.map(course=><article key={course.key} className="rounded-2xl border border-white/15 bg-white/10 p-5 shadow-sm backdrop-blur"><div className="flex items-start justify-between gap-3"><div className="text-3xl">{course.icon}</div><span className="rounded-full bg-[#d6ad63] px-2.5 py-1 text-[9px] font-black uppercase tracking-[.12em] text-[#281605]">Em breve</span></div><h3 className="mt-4 font-serif text-xl leading-snug text-white">{course.title}</h3><div className="mt-4 space-y-1.5 text-xs text-white/78"><p><b className="text-white">Duração prevista:</b> {course.years} anos · {course.semesters} semestres</p><p><b className="text-white">Modalidade:</b> 🔴 Live + 🏫 Semipresencial</p><p><b className="text-white">Valor ilustrativo:</b> a partir de R$ 99,90/mês*</p></div><a href={`/cliente/graduacao/${course.key}`} className="mt-5 inline-flex w-full items-center justify-center rounded-xl bg-[#d6ad63] px-4 py-3 text-sm font-black text-[#281605]">CONHECER A PROPOSTA</a></article>)}</div>\n      <p className="mt-5 text-[11px] leading-5 text-white/60">*Valor meramente ilustrativo. Duração, modalidade, grade e condições poderão mudar antes da eventual abertura oficial de matrículas. Oferta futura sujeita a instituição de ensino superior devidamente credenciada e às exigências regulatórias aplicáveis.</p>\n    </section>\n\n'''
              s=s[:start]+block+s[start:]
          lib.write_text(s,encoding='utf-8')

          admin=Path('apps/painel-ldr/src/routes/_authenticated/admin.tsx')
          a=admin.read_text(encoding='utf-8')
          new='    ["Interesses em Pós-Graduação", "/admin/interesses-pos"],\n    ["Graduações — Interessados", "/admin/interesses-graduacoes"],\n'
          if 'Graduações — Interessados' not in a:
              old='    ["Interesses em Pós-Graduação", "/admin/interesses-pos"],\n'
              if old not in a: raise SystemExit('admin interest anchor not found')
              a=a.replace(old,new)
              admin.write_text(a,encoding='utf-8')

          # Safety checks: additive only, no changes to existing commercial constants here.
          out=lib.read_text(encoding='utf-8')
          assert 'UNDERGRADUATE_COURSES.map' in out
          assert '🎓 Graduações · Em breve' in out
          assert '/cliente/graduacao/${course.key}' in out
          assert 'Pós-Graduações · Lançamento em breve' in out
          assert '14 módulos · 220 unidades' in out
          PY
      - name: Commit focused changes
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src
          git commit -m "feat(painel): add undergraduate coming-soon library section"
          git push
