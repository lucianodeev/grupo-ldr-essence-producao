name: E2E Button Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e-button-audit.yml'
      - '.github/scripts/e2e_button_audit.cjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          mkdir -p /tmp/ldr-e2e
          cd /tmp/ldr-e2e
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run production button audit
        run: node .github/scripts/e2e_button_audit.cjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-button-audit
          path: artifacts/e2e-button-audit.*
          if-no-files-found: warn
