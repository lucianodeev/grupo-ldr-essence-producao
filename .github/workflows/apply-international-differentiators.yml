name: Apply International Differentiators

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-international-differentiators.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply international differentiation UX
        run: |
          python - <<'PY'
          from pathlib import Path

          # Server: international fields + passport computation
          p=Path('apps/painel-ldr/src/lib/professional-social.server.ts')
          s=p.read_text()
          s=s.replace('show_lgbtq_badge").eq("slug"', 'show_lgbtq_badge,operating_countries,open_to_international_projects,open_to_partnerships,international_positioning,show_passport_badge").eq("slug"')
          old='return {profile:{...profile,lgbtq_public:Boolean(profile.lgbtq_self_identified&&profile.show_lgbtq_badge)},category,services:services??[],availability:availability??[],reviews:reviews??[]};'
          new='''const passportItems={identity:Boolean(profile.identity_verified),documents:Boolean(profile.documents_verified),photo:Boolean(profile.photo_url),video:Boolean(profile.intro_video_url),languages:Array.isArray(profile.languages)&&profile.languages.length>0,services:(services??[]).length>0,availability:(availability??[]).length>0,international:Array.isArray(profile.operating_countries)&&profile.operating_countries.length>0};\n  const passportScore=Math.round((Object.values(passportItems).filter(Boolean).length/Object.keys(passportItems).length)*100);\n  return {profile:{...profile,lgbtq_public:Boolean(profile.lgbtq_self_identified&&profile.show_lgbtq_badge)},category,services:services??[],availability:availability??[],reviews:reviews??[],passport:{score:passportScore,items:passportItems,label:"Passaporte Profissional LDR",disclaimer:"Indicador de completude e verificações da plataforma. Não é licença, certificação oficial ou autorização profissional."}};'''
          if old in s: s=s.replace(old,new)
          s=s.replace('showLgbtqBadge?:boolean}){', 'showLgbtqBadge?:boolean;operatingCountries?:string[];openToInternationalProjects?:boolean;openToPartnerships?:boolean;internationalPositioning?:string|null;showPassportBadge?:boolean}){')
          marker='if(input.showLgbtqBadge!==undefined)patch.show_lgbtq_badge=Boolean(input.showLgbtqBadge&&input.lgbtqSelfIdentified===true);'
          add=marker+'\n  if(input.operatingCountries!==undefined)patch.operating_countries=[...new Set(input.operatingCountries.map(x=>x.trim().toUpperCase()).filter(Boolean))].slice(0,20);\n  if(input.openToInternationalProjects!==undefined)patch.open_to_international_projects=Boolean(input.openToInternationalProjects);\n  if(input.openToPartnerships!==undefined)patch.open_to_partnerships=Boolean(input.openToPartnerships);\n  if(input.internationalPositioning!==undefined)patch.international_positioning=input.internationalPositioning?.trim().slice(0,500)||null;\n  if(input.showPassportBadge!==undefined)patch.show_passport_badge=Boolean(input.showPassportBadge);'
          if marker in s and 'operating_countries=' not in s: s=s.replace(marker,add)
          p.write_text(s)

          # Functions validator
          p=Path('apps/painel-ldr/src/lib/professional-social.functions.ts')
          s=p.read_text()
          s=s.replace('showLgbtqBadge?:boolean})=>data)', 'showLgbtqBadge?:boolean;operatingCountries?:string[];openToInternationalProjects?:boolean;openToPartnerships?:boolean;internationalPositioning?:string|null;showPassportBadge?:boolean})=>data)')
          p.write_text(s)

          # Profile editor
          p=Path('apps/painel-ldr/src/routes/profissional-perfil.tsx')
          s=p.read_text()
          s=s.replace('showLgbtq:false});','showLgbtq:false,operatingCountries:"",openToInternationalProjects:false,openToPartnerships:false,internationalPositioning:"",showPassport:true});')
          s=s.replace('showLgbtq:Boolean(p.show_lgbtq_badge)})','showLgbtq:Boolean(p.show_lgbtq_badge),operatingCountries:(p.operating_countries||[]).join(", "),openToInternationalProjects:Boolean(p.open_to_international_projects),openToPartnerships:Boolean(p.open_to_partnerships),internationalPositioning:p.international_positioning||"",showPassport:p.show_passport_badge!==false})')
          s=s.replace('showLgbtqBadge:self===true&&form.showLgbtq}})', 'showLgbtqBadge:self===true&&form.showLgbtq,operatingCountries:form.operatingCountries.split(",").map((x:string)=>x.trim()).filter(Boolean),openToInternationalProjects:form.openToInternationalProjects,openToPartnerships:form.openToPartnerships,internationalPositioning:form.internationalPositioning||null,showPassportBadge:form.showPassport}})')
          needle='<Card title="Diversidade e comunidade LGBTQIA+"'
          card='''<Card title="Conexões Internacionais" text="Mostre em quais mercados você atua ou tem disponibilidade, os idiomas que utiliza e se está aberto a projetos ou parcerias internacionais. Isso não substitui regras profissionais ou autorização legal de atuação em cada país."><Input label="Países / mercados de atuação (códigos ou nomes, separados por vírgula)" value={form.operatingCountries} onChange={(v)=>setForm({...form,operatingCountries:v})} placeholder="Ex.: BE, PT, BR"/><label className="mt-4 flex items-start gap-2 text-sm"><input type="checkbox" checked={form.openToInternationalProjects} onChange={e=>setForm({...form,openToInternationalProjects:e.target.checked})}/><span><strong>Aberto a projetos internacionais</strong><br/><span className="text-muted-foreground">Indica interesse, não garantia de oportunidade.</span></span></label><label className="mt-3 flex items-start gap-2 text-sm"><input type="checkbox" checked={form.openToPartnerships} onChange={e=>setForm({...form,openToPartnerships:e.target.checked})}/><span><strong>Aberto a parcerias profissionais</strong><br/><span className="text-muted-foreground">Facilita networking e colaboração dentro da Rede.</span></span></label><label className="mt-4 block text-sm font-bold">Posicionamento internacional<textarea rows={4} maxLength={500} className="mt-2 w-full rounded-xl border bg-background px-3 py-3 font-normal" value={form.internationalPositioning} onChange={e=>setForm({...form,internationalPositioning:e.target.value})} placeholder="Ex.: Atendo em português e espanhol, com disponibilidade para projetos entre Bélgica, Portugal e Brasil."/></label><label className="mt-4 flex items-start gap-2 text-sm"><input type="checkbox" checked={form.showPassport} onChange={e=>setForm({...form,showPassport:e.target.checked})}/><span><strong>Exibir meu Passaporte Profissional LDR</strong><br/><span className="text-muted-foreground">Indicador de completude do perfil e verificações da plataforma; não é licença ou certificação oficial.</span></span></label></Card>\n <Card title="Diversidade e comunidade LGBTQIA+"'''
          if needle in s and 'Conexões Internacionais' not in s: s=s.replace(needle,card)
          p.write_text(s)

          # Public profile: international cards + passport
          p=Path('apps/painel-ldr/src/routes/profissional.$slug.tsx')
          s=p.read_text()
          anchor='<section className="rounded-3xl border bg-card p-6"><h2 className="font-serif text-2xl">{c.specialties}</h2>'
          international='''<section className="rounded-3xl border bg-card p-6"><div className="flex flex-wrap items-start justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-[.16em] text-primary">CONEXÕES INTERNACIONAIS</p><h2 className="mt-1 font-serif text-2xl">Atuação e colaboração internacional</h2></div><Globe2 className="h-6 w-6 text-primary"/></div>{(p.operating_countries??[]).length?<div className="mt-4 flex flex-wrap gap-2">{p.operating_countries.map((x:string)=><span key={x} className="rounded-full bg-primary/10 px-3 py-1.5 text-sm font-bold">{x}</span>)}</div>:null}{p.international_positioning?<p className="mt-4 text-sm leading-7 text-muted-foreground">{p.international_positioning}</p>:null}<div className="mt-4 flex flex-wrap gap-2">{p.open_to_international_projects?<Badge text="Aberto a projetos internacionais"/>:null}{p.open_to_partnerships?<Badge text="Aberto a parcerias profissionais"/>:null}</div><p className="mt-4 text-xs leading-5 text-muted-foreground">Disponibilidade internacional declarada pelo profissional e sujeita às regras profissionais, fiscais e legais aplicáveis a cada país.</p></section>{p.show_passport_badge&&data.passport?<section className="rounded-3xl border bg-card p-6"><div className="flex items-center justify-between gap-3"><div><p className="text-xs font-black uppercase tracking-[.16em] text-primary">PASSAPORTE PROFISSIONAL LDR</p><h2 className="mt-1 font-serif text-2xl">Perfil {data.passport.score}% completo</h2></div><span className="rounded-full bg-primary px-3 py-1 text-sm font-black text-primary-foreground">{data.passport.score}%</span></div><div className="mt-4 h-2 overflow-hidden rounded-full bg-muted"><div className="h-full bg-primary" style={{width:`${data.passport.score}%`}}/></div><div className="mt-4 grid gap-2 sm:grid-cols-2">{Object.entries(data.passport.items).map(([k,v])=><div key={k} className="flex items-center gap-2 text-sm"><span className={v?"text-primary":"text-muted-foreground"}>{v?"✓":"○"}</span><span>{{identity:"Identidade",documents:"Documentos",photo:"Foto",video:"Vídeo",languages:"Idiomas",services:"Serviços",availability:"Agenda",international:"Atuação internacional"}[k]||k}</span></div>)}</div><p className="mt-4 text-xs leading-5 text-muted-foreground">{data.passport.disclaimer}</p></section>:null}'''
          if anchor in s and 'PASSAPORTE PROFISSIONAL LDR' not in s: s=s.replace(anchor,international+anchor)
          p.write_text(s)

          # Sales page: differentiation section and stronger international positioning
          p=Path('apps/painel-ldr/src/routes/para-profissionais.tsx')
          s=p.read_text()
          anchor='<section className="border-y bg-muted/35"><div className="mx-auto max-w-7xl px-4 py-14 sm:px-6"><h2 className="font-serif text-3xl">{copy.how}</h2>'
          diff='''<section className="border-y bg-primary/5"><div className="mx-auto max-w-7xl px-4 py-14 sm:px-6"><p className="text-xs font-black uppercase tracking-[.18em] text-primary">DIFERENCIAIS LDR</p><h2 className="mt-2 max-w-4xl font-serif text-3xl sm:text-4xl">Uma comunidade profissional com visão internacional — e ferramentas para transformar presença em operação.</h2><p className="mt-4 max-w-4xl text-sm leading-7 text-muted-foreground">A Rede LDR combina marketplace, comunidade internacional, desenvolvimento profissional e ferramentas de operação em um único ecossistema. O objetivo não é prometer clientes, mas ampliar estrutura, confiança, conexão e capacidade profissional.</p><div className="mt-7 grid gap-4 md:grid-cols-2 xl:grid-cols-4"><article className="rounded-3xl border bg-card p-6"><Globe2 className="h-7 w-7 text-primary"/><h3 className="mt-4 font-serif text-xl">Comunidade internacional</h3><p className="mt-2 text-sm leading-6 text-muted-foreground">Networking entre profissionais de diferentes países, idiomas e mercados, com possibilidade de colaboração e troca de experiência.</p></article><article className="rounded-3xl border bg-card p-6"><BadgeCheck className="h-7 w-7 text-primary"/><h3 className="mt-4 font-serif text-xl">Passaporte Profissional LDR</h3><p className="mt-2 text-sm leading-6 text-muted-foreground">Painel de completude com identidade, documentos, foto, vídeo, idiomas, serviços, agenda e atuação internacional. Não é licença ou certificação oficial.</p></article><article className="rounded-3xl border bg-card p-6"><UsersRound className="h-7 w-7 text-primary"/><h3 className="mt-4 font-serif text-xl">Conexões Internacionais</h3><p className="mt-2 text-sm leading-6 text-muted-foreground">O profissional pode indicar mercados de atuação, interesse em projetos internacionais e disponibilidade para parcerias profissionais.</p></article><article className="rounded-3xl border bg-card p-6"><Sparkles className="h-7 w-7 text-primary"/><h3 className="mt-4 font-serif text-xl">Ecossistema, não apenas perfil</h3><p className="mt-2 text-sm leading-6 text-muted-foreground">Perfil, agenda, checkout, financeiro, chat privado, avaliações verificadas, comunidade, treinamentos e ferramentas de desenvolvimento conforme o plano.</p></article></div><div className="mt-7 rounded-3xl border bg-card p-7"><p className="text-sm font-black uppercase tracking-[.14em] text-primary">POSICIONAMENTO CENTRAL</p><blockquote className="mt-3 max-w-4xl font-serif text-2xl leading-relaxed">“Sua profissão não precisa ficar limitada à sua cidade. Entre em uma comunidade profissional internacional, organize sua atuação e desenvolva sua presença dentro de um ecossistema completo.”</blockquote></div></div></section>'''
          if anchor in s and 'DIFERENCIAIS LDR' not in s: s=s.replace(anchor,diff+anchor)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "ldr-rh-campanhas"
            git config user.email "llucianouam@gmail.com"
            git add apps/painel-ldr/src/lib/professional-social.server.ts apps/painel-ldr/src/lib/professional-social.functions.ts apps/painel-ldr/src/routes/profissional-perfil.tsx 'apps/painel-ldr/src/routes/profissional.$slug.tsx' apps/painel-ldr/src/routes/para-profissionais.tsx
            git commit -m "feat(network): adiciona passaporte e conexoes internacionais"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/painel-ldr
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: apps/painel-ldr
        run: npm run build
