name: Publish four cards cache fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fourcards-cachefix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cache-bust script on main
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/luciano-empreendedor/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('training-card-v1.js?v=20260903-final2','training-card-v1.js?v=20260904-fourcards1')
          assert 'training-card-v1.js?v=20260904-fourcards1' in s
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit main cache-bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/luciano-empreendedor/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix public: renovar cache dos quatro cards'
            git push origin main
          fi

      - name: Cache-bust GitHub Pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git switch -c gh-pages-fourcards-cache --track origin/gh-pages
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('training-card-v1.js?v=20260903-final2','training-card-v1.js?v=20260904-fourcards1')
          assert 'training-card-v1.js?v=20260904-fourcards1' in s
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix pages: renovar cache dos quatro cards'
            git push origin HEAD:gh-pages
          fi
