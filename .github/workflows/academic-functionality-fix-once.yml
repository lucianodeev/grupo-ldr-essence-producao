name: Academic Network functionality fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academic-functionality-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Capture baseline TypeScript diagnostics
        working-directory: apps/painel-ldr
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-baseline.log 2>&1
          grep -E 'error TS|TS[0-9]{4}' /tmp/typecheck-baseline.log | sed -E 's/\([0-9]+,[0-9]+\):/:/' | sort -u > /tmp/typecheck-baseline-errors.log || true
          exit 0
      - name: Apply targeted Academic Network functional repair
        run: python tools/patch_academic_functionality_20260914.py
      - name: Apply targeted Academic Network typecheck repair
        run: python tools/patch_academic_typecheck_20260914.py
      - name: Lint audit for changed Academic Network files
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: >-
          npx eslint
          src/lib/academic-network.functions.ts
          src/lib/academic-network.server.ts
          src/components/academic-social-v3-feed.tsx
          src/components/academic-challenges-admin.tsx
          src/components/academic-onboarding-v3.tsx
          src/routes/_clientarea.cliente.rede-academica.tsx
          src/routes/_clientarea.cliente.rede-academica.criar.tsx
          src/routes/_clientarea.cliente.rede-academica.editar-perfil.tsx
          src/routes/_clientarea.cliente.rede-academica.notificacoes.tsx
      - name: Compare TypeScript diagnostics after patch
        working-directory: apps/painel-ldr
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-patched.log 2>&1
          full_status=$?
          grep -E 'error TS|TS[0-9]{4}' /tmp/typecheck-patched.log | sed -E 's/\([0-9]+,[0-9]+\):/:/' | sort -u > /tmp/typecheck-patched-errors.log || true
          comm -13 /tmp/typecheck-baseline-errors.log /tmp/typecheck-patched-errors.log > /tmp/typecheck-new-errors.log || true
          echo '--- New TypeScript diagnostics introduced by patch ---'
          cat /tmp/typecheck-new-errors.log
          cp /tmp/typecheck-baseline.log ../../tools/academic-typecheck-baseline.log
          cp /tmp/typecheck-patched.log ../../tools/academic-typecheck-diagnostics.log
          cp /tmp/typecheck-new-errors.log ../../tools/academic-typecheck-new-errors.log
          if [ -s /tmp/typecheck-new-errors.log ]; then
            echo 'PATCH_TYPECHECK_REGRESSION'
            exit 1
          fi
          echo "PATCH_ADDS_NO_TYPESCRIPT_ERRORS; existing project typecheck status=$full_status"
      - name: Production build
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Commit validated repair and diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src tools/academic-typecheck-baseline.log tools/academic-typecheck-diagnostics.log tools/academic-typecheck-new-errors.log
          if git diff --cached --quiet; then
            echo 'No Academic Network changes to commit.'
            exit 0
          fi
          git commit -m 'fix(academic): finish targeted type safety repairs'
          git push origin main

