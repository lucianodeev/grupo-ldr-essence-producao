name: Fix psychoanalysis FAQ v8
on:
  push:
    paths:
      - 'tools/fix_psychoanalysis_faq_v8.py'
      - '.github/workflows/fix-psychoanalysis-faq-v8.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python tools/fix_psychoanalysis_faq_v8.py
      - name: Commit
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/components/psychoanalysis-training-page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: clarify psychoanalysis one-time payment FAQ"
          git push origin main