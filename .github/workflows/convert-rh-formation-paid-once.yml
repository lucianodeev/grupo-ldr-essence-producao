name: Convert RH formation paid once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/convert-rh-formation-paid-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Finish RH paid conversion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/painel-ldr/src/lib/library-subscription.server.ts')
          s=p.read_text()
          anchor='  ["formacao_lideranca_gestao_pessoas", "Formação em Liderança e Gestão de Pessoas"],\n'
          item='  ["formacao_gestao_pessoas_rh", "Formação em Gestão de Pessoas e Recursos Humanos"],\n'
          if item not in s:
              if anchor not in s: raise SystemExit('subscription anchor missing')
              s=s.replace(anchor,anchor+item,1)
          p.write_text(s)

          p=Path('apps/painel-ldr/src/lib/library-sales-card-i18n.ts')
          s=p.read_text()
          s=s.replace('{ free:true, href:"/cliente/formacoes/gestao-pessoas-rh", tone:"emerald" }','{ price:"R$ 299,99 · € 49,90", href:"/cliente/formacoes/gestao-pessoas-rh", tone:"emerald" }',1)
          s=s.replace('  "/cliente/formacoes/gestao-pessoas-rh",\n','',1)
          for prefix,title in [('pt','Gestão de Pessoas e RH'),('en','People Management & HR'),('fr','Gestion des Personnes et RH'),('es','Gestión de Personas y RR. HH.')]:
              import re
              s=re.sub(rf'{prefix}: \[\["{re.escape(title)}","[^"]+"\],',f'{prefix}: [',s,count=1)
          p.write_text(s)

          p=Path('apps/painel-ldr/src/components/library-storefront.tsx')
          s=p.read_text()
          old='{title:"RH 600h",subtitle:"Formação gratuita em Gestão de Pessoas e RH.",href:"/cliente/formacoes/gestao-pessoas-rh",icon:"👥",tag:"rh gratuito gestão pessoas",group:"gratis",color:"#047857"}'
          new='{title:"RH 600h",subtitle:"Formação profissional em Gestão de Pessoas e RH.",href:"/cliente/formacoes/gestao-pessoas-rh",icon:"👥",price:"R$ 299,99 · € 49,90",tag:"rh formação gestão pessoas",group:"formacoes",color:"#047857"}'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('apps/painel-ldr/src/components/library-sales-home-access-choice.tsx')
          s=p.read_text()
          replacements={
            'rhMeta:"600 horas · 100% online · formação livre profissional", free:"100% GRATUITA", start:"COMEÇAR GRATUITAMENTE"':'rhMeta:"600 horas · 100% online · formação livre profissional", free:"R$ 299,99 · € 49,90", start:"CONHECER A FORMAÇÃO"',
            'rhMeta:"600 hours · 100% online · professional free course", free:"100% FREE", start:"START FREE"':'rhMeta:"600 hours · 100% online · professional training", free:"R$ 299.99 · € 49.90", start:"LEARN MORE"',
            'rhMeta:"600 heures · 100% en ligne · formation libre professionnelle", free:"100% GRATUIT", start:"COMMENCER GRATUITEMENT"':'rhMeta:"600 heures · 100% en ligne · formation professionnelle", free:"R$ 299,99 · € 49,90", start:"DÉCOUVRIR"',
            'rhMeta:"600 horas · 100% online · formación libre profesional", free:"100% GRATIS", start:"EMPEZAR GRATIS"':'rhMeta:"600 horas · 100% online · formación profesional", free:"R$ 299,99 · € 49,90", start:"CONOCER FORMACIÓN"',
            'rh:["RH 600h","Formação gratuita"]':'rh:["RH 600h","Formação profissional"]',
            'rh:["HR 600h","Free training"]':'rh:["HR 600h","Professional training"]',
            'rh:["RH 600h","Formation gratuite en Gestion des Personnes et RH"]':'rh:["RH 600h","Formation professionnelle en Gestion des Personnes et RH"]',
            'rh:["RRHH 600h","Formación gratuita en Gestión de Personas y RRHH"]':'rh:["RRHH 600h","Formación profesional en Gestión de Personas y RRHH"]'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)

          p=Path('apps/painel-ldr/src/components/library-sales-home.tsx')
          s=p.read_text()
          s=s.replace('{tag:"RH · 600H",title:"Formação em Gestão de Pessoas e Recursos Humanos",desc:"600 horas · 100% online · leitura e atividades",free:true,href:"/cliente/formacoes/gestao-pessoas-rh",tone:"emerald"}','{tag:"RH · 600H",title:"Formação em Gestão de Pessoas e Recursos Humanos",desc:"600 horas · 100% online · leitura e atividades",price:"R$ 299,99 · € 49,90",href:"/cliente/formacoes/gestao-pessoas-rh",tone:"emerald"}')
          s=s.replace('  ["Gestão de Pessoas e RH","600h · formação livre profissional","/cliente/formacoes/gestao-pessoas-rh"],\n','')
          p.write_text(s)

          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          s=s.replace('100% GRATUITA · 600 HORAS','600 HORAS · 100% ONLINE',1)
          s=s.replace('12 módulos · 600 horas · 100% online · leitura e atividades · estude no seu ritmo.','12 módulos · 600 horas · 100% online · compra individual R$ 299,99 / € 49,90 ou acesso pela assinatura ativa da Biblioteca LDR.',1)
          p.write_text(s)
          PY
      - name: Build
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build --workspace=apps/painel-ldr
      - name: Commit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/lib/library-subscription.server.ts apps/painel-ldr/src/lib/library-sales-card-i18n.ts apps/painel-ldr/src/components/library-storefront.tsx apps/painel-ldr/src/components/library-sales-home-access-choice.tsx apps/painel-ldr/src/components/library-sales-home.tsx apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git commit -m "feat(painel): finish RH paid subscription conversion"
          git pull --rebase origin main
          git push
