name: Add sales catalog 360 once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-sales-catalog-360-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sales home
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/components/library-sales-home-access-choice.tsx')
          s=p.read_text()
          imp='import { SalesCatalog360 } from "@/components/sales-catalog-360";'
          if imp not in s:
              anchor='import { LanguageSelect, useI18n } from "@/lib/i18n";'
              if anchor not in s: raise SystemExit('i18n import anchor not found')
              s=s.replace(anchor,anchor+'\n'+imp,1)
          marker='    <section id="mini-library-showcase"'
          if '<SalesCatalog360 />' not in s:
              if marker not in s: raise SystemExit('mini library marker not found')
              s=s.replace(marker,'    <SalesCatalog360 />\n\n'+marker,1)
          p.write_text(s)
          PY
      - name: Install and build
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build --workspace=apps/painel-ldr
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/library-sales-home-access-choice.tsx
          git commit -m "feat(painel): surface 360 catalog near top of sales page"
          git push
