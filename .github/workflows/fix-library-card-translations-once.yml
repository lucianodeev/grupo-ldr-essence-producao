name: Fix library card translations once
on:
  push:
    paths:
      - '.github/workflows/fix-library-card-translations-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Translate library and sales cards
        run: echo '?wrcgNjAwSCIsIkZvcm1hw6fDo28gZW0gR2VzdMOjbyBkZSBQZXNzb2FzIGUgUmVjdXJzb3MgSHVtYW5vcyIsIjYwMCBob3Jhcy    ' | base64 -d | python
      - name: Commit translation fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx apps/painel-ldr/src/components/library-sales-home.tsx
          git commit -m "fix(painel): translate all library card labels"
          git push