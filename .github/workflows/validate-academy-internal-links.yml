name: Validate Academy internal links

on:
  push:
    branches:
      - fix/academy-residual-internal-links
    paths:
      - 'apps/painel-ldr/**'
      - '.github/workflows/validate-academy-internal-links.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Generate routes
        working-directory: apps/painel-ldr
        run: npm run generate-routes
      - name: Core tests
        working-directory: apps/painel-ldr
        run: npm test
      - name: Academic regressions
        working-directory: apps/painel-ldr
        run: npm run test:academic
      - name: Render build
        working-directory: apps/painel-ldr
        env:
          SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build:render
      - name: Verify user-facing support links are internal
        shell: bash
        run: |
          ! grep -R --include='*.tsx' -F 'https://suporte.ldrrhestrategia.com/falar-com-ecossistema' apps/painel-ldr/src/components apps/painel-ldr/src/routes
          ! grep -Fq 'https://ldracademy.online/human-room' apps/painel-ldr/src/routes/ecossistema.tsx
