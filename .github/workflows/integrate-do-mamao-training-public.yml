name: Integrar Do Mamao ao Negocio no site publico

on:
  push:
    branches: [main]
    paths:
      - 'apps/luciano-empreendedor/training-card-v1.js'
      - '.github/workflows/integrate-do-mamao-training-public.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Injetar script sem substituir a Home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/luciano-empreendedor/index.html')
          text=p.read_text(encoding='utf-8')
          marker='training-card-v1.js'
          if marker in text:
              print('Integração pública já presente.')
              raise SystemExit(0)
          if '</body>' not in text:
              raise SystemExit('ERRO: </body> não encontrado; nenhum arquivo foi alterado.')
          tag='  <script defer src="/training-card-v1.js?v=20260902"></script>\n'
          p.write_text(text.replace('</body>', tag+'</body>', 1), encoding='utf-8')
          print('Script do treinamento integrado ao index atual.')
          PY
      - name: Publicar patch no main
        run: |
          if git diff --quiet -- apps/luciano-empreendedor/index.html; then
            echo 'Sem alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/luciano-empreendedor/index.html
          git commit -m 'feat: mostrar Do Mamão ao Negócio na plataforma pública'
          git push origin main
