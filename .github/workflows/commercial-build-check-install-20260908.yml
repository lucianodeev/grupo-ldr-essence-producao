name: Commercial UX build check install 20260908

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commercial-build-check-install-20260908.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without changing lockfile
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build panel app
        run: npm run build:painel
