        working-directory: apps/painel-ldr
        run: npm run build

      - name: Publicar alterações no main
        shell: bash
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de código para publicar."
            exit 0
          fi
