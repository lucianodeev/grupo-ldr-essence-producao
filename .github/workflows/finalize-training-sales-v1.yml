name: Finalizar treinamento e vendas

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-training-sales-v1.yml

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções do treinamento e combo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('apps/painel-ldr/src')

          def load(rel):
              p=ROOT/rel
              return p,p.read_text()
          def save(p,t): p.write_text(t)
          def rep(t,old,new,label):
              if old not in t:
                  raise SystemExit(f'Bloco não encontrado: {label}')
              return t.replace(old,new,1)

          # 1) Treinamento do aluno: 500-1000 caracteres + bloqueio mensal
          p,t=load('routes/_clientarea.cliente.treinamentos.do-mamao-ao-negocio.tsx')
          t=t.replace('v.trim().length>=20','v.trim().length>=500')
          t=t.replace('com pelo menos 20 caracteres.','com no mínimo 500 e no máximo 1.000 caracteres cada.')
          t=t.replace('with at least 20 characters.','with between 500 and 1,000 characters each.')
          t=t.replace('d’au moins 20 caractères.','entre 500 et 1 000 caractères chacune.')
          t=t.replace('con al menos 20 caracteres.','entre 500 y 1.000 caracteres cada una.')
          old='''  const journeyDays=Math.max(0,Math.floor((Date.now()-startDate.getTime())/86400000));\n  const unlockedDay=Math.max(1,Math.min(90,journeyDays+1));'''
          new='''  const journeyDays=Math.max(0,Math.floor((Date.now()-startDate.getTime())/86400000));\n  const calendarUnlockedDay=Math.max(1,Math.min(90,journeyDays+1));\n  const approvedReviews=(data.projectSubmissions??[]).filter((p:any)=>p.status==="approved"&&Number(p.submission_number)<=3).length;\n  const monthlyGate=approvedReviews>=2?90:approvedReviews>=1?60:30;\n  const unlockedDay=Math.max(1,Math.min(calendarUnlockedDay,monthlyGate));'''
          t=rep(t,old,new,'bloqueio mensal')
          # textarea escrita: maxlength + contador visível
          pattern=re.compile(r'\{currentLesson\.questions\.filter\(q=>q\.type==="written"\)\.map\(\(q,idx\)=><label key=\{q\.id\} className="block"><span className="font-semibold">\{idx\+8\}\. \{q\.prompt\}</span><textarea value=\{currentState\.writtenAnswers\[q\.id\]\?\?""\} onChange=\{e=>updateDay\(d=>\(\{\.\.\.d,writtenAnswers:\{\.\.\.d\.writtenAnswers,\[q\.id\]:e\.target\.value\}\}\)\)\} className=\{`mt-2 min-h-32 w-full rounded-2xl border p-3 \$\{input\}`\} placeholder=\{locale==="pt"\?"Responda com evidências, teste ou decisão concreta…":"…"\}/></label>\)\}')
          replacement='''{currentLesson.questions.filter(q=>q.type==="written").map((q,idx)=>{const writtenValue=currentState.writtenAnswers[q.id]??"";const valid=writtenValue.trim().length>=500;return <label key={q.id} className="block"><span className="font-semibold">{idx+8}. {q.prompt}</span><textarea value={writtenValue} maxLength={1000} onChange={e=>updateDay(d=>({...d,writtenAnswers:{...d.writtenAnswers,[q.id]:e.target.value}}))} className={`mt-2 min-h-32 w-full rounded-2xl border p-3 ${input}`} placeholder={locale==="pt"?"Responda com evidências, teste ou decisão concreta…":"…"}/><div className={`mt-1 flex items-center justify-between text-xs font-bold ${valid?"text-emerald-600":"text-amber-600"}`}><span>{locale==="pt"?"Mínimo 500 · Máximo 1.000 caracteres":locale==="fr"?"Minimum 500 · Maximum 1 000 caractères":locale==="es"?"Mínimo 500 · Máximo 1.000 caracteres":"Minimum 500 · Maximum 1,000 characters"}</span><span>{writtenValue.length}/1000 {valid?"✓":""}</span></div></label>})}'''
          t,n=pattern.subn(replacement,t,count=1)
          if n!=1: raise SystemExit('Não foi possível inserir contador de caracteres')
          # contexto da avaliação mensal no card de projeto
          t=t.replace('<h2 className="font-serif text-3xl font-bold">{c.project}</h2>','<h2 className="font-serif text-3xl font-bold">{c.project}</h2><p className="mt-2 text-sm opacity-70">{locale==="pt"?"3 avaliações incluídas · 1 ao final de cada mês":locale==="fr"?"3 évaluations incluses · 1 à la fin de chaque mois":locale==="es"?"3 evaluaciones incluidas · 1 al final de cada mes":"3 included reviews · 1 at the end of each month"}</p>',1)
          t=t.replace('<p className="mt-1 text-sm opacity-70">{c.credits}: {data.availableProjectCredits}</p>','<p className="mt-1 text-sm opacity-70">{c.credits}: {data.availableProjectCredits} · {locale==="pt"?`Avaliações incluídas aprovadas: ${data.includedReviewsCompleted??0}/3`:locale==="fr"?`Évaluations incluses approuvées : ${data.includedReviewsCompleted??0}/3`:locale==="es"?`Evaluaciones incluidas aprobadas: ${data.includedReviewsCompleted??0}/3`:`Included reviews approved: ${data.includedReviewsCompleted??0}/3`}</p>',1)
          t=t.replace('<div className="mt-7 rounded-2xl border border-[#d7ad54]/60 p-4"><h3 className="font-serif text-xl font-bold">{c.extra}</h3>','{(data.includedReviewsCompleted??0)>=3?<div className="mt-7 rounded-2xl border border-[#d7ad54]/60 p-4"><h3 className="font-serif text-xl font-bold">{c.extra}</h3>',1)
          t=t.replace('</div><h3 className="mt-7 font-serif text-xl font-bold">{c.sent}</h3>','</div>:null}<h3 className="mt-7 font-serif text-xl font-bold">{c.sent}</h3>',1)
          save(p,t)

          # 2) Backend do treinamento: 3 avaliações mensais, aprovação obrigatória e combo
          p,t=load('lib/training-commerce.server.ts')
          t=t.replace('const DEFAULT_PROJECTS_INCLUDED = 1;','const DEFAULT_PROJECTS_INCLUDED = 3;')
          t=t.replace('return order?.catalog_key === PRODUCT_KEY || key === PRODUCT_KEY || key === TRAINING_SLUG;','return order?.catalog_key === PRODUCT_KEY || key === PRODUCT_KEY || key === TRAINING_SLUG || order?.catalog_key === "combo_empreendedor" || key === "combo_empreendedor";')
          t=t.replace('x.trim().length >= 20','x.trim().length >= 500')

          start=t.index('export async function getDoMamaoTrainingExperience')
          end=t.index('export async function submitDoMamaoProject',start)
          new_get='''export async function getDoMamaoTrainingExperience(userId: string, email: string | null) {\n  const customer = await customerFor(userId, email);\n  const training = await trainingRow();\n  let currentEnrollment = await enrollment(customer.id, training.id);\n  if (!currentEnrollment) { const order = await paidOrder(customer.id); if (order) { await provisionFromPaidOrder(customer.id, order); currentEnrollment = await enrollment(customer.id, training.id); } }\n  if (!currentEnrollment) currentEnrollment = await ensureOwnerEnrollment(customer.id, training.id, email, userId);\n  if (!currentEnrollment) fail("Compre o treinamento para liberar este conteúdo.");\n\n  const { data: existingIncluded } = await db.from("training_project_review_credits").select("id").eq("training_id", training.id).eq("customer_id", customer.id).eq("source", "included");\n  const missingIncluded = Math.max(0, 3 - (existingIncluded ?? []).length);\n  if (missingIncluded) {\n    const rows = Array.from({length:missingIncluded},()=>({training_id:training.id,enrollment_id:currentEnrollment.id,customer_id:customer.id,source:"included",status:"available"}));\n    const { error } = await db.from("training_project_review_credits").insert(rows);\n    if (error) fail("Não foi possível preparar as avaliações mensais incluídas.");\n  }\n\n  await syncPaidProjectReviewCredits(customer.id, training.id);\n  const [{ data: cloud }, { data: credits }, { data: submissions }] = await Promise.all([\n    db.from("training_state").select("state,progress_percent,current_panel,started_at,completed_at,certificate_available_at").eq("training_id", training.id).eq("customer_id", customer.id).maybeSingle(),\n    db.from("training_project_review_credits").select("id,source,status,amount_minor,currency,created_at,used_at").eq("training_id", training.id).eq("customer_id", customer.id).order("created_at", { ascending: true }),\n    db.from("training_project_submissions").select("id,submission_number,title,project_url,status,submitted_at,reviewed_at,feedback").eq("training_id", training.id).eq("customer_id", customer.id).order("submission_number", { ascending: true }),\n  ]);\n  const minimumDays = Number(training.minimum_days ?? DEFAULT_MINIMUM_DAYS);\n  const eligibleAt = new Date(new Date(currentEnrollment.enrolled_at).getTime() + minimumDays * 86400000).toISOString();\n  const state = (cloud?.state && typeof cloud.state === "object" ? cloud.state : {}) as StateRecord;\n  const completedDailyLessons = completeDailyLessons(state);\n  const list = submissions ?? [];\n  const includedReviewsCompleted = list.filter((x:any)=>Number(x.submission_number)<=3 && x.status === "approved").length;\n  const last = list.length ? list[list.length-1] : null;\n  const hasEvaluationPending = Boolean(last && (last.status === "submitted" || last.status === "in_review"));\n  const evaluationNeedsChanges = Boolean(last && last.status === "changes_requested");\n  const nextEvaluationNumber = evaluationNeedsChanges ? Number(last.submission_number) : Math.min(3, list.filter((x:any)=>Number(x.submission_number)<=3).length + 1);\n  const previousApproved = nextEvaluationNumber === 1 || list.some((x:any)=>Number(x.submission_number)===nextEvaluationNumber-1 && x.status==="approved");\n  const monthlyEvaluationEligible = evaluationNeedsChanges || (!hasEvaluationPending && includedReviewsCompleted < 3 && previousApproved && completedDailyLessons >= nextEvaluationNumber * 30);\n  const availableProjectCredits = (credits ?? []).filter((x: any) => x.status === "available").length;\n  const availablePaidReviewCredits = (credits ?? []).filter((x:any)=>x.status==="available" && x.source==="paid").length;\n  const projectSubmissionEligible = monthlyEvaluationEligible || (includedReviewsCompleted >= 3 && availablePaidReviewCredits > 0);\n  return {\n    html: "", trainingId: training.id, title: training.title, studentName: customer.fullName, studentEmail: customer.email,\n    progressPercent: Number(cloud?.progress_percent ?? currentEnrollment.progress_percent ?? 0), cohortNumber: currentEnrollment.training_cohorts?.cohort_number ?? null, enrolledAt: currentEnrollment.enrolled_at,\n    completedAt: cloud?.completed_at ?? currentEnrollment.completed_at ?? null, certificateAvailableAt: cloud?.certificate_available_at ?? currentEnrollment.certificate_available_at ?? null,\n    minimumDays, lifetimeAccess: training.lifetime_access !== false, liveSessionsIncluded: Number(training.live_sessions_included ?? DEFAULT_LIVE_SESSIONS), projectsIncluded: 3,\n    officialCompletionEligibleAt: eligibleAt, projectSubmissionEligible, availableProjectCredits, availablePaidReviewCredits, projectSubmissions: list,\n    includedReviewsCompleted, nextEvaluationNumber, completedDailyLessons, hasEvaluationPending, evaluationNeedsChanges, month2Unlocked: includedReviewsCompleted>=1, month3Unlocked: includedReviewsCompleted>=2,\n    extraProjectReviewBrlCents: Number(training.extra_project_review_brl_minor ?? DEFAULT_PROJECT_REVIEW_BRL), extraProjectReviewEurCents: Number(training.extra_project_review_eur_minor ?? DEFAULT_PROJECT_REVIEW_EUR),\n  };\n}\n\n'''
          t=t[:start]+new_get+t[end:]

          start=t.index('export async function submitDoMamaoProject')
          end=t.index('function completeDailyLessons',start)
          new_submit='''export async function submitDoMamaoProject(userId: string, email: string | null, input: { title: string; projectUrl?: string | null; projectText?: string | null }) {\n  const customer = await customerFor(userId, email); const training = await trainingRow(); const currentEnrollment = await enrollment(customer.id, training.id); if (!currentEnrollment) fail("Matrícula não encontrada.");\n  const title = input.title.trim(); const projectUrl = input.projectUrl?.trim() || null; const projectText = input.projectText?.trim() || null;\n  if (!title) fail("Informe o nome do projeto."); if (!projectUrl && !projectText) fail("Envie um link ou descreva o projeto para avaliação.");\n  await syncPaidProjectReviewCredits(customer.id, training.id);\n  const [{data:cloud},{data:submissions}] = await Promise.all([\n    db.from("training_state").select("state").eq("training_id",training.id).eq("customer_id",customer.id).maybeSingle(),\n    db.from("training_project_submissions").select("id,submission_number,status,review_credit_id").eq("training_id",training.id).eq("customer_id",customer.id).order("submission_number",{ascending:true})\n  ]);\n  const state=(cloud?.state&&typeof cloud.state==="object"?cloud.state:{}) as StateRecord;\n  const completed=completeDailyLessons(state); const list=submissions??[]; const last=list.length?list[list.length-1]:null;\n  if(last && (last.status==="submitted" || last.status==="in_review")) fail("Sua avaliação atual ainda está em análise.");\n  if(last?.status==="changes_requested") {\n    const {data:submission,error}=await db.from("training_project_submissions").update({title,project_url:projectUrl,project_text:projectText,status:"submitted",submitted_at:new Date().toISOString(),reviewed_at:null,reviewed_by:null}).eq("id",last.id).select("id,submission_number,status,submitted_at").single();\n    if(error||!submission) fail("Não foi possível reenviar o projeto."); return {ok:true as const,submission,resubmitted:true as const};\n  }\n  const approvedIncluded=list.filter((x:any)=>Number(x.submission_number)<=3&&x.status==="approved").length;\n  const includedSubmitted=list.filter((x:any)=>Number(x.submission_number)<=3).length;\n  const nextNumber=includedSubmitted<3?includedSubmitted+1:list.length+1;\n  const isIncluded=nextNumber<=3;\n  if(isIncluded){\n    const required=nextNumber*30; if(completed<required) fail(`Conclua as ${required} aulas previstas antes de enviar esta avaliação.`);\n    if(nextNumber>1 && !list.some((x:any)=>Number(x.submission_number)===nextNumber-1&&x.status==="approved")) fail("A avaliação do mês anterior precisa ser aprovada antes do próximo envio.");\n  } else if(approvedIncluded<3) fail("Conclua e tenha aprovadas as 3 avaliações incluídas antes de solicitar uma avaliação extra.");\n  let creditQuery=db.from("training_project_review_credits").select("id").eq("training_id",training.id).eq("customer_id",customer.id).eq("status","available").eq("source",isIncluded?"included":"paid").order("created_at",{ascending:true}).limit(1);\n  const {data:credit}=await creditQuery.maybeSingle(); if(!credit) fail(isIncluded?"Crédito de avaliação incluída indisponível.":"Você não possui crédito pago para uma nova avaliação.");\n  const {data:submission,error}=await db.from("training_project_submissions").insert({training_id:training.id,enrollment_id:currentEnrollment.id,customer_id:customer.id,review_credit_id:credit.id,submission_number:nextNumber,title,project_url:projectUrl,project_text:projectText,status:"submitted"}).select("id,submission_number,status,submitted_at").single();\n  if(error||!submission) fail("Não foi possível enviar o projeto."); await db.from("training_project_review_credits").update({status:"used",used_at:new Date().toISOString()}).eq("id",credit.id); return {ok:true as const,submission};\n}\n\n'''
          t=t[:start]+new_submit+t[end:]

          # certificado somente após 3 aprovações
          marker='''  if (!completedAt && progress >= 100 && Date.now() >= eligibleDay) { completedAt = new Date().toISOString(); certificateAvailableAt = new Date(Date.now() + 15 * 86400000).toISOString(); }'''
          repl='''  const { count: approvedReviews } = await db.from("training_project_submissions").select("id", { count:"exact", head:true }).eq("training_id", training.id).eq("customer_id", customer.id).eq("status", "approved").lte("submission_number", 3);\n  if (!completedAt && progress >= 100 && Date.now() >= eligibleDay && Number(approvedReviews ?? 0) >= 3) { completedAt = new Date().toISOString(); certificateAvailableAt = new Date(Date.now() + 15 * 86400000).toISOString(); }'''
          t=rep(t,marker,repl,'certificado após 3 avaliações')
          save(p,t)

          # 3) Revisão profissional: aprovar ou solicitar ajustes
          p,t=load('lib/learning.functions.ts')
          t=t.replace('inputValidator((data: { submissionId: string; feedback: string }) => data)','inputValidator((data: { submissionId: string; feedback: string; decision: "approved" | "changes_requested" }) => data)')
          save(p,t)

          p,t=load('lib/learning.server.ts')
          old='''export async function professionalReviewTrainingProject(userId: string, input: { submissionId: string; feedback: string }) {\n  await requireProfessional(userId);\n  const feedback = input.feedback.trim();\n  if (!feedback || feedback.length > 12000) fail("Escreva a avaliação do projeto.");\n  const { data: submission } = await supabaseAdmin.from("training_project_submissions").select("id,status").eq("id", input.submissionId).maybeSingle();\n  if (!submission) fail("Projeto não encontrado.");\n  const { error } = await supabaseAdmin.from("training_project_submissions").update({ status: "reviewed", feedback, reviewed_at: new Date().toISOString() }).eq("id", input.submissionId);\n  if (error) fail("Não foi possível devolver a avaliação ao aluno.");\n  return { ok: true as const };\n}'''
          new='''export async function professionalReviewTrainingProject(userId: string, input: { submissionId: string; feedback: string; decision: "approved" | "changes_requested" }) {\n  await requireProfessional(userId);\n  const feedback = input.feedback.trim();\n  if (!feedback || feedback.length > 12000) fail("Escreva a avaliação do projeto.");\n  const { data: submission } = await supabaseAdmin.from("training_project_submissions").select("id,status,submission_number").eq("id", input.submissionId).maybeSingle();\n  if (!submission) fail("Projeto não encontrado.");\n  if (submission.status !== "submitted" && submission.status !== "in_review") fail("Este envio não está aguardando avaliação.");\n  const { error } = await supabaseAdmin.from("training_project_submissions").update({ status: input.decision, feedback, reviewed_at: new Date().toISOString(), reviewed_by:userId }).eq("id", input.submissionId);\n  if (error) fail("Não foi possível devolver a avaliação ao aluno.");\n  return { ok: true as const, status:input.decision, submissionNumber:submission.submission_number };\n}'''
          t=rep(t,old,new,'decisão da avaliação')
          save(p,t)

          p,t=load('routes/_authenticated/admin.treinamentos.tsx')
          t=t.replace('const review = useMutation({ mutationFn: (submissionId:string) => reviewProject({ data:{ submissionId, feedback:feedbackById[submissionId] ?? "" } })','const review = useMutation({ mutationFn: (input:{submissionId:string;decision:"approved"|"changes_requested"}) => reviewProject({ data:{ submissionId:input.submissionId, feedback:feedbackById[input.submissionId] ?? "", decision:input.decision } })')
          t=t.replace('onSuccess: async (_r, submissionId) => { setFeedbackById((current) => ({ ...current, [submissionId]:"" })); await refresh(); }','onSuccess: async (_r, input) => { setFeedbackById((current) => ({ ...current, [input.submissionId]:"" })); await refresh(); }')
          t=t.replace('{p.status === "reviewed" ? "Avaliado" : "Aguardando avaliação"}','{p.status === "approved" ? "Aprovado" : p.status === "changes_requested" ? "Ajustes solicitados" : p.status === "in_review" ? "Em avaliação" : "Aguardando avaliação"}')
          t=t.replace('{p.status === "reviewed" && p.feedback ?','{(p.status === "approved" || p.status === "changes_requested") && p.feedback ?')
          oldbtn='<button disabled={!(feedbackById[p.id] ?? "").trim() || review.isPending} onClick={()=>review.mutate(p.id)} className="mt-3 min-h-11 rounded-xl bg-primary px-5 text-sm font-bold text-primary-foreground disabled:opacity-50">Concluir avaliação e devolver ao aluno</button>'
          newbtn='<div className="mt-3 flex flex-col gap-2 sm:flex-row"><button disabled={!(feedbackById[p.id] ?? "").trim() || review.isPending} onClick={()=>review.mutate({submissionId:p.id,decision:"changes_requested"})} className="min-h-11 rounded-xl border border-amber-500 px-5 text-sm font-bold text-amber-700 disabled:opacity-50">Solicitar ajustes</button><button disabled={!(feedbackById[p.id] ?? "").trim() || review.isPending} onClick={()=>review.mutate({submissionId:p.id,decision:"approved"})} className="min-h-11 rounded-xl bg-primary px-5 text-sm font-bold text-primary-foreground disabled:opacity-50">Aprovar e liberar próximo mês</button></div>'
          t=rep(t,oldbtn,newbtn,'botões admin avaliação')
          save(p,t)

          # 4) Combo: acesso a eBook + Livro + Treinamento pelo preço promocional
          p,t=load('lib/digital-content.server.ts')
          t=t.replace('ebook_coragem_comecar: ["ebook_coragem_comecar", "a_coragem_de_comecar", "ebook"],','ebook_coragem_comecar: ["ebook_coragem_comecar", "a_coragem_de_comecar", "ebook", "combo_empreendedor"],')
          t=t.replace('livro_menino_mamao: ["livro_menino_mamao", "menino_mamao", "livro"],','livro_menino_mamao: ["livro_menino_mamao", "menino_mamao", "livro", "combo_empreendedor"],')
          save(p,t)

          p,t=load('lib/client-portal.server.ts')
          t=t.replace('ebook_coragem_comecar: ["ebook_coragem_comecar", "a_coragem_de_comecar", "ebook"],','ebook_coragem_comecar: ["ebook_coragem_comecar", "a_coragem_de_comecar", "ebook", "combo_empreendedor"],')
          t=t.replace('livro_menino_mamao: ["livro_menino_mamao", "menino_mamao", "livro"],','livro_menino_mamao: ["livro_menino_mamao", "menino_mamao", "livro", "combo_empreendedor"],')
          if 'createClientEntrepreneurComboCheckout' not in t:
              t += '''\n\nexport async function createClientEntrepreneurComboCheckout(userId:string,email:string|null,market:DigitalMarket){\n  const customer=await requireClient(userId,email);\n  const {data:existing}=await supabaseAdmin.from("orders").select("id").eq("customer_id",customer.id).eq("payment_status","pago").eq("catalog_key","combo_empreendedor").limit(1).maybeSingle();\n  if(existing) fail("O Combo Empreendedor já está disponível para esta conta.");\n  const amountCents=market==="BR"?29999:4990; const currency=market==="BR"?"BRL":"EUR";\n  const {data:order,error:orderError}=await supabaseAdmin.from("orders").insert({order_number:"",customer_id:customer.id,contact_email:customer.email,contact_phone:customer.phone,service_type:"produto_digital",title:"Combo Empreendedor — Formação Completa",description:"eBook + Livro + Formação Do Mamão ao Negócio",quantity:1,amount_cents:amountCents,currency,payment_status:"pendente",status:"novo",priority:"media",catalog_key:"combo_empreendedor",metadata:{product_key:"combo_empreendedor",bundle:"ebook_coragem_comecar,livro_menino_mamao,do_mamao_ao_negocio",market,auth_user_id:userId}} as never).select("id").single();\n  if(orderError||!order) fail("Não foi possível iniciar o pedido do Combo.");\n  const secret=process.env["STRIPE_SECRET_KEY"]; if(!secret){await supabaseAdmin.from("orders").delete().eq("id",order.id);fail("Pagamento temporariamente indisponível.");}\n  const request=getRequest(); const requestUrl=request?new URL(request.url):null; const appOrigin=process.env["CLIENT_PANEL_URL"]?.replace(/\\/$/,"")||(requestUrl?requestUrl.origin:"https://painel.ldrrhestrategia.com");\n  const params=new URLSearchParams(); params.set("mode","payment"); params.set("line_items[0][price_data][currency]",currency.toLowerCase()); params.set("line_items[0][price_data][unit_amount]",String(amountCents)); params.set("line_items[0][price_data][product_data][name]","Combo Empreendedor — eBook + Livro + Formação"); params.set("line_items[0][quantity]","1");\n  params.set("success_url",`${appOrigin}/cliente/biblioteca?payment=success&combo=1&session_id={CHECKOUT_SESSION_ID}`); params.set("cancel_url",`${appOrigin}/cliente/biblioteca?payment=cancel&combo=1`); params.set("client_reference_id",userId); params.set("metadata[order_id]",order.id); params.set("metadata[product_key]","combo_empreendedor"); params.set("metadata[user_id]",userId); params.set("metadata[market]",market); params.set("payment_intent_data[metadata][order_id]",order.id); params.set("payment_intent_data[metadata][product_key]","combo_empreendedor"); if(customer.email)params.set("customer_email",customer.email);\n  let response:Response; try{response=await fetch("https://api.stripe.com/v1/checkout/sessions",{method:"POST",headers:{Authorization:`Bearer ${secret}`,"Content-Type":"application/x-www-form-urlencoded"},body:params});}catch{await supabaseAdmin.from("orders").delete().eq("id",order.id);fail("Não foi possível abrir o checkout do Combo.");}\n  const session=await response.json() as {id?:string;url?:string}; if(!response.ok||!session.id||!session.url){await supabaseAdmin.from("orders").delete().eq("id",order.id);fail("Não foi possível abrir o checkout do Combo.");}\n  await supabaseAdmin.from("orders").update({stripe_checkout_session_id:session.id}).eq("id",order.id); return {url:session.url};\n}\n'''
          save(p,t)

          p,t=load('lib/client-portal.functions.ts')
          if 'clientCreateEntrepreneurComboCheckout' not in t:
