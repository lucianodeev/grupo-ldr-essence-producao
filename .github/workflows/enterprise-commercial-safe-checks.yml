name: Enterprise commercial safe checks
on:
  pull_request:
    paths:
      - 'apps/painel-ldr/src/**'
      - 'apps/painel-ldr/tests/**'
      - 'apps/painel-ldr/supabase/migrations/*enterprise_quote*'
      - 'scripts/agenda/**'
      - '.github/workflows/enterprise-commercial-safe-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/painel-ldr run generate-routes
      - run: npm --prefix apps/painel-ldr run typecheck
      - name: Isolated permissions, proposal, catalogue and product regressions
        run: node --test apps/painel-ldr/tests/*.test.cjs
      - name: Signed webhooks and Google transport failures (no provider traffic)
        env:
          AGENDA_PG_PACKAGE: ${{ github.workspace }}/apps/painel-ldr/package.json
        run: node --test scripts/agenda/payment-webhook.test.mjs scripts/agenda/calendar*.test.mjs
      - name: Protected remote Calendar configuration guards without credentials
        run: node --test scripts/agenda/remote-calendar-config.test.mjs
      - name: Production build, without deployment
        run: npm --prefix apps/painel-ldr run build:render
      - name: Typecheck generated production route registration
        run: npm --prefix apps/painel-ldr run typecheck
  local-supabase:
    # Standard runner in this public repository. No hosted Supabase branch or secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: npm install --prefix /tmp/free-pg --no-audit --no-fund pg@8.23.1
      - name: Start disposable local Auth, Data API and database
        run: |
          supabase init --workdir /tmp/ldr-free-supabase --yes
          sed -i 's/enable_confirmations = false/enable_confirmations = true/' /tmp/ldr-free-supabase/supabase/config.toml
          supabase start --workdir /tmp/ldr-free-supabase --exclude storage-api,imgproxy,realtime,studio,postgres-meta,edge-runtime,logflare,vector,supavisor > /tmp/ldr-local-start.log 2>&1
          umask 077
          supabase status --workdir /tmp/ldr-free-supabase -o json > /tmp/ldr-local-status.json
      - name: Integrated authentication, free proposal, approval, signed fixture, credits and agenda
        env:
          AGENDA_PG_PACKAGE: /tmp/free-pg/package.json
          LDR_LOCAL_SUPABASE_STATUS: /tmp/ldr-local-status.json
          LDR_LOCAL_BROWSER_IDENTITIES: /tmp/ldr-local-browser-identities.json
        run: node scripts/agenda/free-supabase-integration.mjs
      - run: npm install --prefix /tmp/free-browser --no-audit --no-fund playwright@1.56.1
      - run: /tmp/free-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify cookie sessions and private pages in the real local application
        env:
          PLAYWRIGHT_PACKAGE: /tmp/free-browser/package.json
          LDR_LOCAL_SUPABASE_STATUS: /tmp/ldr-local-status.json
          LDR_LOCAL_BROWSER_IDENTITIES: /tmp/ldr-local-browser-identities.json
        run: node scripts/agenda/free-supabase-browser.mjs
      - name: Remove disposable stack and local data
        if: always()
        run: supabase stop --workdir /tmp/ldr-free-supabase --no-backup
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/painel-ldr run build:render
      - run: npm install --prefix /tmp/ldr-browser --no-audit --no-fund playwright@1.56.1
      - run: /tmp/ldr-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check local desktop and mobile journeys without credentials
        env:
          PLAYWRIGHT_PACKAGE: /tmp/ldr-browser/package.json
          LDR_VISUAL_OUTPUT: /tmp/ldr-commercial-visual
        run: node scripts/agenda/commercial-visual.mjs
      - name: Verify shared Academy catalog in public and private views
        env:
          LDR_READER_PLAYWRIGHT: /tmp/ldr-browser/node_modules/playwright
        run: node tools/test-academy-unified-catalog-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-desktop-mobile
          path: |
            /tmp/ldr-commercial-visual/*.jpg
            /tmp/ldr-unified-academy/results.json
            /tmp/ldr-unified-academy/*.png
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        suite: [enterprise, agenda]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: commercial_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated_test_only
      PGDATABASE: commercial_test
      ENTERPRISE_SQL_PACKAGE: /tmp/enterprise-pg/package.json
      AGENDA_PG_PACKAGE: /tmp/enterprise-pg/package.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/enterprise-pg --no-audit --no-fund pg@8.23.1
      - name: Execute quote financial guards and payment/credit lifecycle in disposable PostgreSQL
        if: matrix.suite == 'enterprise'
        run: node scripts/agenda/enterprise-quotes-sql.mjs
      - name: Execute actual calendar RPC, RLS, credit and concurrency regressions
        if: matrix.suite == 'agenda'
        run: node scripts/agenda/verify.mjs
