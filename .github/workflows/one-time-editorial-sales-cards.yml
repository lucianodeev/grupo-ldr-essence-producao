name: Editorial sales cards patch
on:
  push:
    paths:
      - '.github/workflows/one-time-editorial-sales-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sales page
        run: python tools/patch_editorial_sales_cards.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/library-sales-home.tsx
          git commit -m "feat(painel): add Jornal and Revista to sales page"
          git push
