name: One-time publish psychoanalysis ebooks v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-publish-psychoanalysis-ebooks-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply the validated ebook patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/one-time-publish-psychoanalysis-ebooks.yml').read_text()
          start=source.index("          from pathlib import Path", source.index("python3 - <<'PY'"))
          end=source.index("\n          PY", start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          code='\n'.join(lines)
          compile(code,'ebook_patch','exec')
          exec(code,{'__name__':'__main__'})
          PY
      - name: Install and build
        working-directory: apps/painel-ldr
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify wiring and preserve lockfile
        run: |
          grep -q 'ebook_psicanalise_autismo' apps/painel-ldr/src/lib/client-portal.server.ts
          grep -q 'PSYCHOANALYSIS_EBOOKS.map' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          grep -q 'dynamicPrice:true' apps/painel-ldr/src/lib/client-portal.server.ts
          grep -q 'ebook_pratica_clinica_psicanalise' apps/painel-ldr/src/lib/digital-content.server.ts
          git restore apps/painel-ldr/package-lock.json 2>/dev/null || true
      - name: Commit result
        run: |
          rm -f .github/workflows/one-time-publish-psychoanalysis-ebooks.yml .github/workflows/one-time-publish-psychoanalysis-ebooks-v2.yml
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add -A
          git commit -m "feat: publish four psychoanalysis ebooks in academy"
          git push origin main
