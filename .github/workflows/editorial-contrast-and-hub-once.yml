name: Editorial contrast and hub cleanup once
on:
  push:
    paths:
      - '.github/workflows/editorial-contrast-and-hub-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix editorial hub and contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          hub=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.publicacoes.tsx')
          s=hub.read_text()
          old='<div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">{items.map(item=>'
          legacy='''<div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
          <Link to="/cliente/biblioteca/jornal-ldr" className="group overflow-hidden rounded-[26px] border bg-white !text-slate-900 shadow-sm transition hover:-translate-y-1 hover:shadow-xl"><div className="bg-gradient-to-br from-[#071426] via-[#0b2341] to-[#163b67] p-5 !text-white"><div className="flex items-start justify-between gap-3"><span className="text-3xl">📰</span><span className="rounded-full bg-white/15 px-3 py-1 text-[9px] font-black uppercase tracking-wider !text-white">{t.weekly}</span></div><h3 className="mt-5 font-serif text-2xl leading-tight !text-white">Jornal LDR</h3><p className="mt-2 text-xs leading-5 !text-white/80">LDR Editorial</p></div><div className="p-5"><p className="text-sm font-bold text-slate-700">{t.independent}</p><p className="mt-1 font-black text-[#0b2341]">{money(90,"EUR",locale)} / {t.week} <span className="font-medium text-slate-500">· {t.brazil} {money(90,"BRL",locale)}</span></p></div></Link>
          <Link to="/cliente/biblioteca/revista-ldr" className="group overflow-hidden rounded-[26px] border bg-white !text-slate-900 shadow-sm transition hover:-translate-y-1 hover:shadow-xl"><div className="bg-gradient-to-br from-[#4c071d] via-[#6b0d2b] to-[#8f2448] p-5 !text-white"><div className="flex items-start justify-between gap-3"><span className="text-3xl">📖</span><span className="rounded-full bg-white/15 px-3 py-1 text-[9px] font-black uppercase tracking-wider !text-white">{t.weekly}</span></div><h3 className="mt-5 font-serif text-2xl leading-tight !text-white">Revista LDR</h3><p className="mt-2 text-xs leading-5 !text-white/80">LDR Editorial</p></div><div className="p-5"><p className="text-sm font-bold text-slate-700">{t.independent}</p><p className="mt-1 font-black text-[#0b2341]">{money(90,"EUR",locale)} / {t.week} <span className="font-medium text-slate-500">· {t.brazil} {money(90,"BRL",locale)}</span></p></div></Link>
          {items.map(item=>'''
          if old not in s:
              raise SystemExit('Hub grid anchor not found')
          s=s.replace(old,legacy,1)
          s=s.replace('className="mt-5 font-serif text-2xl leading-tight">{item.title}</h3>','className="mt-5 font-serif text-2xl leading-tight !text-white">{item.title}</h3>')
          s=s.replace('className="mt-2 text-xs leading-5 text-white/70">{item.subtitle}</p>','className="mt-2 text-xs leading-5 !text-white/80">{item.subtitle}</p>')
          hub.write_text(s)

          page=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.publicacoes.$slug.tsx')
          p=page.read_text()
          p=p.replace('className="mt-3 max-w-4xl font-serif text-4xl leading-tight sm:text-6xl">{item.title}</h1>','className="mt-3 max-w-4xl font-serif text-4xl leading-tight !text-white sm:text-6xl">{item.title}</h1>')
          p=p.replace('className="mt-4 max-w-3xl text-base leading-7 text-white/75">{item.description}</p>','className="mt-4 max-w-3xl text-base leading-7 !text-white/80">{item.description}</p>')
          p=p.replace('className="font-serif text-4xl sm:text-6xl">{item.title}</h1>','className="font-serif text-4xl !text-white sm:text-6xl">{item.title}</h1>')
          p=p.replace('className="mt-5 max-w-3xl text-lg leading-8 text-white/75">{item.subtitle}</p>','className="mt-5 max-w-3xl text-lg leading-8 !text-white/80">{item.subtitle}</p>')
          page.write_text(p)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.publicacoes.tsx apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.publicacoes.\$slug.tsx
          git commit -m "fix(painel): unify editorial hub and improve contrast"
          git push
