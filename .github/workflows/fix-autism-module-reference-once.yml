name: Fix autism module reference once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-autism-module-reference-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct Klein reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/content/psychoanalysis-autism-module.ts')
          s=p.read_text(encoding='utf-8')
          old='The Psychogenesis of a Case of Homosexuality in a Woman / writings on child analysis — contextualização do Caso Dick'
          new='The Importance of Symbol-Formation in the Development of the Ego'
          if old not in s:
              raise SystemExit('reference pattern not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src/content/psychoanalysis-autism-module.ts
          git commit -m 'fix(painel): correct Klein reference in autism module'
          git push origin main
