name: One-time unique library card colors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-unique-library-card-colors.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply unique card palette
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()

          # Keep existing unique colors. Change only duplicates in the compact catalog.
          replacements={
            '{card("book",ct.books,"bg-[#5b0824]","book",accessLabels.included)}':'{card("book",ct.books,"bg-[#7A3E12]","book",accessLabels.included)}',
            'className="min-w-0 rounded-2xl bg-[#0b2341] px-1 py-4 text-center text-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"><span className="mx-auto block text-lg">🤝</span>':'className="min-w-0 rounded-2xl bg-[#2F6F4E] px-1 py-4 text-center text-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"><span className="mx-auto block text-lg">🤝</span>',
            'href="/cliente/orientacao-profissional" className="min-w-0 rounded-2xl bg-[#0b5cab]':'href="/cliente/orientacao-profissional" className="min-w-0 rounded-2xl bg-[#4B3F8F]',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Expected compact-card source not found: {old[:80]}')
            s=s.replace(old,new,1)

          old='''{PROFESSIONAL_FORMATIONS.map((f,i)=>{const ft=pfText(f,locale);const included=includedProfessionalSlugs.has(f.slug);const colors=["#0b2341","#5b0824","#17645e","#0F5E7A","#5b2b86","#047857","#9a4f13","#143d59","#263b63","#7a3f16","#0f5132"];return <a key={f.slug} href={f.learnerPath} className="min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" style={{backgroundColor:colors[f.theme]??"#0b2341"}}><span className="mx-auto block text-lg">{f.icon}</span>'''
          new='''{PROFESSIONAL_FORMATIONS.map((f,i)=>{const ft=pfText(f,locale);const included=includedProfessionalSlugs.has(f.slug);const colors=["#6F4E37","#3E6B89","#8C4A5B","#6A5A91","#2E7D6E","#9A6B2F","#4F6B3C","#7B4F8C","#A14F36","#356B72","#76543A","#5D6F8A","#884C63","#3E745B","#8B6A3E","#526B88","#6D3FA0","#2F6F73","#A65A3A","#7A3651","#315F86","#B1842F"];return <a key={f.slug} href={f.learnerPath} className="min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" style={{backgroundColor:colors[i%colors.length]}}><span className="mx-auto block text-lg">{f.icon}</span>'''
          if old not in s:
            raise SystemExit('Professional formation color renderer not found')
          s=s.replace(old,new,1)

          # Guard: no repeated explicit compact-card backgrounds among the key fixed cards.
          expected=['#5b0824','#7A3E12','#0b2341','#d6ad63','#5b2b86','#17645e','#0F5E7A','#2F6F4E','#263b63','#4B3F8F','#c85a24','#0b5cab','#0f5132','#047857','#b85c2e','#123f73','#b4232a','#143d59','#24476f','#8a6a2d','#35101e']
          if len(expected)!=len(set(x.lower() for x in expected)):
            raise SystemExit('Fixed-card palette contains duplicates')
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-unique-library-card-colors.yml
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add -A
          git commit -m "ui: give every library card a unique color identity"
          git push origin main
