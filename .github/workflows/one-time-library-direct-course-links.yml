name: One time direct course links
on:
  push:
    paths: ['.github/workflows/one-time-library-direct-course-links.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch course cards
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          old='''  const card=(key:string,label:string,bg:string,icon="grad",status?:string)=><button onClick={()=>setActive(active===key?null:key)} className={`min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm ${bg} ${active===key?"ring-2 ring-[#d6ad63]":""}`}>{icon==="book"?<BookOpen className="mx-auto h-5 w-5"/>:icon==="film"?<Film className="mx-auto h-5 w-5"/>:<GraduationCap className="mx-auto h-5 w-5"/>}<p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">{label}</p>{status?<span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase tracking-wide text-white sm:text-[7px]">{status}</span>:null}</button>;'''
          new='''  const card=(key:string,label:string,bg:string,icon="grad",status?:string)=>{const paths:Record<string,string>={training:"/cliente/treinamentos/do-mamao-ao-negocio",psycho:"/cliente/treinamentos/psicanalise",brief:"/cliente/treinamentos/terapia-breve-psicanalitica",massage:"/cliente/treinamentos/massoterapia",business24:"/cliente/treinamentos/negocio-24-horas",mentor:"/cliente/treinamentos/mentoria-carreira",leader:"/cliente/treinamentos/lideranca-gestao",ai:"/cliente/treinamentos/ia-negocios-carreira",hr:"/cliente/formacoes/gestao-pessoas-rh"};const allowed=key==="hr"||Boolean((ent as any)[key]);const body=<>{icon==="book"?<BookOpen className="mx-auto h-5 w-5"/>:icon==="film"?<Film className="mx-auto h-5 w-5"/>:<GraduationCap className="mx-auto h-5 w-5"/>}<p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">{label}</p>{status?<span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase tracking-wide text-white sm:text-[7px]">{status}</span>:null}</>;return paths[key]&&allowed?<a href={paths[key]} className={`min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm transition hover:-translate-y-0.5 ${bg}`}>{body}</a>:<button onClick={()=>setActive(active===key?null:key)} className={`min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm ${bg} ${active===key?"ring-2 ring-[#d6ad63]":""}`}>{body}</button>};'''
          if old not in s: raise SystemExit('card helper not found')
          p.write_text(s.replace(old,new,1))
      - name: Fix professional owner check
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/painel-ldr/src/lib/professional-formations.server.ts')
          s=p.read_text().replace('hasOwnerDigitalAccess(email??customer.email,userId)','hasOwnerDigitalAccess(email??c.email,userId)')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name ldr-rh-campanhas
          git config user.email llucianouam@gmail.com
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx apps/painel-ldr/src/lib/professional-formations.server.ts
          git commit -m "fix: open entitled library courses directly" || exit 0
          git push
