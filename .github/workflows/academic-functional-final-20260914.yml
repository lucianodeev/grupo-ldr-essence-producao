name: Academic Network final functional corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academic-functional-final-20260914.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync current Academic Network table types
        run: python tools/sync_academic_supabase_types_20260914.py
      - name: Verify Academic Network type sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/integrations/supabase/types.ts')
          text=p.read_text()
          required=['academic_comments','academic_connections','academic_conversations','academic_messages','academic_post_media','academic_posts','academic_profiles','academic_reactions','academic_saved_posts']
          missing=[name for name in required if f'      {name}: {{' not in text]
          if missing: raise SystemExit(f'Missing synced Academic Network types: {missing}')
          print('Academic Network schema type gate: OK')
          PY
      - name: Record existing any usage
        run: |
          python - <<'PY' > /tmp/any-before.txt
          from pathlib import Path
          import re
          files=[Path('apps/painel-ldr/src/components/academic-social-v3-feed.tsx'),Path('apps/painel-ldr/src/lib/academic-network.server.ts'),Path('apps/painel-ldr/src/lib/academic-dm.server.ts')]
          print(sum(len(re.findall(r'\bany\b', p.read_text())) for p in files))
          PY
      - name: Normalize targeted patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/patch_academic_functional_20260914.py')
          text=p.read_text()
          old='''    if count!=1:\n        raise SystemExit(f"{label}: expected one match, found {count}")'''
          new='''    if count!=1 and not (label=="article composer delete prop" and count==2):\n        raise SystemExit(f"{label}: expected one match, found {count}")'''
          if old not in text: raise SystemExit('patch guard not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Apply targeted functional corrections
        run: python tools/patch_academic_functional_20260914.py
      - name: Complete strict state location and DM compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/painel-ldr/src/components/academic-social-v3-feed.tsx')
          text=p.read_text()
          old='typeof row.count==="number"?row.count:null'
          if old not in text: raise SystemExit('strict count access target not found')
          text=text.replace(old,'typeof row["count"]==="number"?row["count"]:null',1)
          marker='''</div>}{file&&<div className="mt-2 rounded-xl border bg-muted/30 p-2">'''
          badge='''</div>}{!locationOpen&&location&&<div className="mt-2 flex items-center gap-2 rounded-xl border bg-muted/30 px-3 py-2 text-xs"><MapPin className="h-4 w-4 shrink-0 text-[#b78927]"/><span className="min-w-0 flex-1 truncate">{location}</span><button type="button" aria-label="Remover localização" onClick={()=>{setLocation("");setLocationCity("");setLocationCountry("")}} className="shrink-0 rounded-lg border px-2 py-1 text-[10px] font-black">REMOVER</button></div>}{file&&<div className="mt-2 rounded-xl border bg-muted/30 p-2">'''
          if marker not in text: raise SystemExit('selected location marker not found')
          p.write_text(text.replace(marker,badge,1))

          dm=Path('apps/painel-ldr/src/lib/academic-dm.server.ts')
          d=dm.read_text()
          replacements=[
            (',created_by:createdBy,status:"pending"',',status:"pending"'),
            ('select("id,user_one_id,user_two_id,last_message_at,created_at").or(`user_one_id.eq.${userId},user_two_id.eq.${userId}`).order("last_message_at",{ascending:false,nullsFirst:false}).order("created_at",{ascending:false})','select("id,user_one_id,user_two_id,updated_at,created_at").or(`user_one_id.eq.${userId},user_two_id.eq.${userId}`).order("updated_at",{ascending:false}).order("created_at",{ascending:false})'),
            ('update({last_message_at:now,updated_at:now})','update({updated_at:now})')
          ]
          for old_value,new_value in replacements:
            if old_value not in d: raise SystemExit(f'DM compatibility target not found: {old_value[:60]}')
            d=d.replace(old_value,new_value,1)
          dm.write_text(d)
          PY
      - name: Ensure no new any usage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('apps/painel-ldr/src/components/academic-social-v3-feed.tsx'),Path('apps/painel-ldr/src/lib/academic-network.server.ts'),Path('apps/painel-ldr/src/lib/academic-dm.server.ts')]
          before=int(Path('/tmp/any-before.txt').read_text().strip())
          after=sum(len(re.findall(r'\bany\b', p.read_text())) for p in files)
          print(f'any usage touched runtime files: before={before}, after={after}')
          if after>before: raise SystemExit('Patch increased any usage')
          PY
      - name: Full TypeScript audit
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: npm run typecheck 2>&1 | tee ../../tools/academic-functional-typecheck.log
      - name: Reject Academic Network TypeScript errors
        run: |
          grep -E 'src/(components/academic-social-v3-feed|lib/academic-(network|dm|location)|routes/_clientarea\.cliente\.rede-academica|integrations/supabase/types)' tools/academic-functional-typecheck.log > tools/academic-network-typecheck-current.log || true
          test ! -s tools/academic-network-typecheck-current.log || (cat tools/academic-network-typecheck-current.log && exit 1)
      - name: Production build
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Commit validated corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src/components/academic-social-v3-feed.tsx apps/painel-ldr/src/lib/academic-network.server.ts apps/painel-ldr/src/lib/academic-dm.server.ts apps/painel-ldr/src/integrations/supabase/types.ts tools/academic-functional-typecheck.log
          git rm -f tools/academic-network-typecheck-current.log tools/patch_academic_functional_20260914.py tools/sync_academic_supabase_types_20260914.py .github/workflows/academic-functional-final-20260914.yml
          git commit -m 'fix(academic): finalize social actions publishing and dm'
          git push origin main