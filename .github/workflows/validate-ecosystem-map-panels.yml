name: Validate ecosystem map and panels

on:
  push:
    branches:
      - fix/ecosystem-map-panels
    paths:
      - 'apps/painel-ldr/**'
      - '.github/workflows/validate-ecosystem-map-panels.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate route tree
        working-directory: apps/painel-ldr
        run: npm run generate-routes
      - name: Preview routing tests
        working-directory: apps/painel-ldr
        run: npm run test:preview
      - name: Core tests
        working-directory: apps/painel-ldr
        run: npm test
      - name: Academic regressions
        working-directory: apps/painel-ldr
        run: npm run test:academic
      - name: Render build
        working-directory: apps/painel-ldr
        env:
          SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build:render
      - name: Verify server output
        run: test -f apps/painel-ldr/.output/server/index.mjs
