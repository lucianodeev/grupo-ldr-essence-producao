name: Fix Luciano public homepage v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-luciano-public-home-v3.yml']
permissions:
  contents: write
jobs:
  fix-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply full public-home identity and visible ebook sample
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/luciano-empreendedor/index.html')
          html = p.read_text(encoding='utf-8')

          # Replace only the enhancement style block. Library/book styles are intentionally untouched.
          new_css = r'''<style id="ldr-public-ux-20260825">
          :root{--ldr-navy:#0d2340;--ldr-blue:#173a67;--ldr-blue2:#244f82;--ldr-gold:#c7a45a;--ldr-cream:#f7f2e8;--ldr-paper:#fffdf8;--ldr-ink:#172033;--ldr-wine:#4b101d;--ldr-wine-deep:#2b0a11}
          /* PUBLIC HOMEPAGE ONLY — do not alter #library, ebook reader or book experience */
          body:not(.library-open){background:var(--ldr-cream)}
          #site{background:linear-gradient(180deg,var(--ldr-navy) 0 520px,var(--ldr-cream) 520px 100%)!important;color:var(--ldr-ink)!important;min-height:100vh}
          #site>header{background:rgba(13,35,64,.97)!important;border-bottom:1px solid rgba(199,164,90,.55)!important;box-shadow:0 8px 30px rgba(4,19,38,.18)!important}
          #site>header,#site>header a,#site>header button,#site>header .logo{color:#fff!important}
          #site>header .logo{font-family:Georgia,'Times New Roman',serif!important}
          #site>header a:hover{color:var(--ldr-gold)!important}
          #site>main,#site>.container{position:relative}
          #site section:not(.ldr-editorial){background:transparent!important}
          #site h1,#site h2,#site h3{color:var(--ldr-navy)!important}
          #site p,#site li{color:#455064}
          #site a[class*="btn"],#site button:not([class*="close"]){border-radius:999px!important}
          #site a[class*="btn"]:not(.ldr-btn-secondary),#site button:not([class*="close"]){background:var(--ldr-gold)!important;color:#20170b!important;border-color:var(--ldr-gold)!important;font-weight:800!important}

          #site .ldr-home-enhancement{display:block!important;visibility:visible!important;opacity:1!important;font-family:Montserrat,Arial,sans-serif;padding:clamp(18px,3.5vw,44px) 20px 56px;background:transparent!important;position:relative;z-index:2}
          #site .ldr-wrap{max-width:1120px;margin:0 auto}
          #site .ldr-home-top{background:linear-gradient(135deg,var(--ldr-blue),var(--ldr-navy));border:1px solid rgba(199,164,90,.55);border-radius:26px;padding:clamp(26px,5vw,56px);box-shadow:0 24px 60px rgba(4,19,38,.22);margin-bottom:22px}
          #site .ldr-home-top .ldr-title,#site .ldr-home-top .ldr-lead{color:#fff!important}
          #site .ldr-kicker{font-size:.76rem;text-transform:uppercase;letter-spacing:.18em;font-weight:900;color:var(--ldr-gold)!important}
          #site .ldr-title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(2.1rem,4.4vw,4.1rem);line-height:1.03;margin:.35rem 0 1rem}
          #site .ldr-lead{font-size:clamp(1rem,1.6vw,1.18rem);line-height:1.7;max-width:820px}
          #site .ldr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}
          #site .ldr-card{background:var(--ldr-paper)!important;border:1px solid rgba(13,35,64,.14);border-top:4px solid var(--ldr-gold);border-radius:20px;padding:clamp(20px,3vw,32px);box-shadow:0 16px 40px rgba(13,35,64,.09)}
          #site .ldr-card h3{font-family:Georgia,'Times New Roman',serif;color:var(--ldr-navy)!important;font-size:1.55rem;margin:0 0 10px}
          #site .ldr-card p{line-height:1.65;color:#566174!important;margin:.45rem 0}

          /* Ebook sample keeps its own editorial wine/gold identity */
          #site .ldr-editorial{display:block!important;visibility:visible!important;opacity:1!important;margin:24px 0 0;background:linear-gradient(145deg,var(--ldr-wine),var(--ldr-wine-deep))!important;border:2px solid rgba(199,164,90,.78)!important;border-radius:28px;padding:clamp(28px,5vw,58px);color:var(--ldr-cream)!important;box-shadow:0 24px 60px rgba(43,10,17,.24)}
          #site .ldr-editorial .ldr-title{color:var(--ldr-cream)!important}
          #site .ldr-editorial .ldr-kicker,#site .ldr-editorial strong{color:var(--ldr-gold)!important}
          #site .ldr-editorial p{color:#f1e8dc!important;line-height:1.75}
          #site .ldr-free-badge{display:inline-flex;align-items:center;gap:8px;background:var(--ldr-gold);color:#24190c;border-radius:999px;padding:9px 14px;font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
          #site .ldr-quote{font-size:clamp(1.25rem,2.3vw,2rem);text-align:center;margin:1.2rem auto;max-width:850px;font-family:Georgia,'Times New Roman',serif}
          #site details.ldr-sample{display:block!important;margin-top:22px;border:1px solid rgba(199,164,90,.65);border-radius:18px;background:rgba(255,255,255,.07)!important;overflow:hidden}
          #site details.ldr-sample summary{cursor:pointer;padding:18px 20px;font-weight:900;color:var(--ldr-gold)!important;list-style:none;font-size:1.02rem}
          #site details.ldr-sample summary::-webkit-details-marker{display:none}
          #site details.ldr-sample[open] summary{border-bottom:1px solid rgba(199,164,90,.32)}
          #site .ldr-chapter{display:block!important;padding:12px 20px 24px;max-width:840px}
          #site .ldr-chapter h4{font-family:Georgia,'Times New Roman',serif;color:#fff!important;font-size:1.55rem;margin:.6rem 0 1rem}
          #site .ldr-chapter p{color:#f1e8dc!important;margin:.9rem 0}
          #site .ldr-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
          #site .ldr-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:13px 20px;font-weight:900;text-decoration:none;border:1px solid transparent}
          #site .ldr-btn-primary{background:var(--ldr-gold)!important;color:#24190c!important}
          #site .ldr-btn-secondary{background:transparent!important;border-color:rgba(247,242,232,.72)!important;color:var(--ldr-cream)!important}
          .ldr-floating{position:fixed;right:18px;bottom:18px;z-index:9998;display:flex;flex-direction:column;gap:10px;align-items:flex-end;font-family:Montserrat,Arial,sans-serif}
          .ldr-floating a{display:flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 17px;text-decoration:none;font-size:.88rem;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.18)}
          .ldr-floating .client{background:var(--ldr-navy);color:white;border:1px solid rgba(199,164,90,.5)}
          .ldr-floating .whatsapp{background:#25D366;color:#092d18}
          body:has(#library.open) .ldr-floating{display:none}
          @media(max-width:760px){#site{background:linear-gradient(180deg,var(--ldr-navy) 0 420px,var(--ldr-cream) 420px 100%)!important}#site .ldr-grid{grid-template-columns:1fr}.ldr-floating{right:10px;bottom:10px}.ldr-floating a{padding:11px 13px;font-size:.79rem}#site .ldr-home-enhancement{padding:12px 12px 42px}#site .ldr-home-top,#site .ldr-editorial{border-radius:20px}}
          </style>'''

          html2, n = re.subn(r'<style id="ldr-public-ux-20260825">.*?</style>', new_css, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Enhancement style block not found; abort safely')
          html = html2

          # Make the sample immediately visible, not collapsed.
          html = html.replace('<details class="ldr-sample">', '<details class="ldr-sample" open>', 1)

          # Make the callout unmistakable and wrap the intro in the blue public-home identity.
          html = html.replace('<div class="ldr-wrap"><p class="ldr-kicker">Luciano Rodrigues Almeida · Grupo LDR Essence</p><h2 class="ldr-title">Ideias ganham força quando entram em movimento.</h2><p class="ldr-lead">Conheça a trajetória, os conteúdos e a plataforma criada para conectar empreendedorismo, desenvolvimento profissional e experiências reais de recomeço.</p>', '<div class="ldr-wrap"><div class="ldr-home-top"><p class="ldr-kicker">Luciano Rodrigues Almeida · Grupo LDR Essence</p><h2 class="ldr-title">Ideias ganham força quando entram em movimento.</h2><p class="ldr-lead">Conheça a trajetória, os conteúdos e a plataforma criada para conectar empreendedorismo, desenvolvimento profissional e experiências reais de recomeço.</p></div>', 1)
          html = html.replace('<article class="ldr-editorial" id="amostra-gratis"><p class="ldr-kicker">Experiência editorial exclusiva</p>', '<article class="ldr-editorial" id="amostra-gratis"><span class="ldr-free-badge">✓ Amostra grátis do eBook — disponível aqui</span><p class="ldr-kicker">Experiência editorial exclusiva</p>', 1)
          html = html.replace('<summary>Ler gratuitamente o primeiro capítulo</summary>', '<summary>▼ Leia agora gratuitamente o primeiro capítulo</summary>', 1)

          # Marker for production verification.
          if 'ldr-home-fix-v3' not in html:
              html = html.replace('</body>', '<!-- ldr-home-fix-v3 -->\n</body>', 1)

          p.write_text(html, encoding='utf-8')
          print('Public homepage recolored; free ebook sample opened and highlighted.')
          PY
      - name: Verify scope and visible sample
        run: |
          grep -q 'ldr-home-fix-v3' apps/luciano-empreendedor/index.html
          grep -q 'Amostra grátis do eBook — disponível aqui' apps/luciano-empreendedor/index.html
          grep -q 'details class="ldr-sample" open' apps/luciano-empreendedor/index.html
          grep -q -- '--ldr-navy:#0d2340' apps/luciano-empreendedor/index.html
          grep -q 'id="library"' apps/luciano-empreendedor/index.html
      - name: Commit production fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/luciano-empreendedor/index.html
          git commit -m 'fix: show free ebook sample and apply LDR colors to public homepage'
          git push origin main
