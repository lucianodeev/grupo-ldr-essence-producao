name: Academy candidate reader checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/test-academy-candidates-browser.cjs'
      - 'tools/prepare-course-academy-candidates.cjs'
      - 'editorial/courses/**'
      - 'apps/painel-ldr/src/components/academy-reading-edition.tsx'
      - '.github/workflows/academy-candidates-browser.yml'
permissions:
  contents: read
jobs:
  candidate-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build application CSS without deployment
        run: npm --prefix apps/painel-ldr run build
      - name: Install isolated free browser runner
        run: |
          npm install --prefix /tmp/ldr-reader-ci --no-audit --no-fund playwright@1.62.1
          /tmp/ldr-reader-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify all draft units without changing approval states
        env:
          LDR_READER_PLAYWRIGHT: /tmp/ldr-reader-ci/node_modules/playwright
        run: node tools/test-academy-candidates-browser.cjs
      - name: Retain hashes and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-candidate-reader-evidence
          path: |
            /tmp/ldr-candidates-browser/results.json
            /tmp/ldr-candidates-browser/*.png
          retention-days: 7
          if-no-files-found: error
