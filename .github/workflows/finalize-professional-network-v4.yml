name: Finalize Professional Network V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-professional-network-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final navigation booking and terms updates
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/painel-ldr/src/routes/profissional-painel.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CalendarDays, CircleDollarSign, CreditCard, FileText, GraduationCap, LayoutDashboard, LogOut, Megaphone, Settings2, UserRound, UsersRound','BriefcaseBusiness, CalendarDays, CircleDollarSign, CreditCard, ExternalLink, FileText, GraduationCap, LayoutDashboard, LogOut, Megaphone, Settings2, UserRound, UsersRound')
          old='const NAV=[["#dashboard","Dashboard",LayoutDashboard],["#perfil","Meu Perfil",UserRound],["#agenda","Agenda",CalendarDays],["#atendimentos","Atendimentos",UsersRound],["#ganhos","Meus Ganhos",CircleDollarSign],["#repasses","Repasses",CreditCard],["#documentos","Documentos",FileText],["#assinatura","Minha Assinatura",CreditCard],["#treinamentos","Treinamentos ao Vivo",GraduationCap],["#comunidade","Comunidade",Megaphone],["#config","Configurações",Settings2]] as const;'
          new='const NAV=[["#dashboard","Dashboard",LayoutDashboard],["#perfil","Meu Perfil",UserRound],["/profissional-servicos","Meus Serviços",BriefcaseBusiness],["#agenda","Agenda",CalendarDays],["#atendimentos","Atendimentos",UsersRound],["#ganhos","Meus Ganhos",CircleDollarSign],["#repasses","Repasses",CreditCard],["/profissional-documentos","Documentos",FileText],["/profissional-assinatura","Minha Assinatura",CreditCard],["#treinamentos","Treinamentos ao Vivo",GraduationCap],["#comunidade","Comunidade",Megaphone],["https://ldrrhestrategia.com/solucoes","Serviços LDR",ExternalLink],["mailto:contacto@ldrrhestrategia.com","Suporte",ExternalLink],["#config","Configurações",Settings2]] as const;'
          if old in s: s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('apps/painel-ldr/src/lib/professional-network.server.ts')
          s=p.read_text(encoding='utf-8')
          needle='params.set("cancel_url", `${origin()}/profissional/${input.profileSlug}?booking=cancel`);\n  params.set("metadata[checkout_kind]", "marketplace_booking");'
          replacement='params.set("cancel_url", `${origin()}/profissional/${input.profileSlug}?booking=cancel`);\n  params.set("expires_at", String(Math.floor(Date.now() / 1000) + 30 * 60));\n  params.set("metadata[checkout_kind]", "marketplace_booking");'
          if needle in s: s=s.replace(needle,replacement)
          p.write_text(s,encoding='utf-8')

          p=Path('apps/painel-ldr/src/routes/para-profissionais.tsx')
          s=p.read_text(encoding='utf-8')
          needle='<p className="mt-2">Serviços de saúde mental não substituem serviços de emergência.</p></div></section>'
          replacement='<p className="mt-2">Serviços de saúde mental não substituem serviços de emergência.</p><Link to="/rede-profissionais/termos" className="mt-4 inline-block font-bold text-primary underline">Ler termos, privacidade, cancelamento, reembolso e repasse</Link></div></section>'
          if needle in s: s=s.replace(needle,replacement)
          p.write_text(s,encoding='utf-8')

          checks=[
            ('apps/painel-ldr/src/routes/profissional-painel.tsx','/profissional-servicos'),
            ('apps/painel-ldr/src/routes/profissional-painel.tsx','/profissional-assinatura'),
            ('apps/painel-ldr/src/lib/professional-network.server.ts','params.set("expires_at"'),
            ('apps/painel-ldr/src/routes/para-profissionais.tsx','/rede-profissionais/termos'),
          ]
          for path,text in checks:
            if text not in Path(path).read_text(encoding='utf-8'):
              raise SystemExit(f'Missing expected update: {path} -> {text}')
          PY
      - name: Commit safely
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src
          git commit -m 'feat(network): fecha navegação, termos e reserva temporária'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
