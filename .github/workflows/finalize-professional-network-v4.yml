name: Finalize Professional Network V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-professional-network-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Render landing data during SSR
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/para-profissionais.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import { useServerFn } from "@tanstack/react-start";\nimport { useEffect, useState } from "react";\n','')
          s=s.replace('export const Route = createFileRoute("/para-profissionais")({\n  head:', 'export const Route = createFileRoute("/para-profissionais")({\n  loader: () => networkLanding(),\n  head:')
          old=' const {locale}=useI18n(); const copy=COPY[locale]; const load=useServerFn(networkLanding); const [data,setData]=useState<any>(null);\n useEffect(()=>{void load().then(setData)},[load]);\n const plans=(data?.plans??[]) as AnyRow[]; const luciano=(data?.profiles??[]).find((p:AnyRow)=>p.slug==="luciano-rodrigues-almeida");'
          new=' const {locale}=useI18n(); const copy=COPY[locale]; const data=Route.useLoaderData() as any;\n const plans=(data?.plans??[]) as AnyRow[]; const luciano=(data?.profiles??[]).find((p:AnyRow)=>p.slug==="luciano-rodrigues-almeida");'
          if old not in s:
            raise SystemExit('Landing component signature changed; refusing unsafe patch')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate build
        working-directory: apps/painel-ldr
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit safely
        run: |
          git restore apps/painel-ldr/package-lock.json 2>/dev/null || true
          if git diff --quiet; then exit 0; fi
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src/routes/para-profissionais.tsx
          git commit -m 'fix(network): renderiza planos e perfil demonstrativo no SSR'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
