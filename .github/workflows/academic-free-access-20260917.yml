name: Academic Network Free Access 2026-09-17

on:
  push:
    branches:
      - automation/academic-free-access-implementation
    paths:
      - 'tools/apply_academic_free_access_20260917.py'
      - 'tools/fix_academic_free_access_runner_20260917.py'
      - '.github/workflows/academic-free-access-20260917.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Normalize free-access runner
        run: python tools/fix_academic_free_access_runner_20260917.py
      - name: Apply free-access patch
        run: python tools/apply_academic_free_access_20260917.py
      - name: Verify no Academic Network paywall remains
        run: |
          ! grep -n 'academic_access_trials' apps/painel-ldr/src/lib/academic-network.server.ts
          ! grep -n 'requirePremium(userId)' apps/painel-ldr/src/lib/academic-network.server.ts
          ! grep -nE '7 DIAS COMPLETOS|7 FULL DAYS|7 JOURS COMPLETOS|7 DÍAS COMPLETOS|Assine para publicar|Subscribe to post|Abonnez-vous pour publier|Suscríbete para publicar' apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/routes/rede-academica.tsx
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Build
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Tests
        working-directory: apps/painel-ldr
        run: npm test
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/lib/academic-network.server.ts apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/routes/rede-academica.tsx apps/painel-ldr/src/routes/_clientarea.cliente.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat(academic): make social network free for authenticated users"
            git push origin HEAD:${{ github.ref_name }}
          fi
