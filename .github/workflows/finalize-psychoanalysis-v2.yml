name: Finalize psychoanalysis v2
on:
  push:
    paths:
      - 'tools/finalize_psychoanalysis_v2.py'
      - '.github/workflows/finalize-psychoanalysis-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply psychoanalysis v2
        run: python tools/finalize_psychoanalysis_v2.py
      - name: Commit implementation
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/content/psychoanalysis-curriculum.ts apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx apps/painel-ldr/src/components/psychoanalysis-training-page.tsx apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize psychoanalysis 180-day learning experience"
          git push origin main
