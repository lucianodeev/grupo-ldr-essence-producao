name: Validate AI READY MVP branch

on:
  push:
    branches:
      - feat/ai-ready-2026-mvp
  pull_request:
    branches:
      - main
    paths:
      - 'apps/painel-ldr/**'
      - '.github/workflows/validate-ai-ready-mvp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --test apps/painel-ldr/tests/professional-availability-ownership.test.cjs apps/painel-ldr/tests/professional-availability-behavior.test.cjs
      - name: Individual service checkout and credit ownership (synthetic data)
        run: node --test apps/painel-ldr/tests/individual-service-*.test.cjs
      - name: Signed payment webhook (synthetic signatures, no financial operations)
        env:
          AGENDA_PG_PACKAGE: ${{ github.workspace }}/apps/painel-ldr/package.json
        run: node --test scripts/agenda/payment-webhook.test.mjs
      - name: Stripe recurring lifecycle regression (synthetic only)
        run: node --test scripts/stripe-recurring-lifecycle.test.mjs
      - run: npm run build:painel
