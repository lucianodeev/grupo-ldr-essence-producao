              p.write_text(s)
          PY
      - name: Validate generated course
        run: |
          grep -q 'formacao_negocio_24_horas' apps/painel-ldr/src/lib/library-subscription.server.ts
          grep -q 'NEGÓCIO EM 24 HORAS' apps/painel-ldr/src/components/library-sales-home-access-choice.tsx
