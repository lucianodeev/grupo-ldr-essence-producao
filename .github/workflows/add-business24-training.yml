name: Add Business 24h training
on:
  push:
    paths:
      - '.github/workflows/add-business24-training.yml'
permissions:
  contents: write
jobs:
  build-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate training
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('apps/painel-ldr/src')

          modules=[
          ('A IDEIA CERTA PARA COMEÇAR',[
          'O que realmente significa começar um negócio','Negócio x ideia','Problema x oportunidade','Como identificar necessidades reais','O que você já sabe fazer e pode vender','Produto, serviço ou conhecimento?','Como evitar começar grande demais','Validação rápida de uma ideia','Escolhendo uma ideia viável','Exercício: Definição do negócio']),
          ('CLIENTE E PROBLEMA',[
          'Quem é o seu cliente','Público-alvo sem complicação','Cliente ideal x cliente possível','Dor, necessidade e desejo','O que faz alguém comprar','Como conversar com possíveis clientes','Pesquisa rápida de mercado','Como analisar concorrentes','Como encontrar diferenciação','Exercício: Perfil do cliente']),
          ('CRIAÇÃO DA OFERTA',[
          'Produto não é oferta','Como transformar uma habilidade em oferta','Oferta simples','Oferta de entrada','Benefícios x características','Como tornar a proposta fácil de entender','Nomeando sua oferta','Criando urgência sem manipulação','Como apresentar valor','Exercício: Criar a primeira oferta']),
          ('PREÇO E LUCRATIVIDADE',[
          'O erro de cobrar apenas pelo custo','Como formar preço','Custos fixos','Custos variáveis','Margem','Ponto de equilíbrio','Quanto precisa vender','Preço de entrada','Desconto sem destruir a margem','Exercício: Definir preço e margem']),
          ('POSICIONAMENTO',[
          'Como o mercado percebe seu negócio','O que você quer que as pessoas entendam em 5 segundos','Nome e identidade','Bio comercial','Proposta de valor','Diferenciação','Autoridade sem inventar resultados','Como apresentar sua história','Comunicação simples','Exercício: Posicionamento final']),
          ('ESTRUTURA DE VENDA',[
          'Como alguém chega até você','Funil simples','Instagram','WhatsApp','Link da bio','Página simples de venda','Chamada para ação','Atendimento comercial','Como responder dúvidas','Exercício: Criar o fluxo de venda']),
          ('PRIMEIRA VENDA',[
          'A primeira oferta ao mercado','Como abordar sem parecer desesperado','Venda por relacionamento','Venda direta','Indicações','Grupos e comunidades','Redes sociais','Como apresentar o preço','Como lidar com “vou pensar”','Exercício: Fazer a primeira ação comercial']),
          ('AS PRIMEIRAS 24 HORAS',[
          'O plano das primeiras 2 horas','Hora 2 a 4','Hora 4 a 6','Hora 6 a 8','Organização da oferta','Publicação','Abordagem','Follow-up','Medição dos resultados','Plano completo de 24 horas']),
          ('DE PRIMEIRA VENDA A NEGÓCIO',[
          'O que fazer depois da primeira venda','O que medir','Receita','Lucro','Margem','Reinvestimento','Aquisição de clientes','Repetição da oferta','Plano de 30 dias','Preparação do projeto final'])]

          out=[]
          num=0
          for mi,(mt,titles) in enumerate(modules,1):
              lessons=[]
              for li,title in enumerate(titles,1):
                  num+=1
                  lessons.append({
                    'id':f'b24-{num:03d}','number':num,'title':title,
                    'objective':f'Compreender e aplicar “{title}” diretamente na construção do próprio negócio.',
                    'introduction':f'Nesta aula, você transforma o tema “{title}” em uma decisão prática. O objetivo é reduzir teoria excessiva e avançar com evidências reais do mercado.',
                    'development':f'Trabalhe o tema “{title}” a partir do problema que deseja resolver, do cliente que pretende atender e da oferta que está construindo. Registre hipóteses, teste o que puder com pessoas reais e compare intenção com comportamento. Uma decisão simples validada vale mais do que uma estrutura sofisticada sem cliente.',
                    'example':f'Exemplo prático: aplique “{title}” a um serviço ou produto que poderia ser apresentado hoje a um cliente real. Escreva a proposta em linguagem simples e observe se a pessoa entende rapidamente o valor.',
                    'exercise':f'Registre uma decisão concreta sobre “{title}”, a evidência que sustenta essa decisão e o próximo teste que fará.',
                    'action':f'Execute ainda hoje uma ação pequena ligada a “{title}” e anote o resultado.',
                    'summary':f'Você concluiu “{title}” quando consegue explicar sua decisão, mostrar a evidência utilizada e definir o próximo passo.'
                  })
              out.append({'number':mi,'title':mt,'lessons':lessons})
          curr='''export type Business24Lesson={id:string;number:number;title:string;objective:string;introduction:string;development:string;example:string;exercise:string;action:string;summary:string};\nexport type Business24Module={number:number;title:string;lessons:Business24Lesson[]};\nexport const BUSINESS24_MODULES:Business24Module[]='''+json.dumps(out,ensure_ascii=False,separators=(',',':'))+''' as Business24Module[];\nexport const BUSINESS24_TOTAL_LESSONS=90;\nexport const BUSINESS24_TOTAL_HOURS=360;\n'''
          (root/'content/business24-curriculum.ts').write_text(curr)

          server=r'''import { getRequest } from "@tanstack/react-start/server";
import { supabaseAdmin } from "@/integrations/supabase/client.server";
import { resolveClient } from "@/lib/client-portal.server";
import { hasOwnerDigitalAccess } from "@/lib/owner-digital-access.server";
const db=supabaseAdmin as any;
const PRODUCT_KEY="formacao_negocio_24_horas";
const SLUG="formacao-negocio-em-24-horas";
const TITLE="Formação Negócio em 24 Horas";
const PRICE_BRL=29999, PRICE_EUR=4990;
type Market="BR"|"INTL";
function fail(m:string):never{throw new Error(m)}
async function customerFor(userId:string,email:string|null){const x=await resolveClient(userId,email);if(x.status!=="ok")fail("Acesso do cliente não disponível.");return x.customer;}
function match(o:any){const m=o?.metadata??{};return o?.catalog_key===PRODUCT_KEY||m.product_key===PRODUCT_KEY||m.product_key===SLUG;}
async function paidOrder(customerId:string){const {data,error}=await db.from("orders").select("id,catalog_key,payment_status,metadata,created_at").eq("customer_id",customerId).eq("payment_status","pago").order("created_at",{ascending:false});if(error)return null;return (data??[]).find(match)??null;}
async function ensureProgram(){let {data}=await db.from("training_programs").select("id,slug,title,status").eq("slug",SLUG).maybeSingle();if(data?.id){if(data.status!=="published")await db.from("training_programs").update({status:"published"}).eq("id",data.id);return {...data,status:"published"};}const r=await db.from("training_programs").insert({slug:SLUG,title:TITLE,description:"Formação prática 100% online com 9 módulos, 90 aulas, 360 horas, sem encontros ao vivo e projeto final avaliado.",status:"published",minimum_days:0,live_sessions_included:0,projects_included:1,lifetime_access:true}).select("id,slug,title,status").single();if(r.error||!r.data)throw r.error??new Error("Falha ao preparar a formação.");return r.data;}
async function ensureEnrollment(customerId:string,trainingId:string,entitled:boolean){if(!entitled)return null;let {data}=await db.from("training_enrollments").select("id,enrolled_at,progress_percent,completed_at,certificate_available_at").eq("training_id",trainingId).eq("customer_id",customerId).eq("active",true).maybeSingle();if(data)return data;const r=await db.from("training_enrollments").insert({training_id:trainingId,customer_id:customerId,active:true,product_key:PRODUCT_KEY}).select("id,enrolled_at,progress_percent,completed_at,certificate_available_at").single();return r.data??null;}
function appOrigin(){const r=getRequest();return process.env.CLIENT_PANEL_URL?.replace(/\/$/,"")||(r?new URL(r.url).origin:"https://painel.ldrrhestrategia.com");}
export async function getBusiness24Offer(userId:string,email:string|null){const c=await customerFor(userId,email);const order=await paidOrder(c.id);const owner=hasOwnerDigitalAccess(email,userId);const entitled=Boolean(order)||owner;const training=await ensureProgram();await ensureEnrollment(c.id,training.id,entitled);return {productKey:PRODUCT_KEY,slug:SLUG,title:TITLE,priceBrlCents:PRICE_BRL,priceEurCents:PRICE_EUR,entitled,lifetimeAccess:true,totalModules:9,totalLessons:90,totalHours:360,liveSessionsIncluded:0,projectReviewIncluded:true};}
export async function createBusiness24Checkout(userId:string,email:string|null,market:Market){const c=await customerFor(userId,email);const offer=await getBusiness24Offer(userId,email);if(offer.entitled)fail("Esta formação já está disponível para sua conta.");const amount=market==="BR"?PRICE_BRL:PRICE_EUR,currency=market==="BR"?"BRL":"EUR";const meta={product_key:PRODUCT_KEY,training_slug:SLUG,market,auth_user_id:userId};const {data:o,error}=await db.from("orders").insert({order_number:"",customer_id:c.id,contact_email:c.email,contact_phone:c.phone,service_type:"produto_digital",title:TITLE,description:"Pagamento único · acesso vitalício · 90 aulas · projeto final avaliado",quantity:1,amount_cents:amount,currency,payment_status:"pendente",status:"novo",priority:"media",catalog_key:PRODUCT_KEY,metadata:meta}).select("id").single();if(error||!o)fail("Não foi possível iniciar o pedido.");const secret=process.env.STRIPE_SECRET_KEY;if(!secret){await db.from("orders").delete().eq("id",o.id);fail("Pagamento temporariamente indisponível.");}const p=new URLSearchParams();p.set("mode","payment");p.set("line_items[0][price_data][currency]",currency.toLowerCase());p.set("line_items[0][price_data][unit_amount]",String(amount));p.set("line_items[0][price_data][product_data][name]",TITLE);p.set("line_items[0][quantity]","1");p.set("success_url",`${appOrigin()}/cliente/biblioteca?payment=success&product=business24&session_id={CHECKOUT_SESSION_ID}`);p.set("cancel_url",`${appOrigin()}/cliente/biblioteca?payment=cancel&product=business24`);p.set("client_reference_id",userId);p.set("metadata[order_id]",o.id);p.set("metadata[product_key]",PRODUCT_KEY);p.set("metadata[training_slug]",SLUG);p.set("metadata[user_id]",userId);p.set("payment_intent_data[metadata][order_id]",o.id);p.set("payment_intent_data[metadata][product_key]",PRODUCT_KEY);if(c.email)p.set("customer_email",c.email);let response:Response;try{response=await fetch("https://api.stripe.com/v1/checkout/sessions",{method:"POST",headers:{Authorization:`Bearer ${secret}`,"Content-Type":"application/x-www-form-urlencoded"},body:p});}catch{await db.from("orders").delete().eq("id",o.id);fail("Não foi possível abrir o checkout.");}const session=await response.json() as any;if(!response.ok||!session.id||!session.url){await db.from("orders").delete().eq("id",o.id);fail("Não foi possível abrir o checkout.");}await db.from("orders").update({stripe_checkout_session_id:session.id}).eq("id",o.id);return {url:session.url};}
export async function getBusiness24Experience(userId:string,email:string|null){const c=await customerFor(userId,email);const offer=await getBusiness24Offer(userId,email);if(!offer.entitled)fail("Compre a formação ou ative a assinatura da Biblioteca para acessar.");const training=await ensureProgram();const enr=await ensureEnrollment(c.id,training.id,true);const [{data:cloud},{data:subs},{data:credits}]=await Promise.all([db.from("training_state").select("state,progress_percent").eq("training_id",training.id).eq("customer_id",c.id).maybeSingle(),db.from("training_project_submissions").select("id,submission_number,title,project_url,status,submitted_at,reviewed_at,feedback").eq("training_id",training.id).eq("customer_id",c.id).order("submission_number",{ascending:true}),db.from("training_project_review_credits").select("id,status,source").eq("training_id",training.id).eq("customer_id",c.id).eq("source","included")]);if(!(credits??[]).length&&enr?.id)await db.from("training_project_review_credits").insert({training_id:training.id,enrollment_id:enr.id,customer_id:c.id,source:"included",status:"available"});const state=(cloud?.state&&typeof cloud.state==="object"?cloud.state:{}) as Record<string,unknown>;const completed=Array.isArray((state as any).completedLessons)?(state as any).completedLessons:[];return {...offer,trainingId:training.id,enrollmentId:enr?.id??null,state,completedLessons:completed,progressPercent:Math.round(Math.min(100,completed.length/90*100)),projectEligible:completed.length>=90,projectSubmissions:subs??[],studentName:c.fullName??c.full_name??c.email??"Aluno"};}
export async function saveBusiness24State(userId:string,email:string|null,state:Record<string,unknown>){const c=await customerFor(userId,email);const offer=await getBusiness24Offer(userId,email);if(!offer.entitled)fail("Acesso não disponível.");const training=await ensureProgram();const completed=Array.isArray((state as any).completedLessons)?(state as any).completedLessons:[];const progress=Math.round(Math.min(100,completed.length/90*100));const patch={training_id:training.id,customer_id:c.id,state,progress_percent:progress,updated_at:new Date().toISOString()};const {error}=await db.from("training_state").upsert(patch,{onConflict:"training_id,customer_id"});if(error)fail("Não foi possível salvar o progresso.");await db.from("training_enrollments").update({progress_percent:progress,...(progress>=100?{completed_at:new Date().toISOString()}:{} )}).eq("training_id",training.id).eq("customer_id",c.id);return {ok:true as const,progressPercent:progress};}
export async function submitBusiness24Project(userId:string,email:string|null,input:{title:string;projectUrl?:string|null;projectText?:string|null}){const c=await customerFor(userId,email);const exp=await getBusiness24Experience(userId,email);if(!exp.projectEligible)fail("Conclua as 90 aulas antes de enviar o projeto final.");const title=input.title.trim(),projectUrl=input.projectUrl?.trim()||null,projectText=input.projectText?.trim()||null;if(!title)fail("Informe o nome do projeto.");if(!projectUrl&&!projectText)fail("Descreva o projeto ou informe um link.");const list=exp.projectSubmissions??[],last=list.length?list[list.length-1]:null;if(last&&(last.status==="submitted"||last.status==="in_review"))fail("Seu projeto já está em avaliação.");if(last?.status==="changes_requested"){const r=await db.from("training_project_submissions").update({title,project_url:projectUrl,project_text:projectText,status:"submitted",submitted_at:new Date().toISOString(),reviewed_at:null}).eq("id",last.id).select("id,submission_number,status,submitted_at").single();if(r.error||!r.data)fail("Não foi possível reenviar o projeto.");return {ok:true as const,submission:r.data};}const {data:credit}=await db.from("training_project_review_credits").select("id").eq("training_id",exp.trainingId).eq("customer_id",c.id).eq("source","included").eq("status","available").limit(1).maybeSingle();if(!credit?.id)fail("A avaliação incluída já foi utilizada.");const r=await db.from("training_project_submissions").insert({training_id:exp.trainingId,enrollment_id:exp.enrollmentId,customer_id:c.id,review_credit_id:credit.id,submission_number:1,title,project_url:projectUrl,project_text:projectText,status:"submitted"}).select("id,submission_number,status,submitted_at").single();if(r.error||!r.data)fail("Não foi possível enviar o projeto.");await db.from("training_project_review_credits").update({status:"used",used_at:new Date().toISOString()}).eq("id",credit.id);return {ok:true as const,submission:r.data};}
'''
          (root/'lib/business24-commerce.server.ts').write_text(server)

          functions=r'''import { createServerFn } from "@tanstack/react-start";
import { requireSupabaseAuth } from "@/integrations/supabase/auth-middleware";
function emailOf(c:Record<string,unknown>){const v=c["email"];return typeof v==="string"?v:null;}
export const clientBusiness24Offer=createServerFn({method:"GET"}).middleware([requireSupabaseAuth]).handler(async({context})=>{const m=await import("@/lib/business24-commerce.server");return m.getBusiness24Offer(context.userId,emailOf(context.claims));});
export const clientCreateBusiness24Checkout=createServerFn({method:"POST"}).middleware([requireSupabaseAuth]).inputValidator((data:{market:"BR"|"INTL"})=>data).handler(async({context,data})=>{const m=await import("@/lib/business24-commerce.server");return m.createBusiness24Checkout(context.userId,emailOf(context.claims),data.market);});
export const clientBusiness24Experience=createServerFn({method:"GET"}).middleware([requireSupabaseAuth]).handler(async({context})=>{const m=await import("@/lib/business24-commerce.server");return m.getBusiness24Experience(context.userId,emailOf(context.claims));});
export const clientSaveBusiness24State=createServerFn({method:"POST"}).middleware([requireSupabaseAuth]).inputValidator((data:{state:Record<string,unknown>})=>data).handler(async({context,data})=>{const m=await import("@/lib/business24-commerce.server");return m.saveBusiness24State(context.userId,emailOf(context.claims),data.state);});
export const clientSubmitBusiness24Project=createServerFn({method:"POST"}).middleware([requireSupabaseAuth]).inputValidator((data:{title:string;projectUrl?:string|null;projectText?:string|null})=>data).handler(async({context,data})=>{const m=await import("@/lib/business24-commerce.server");return m.submitBusiness24Project(context.userId,emailOf(context.claims),data);});
'''
          (root/'lib/business24-commerce.functions.ts').write_text(functions)

          public=r'''import { Link } from "@tanstack/react-router";
import { BUSINESS24_MODULES } from "@/content/business24-curriculum";
export function Business24PublicPage(){return <main className="min-h-screen bg-[#fff7e7] text-[#071426]"><section className="bg-gradient-to-br from-[#071426] via-[#14334d] to-[#c85a24] text-white"><div className="mx-auto max-w-6xl px-5 py-16 sm:py-24"><span className="rounded-full border border-[#d6ad63]/60 bg-black/10 px-4 py-2 text-xs font-black tracking-[.16em] text-[#ffe0a3]">FORMAÇÃO PRÁTICA · 100% ONLINE</span><h1 className="mt-6 max-w-4xl font-serif text-4xl leading-tight sm:text-6xl">Negócio em 24 Horas</h1><p className="mt-4 max-w-3xl text-xl text-white/85">Da ideia à primeira oferta pronta para vender.</p><div className="mt-7 flex flex-wrap gap-2 text-sm font-bold"><span className="rounded-full bg-white/10 px-4 py-2">9 módulos</span><span className="rounded-full bg-white/10 px-4 py-2">90 aulas</span><span className="rounded-full bg-white/10 px-4 py-2">360 horas</span><span className="rounded-full bg-white/10 px-4 py-2">Sem encontros ao vivo</span><span className="rounded-full bg-white/10 px-4 py-2">Projeto final avaliado</span></div><div className="mt-8 flex flex-col gap-3 sm:flex-row"><Link to="/cliente/biblioteca" className="rounded-xl bg-[#d6ad63] px-6 py-4 text-center font-black text-[#281605]">COMEÇAR AGORA</Link><a href="#programa" className="rounded-xl border border-white/30 px-6 py-4 text-center font-black">VER PROGRAMA</a></div></div></section><section className="mx-auto max-w-6xl px-5 py-12"><div className="grid gap-5 sm:grid-cols-3"><div className="rounded-2xl border bg-white p-5"><b>APRENDA</b><p className="mt-2 text-sm text-slate-600">Conteúdo direto para decisões de negócio.</p></div><div className="rounded-2xl border bg-white p-5"><b>EXECUTE E VALIDE</b><p className="mt-2 text-sm text-slate-600">Teste oferta, preço, posicionamento e canais.</p></div><div className="rounded-2xl border bg-white p-5"><b>PROJETO AVALIADO</b><p className="mt-2 text-sm text-slate-600">Finalize seu projeto e envie para avaliação humana.</p></div></div></section><section id="programa" className="bg-white"><div className="mx-auto max-w-6xl px-5 py-14"><p className="text-xs font-black uppercase tracking-[.2em] text-[#c85a24]">PROGRAMA</p><h2 className="mt-2 font-serif text-4xl">9 módulos · 90 aulas</h2><div className="mt-8 grid gap-4 md:grid-cols-2">{BUSINESS24_MODULES.map(m=><article key={m.number} className="rounded-2xl border border-[#c85a24]/20 bg-[#fffaf5] p-5"><span className="text-xs font-black text-[#c85a24]">MÓDULO {m.number}</span><h3 className="mt-2 font-serif text-xl">{m.title}</h3><p className="mt-2 text-sm text-slate-600">10 aulas práticas</p></article>)}</div></div></section><section className="mx-auto max-w-6xl px-5 py-14"><div className="rounded-[30px] bg-[#071426] p-7 text-white sm:p-10"><p className="text-xs font-black tracking-[.18em] text-[#d6ad63]">PAGAMENTO ÚNICO · ACESSO VITALÍCIO</p><h2 className="mt-3 font-serif text-3xl">Formação Negócio em 24 Horas</h2><p className="mt-4 text-2xl font-black text-[#ffe0a3]">🇧🇷 R$ 299,99 · 🇪🇺 € 49,90</p><p className="mt-3 text-sm text-white/70">Também incluída na assinatura da Biblioteca LDR enquanto a assinatura estiver ativa.</p><p className="mt-4 text-xs text-white/55">A formação ensina estruturação, validação e execução. Não há garantia de lucro ou resultado financeiro em 24 horas.</p><Link to="/cliente/biblioteca" className="mt-6 inline-flex rounded-xl bg-[#d6ad63] px-6 py-4 font-black text-[#281605]">ACESSAR PELA BIBLIOTECA</Link></div></section></main>}
'''
          (root/'components/business24-public-page.tsx').write_text(public)
          (root/'routes/formacao-negocio-em-24-horas.tsx').write_text('''import { createFileRoute } from "@tanstack/react-router";\nimport { Business24PublicPage } from "@/components/business24-public-page";\nexport const Route=createFileRoute("/formacao-negocio-em-24-horas")({head:()=>({meta:[{title:"Negócio em 24 Horas | Biblioteca LDR"},{name:"description",content:"Formação prática 100% online: 9 módulos, 90 aulas, 360 horas e projeto final avaliado."}]}),component:Business24PublicPage});\n''')

          client=r'''import { createFileRoute, Link } from "@tanstack/react-router";
import { useMutation,useQuery,useQueryClient } from "@tanstack/react-query";
import { useServerFn } from "@tanstack/react-start";
import { useMemo,useState } from "react";
import { BUSINESS24_MODULES } from "@/content/business24-curriculum";
import { clientBusiness24Experience,clientSaveBusiness24State,clientSubmitBusiness24Project } from "@/lib/business24-commerce.functions";
export const Route=createFileRoute("/_clientarea/cliente/treinamentos/negocio-24-horas")({component:Business24Training});
function Business24Training(){const expFn=useServerFn(clientBusiness24Experience),saveFn=useServerFn(clientSaveBusiness24State),submitFn=useServerFn(clientSubmitBusiness24Project);const qc=useQueryClient();const {data,isLoading,error}=useQuery({queryKey:["business24-experience"],queryFn:()=>expFn({})});const all=useMemo(()=>BUSINESS24_MODULES.flatMap(m=>m.lessons.map(l=>({...l,module:m}))),[]);const [lessonId,setLessonId]=useState(all[0]?.id??"");const [tab,setTab]=useState<"curso"|"projeto">("curso");const [title,setTitle]=useState(""),[text,setText]=useState(""),[url,setUrl]=useState("");const completed:string[]=data?.completedLessons??[];const current=all.find(x=>x.id===lessonId)??all[0];const save=useMutation({mutationFn:(ids:string[])=>saveFn({data:{state:{...(data?.state??{}),completedLessons:ids,currentLessonId:lessonId}}}),onSuccess:()=>qc.invalidateQueries({queryKey:["business24-experience"]})});const submit=useMutation({mutationFn:()=>submitFn({data:{title,projectText:text,projectUrl:url||null}}),onSuccess:()=>{setTitle("");setText("");setUrl("");qc.invalidateQueries({queryKey:["business24-experience"]})}});if(isLoading)return <p>Carregando formação…</p>;if(error||!data)return <div className="rounded-2xl border p-6"><p>Não foi possível abrir esta formação.</p><Link to="/cliente/biblioteca" className="mt-4 inline-block underline">Voltar à Biblioteca</Link></div>;const pct=Math.round(completed.length/90*100);const mark=()=>{if(completed.includes(current.id))return;save.mutate([...completed,current.id])};return <div className="min-h-screen bg-[#fff8ef] text-[#071426]"><header className="border-b bg-[#071426] text-white"><div className="mx-auto max-w-7xl px-4 py-5"><Link to="/cliente/biblioteca" className="text-xs font-bold text-[#d6ad63]">← Biblioteca</Link><h1 className="mt-2 font-serif text-3xl">Negócio em 24 Horas</h1><p className="mt-1 text-sm text-white/65">9 módulos · 90 aulas · 360h · 100% online · sem encontros ao vivo</p><div className="mt-4 h-2 overflow-hidden rounded-full bg-white/10"><div className="h-full bg-[#d6ad63]" style={{width:`${pct}%`}}/></div><p className="mt-1 text-xs">{completed.length}/90 aulas · {pct}%</p></div></header><div className="mx-auto max-w-7xl px-4 py-6"><div className="mb-5 flex gap-2"><button onClick={()=>setTab("curso")} className={`rounded-xl px-4 py-2 text-sm font-black ${tab==="curso"?"bg-[#c85a24] text-white":"border bg-white"}`}>CURSO</button><button onClick={()=>setTab("projeto")} className={`rounded-xl px-4 py-2 text-sm font-black ${tab==="projeto"?"bg-[#c85a24] text-white":"border bg-white"}`}>PROJETO FINAL</button></div>{tab==="curso"?<div className="grid gap-5 lg:grid-cols-[300px_1fr]"><aside className="max-h-[70vh] overflow-auto rounded-2xl border bg-white p-3">{BUSINESS24_MODULES.map(m=><div key={m.number} className="mb-4"><p className="px-2 text-[10px] font-black uppercase tracking-[.12em] text-[#c85a24]">Módulo {m.number} · {m.title}</p>{m.lessons.map(l=><button key={l.id} onClick={()=>setLessonId(l.id)} className={`mt-1 w-full rounded-lg px-2 py-2 text-left text-xs ${lessonId===l.id?"bg-[#fff0e5] font-bold":"hover:bg-slate-50"}`}>{completed.includes(l.id)?"✓ ":""}{l.number}. {l.title}</button>)}</div>)}</aside><article className="rounded-2xl border bg-white p-5 sm:p-8"><p className="text-xs font-black uppercase tracking-[.15em] text-[#c85a24]">MÓDULO {current.module.number} · AULA {current.number}</p><h2 className="mt-2 font-serif text-3xl">{current.title}</h2><section className="mt-6 space-y-6 text-[15px] leading-7 text-slate-700"><div><h3 className="font-black text-[#071426]">Objetivo</h3><p>{current.objective}</p></div><div><h3 className="font-black text-[#071426]">Introdução</h3><p>{current.introduction}</p></div><div><h3 className="font-black text-[#071426]">Desenvolvimento</h3><p>{current.development}</p></div><div className="rounded-xl bg-[#fff7e7] p-4"><h3 className="font-black">Exemplo</h3><p>{current.example}</p></div><div><h3 className="font-black text-[#071426]">Exercício prático</h3><p>{current.exercise}</p></div><div><h3 className="font-black text-[#071426]">Ação</h3><p>{current.action}</p></div><div><h3 className="font-black text-[#071426]">Resumo</h3><p>{current.summary}</p></div></section><button disabled={completed.includes(current.id)||save.isPending} onClick={mark} className="mt-8 w-full rounded-xl bg-[#c85a24] px-5 py-3 font-black text-white">{completed.includes(current.id)?"✓ AULA CONCLUÍDA":"MARCAR COMO CONCLUÍDA"}</button></article></div>:<div className="grid gap-5 lg:grid-cols-2"><section className="rounded-2xl border bg-white p-6"><p className="text-xs font-black uppercase tracking-[.15em] text-[#c85a24]">PROJETO FINAL AVALIADO</p><h2 className="mt-2 font-serif text-3xl">Seu Negócio em 24 Horas</h2><p className="mt-3 text-sm leading-6 text-slate-600">A entrega abre após concluir as 90 aulas. Inclua: nome do negócio, problema, público, oferta, proposta de valor, preço, custos, margem estimada, canal de venda, aquisição de clientes, texto de venda, atendimento, divulgação, meta de primeira venda e planos de 24h, 7 dias e 30 dias.</p>{data.projectEligible?<div className="mt-5 space-y-3"><input value={title} onChange={e=>setTitle(e.target.value)} className="w-full rounded-xl border p-3" placeholder="Nome do projeto"/><input value={url} onChange={e=>setUrl(e.target.value)} className="w-full rounded-xl border p-3" placeholder="Link do projeto (opcional)"/><textarea value={text} onChange={e=>setText(e.target.value)} rows={12} className="w-full rounded-xl border p-3" placeholder="Descreva seu projeto completo…"/><button disabled={!title.trim()||!text.trim()||submit.isPending} onClick={()=>submit.mutate()} className="w-full rounded-xl bg-[#c85a24] px-5 py-3 font-black text-white">ENVIAR PARA AVALIAÇÃO</button>{submit.error?<p className="text-sm text-red-600">{String((submit.error as Error).message)}</p>:null}</div>:<div className="mt-5 rounded-xl bg-amber-50 p-4 text-sm font-bold text-amber-800">Conclua as 90 aulas para liberar o envio. Progresso atual: {completed.length}/90.</div>}</section><section className="rounded-2xl border bg-white p-6"><h3 className="font-serif text-2xl">Avaliações</h3><div className="mt-4 space-y-3">{(data.projectSubmissions??[]).length?(data.projectSubmissions??[]).map((s:any)=><div key={s.id} className="rounded-xl border p-4"><p className="font-black">{s.title}</p><p className="mt-1 text-xs uppercase text-slate-500">Status: {s.status}</p>{s.feedback?<div className="mt-3 rounded-lg bg-[#fff7e7] p-3 text-sm"><b>Feedback:</b> {s.feedback}</div>:null}</div>):<p className="text-sm text-slate-500">Nenhum projeto enviado ainda.</p>}</div><div className="mt-6 rounded-xl bg-[#071426] p-4 text-sm text-white"><b>Certificação</b><p className="mt-1 text-white/70">A conclusão acadêmica exige 100% das aulas e aprovação do projeto final.</p></div></section></div>}</div></div>}
'''
          (root/'routes/_clientarea.cliente.treinamentos.negocio-24-horas.tsx').write_text(client)

          # subscription inclusion
          p=root/'lib/library-subscription.server.ts';s=p.read_text()
          anchor='  ["formacao_terapia_breve_psicanalitica", "Formação em Terapia Breve Psicanalítica"],'
          if 'formacao_negocio_24_horas' not in s:
              s=s.replace(anchor,anchor+'\n  ["formacao_negocio_24_horas", "Formação Negócio em 24 Horas"],')
              p.write_text(s)

          # secondary sales catalog
          p=root/'components/library-sales-home.tsx';s=p.read_text()
          anchor='{tag:"TERAPIA BREVE · 1.200H",title:"Formação em Terapia Breve Psicanalítica",desc:"15 módulos · 300 aulas · 1.200 horas · 6 encontros ao vivo",price:"R$ 299,99 · € 49,90",href:"/formacao-terapia-breve-psicanalitica",tone:"petrol"},'
          if 'NEGÓCIO EM 24H' not in s and anchor in s:
              s=s.replace(anchor,anchor+'\n  {tag:"NEGÓCIO EM 24H",title:"Formação Negócio em 24 Horas",desc:"9 módulos · 90 aulas · 360 horas · 100% online · projeto final avaliado",price:"R$ 299,99 · € 49,90",href:"/formacao-negocio-em-24-horas",tone:"gold"},')
              p.write_text(s)

          # public home actual component: card before formacoes
          p=root/'components/library-sales-home-access-choice.tsx';s=p.read_text()
          marker='    <section id="formacoes"'
          if 'NEGÓCIO EM 24 HORAS</p>' not in s and marker in s:
              card='''    <section className="mx-auto max-w-7xl px-4 pt-10 sm:px-6"><article className="overflow-hidden rounded-[30px] border-2 border-[#c85a24]/35 bg-gradient-to-br from-[#fff3e8] to-white p-7 shadow-sm"><div className="grid gap-6 lg:grid-cols-[1fr_auto] lg:items-center"><div><span className="inline-flex rounded-full bg-[#c85a24] px-3 py-1 text-[10px] font-black uppercase tracking-[.14em] text-white">NOVA FORMAÇÃO · 100% ONLINE</span><p className="mt-4 text-xs font-black uppercase tracking-[.18em] text-[#c85a24]">NEGÓCIO EM 24 HORAS</p><h2 className="mt-2 font-serif text-3xl sm:text-4xl">Formação Negócio em 24 Horas</h2><p className="mt-3 max-w-3xl text-sm leading-7 text-slate-600">9 módulos · 90 aulas · 360 horas · sem encontros ao vivo · projeto final avaliado. Da ideia à primeira oferta pronta para vender.</p><p className="mt-4 font-black text-[#8a3b17]">R$ 299,99 · € 49,90 · pagamento único · acesso vitalício</p></div><Link to="/formacao-negocio-em-24-horas" className="rounded-xl bg-[#c85a24] px-6 py-4 text-center text-sm font-black text-white shadow-sm">CONHECER A FORMAÇÃO</Link></div></article></section>\n\n'''
              s=s.replace(marker,card+marker,1);p.write_text(s)

          # client library integration
          p=root/'routes/_clientarea.cliente.biblioteca.tsx';s=p.read_text()
          if 'business24-commerce.functions' not in s:
              s=s.replace('import { clientCreateBriefTherapyCheckout, clientBriefTherapyOffer } from "@/lib/brief-therapy-commerce.functions";','import { clientCreateBriefTherapyCheckout, clientBriefTherapyOffer } from "@/lib/brief-therapy-commerce.functions";\nimport { clientBusiness24Offer, clientCreateBusiness24Checkout } from "@/lib/business24-commerce.functions";')
              s=s.replace('    briefFn=useServerFn(clientBriefTherapyOffer),','    briefFn=useServerFn(clientBriefTherapyOffer),\n    business24Fn=useServerFn(clientBusiness24Offer),')
              s=s.replace('    briefCheckoutFn=useServerFn(clientCreateBriefTherapyCheckout),','    briefCheckoutFn=useServerFn(clientCreateBriefTherapyCheckout),\n    business24CheckoutFn=useServerFn(clientCreateBusiness24Checkout),')
              s=s.replace('  const {data:brief}=useQuery({queryKey:["brief-therapy-offer"],queryFn:()=>briefFn({})});','  const {data:brief}=useQuery({queryKey:["brief-therapy-offer"],queryFn:()=>briefFn({})});\n  const {data:business24}=useQuery({queryKey:["business24-offer"],queryFn:()=>business24Fn({})});')
              s=s.replace('  const briefCheckout=useMutation({mutationFn:(m:"BR"|"INTL")=>briefCheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});','  const briefCheckout=useMutation({mutationFn:(m:"BR"|"INTL")=>briefCheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});\n  const business24Checkout=useMutation({mutationFn:(m:"BR"|"INTL")=>business24CheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});')
              s=s.replace('brief:owner||!!brief?.entitled,mentor:', 'brief:owner||!!brief?.entitled,business24:owner||!!business24?.entitled,mentor:')
              s=s.replace('{card("brief","Terapia Breve","bg-[#17645e]")}', '{card("brief","Terapia Breve","bg-[#17645e]")}\n        {card("business24","Negócio 24h","bg-[#c85a24]")}')
              old='active==="brief"?<div><h3 className="font-serif text-xl text-[#103d3a]">Formação em Terapia Breve Psicanalítica</h3>'
              new='active==="business24"?<div><h3 className="font-serif text-xl text-[#8a3b17]">Formação Negócio em 24 Horas</h3><p className="mt-2 text-sm text-muted-foreground">9 módulos · 90 aulas · 360 horas · 100% online · sem encontros ao vivo · projeto final avaliado.</p>{ent.business24?<a href="/cliente/treinamentos/negocio-24-horas" className="mt-4 inline-flex w-full justify-center rounded-xl bg-[#c85a24] px-4 py-3 font-black text-white">Acessar formação</a>:<button onClick={()=>business24Checkout.mutate(market)} className="mt-4 w-full rounded-xl bg-[#c85a24] px-4 py-3 font-black text-white">Quero começar · {market==="BR"?money(business24?.priceBrlCents??29999,"BRL",locale):money(business24?.priceEurCents??4990,"EUR",locale)}</button>}</div>:'+old
              s=s.replace(old,new,1)
