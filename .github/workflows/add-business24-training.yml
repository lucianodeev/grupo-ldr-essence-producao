name: Add Business 24h training
on:
  push:
    paths:
      - '.github/workflows/add-business24-training.yml'
permissions:
  contents: write
jobs:
  build-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recover and run generator
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','show','2a3e8995bee67cf81643e0c9b3b566c648163baa:.github/workflows/add-business24-training.yml'],text=True)
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/add_business24.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python /tmp/add_business24.py
      - name: Validate generated course files
        run: |
          grep -q 'formacao_negocio_24_horas' apps/painel-ldr/src/lib/library-subscription.server.ts
          grep -q 'NEGÓCIO EM 24 HORAS' apps/painel-ldr/src/components/library-sales-home-access-choice.tsx
          grep -q 'business24' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          grep -q 'BUSINESS24_TOTAL_LESSONS=90' apps/painel-ldr/src/content/business24-curriculum.ts
          grep -q 'BUSINESS24_TOTAL_HOURS=360' apps/painel-ldr/src/content/business24-curriculum.ts
          grep -q 'liveSessionsIncluded:0' apps/painel-ldr/src/lib/business24-commerce.server.ts
          grep -q 'projectReviewIncluded:true' apps/painel-ldr/src/lib/business24-commerce.server.ts
          test -f apps/painel-ldr/src/routes/formacao-negocio-em-24-horas.tsx
          test -f apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.negocio-24-horas.tsx
          git diff --check
      - name: Commit and publish course safely
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add Negocio em 24 Horas training"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
