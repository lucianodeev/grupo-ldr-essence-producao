name: Inject Pages accessibility once

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/inject-pages-accessibility-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Inject script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./accessibility-v1.js?v=20260903"></script>'
          if tag not in s:
              if '</body>' in s: s=s.replace('</body>',tag+'\n</body>',1)
              else: s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat pages: ativar controles de acessibilidade'
          git push origin gh-pages
