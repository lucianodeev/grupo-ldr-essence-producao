name: Implement Social Clinic

on:
  push:
    branches:
      - feat/clinica-social-ldr
    paths:
      - tools/implement_social_clinic.py
      - .github/workflows/implement-social-clinic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinica-social-ldr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Social Clinic patch
        run: python tools/implement_social_clinic.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build painel LDR
        run: npm run build --workspace apps/painel-ldr
      - name: Commit validated implementation
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/painel-ldr
            git commit -m "feat: add LDR Social Clinic"
            git push origin HEAD:feat/clinica-social-ldr
          fi
