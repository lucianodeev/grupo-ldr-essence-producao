name: Add written professional orientation once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-service:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create service from validated written chat
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('apps/painel-ldr/src')

          # 1) Server: reuse validated paid-chat architecture, isolate product/tables/prices/routes.
          src=(root/'lib/written-orientation.server.ts').read_text(encoding='utf-8')
          s=src
          repl={
            'orientacao_psicanalitica_escrita':'orientacao_profissional_escrita',
            'Orientação Psicanalítica Escrita':'Orientação Profissional Escrita',
            'psychoanalytic_written_promos':'professional_written_promos',
            'psychoanalytic_written_sessions':'professional_written_sessions',
            'psychoanalytic_written_messages':'professional_written_messages',
            '/cliente/orientacao-psicanalitica':'/cliente/orientacao-profissional',
            'Nova Orientação Psicanalítica Escrita':'Nova Orientação Profissional Escrita',
            'getWrittenOrientationOffer':'getProfessionalOrientationOffer',
            'createWrittenOrientationCheckout':'createProfessionalOrientationCheckout',
            'activateWrittenOrientationCheckout':'activateProfessionalOrientationCheckout',
            'getWrittenOrientationSession':'getProfessionalOrientationSession',
            'sendWrittenOrientationClientMessage':'sendProfessionalOrientationClientMessage',
            'getWrittenOrientationAdminSession':'getProfessionalOrientationAdminSession',
            'getWrittenOrientationAdmin':'getProfessionalOrientationAdmin',
            'sendWrittenOrientationProfessionalMessage':'sendProfessionalOrientationProfessionalMessage',
            'written orientation notification skipped':'professional orientation notification skipped',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          s=s.replace('INTL:{10:90,30:100,60:190}', 'INTL:{10:90,30:190,60:390}')
          s=s.replace('BR:{10:535,30:595,60:1130}', 'BR:{10:535,30:1130,60:2320}')
          s=s.replace('description:`Orientação breve por texto · ${packageMinutes} minutos`','description:`Orientação profissional por texto · ${packageMinutes} minutos`')
          (root/'lib/professional-orientation.server.ts').write_text(s,encoding='utf-8')

          # 2) Server functions.
          f=(root/'lib/written-orientation.functions.ts').read_text(encoding='utf-8')
          pairs={
            '@/lib/written-orientation.server':'@/lib/professional-orientation.server',
            'clientWrittenOrientationOffer':'clientProfessionalOrientationOffer',
            'clientCreateWrittenOrientationCheckout':'clientCreateProfessionalOrientationCheckout',
            'clientActivateWrittenOrientationCheckout':'clientActivateProfessionalOrientationCheckout',
            'clientWrittenOrientationSession':'clientProfessionalOrientationSession',
            'clientSendWrittenOrientationMessage':'clientSendProfessionalOrientationMessage',
            'adminWrittenOrientationList':'adminProfessionalOrientationList',
            'adminWrittenOrientationSession':'adminProfessionalOrientationSession',
            'adminSendWrittenOrientationMessage':'adminSendProfessionalOrientationMessage',
            'getWrittenOrientationOffer':'getProfessionalOrientationOffer',
            'createWrittenOrientationCheckout':'createProfessionalOrientationCheckout',
            'activateWrittenOrientationCheckout':'activateProfessionalOrientationCheckout',
            'getWrittenOrientationSession':'getProfessionalOrientationSession',
            'sendWrittenOrientationClientMessage':'sendProfessionalOrientationClientMessage',
            'getWrittenOrientationAdminSession':'getProfessionalOrientationAdminSession',
            'getWrittenOrientationAdmin':'getProfessionalOrientationAdmin',
            'sendWrittenOrientationProfessionalMessage':'sendProfessionalOrientationProfessionalMessage',
          }
          for a,b in pairs.items(): f=f.replace(a,b)
          (root/'lib/professional-orientation.functions.ts').write_text(f,encoding='utf-8')

          # 3) Client route.
          c=(root/'routes/_clientarea.cliente.orientacao-psicanalitica.tsx').read_text(encoding='utf-8')
          pairs={
            '@/lib/written-orientation.functions':'@/lib/professional-orientation.functions',
            'clientActivateWrittenOrientationCheckout':'clientActivateProfessionalOrientationCheckout',
            'clientCreateWrittenOrientationCheckout':'clientCreateProfessionalOrientationCheckout',
            'clientSendWrittenOrientationMessage':'clientSendProfessionalOrientationMessage',
            'clientWrittenOrientationOffer':'clientProfessionalOrientationOffer',
            'clientWrittenOrientationSession':'clientProfessionalOrientationSession',
            '/_clientarea/cliente/orientacao-psicanalitica':'/_clientarea/cliente/orientacao-profissional',
            'written-orientation-offer':'professional-orientation-offer',
            'written-orientation-session':'professional-orientation-session',
            'Orientação Psicanalítica Escrita':'Orientação Profissional Escrita',
            'Um espaço breve de escuta e orientação por texto, com fundamentação psicanalítica e, quando pertinente, referências científicas verificáveis.':'Orientação prática por texto para carreira, currículo, entrevistas, transição profissional, posicionamento e próximos passos.',
            'Não substitui atendimento médico, psiquiátrico, psicológico emergencial ou serviços de urgência. Em situação de risco imediato ou emergência, procure o serviço de emergência da sua região.':'Não garante contratação, promoção, visto, reconhecimento de diploma ou resultado profissional. Decisões finais são do cliente e podem exigir profissionais ou órgãos especializados.',
            'Entendo que este é um serviço breve de orientação por texto e não substitui atendimento médico, psiquiátrico, psicológico emergencial ou serviços de urgência.':'Entendo que este é um serviço breve de orientação profissional por texto, não garante emprego ou resultado específico e não substitui assessoria jurídica, migratória ou acadêmica especializada.',
            'bg-gradient-to-br from-[#111827] via-[#263b63] to-[#445c8a]':'bg-gradient-to-br from-[#071426] via-[#0b5cab] to-[#2d7bc2]',
            '#445c8a':'#0b5cab',
            '#263b63':'#0b5cab',
          }
          for a,b in pairs.items(): c=c.replace(a,b)
          (root/'routes/_clientarea.cliente.orientacao-profissional.tsx').write_text(c,encoding='utf-8')

          # 4) Master route.
          a=(root/'routes/_authenticated/admin.orientacoes-psicanaliticas.tsx').read_text(encoding='utf-8')
          pairs={
            '@/lib/written-orientation.functions':'@/lib/professional-orientation.functions',
            'adminSendWrittenOrientationMessage':'adminSendProfessionalOrientationMessage',
            'adminWrittenOrientationList':'adminProfessionalOrientationList',
            'adminWrittenOrientationSession':'adminProfessionalOrientationSession',
            '/_authenticated/admin/orientacoes-psicanaliticas':'/_authenticated/admin/orientacoes-profissionais',
            'written-orientation-admin-session':'professional-orientation-admin-session',
            'written-orientation-admin':'professional-orientation-admin',
            'Orientações Psicanalíticas Escritas':'Orientações Profissionais Escritas',
            '#445c8a':'#0b5cab',
            '#263b63':'#0b5cab',
          }
          for x,y in pairs.items(): a=a.replace(x,y)
          (root/'routes/_authenticated/admin.orientacoes-profissionais.tsx').write_text(a,encoding='utf-8')

          # 5) Library card next to written psychoanalytic orientation.
          p=root/'routes/_clientarea.cliente.biblioteca.tsx'
          b=p.read_text(encoding='utf-8')
          if '/cliente/orientacao-profissional' not in b:
            anchor='<a href="/cliente/orientacao-psicanalitica" className="min-w-0 rounded-2xl bg-[#263b63] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">✍️</span><p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">Orientação Escrita</p></a>'
            add=anchor+'\n        <a href="/cliente/orientacao-profissional" className="min-w-0 rounded-2xl bg-[#0b5cab] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">💼</span><p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">Orientação Profissional</p></a>'
            if anchor not in b: raise SystemExit('library orientation anchor missing')
            b=b.replace(anchor,add,1); p.write_text(b,encoding='utf-8')

          # 6) Master navigation.
          p=root/'routes/_authenticated/admin.tsx'
          b=p.read_text(encoding='utf-8')
          if '/admin/orientacoes-profissionais' not in b:
            anchor='    ["Orientações Psicanalíticas Escritas", "/admin/orientacoes-psicanaliticas"],\n'
            if anchor not in b: raise SystemExit('admin orientation anchor missing')
            b=b.replace(anchor,anchor+'    ["Orientações Profissionais Escritas", "/admin/orientacoes-profissionais"],\n',1); p.write_text(b,encoding='utf-8')

          # 7) Sales home block. Keep independent from Library subscription.
          p=root/'components/library-sales-home-access-choice.tsx'
          b=p.read_text(encoding='utf-8')
          if '/cliente/orientacao-profissional' not in b:
            anchor='    <section id="formacoes" className="bg-white py-14"><div className="mx-auto max-w-7xl px-4 sm:px-6"><h2 className="font-serif text-3xl sm:text-4xl">{t.formations}</h2><div className="mt-8 grid gap-6 lg:grid-cols-2">'
            card='''    <section className="mx-auto max-w-7xl px-4 pt-10 sm:px-6"><article className="overflow-hidden rounded-[30px] border-2 border-[#0b5cab]/30 bg-gradient-to-br from-[#eef6ff] via-white to-[#f7f3e9] p-7 shadow-sm"><div className="grid gap-6 lg:grid-cols-[1fr_auto] lg:items-center"><div><span className="inline-flex rounded-full bg-[#0b5cab] px-3 py-1 text-[10px] font-black uppercase tracking-[.14em] text-white">NOVO SERVIÇO · CARREIRA</span><p className="mt-4 text-xs font-black uppercase tracking-[.18em] text-[#0b5cab]">ORIENTAÇÃO PROFISSIONAL ESCRITA</p><h2 className="mt-2 font-serif text-3xl sm:text-4xl">Está perdido profissionalmente? Saia com uma direção mais clara.</h2><p className="mt-3 max-w-3xl text-sm leading-7 text-slate-600">Converse por texto sobre currículo, entrevistas, carreira, transição profissional, posicionamento e próximos passos. O tempo fica pausado enquanto você aguarda a resposta.</p><div className="mt-4 flex flex-wrap gap-2 text-xs font-black text-[#0b5cab]"><span className="rounded-full bg-[#0b5cab]/10 px-3 py-2">10 min · € 0,90 / R$ 5,35</span><span className="rounded-full bg-[#0b5cab]/10 px-3 py-2">30 min · € 1,90 / R$ 11,30</span><span className="rounded-full bg-[#0b5cab]/10 px-3 py-2">60 min · € 3,90 / R$ 23,20</span></div><p className="mt-3 text-xs leading-5 text-slate-500">Promoção válida por 30 dias a partir da primeira compra. Serviço separado da assinatura da Biblioteca.</p></div><Link to="/cliente/orientacao-profissional" className="rounded-xl bg-[#0b5cab] px-6 py-4 text-center text-sm font-black text-white shadow-sm">FALAR SOBRE MINHA CARREIRA</Link></div></article></section>\n\n'''
            if anchor not in b: raise SystemExit('sales home anchor missing')
            b=b.replace(anchor,card+anchor,1); p.write_text(b,encoding='utf-8')
          PY
      - name: Commit service
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/lib/professional-orientation.server.ts \
                  apps/painel-ldr/src/lib/professional-orientation.functions.ts \
                  apps/painel-ldr/src/routes/_clientarea.cliente.orientacao-profissional.tsx \
                  apps/painel-ldr/src/routes/_authenticated/admin.orientacoes-profissionais.tsx \
                  apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx \
                  apps/painel-ldr/src/routes/_authenticated/admin.tsx \
                  apps/painel-ldr/src/components/library-sales-home-access-choice.tsx
          git commit -m "feat(painel): add written professional orientation service"
          git push
