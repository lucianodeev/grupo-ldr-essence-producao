# trigger
name: Run mini-library showcase
on:
  push:
    paths:
      - '.github/workflows/run-mini-library-showcase.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/apply-mini-library-showcase.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/library-sales-home-access-choice.tsx
          git commit -m "feat(painel): add multilingual mini-library sales showcase"
          git push
