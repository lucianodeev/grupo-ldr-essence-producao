name: One-time clean AI formation copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-clean-ai-copy.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove unnecessary live-class wording only from AI formation
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.ia-negocios-carreira.tsx': [
              ('15 módulos · 225 aulas · 100% online · sem aulas ao vivo · 5 projetos + Projeto Final',
               '15 módulos · 225 aulas · 100% online · 5 projetos + Projeto Final'),
            ],
            'apps/painel-ldr/src/lib/ai-formation-commerce.server.ts': [
              ('Formação 100% online e assíncrona: 600 horas, 15 módulos, 225 aulas, 5 projetos avaliativos e 1 projeto final.',
               'Formação 100% online: 600 horas, 15 módulos, 225 aulas, 5 projetos avaliativos e 1 projeto final.'),
            ],
          }
          changed = []
          for filename, pairs in replacements.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in pairs:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(filename)
          print('changed:', changed)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'LDR Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.ia-negocios-carreira.tsx apps/painel-ldr/src/lib/ai-formation-commerce.server.ts
          git commit -m 'fix(painel): simplify AI formation online copy'
          git push
