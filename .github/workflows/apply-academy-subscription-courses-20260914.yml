# Legacy integration patches remain manual historical tools. Never reapply them
# automatically to the curated library or push generated changes to main.
name: Apply Academy subscription courses 2026-09-14
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/painel-ldr/src/content/academy-free/**'
      - 'apps/painel-ldr/src/lib/academy-*.ts'
      - 'apps/painel-ldr/src/lib/*formation*.ts'
      - 'apps/painel-ldr/src/lib/learning.server.ts'
      - 'apps/painel-ldr/src/lib/library-*.ts'
      - 'apps/painel-ldr/src/components/*library*.tsx'
      - 'apps/painel-ldr/src/components/academy-*.tsx'
      - 'apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca*.tsx'
      - 'apps/painel-ldr/src/routes/_clientarea.cliente.cursos*.tsx'
      - 'apps/painel-ldr/tests/library-*.test.cjs'
      - 'apps/painel-ldr/tests/editorial-drafts.test.cjs'
      - 'apps/painel-ldr/tests/helpers/**'
      - 'editorial/drafts/**'
      - 'editorial/courses/**'
      - 'tools/validate-course-drafts.cjs'
      - 'tools/course-repetition-review.cjs'
      - 'tools/review-editorial-corpus.cjs'
      - 'tools/validate-editorial-drafts.cjs'
      - 'package-lock.json'
      - 'apps/painel-ldr/package.json'
      - '.github/workflows/apply-academy-subscription-courses-20260914.yml'
  push:
    branches: [main]
    paths:
      - 'apps/painel-ldr/src/content/academy-free/**'
      - 'apps/painel-ldr/src/lib/academy-*.ts'
      - 'apps/painel-ldr/src/lib/*formation*.ts'
      - 'apps/painel-ldr/src/lib/learning.server.ts'
      - 'apps/painel-ldr/src/lib/library-*.ts'
      - 'apps/painel-ldr/src/components/*library*.tsx'
      - 'apps/painel-ldr/src/components/academy-*.tsx'
      - 'apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca*.tsx'
      - 'apps/painel-ldr/src/routes/_clientarea.cliente.cursos*.tsx'
      - 'apps/painel-ldr/tests/library-*.test.cjs'
      - 'apps/painel-ldr/tests/editorial-drafts.test.cjs'
      - 'apps/painel-ldr/tests/helpers/**'
      - 'editorial/drafts/**'
      - 'editorial/courses/**'
      - 'tools/validate-course-drafts.cjs'
      - 'tools/course-repetition-review.cjs'
      - 'tools/review-editorial-corpus.cjs'
      - 'tools/validate-editorial-drafts.cjs'
      - 'package-lock.json'
      - 'apps/painel-ldr/package.json'
      - '.github/workflows/apply-academy-subscription-courses-20260914.yml'
permissions:
  contents: read
jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify library contracts with synthetic data
        run: node --test apps/painel-ldr/tests/library-*.test.cjs apps/painel-ldr/tests/editorial-drafts.test.cjs
      - name: Validate unpublished editorial candidates
        run: node tools/validate-editorial-drafts.cjs
      - name: Validate unpublished course candidates
        run: node tools/validate-course-drafts.cjs
      - name: Check repetition across all authored candidates
        run: node tools/review-editorial-corpus.cjs
      - name: Check Academy TypeScript
        run: npm --prefix apps/painel-ldr run typecheck
      - name: Build Academy without deployment
        run: npm --prefix apps/painel-ldr run build
