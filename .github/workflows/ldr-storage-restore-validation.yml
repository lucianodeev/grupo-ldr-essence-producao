name: LDR isolated Storage recovery validation
on:
  workflow_dispatch:
  push:
    branches: [fix/ldr-isolated-storage-restore-20261113, fix/agenda-payment-credit-completion-20261113]
    paths: ['scripts/agenda/recovery/**', 'scripts/agenda/verify.mjs', 'apps/painel-ldr/supabase/migrations/*agenda_calendar_credit_integration.sql', 'docs/audit-20261111/agenda-preactivation-rollback.sql', '.github/workflows/ldr-storage-restore-validation.yml', '.github/workflows/ldr-recovery-preparation.yml']
permissions:
  contents: read
concurrency:
  group: ldr-isolated-storage-validation
  cancel-in-progress: true
jobs:
  synthetic_storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require public repository and no credentials
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = false
      - name: Retrieve official versioned images before any isolated service starts
        run: |
          docker pull supabase/postgres:17.6.1.155
          docker pull supabase/storage-api:v1.90.3@sha256:17010384ae107d663638aac64aaa794c23d5e9b834ebbe206eb392290b37e358
          docker image inspect supabase/storage-api:v1.90.3@sha256:17010384ae107d663638aac64aaa794c23d5e9b834ebbe206eb392290b37e358 --format '{{json .RepoDigests}}'
      - name: Validate recovery and optional configuration with synthetic credentials only
        run: |
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/ldr-parser-deps" -r scripts/agenda/recovery/parser-requirements.txt
          export PYTHONPATH="$RUNNER_TEMP/ldr-parser-deps"
          python3 -m unittest discover -s scripts/agenda/recovery -p 'test_*.py' -v
          node --test scripts/agenda/recovery/diagnostic.test.mjs
          python3 scripts/agenda/recovery/prepare.py --self-test
          python3 scripts/agenda/recovery/verify_recovered.py
      - name: Restore synthetic file bytes to a fresh isolated official Storage service
        run: python3 scripts/agenda/recovery/verify_storage.py
  original_sql_regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env: {POSTGRES_PASSWORD: synthetic_only, POSTGRES_DB: agenda_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic_only
      PGDATABASE: agenda_test
      AGENDA_PG_PACKAGE: /tmp/agenda-pg/package.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require public repository and synthetic-only credentials
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = false
      - name: Install isolated SQL test driver
        run: npm install --prefix /tmp/agenda-pg --no-audit --no-fund pg@8.23.1 typescript@5.8.3
      - name: Re-run full original SQL checks including non-destructive rollback guard
        run: node scripts/agenda/verify.mjs
