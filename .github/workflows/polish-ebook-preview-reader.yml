name: Polish ebook preview reader
on:
  push:
    paths:
      - '.github/workflows/polish-ebook-preview-reader.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Improve responsive premium reader UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/components/digital-preview-reader.tsx')
          s=p.read_text()
          old=s

          replacements = [
            ('return <div className={`min-h-[calc(100vh-2rem)] rounded-3xl p-3 transition-colors sm:p-5 ${surface}`} style={{fontSize:`${scale}em`}}>',
             'return <div className={`min-h-screen w-full overflow-x-hidden p-2 transition-colors sm:p-4 lg:p-6 ${surface}`} style={{fontSize:`${scale}em`}}>'),
            ('<header className={`sticky top-2 z-20 rounded-2xl border p-3 shadow-sm sm:p-4 ${card}`}><div className="flex flex-col gap-3 xl:flex-row xl:items-center xl:justify-between"><div>',
             '<header className={`sticky top-2 z-20 mx-auto max-w-7xl rounded-3xl border p-3 shadow-lg backdrop-blur sm:p-5 ${card}`}><div className="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between"><div className="min-w-0 flex-1">'),
            ('<h1 className="mt-2 font-serif text-2xl font-bold sm:text-3xl" style={{color:dark?undefined:palette.accent}}>{c.title}</h1><p className="mt-1 text-xs opacity-70">{c.progress}: {progress}%</p></div><div className="flex flex-wrap gap-2">',
             '<h1 className="mt-2 max-w-4xl break-words font-serif text-[clamp(1.45rem,3vw,2.25rem)] font-bold leading-[1.12] tracking-[-.02em]" style={{color:dark?undefined:palette.accent}}>{c.title}</h1><div className="mt-3 flex items-center gap-3"><p className="whitespace-nowrap text-xs font-semibold opacity-70">{c.progress}: {progress}%</p><div className="h-1.5 w-full max-w-56 overflow-hidden rounded-full bg-black/10"><div className="h-full rounded-full bg-[#d9aa3f] transition-all" style={{width:`${progress}%`}}/></div></div></div><div className="flex flex-wrap items-center gap-2 xl:justify-end">'),
            ('<button onClick={()=>setTheme("light")} className="inline-flex min-h-11 items-center gap-2 rounded-xl border px-3 py-2 text-sm font-bold"><Sun className="h-4 w-4"/>{c.light}</button>',
             '<button aria-pressed={theme==="light"} title={c.light} onClick={()=>setTheme("light")} className={`inline-flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold transition ${theme==="light"?"border-[#d9aa3f] bg-[#d9aa3f]/15 shadow-sm":"hover:bg-black/5"}`}><Sun className="h-4 w-4 shrink-0"/><span className="hidden sm:inline">{c.light}</span></button>'),
            ('<button onClick={()=>setTheme("dark")} className="inline-flex min-h-11 items-center gap-2 rounded-xl border px-3 py-2 text-sm font-bold"><Moon className="h-4 w-4"/>{c.dark}</button>',
             '<button aria-pressed={theme==="dark"} title={c.dark} onClick={()=>setTheme("dark")} className={`inline-flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold transition ${theme==="dark"?"border-[#d9aa3f] bg-[#d9aa3f]/15 shadow-sm":"hover:bg-black/5"}`}><Moon className="h-4 w-4 shrink-0"/><span className="hidden sm:inline">{c.dark}</span></button>'),
            ('<button onClick={()=>setScale(v=>Math.max(.9,+(v-.1).toFixed(1)))} className="min-h-11 rounded-xl border px-3 py-2 text-sm font-bold"><ZoomOut className="inline h-4 w-4"/> A−</button>',
             '<button aria-label="Diminuir fonte" title="A−" disabled={scale<=.9} onClick={()=>setScale(v=>Math.max(.9,+(v-.1).toFixed(1)))} className="inline-flex min-h-11 shrink-0 items-center gap-1.5 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-35"><ZoomOut className="h-4 w-4 shrink-0"/>A−</button>'),
            ('<button onClick={()=>setScale(v=>Math.min(1.4,+(v+.1).toFixed(1)))} className="min-h-11 rounded-xl border px-3 py-2 text-sm font-bold"><ZoomIn className="inline h-4 w-4"/> A+</button>',
             '<button aria-label="Aumentar fonte" title="A+" disabled={scale>=1.4} onClick={()=>setScale(v=>Math.min(1.4,+(v+.1).toFixed(1)))} className="inline-flex min-h-11 shrink-0 items-center gap-1.5 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-35"><ZoomIn className="h-4 w-4 shrink-0"/>A+</button>'),
            ('<label className="inline-flex min-h-11 items-center gap-2 rounded-xl border px-3 py-2 text-sm font-bold"><span>{c.language}</span><select',
             '<label className="inline-flex min-h-11 shrink-0 items-center gap-2 whitespace-nowrap rounded-xl border px-3 py-2 text-sm font-bold"><span className="hidden md:inline">{c.language}</span><select'),
            ('<main className="mx-auto grid max-w-6xl gap-4 py-5 lg:grid-cols-[260px_minmax(0,1fr)]"><aside className={`rounded-2xl border p-3 ${card}`}><nav className="grid max-h-[72vh] gap-1 overflow-y-auto">',
             '<main className="mx-auto grid max-w-7xl gap-4 py-4 sm:py-6 lg:grid-cols-[280px_minmax(0,1fr)] xl:grid-cols-[310px_minmax(0,1fr)]"><aside className={`min-w-0 rounded-3xl border p-2 shadow-sm sm:p-3 ${card}`}><nav className="flex gap-2 overflow-x-auto pb-1 lg:grid lg:max-h-[72vh] lg:overflow-x-hidden lg:overflow-y-auto lg:pb-0">'),
            ('className={`min-h-11 rounded-xl px-3 py-2 text-left text-sm ${i===pageIndex?"font-bold text-white":""}`}',
             'className={`min-h-12 min-w-[220px] shrink-0 rounded-xl px-4 py-3 text-left text-sm leading-5 transition lg:min-w-0 lg:w-full ${i===pageIndex?"font-bold text-white shadow-sm":"hover:bg-black/5"}`}'),
            ('<article className={`rounded-2xl border p-5 shadow-sm sm:p-8 lg:p-10 ${card}`}>',
             '<article className={`min-w-0 rounded-3xl border p-5 shadow-sm sm:p-8 lg:p-10 xl:p-12 ${card}`}>'),
            ('<h2 className="mt-2 font-serif text-2xl font-bold sm:text-3xl">{active.titulo}</h2><div className="mt-6 whitespace-pre-line text-base leading-8 opacity-80 sm:text-lg">{active.texto}</div>',
             '<h2 className="mt-3 max-w-4xl break-words font-serif text-[clamp(1.65rem,3.5vw,2.4rem)] font-bold leading-[1.15] tracking-[-.02em]">{active.titulo}</h2><div className="mt-6 max-w-3xl whitespace-pre-line text-[1rem] leading-[1.85] opacity-85 sm:text-[1.08rem] lg:text-[1.12rem]">{active.texto}</div>'),
            ('<div className="mt-10 flex justify-between gap-3 border-t pt-5">',
             '<div className="mt-10 flex flex-col-reverse gap-3 border-t pt-5 sm:flex-row sm:justify-between">'),
            ('className="inline-flex min-h-11 items-center gap-2 rounded-xl border px-4 py-3 text-sm font-bold disabled:opacity-35"',
             'className="inline-flex min-h-12 w-full items-center justify-center gap-2 whitespace-nowrap rounded-xl border px-5 py-3 text-sm font-bold transition hover:bg-black/5 disabled:cursor-not-allowed disabled:opacity-35 sm:w-auto"'),
            ('className="inline-flex min-h-11 items-center gap-2 rounded-xl px-4 py-3 text-sm font-bold text-white"',
             'className="inline-flex min-h-12 w-full items-center justify-center gap-2 whitespace-nowrap rounded-xl px-5 py-3 text-sm font-bold text-white shadow-md transition hover:opacity-95 sm:w-auto"'),
            ('<div className="py-8 text-center">',
             '<div className="mx-auto max-w-3xl py-8 text-center sm:py-12">'),
            ('<h2 className="mt-3 font-serif text-4xl font-bold">{c.endTitle}</h2>',
             '<h2 className="mt-3 break-words font-serif text-[clamp(2rem,5vw,3rem)] font-bold leading-tight tracking-[-.02em]">{c.endTitle}</h2>'),
            ('<p className="mx-auto mt-5 max-w-2xl text-base leading-8 opacity-80">{c.endBody}</p>',
             '<p className="mx-auto mt-5 max-w-2xl text-base leading-[1.8] opacity-85 sm:text-lg">{c.endBody}</p>'),
            ('<div className="mx-auto mt-8 grid max-w-xl gap-3 sm:grid-cols-2">',
             '<div className="mx-auto mt-8 grid max-w-2xl gap-3 sm:grid-cols-2">'),
            ('className="inline-flex min-h-12 items-center justify-center rounded-2xl bg-[#5b0824] px-5 py-4 text-sm font-black text-white"',
             'className="inline-flex min-h-14 items-center justify-center rounded-2xl bg-[#5b0824] px-5 py-4 text-center text-sm font-black leading-5 text-white shadow-lg transition hover:opacity-95"'),
            ('className="inline-flex min-h-12 items-center justify-center rounded-2xl border border-[#d9aa3f] px-5 py-4 text-sm font-black"',
             'className="inline-flex min-h-14 items-center justify-center rounded-2xl border border-[#d9aa3f] px-5 py-4 text-center text-sm font-black leading-5 transition hover:bg-[#d9aa3f]/10"'),
          ]

          for a,b in replacements:
              if a not in s:
                  raise SystemExit(f'Required UI marker not found; refusing partial patch: {a[:100]}')
              s=s.replace(a,b,1)

          if s==old:
              raise SystemExit('No changes made')
          p.write_text(s)
          PY
      - name: Commit reader polish
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/components/digital-preview-reader.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: polish free preview reader responsiveness"
          git push origin main
