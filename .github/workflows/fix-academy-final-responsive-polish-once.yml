name: Fix Academy responsive polish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-academy-final-responsive-polish-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal approved responsive polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Mobile library card titles: preserve card geometry, only stop mid-word breaks.
          p = Path('apps/painel-ldr/src/components/academy-accessibility-controls.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''      font-size: 0.62rem !important;\n      line-height: 1.16 !important;\n      letter-spacing: 0 !important;\n      -webkit-line-clamp: 3 !important;'''
          new = '''      font-size: 0.62rem !important;\n      line-height: 1.16 !important;\n      letter-spacing: 0 !important;\n      word-break: normal !important;\n      overflow-wrap: normal !important;\n      hyphens: none !important;\n      -webkit-line-clamp: 3 !important;'''
          if old not in s:
              raise SystemExit('Library title typography block not found; aborting safely.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Public Academy hero actions: desktop only, preserve mobile/tablet.
          p = Path('apps/painel-ldr/src/components/academy-university-home.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'className="grid gap-2 sm:grid-cols-2 lg:w-[390px]"'
          new = 'className="academy-home-hero-actions grid gap-2 sm:grid-cols-2 lg:w-[460px] lg:gap-3"'
          if old not in s:
              raise SystemExit('Academy hero actions block not found; aborting safely.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Giveaway desktop card only: improve proportion without touching mobile content.
          p = Path('apps/painel-ldr/src/components/academy-giveaway-banner.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'className="ml-auto max-w-sm rounded-[28px] border border-[#d6ad63]/30 bg-white/[.06] p-7 text-center"'
          new = 'className="ml-auto flex min-h-[205px] w-[320px] flex-col justify-center rounded-[28px] border border-[#d6ad63]/30 bg-white/[.06] p-8 text-center"'
          if old not in s:
              raise SystemExit('Giveaway desktop card block not found; aborting safely.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Desktop-only sizing for the two public hero links.
          p = Path('apps/painel-ldr/src/styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Academy public hero — desktop-only final sizing */'
          css = '''\n\n/* Academy public hero — desktop-only final sizing */\n@media (min-width: 1024px) {\n  .academy-home-hero-actions > a {\n    min-height: 54px;\n    padding-inline: 1.5rem;\n    padding-block: 0.85rem;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 0.8125rem;\n    line-height: 1.15;\n    font-weight: 800;\n    text-align: center;\n    white-space: normal;\n  }\n}\n'''
          if marker not in s:
              s += css
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scope and syntax hygiene
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            apps/painel-ldr/src/components/academy-accessibility-controls.tsx \
            apps/painel-ldr/src/components/academy-giveaway-banner.tsx \
            apps/painel-ldr/src/components/academy-university-home.tsx \
            apps/painel-ldr/src/styles.css | sort)"
          test "$changed" = "$expected"

      - name: Commit approved responsive polish
        shell: bash
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/components/academy-accessibility-controls.tsx apps/painel-ldr/src/components/academy-giveaway-banner.tsx apps/painel-ldr/src/components/academy-university-home.tsx apps/painel-ldr/src/styles.css
          git commit -m "fix(academy): polish mobile card titles and desktop hero sizing"
          git push origin main
