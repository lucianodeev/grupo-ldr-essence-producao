name: LDR ONE Business safe checks

on:
  pull_request:
    paths:
      - "apps/painel-ldr/src/lib/ldr-pass.server.ts"
      - "apps/painel-ldr/src/lib/ldr-pass.functions.ts"
      - "apps/painel-ldr/src/routes/ldr-pass.tsx"
      - "apps/painel-ldr/src/routes/__root.tsx"
      - "apps/painel-ldr/tests/ldr-one-business-min-seats.test.cjs"
      - ".github/workflows/ldr-one-business-safe-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ldr-one-business-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check five-seat minimum (no network calls)
        run: node --test apps/painel-ldr/tests/ldr-one-business-min-seats.test.cjs
      - name: Check checkout resume (mock Stripe)
        run: node --test apps/painel-ldr/tests/ldr-one-checkout-resume.test.cjs
      - name: Exercise isolated entitlement, checkout and webhook lifecycle (mocks only)
        run: node --experimental-strip-types --test apps/painel-ldr/src/lib/ldr-one-sandbox.test.ts apps/painel-ldr/src/lib/ldr-one-checkout-sandbox.test.ts apps/painel-ldr/src/lib/ldr-one-events-sandbox.test.ts
      - name: Exercise isolated seat assignment and revocation (mocks only)
        run: node --test scripts/ldr-one-sandbox-access.test.mjs scripts/ldr-one-sandbox-revoke-seat.test.mjs scripts/ldr-one-sandbox-seat-roster.test.mjs
      - name: Exercise isolated Stripe event and checkout integration guards (mocks only)
        run: node --test scripts/ldr-one-sandbox-webhook-bridge.test.mjs scripts/ldr-one-sandbox-checkout-service.test.mjs scripts/ldr-one-sandbox-checkout-integration.test.mjs scripts/ldr-one-sandbox-real-webhook-lifecycle.test.mjs
