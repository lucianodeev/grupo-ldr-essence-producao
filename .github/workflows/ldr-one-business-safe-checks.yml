name: LDR ONE Business safe checks

on:
  pull_request:
    paths:
      - "apps/painel-ldr/src/lib/ldr-pass.server.ts"
      - "apps/painel-ldr/src/lib/ldr-pass.functions.ts"
      - "apps/painel-ldr/src/routes/ldr-pass.tsx"
      - "apps/painel-ldr/src/routes/__root.tsx"
      - "apps/painel-ldr/tests/ldr-one-business-min-seats.test.cjs"
      - ".github/workflows/ldr-one-business-safe-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ldr-one-business-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check five-seat minimum (no network calls)
        run: node --test apps/painel-ldr/tests/ldr-one-business-min-seats.test.cjs
      - name: Check checkout resume (mock Stripe)
        run: node --test apps/painel-ldr/tests/ldr-one-checkout-resume.test.cjs
