name: Add ebook preview entry
on:
  push:
    paths:
      - '.github/workflows/add-ebook-preview-entry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add preview entry without changing existing cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          marker='<section className="grid min-w-0 gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label={copy.title}>'
          if '/cliente/biblioteca/amostra' in s:
              print('Preview entry already present')
          else:
              if marker not in s:
                  raise SystemExit('Library product grid marker not found; refusing to modify')
              preview='''{!data.products.find((product)=>product.key==="ebook_coragem_comecar")?.entitled?<section className="overflow-hidden rounded-3xl border-2 border-[#d7ad54] bg-gradient-to-br from-[#35101e] to-[#5b0824] p-5 text-white shadow-lg sm:p-6"><div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div><span className="inline-flex rounded-full bg-[#d7ad54] px-3 py-1 text-xs font-black text-[#42111d]">{locale==="pt"?"AMOSTRA GRÁTIS":locale==="fr"?"EXTRAIT GRATUIT":locale==="es"?"MUESTRA GRATIS":"FREE PREVIEW"}</span><h2 className="mt-3 font-serif text-2xl font-bold text-[#fff5df]">{locale==="pt"?"Leia o início da minha história — grátis":locale==="fr"?"Lisez le début de mon histoire — gratuitement":locale==="es"?"Lee el inicio de mi historia — gratis":"Read the beginning of my story — free"}</h2><p className="mt-2 max-w-2xl text-sm leading-6 text-[#f5dfac]">{locale==="pt"?"Uma experiência de leitura dentro da Biblioteca: Bahia, banana e mamão, porta em porta, recomeços e a transformação da experiência em método.":locale==="fr"?"Une expérience de lecture dans la Bibliothèque : Bahia, bananes et papayes, porte-à-porte, nouveaux départs et transformation de l’expérience en méthode.":locale==="es"?"Una experiencia de lectura dentro de la Biblioteca: Bahia, bananas y papayas, puerta a puerta, nuevos comienzos y la transformación de la experiencia en método.":"A reading experience inside the Library: Bahia, bananas and papayas, door to door, new beginnings and turning experience into method."}</p></div><a href="/cliente/biblioteca/amostra" className="inline-flex min-h-12 shrink-0 items-center justify-center gap-2 rounded-2xl bg-[#d7ad54] px-5 py-4 text-sm font-black text-[#42111d] shadow-md"><BookOpen className="h-5 w-5"/>{locale==="pt"?"LER AMOSTRA GRÁTIS":locale==="fr"?"LIRE L’EXTRAIT GRATUIT":locale==="es"?"LEER MUESTRA GRATIS":"READ FREE PREVIEW"}</a></div></section>:null}\n\n    '''
              s=s.replace(marker,preview+marker,1)
              p.write_text(s)
              print('Preview entry added')
          PY
      - name: Commit change
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add free ebook preview entry in library"
          git push origin main
