name: Change library book color to wine
on:
  push:
    paths:
      - 'tools/change_library_book_color_to_wine.py'
      - '.github/workflows/change-library-book-color-to-wine.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply book color patch
        run: python tools/change_library_book_color_to_wine.py
      - name: Commit change
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: change library book card to wine"
          git push origin main
