name: One-time add editorial cards
on:
  push:
    paths:
      - '.github/workflows/one-time-add-editorial-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Jornal and Revista cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text(encoding='utf-8')
          if 'href="/cliente/biblioteca/jornal-ldr"' not in s:
              needle='{card("book","Livros","bg-[#5b0824]","book")}'
              addition='''{card("book","Livros","bg-[#5b0824]","book")}\n        <a href="/cliente/biblioteca/jornal-ldr" className="min-w-0 rounded-2xl bg-[#0b2341] px-1 py-4 text-center text-white shadow-sm"><div className="mx-auto text-lg">📰</div><p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">Jornal LDR</p><p className="mt-1 text-[7px] text-white/70">0,90/mês</p></a>\n        <a href="/cliente/biblioteca/revista-ldr" className="min-w-0 rounded-2xl bg-[#6b0d2b] px-1 py-4 text-center text-white shadow-sm"><div className="mx-auto text-lg">📖</div><p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">Revista LDR</p><p className="mt-1 text-[7px] text-white/70">0,90/mês</p></a>'''
              if needle not in s:
                  raise SystemExit('Card Livros anchor not found; refusing unsafe patch')
              s=s.replace(needle,addition,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git commit -m "feat(painel): show Jornal and Revista cards in library"
          git push
