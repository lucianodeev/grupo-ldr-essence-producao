name: Apply library card translations once
on:
  push:
    paths:
      - '.github/workflows/apply-library-card-i18n-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply translations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s = p.read_text()
          imp = 'import { UNDERGRADUATE_COURSES } from "@/lib/undergraduate.catalog";'
          add = 'import { libraryCardText, postgraduateCardTitle, undergraduateCardTitle } from "@/lib/library-card-i18n";'
          if add not in s:
              s = s.replace(imp, imp + '\n' + add, 1)
          if 'const ct=libraryCardText(locale);' not in s:
              s = s.replace('const t=TXT[locale];', 'const t=TXT[locale];\n  const ct=libraryCardText(locale);', 1)
          pairs = {
              'card("ebook","eBooks"': 'card("ebook",ct.ebooks',
              'card("book","Livros"': 'card("book",ct.books',
              'card("training","Negócios"': 'card("training",ct.business',
              'card("psycho","Psicanálise"': 'card("psycho",ct.psycho',
              'card("brief","Terapia Breve"': 'card("brief",ct.brief',
              'card("massage","Massoterapia"': 'card("massage",ct.massage',
              'card("business24","Negócio 24h"': 'card("business24",ct.business24',
              'card("mentor","Mentoria"': 'card("mentor",ct.mentorship',
              'card("leader","Liderança"': 'card("leader",ct.leadership',
              'card("hr","RH 600h"': 'card("hr",ct.hr',
              'card("free","Gratuito"': 'card("free",ct.free',
              'card("film","Filme (em breve)"': 'card("film",ct.film',
              '>Jornais & Revistas</p>': '>{ct.editorial}</p>',
              '>Todos em um só lugar</p>': '>{ct.editorialSub}</p>',
              '>Orientação Escrita</p>': '>{ct.writtenPsycho}</p>',
              '>psicanalítica</p>': '>{ct.writtenPsychoSub}</p>',
              '>Orientação Profissional</p>': '>{ct.writtenCareer}</p>',
              '>carreira</p>': '>{ct.writtenCareerSub}</p>',
              '>Quero começar minha formação</button>': '>{ct.startFormation}</button>',
              '>Graduação · Em breve</span>': '>{ct.undergrad}</span>',
              '>LIVE SEMIPRESENCIAL</span>': '>{ct.live}</span>',
              '>Matriz preliminar</p>': '>{ct.prelim}</p>',
              '>A partir de R$ 99,90/mês</p>': '>{ct.from}</p>',
              '>TENHO INTERESSE</': '>{ct.interest}</',
              '>INSCREVER INTERESSE</': '>{ct.register}</',
              '>Em breve</span>': '>{ct.postgrad}</span>',
          }
          for old, new in pairs.items():
              s = s.replace(old, new)
          s = s.replace('{course.title}', '{undergraduateCardTitle(locale,course.key,course.title)}')
          s = s.replace('{g.title}', '{postgraduateCardTitle(locale,g.key,g.title)}')
          s = s.replace('>Carregando biblioteca…</p>', '>{ct.loading}</p>')
          p.write_text(s)

          p = Path('apps/painel-ldr/src/components/library-sales-home.tsx')
          s = p.read_text()
          imp = 'import { useI18n } from "@/lib/i18n";'
          add = 'import { librarySalesCardCatalog } from "@/lib/library-sales-card-i18n";'
          if add not in s:
              s = s.replace(imp, imp + '\n' + add, 1)
          anchor = 'const {locale:raw}=useI18n(); const locale=(raw==="pt"||raw==="en"||raw==="fr"||raw==="es"?raw:"pt") as Locale; const t=COPY[locale];'
          if 'librarySalesCardCatalog(locale)' not in s:
              s = s.replace(anchor, anchor + ' const {formations,freeCourses}=librarySalesCardCatalog(locale);', 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx apps/painel-ldr/src/components/library-sales-home.tsx
          git commit -m "fix(painel): translate every library card with selector"
          git push