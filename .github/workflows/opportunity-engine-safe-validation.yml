name: Opportunity Engine Safe Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/painel-ldr/src/lib/career-intelligence.functions.ts'
      - 'apps/painel-ldr/tests/academic-regressions.test.cjs'
      - 'apps/painel-ldr/package.json'
      - '.github/workflows/opportunity-engine-safe-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/painel-ldr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Academic regressions
        run: npm run test:academic
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
