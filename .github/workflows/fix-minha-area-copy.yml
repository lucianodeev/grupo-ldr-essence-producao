name: Fix Minha Área copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-minha-area-copy.yml'
permissions:
  contents: write
jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/acesso.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('client:"Minha Área", clientText:"Sigue compras, agenda, biblioteca, mentoría y servicios individuales."','client:"Mi Área", clientText:"Sigue compras, agenda, biblioteca, mentoría y servicios individuales."')
          p.write_text(s,encoding='utf-8')

          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.contratar.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Pagamento seguro. Após a contratação, acompanhe os próximos passos pela sua Minha Área.','Pagamento seguro. Após a contratação, acompanhe os próximos passos pela Minha Área.')
          s=s.replace('Secure payment. After purchase, follow the next steps in your My Area.','Secure payment. After purchase, follow the next steps in My Area.')
          s=s.replace('Pago seguro. Después de contratar, sigue los próximos pasos desde tu Mi Área.','Pago seguro. Después de contratar, sigue los próximos pasos desde Mi Área.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate build
        working-directory: apps/painel-ldr
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src/routes/acesso.tsx apps/painel-ldr/src/routes/_clientarea.cliente.contratar.tsx apps/painel-ldr/src/routeTree.gen.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: polish Minha Área copy'
          git push origin main
