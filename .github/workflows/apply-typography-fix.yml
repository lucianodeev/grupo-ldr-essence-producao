name: Apply typography stylesheet

on:
  push:
    branches:
      - fix/typografia-responsiva-global
    paths:
      - .github/workflows/apply-typography-fix.yml
      - apps/luciano-empreendedor/typography-fix.css

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typografia-responsiva-global
          fetch-depth: 0
      - name: Link typography stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/luciano-empreendedor/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="/typography-fix.css?v=20260825">'
          if marker not in text:
              if '</head>' not in text:
                  raise SystemExit('index.html sem </head>')
              text = text.replace('</head>', marker + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated link
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/luciano-empreendedor/index.html
          git commit -m "fix: load responsive typography stylesheet"
          git push origin HEAD:fix/typografia-responsiva-global
