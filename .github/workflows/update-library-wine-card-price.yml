name: Update library wine card price

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-library-wine-card-price.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only wine training card price
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          old='''<div className="mt-5 flex flex-wrap items-end gap-3"><span className="text-base text-white/65 line-through">{regularTrainingPrice}</span><strong className="text-4xl text-[#f1c45d]">{trainingPrice}</strong></div>'''
          new='''<div className="mt-5 flex flex-wrap items-end gap-3"><strong className="text-4xl text-[#f1c45d]">{market==="BR"?(locale==="pt"?"12x de R$ 31,03":locale==="en"?"12x R$ 31.03":locale==="fr"?"12x R$ 31,03":"12x R$ 31,03"):(locale==="fr"?"65,34 €":"€ 65,34")}</strong></div>'''
          if old not in s:
              raise SystemExit('Target wine-card price block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit library wine card update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet || git commit -m "feat: refresh wine training card price in library"
          git push
