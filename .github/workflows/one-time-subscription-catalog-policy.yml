name: One-time subscription catalog policy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-subscription-catalog-policy.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply catalog policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Policy update: keep existing validated products unchanged, move only
          # main Psychoanalysis out of subscription and include only the six new courses.
          p=Path('apps/painel-ldr/src/lib/library-subscription.server.ts')
          s=p.read_text()
          psycho='  ["formacao_psicanalise", "Formação Online em Psicanálise"],\n'
          if psycho not in s:
              raise SystemExit('Expected Psychoanalysis subscription entry not found')
          s=s.replace(psycho,'',1)
          anchor='  ["formacao_comunicacao_oratoria_inteligencia_emocional", "Formação em Comunicação, Oratória e Inteligência Emocional no Trabalho"],\n'
          additions=(
              '  ["formacao_aba_autismo_600h", "Formação em ABA Aplicada ao Autismo"],\n'
              '  ["formacao_saude_mental_praticas_clinicas_600h", "Saúde Mental e Práticas Clínicas Baseadas em Evidências"],\n'
              '  ["formacao_sociologia_600h", "Sociologia — Teorias, Métodos e Desigualdades Contemporâneas"],\n'
              '  ["formacao_filosofia_clinica_600h", "Filosofia Clínica — Método, Escuta e Filosofia Aplicada"],\n'
              '  ["formacao_ciencia_politica_600h", "Ciência Política — Teoria, Instituições e Democracia"],\n'
              '  ["formacao_ciencias_felicidade_600h", "Ciências da Felicidade e Bem-Estar — Da Neurociência à Prática"],\n'
          )
          if additions[0] not in s:
              if anchor not in s:
                  raise SystemExit('Subscription list anchor not found')
              s=s.replace(anchor,anchor+''.join(additions),1)
          p.write_text(s)

          p=Path('apps/painel-ldr/src/lib/new-professional-formations.catalog.ts')
          s=p.read_text()
          old='const base={priceBrlCents:29999,priceEurCents:4990,hours:600,lessons:144,modulesCount:12,minimumDays:75,includedInSubscription:false};'
          new='const base={priceBrlCents:29999,priceEurCents:4990,hours:600,lessons:144,modulesCount:12,minimumDays:75,includedInSubscription:true};'
          if old not in s and new not in s:
              raise SystemExit('New formation base policy not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          oldset='const includedProfessionalSlugs=new Set(["vendas-negociacao","marketing-digital","recrutamento-selecao","gestao-administrativa-financeira","comunicacao-oratoria"]);'
          newset='const includedProfessionalSlugs=new Set(["vendas-negociacao","marketing-digital","recrutamento-selecao","gestao-administrativa-financeira","comunicacao-oratoria","aba-autismo","saude-mental-praticas-clinicas","sociologia","filosofia-clinica","ciencia-politica","ciencias-felicidade"]);'
          if oldset not in s and newset not in s:
              raise SystemExit('Library included slug set not found')
          s=s.replace(oldset,newset,1)
          s=s.replace('{card("psycho",ct.psycho,"bg-[#5b2b86]","grad",accessLabels.included)}','{card("psycho",ct.psycho,"bg-[#5b2b86]","grad",accessLabels.single)}',1)
          s=s.replace('<h3 className="font-serif text-2xl">Formação Online em Psicanálise</h3><p className="mt-2 text-xs font-bold text-[#0b2341]">✓ Incluído na assinatura Biblioteca LDR · compra avulsa mantém acesso vitalício.</p>',
                      '<h3 className="font-serif text-2xl">Formação Online em Psicanálise</h3><p className="mt-2 text-xs font-bold text-[#5b2b86]">Compra avulsa · não incluído na assinatura Biblioteca LDR · pagamento único · acesso vitalício após compra.</p>',1)
          p.write_text(s)
          PY
      - name: Verify policy in source
        run: |
          ! grep -q '\["formacao_psicanalise", "Formação Online em Psicanálise"\]' apps/painel-ldr/src/lib/library-subscription.server.ts
          grep -q 'formacao_aba_autismo_600h' apps/painel-ldr/src/lib/library-subscription.server.ts
          grep -q 'includedInSubscription:true' apps/painel-ldr/src/lib/new-professional-formations.catalog.ts
          grep -q '"ciencias-felicidade"' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-subscription-catalog-policy.yml
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add -A
          git commit -m "fix: separate psychoanalysis from library subscription"
          git push origin main
