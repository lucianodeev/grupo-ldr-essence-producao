name: One-time fix Revista Psicanálise slug
on:
  push:
    branches:
      - fix/revista-psicanalise-slug-v2
    paths:
      - '.github/workflows/one-time-fix-revista-psicanalise-slug.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/revista-psicanalise-slug-v2
      - name: Align catalog slug with validated public link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/lib/editorial-catalog.ts')
          s=p.read_text(encoding='utf-8')
          old='productKey:"revista_psicanalise_no_mundo",slug:"psicanalise-no-mundo"'
          new='productKey:"revista_psicanalise_no_mundo",slug:"revista-psicanalise-no-mundo"'
          if old not in s:
              raise SystemExit('expected catalog entry not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src/lib/editorial-catalog.ts
          git commit -m 'fix: alinhar slug da Revista Psicanálise no Mundo'
          git push origin HEAD:fix/revista-psicanalise-slug-v2
