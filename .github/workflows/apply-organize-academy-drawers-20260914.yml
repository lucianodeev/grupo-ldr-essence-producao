name: Apply Academy drawer organization 2026-09-14

on:
  push:
    branches:
      - feat/organize-academy-drawers-20260914
      - main
    paths:
      - 'tools/patch_organize_academy_drawers_20260914.py'
      - '.github/workflows/apply-organize-academy-drawers-20260914.yml'
      - 'apps/painel-ldr/src/components/academic-drawers.tsx'
      - 'apps/painel-ldr/src/components/academy-subscription-course-shelf.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply idempotent drawer patch
        run: python tools/patch_organize_academy_drawers_20260914.py
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Build Academy
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Commit generated integration when build succeeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/academic-drawers.tsx apps/painel-ldr/src/components/academy-subscription-course-shelf.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat(academy): organize subscription courses in existing drawers"
            git push origin HEAD:${{ github.ref_name }}
          fi
