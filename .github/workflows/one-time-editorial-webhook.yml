name: Editorial webhook patch
on:
  push:
    paths:
      - 'tools/patch_editorial_webhook.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/patch_editorial_webhook.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/api/stripe/webhook.ts
          git commit -m "feat(painel): sync editorial subscriptions through Stripe webhook"
          git push
