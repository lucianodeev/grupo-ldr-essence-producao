name: Fix Pages training card once

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/fix-pages-training-card-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Corrigir caminho do script no GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/training-card-v1.js'
          new = './training-card-v1.js'
          if old not in s:
              raise SystemExit('Marcador do script não encontrado no index.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix pages: carregar status disponível do treinamento'
          git push origin gh-pages
