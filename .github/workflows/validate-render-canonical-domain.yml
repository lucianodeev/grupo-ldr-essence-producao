name: Validate Render canonical domain

on:
  push:
    branches:
      - feat/render-canonical-domain
    paths:
      - 'apps/painel-ldr/**'
      - '.github/workflows/validate-render-canonical-domain.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Generate routes
        working-directory: apps/painel-ldr
        run: npm run generate-routes
      - name: Unified-domain tests
        working-directory: apps/painel-ldr
        run: npm run test:preview
      - name: Core tests
        working-directory: apps/painel-ldr
        run: npm test
      - name: Academic regressions
        working-directory: apps/painel-ldr
        run: npm run test:academic
      - name: Render build
        working-directory: apps/painel-ldr
        env:
          SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build:render
      - name: Verify Render canonical host
        shell: bash
        run: |
          grep -Fq 'CANONICAL_ECOSYSTEM_ORIGIN = "https://ldr-ecossistema-validacao.onrender.com"' apps/painel-ldr/src/server.ts
          grep -Fq 'CANONICAL_ECOSYSTEM_HOST = "ldr-ecossistema-validacao.onrender.com"' apps/painel-ldr/src/lib/unified-preview.ts
