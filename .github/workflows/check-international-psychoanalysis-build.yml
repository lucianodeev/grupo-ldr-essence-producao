name: Check international psychoanalysis course build
on:
  push:
    paths:
      - '.github/workflows/check-international-psychoanalysis-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-package-lock
      - run: npm run build:painel
