name: Apply psychoanalysis academic rigor presentation
on:
  push:
    paths:
      - '.github/workflows/one-shot-psychoanalysis-academic-rigor.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply surgical presentation updates
        run: |
          python - <<'PY'
          from pathlib import Path

          # Internal student experience: make the progressive difficulty visible without changing access/progress logic.
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx')
          s=p.read_text()
          old='import { psychoanalysisModules, PSYCHOANALYSIS_TOTAL_LESSONS } from "@/content/psychoanalysis-curriculum-active";'
          new=old+'\nimport { getAcademicLevel } from "@/content/psychoanalysis-advanced-rigor";'
          if old in s and 'getAcademicLevel' not in s:
              s=s.replace(old,new,1)
          old='Teoria · Análise pessoal · Supervisão · 15 módulos · 240 unidades · 1.200 horas · 6 encontros ao vivo'
          new='Teoria · Análise pessoal · Supervisão · 15 módulos · 240 unidades · 1.200 horas · 6 encontros ao vivo · progressão acadêmica em 5 níveis'
          s=s.replace(old,new)
          old='<span className="mt-1 block text-sm font-bold leading-5">{m.title}</span>'
          new='<span className="mt-1 block text-sm font-bold leading-5">{m.title}</span><span className="mt-1 block text-[10px] font-black uppercase tracking-[.1em] opacity-70">Nível: {getAcademicLevel(mi)}</span>'
          s=s.replace(old,new)
          old='<span className="rounded-full bg-[#f5efe0] px-3 py-1 text-[10px] font-black uppercase tracking-[.12em] text-[#8a6816]">Aula {state.lesson+1}/{mod.lessons.length}</span>'
          new=old+'<span className="rounded-full bg-[#ede7f7] px-3 py-1 text-[10px] font-black uppercase tracking-[.12em] text-[#5b2b86]">{getAcademicLevel(state.module)}</span>'
          s=s.replace(old,new)
          p.write_text(s)

          # Public sales page: communicate rigor accurately without claiming an academic degree/equivalence.
          p=Path('apps/painel-ldr/src/components/psychoanalysis-training-page.tsx')
          s=p.read_text()
          old='Uma formação estruturada para quem quer compreender a Psicanálise além das frases prontas: fundamentos, técnica, clínica, análise pessoal, supervisão e estudo continuado em um único percurso.'
          new='Uma formação de alto rigor acadêmico para quem quer compreender a Psicanálise além das frases prontas: fundamentos, fontes primárias, contrapontos críticos, pesquisa, técnica, clínica, análise pessoal, supervisão e produção acadêmica em um único percurso.'
          s=s.replace(old,new)
          marker='   <section><p className="text-xs font-black uppercase tracking-[.18em] text-[#7b4aa3]">O tripé da formação</p>'
          block='''   <section className="rounded-[2rem] border border-[#caa85d]/60 bg-[#2f1457] p-6 text-white shadow-xl sm:p-8"><p className="text-xs font-black uppercase tracking-[.18em] text-[#efd58d]">Formação de alto rigor acadêmico</p><h2 className="mt-2 max-w-4xl font-serif text-3xl font-bold sm:text-4xl">Aqui, você não aprende apenas o que os autores disseram. Aprende a questioná-los, compará-los e sustentar a sua própria construção clínica.</h2><p className="mt-4 max-w-4xl text-sm leading-7 text-white/80 sm:text-base">O percurso avança por cinco níveis — Fundamentos, Intermediário, Avançado, Pesquisa e Clínica Avançada e Especialista Internacional — com leitura de fontes primárias, contrapontos, análise de evidências, limites epistemológicos, estudos de caso, decisões éticas e produção escrita.</p><div className="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">{["Fontes primárias + leitura crítica","Hipóteses concorrentes e limites","Casos complexos + decisão ética","Pesquisa, escrita e argumentação"].map(item=><div key={item} className="rounded-2xl border border-white/15 bg-white/10 p-4 text-sm font-bold">{item}</div>)}</div><p className="mt-5 text-xs leading-5 text-white/60">Formação livre de alto rigor acadêmico. A descrição de rigor não representa título de mestrado, doutorado ou equivalência universitária oficial.</p></section>\n\n'''
          if marker in s and 'Formação de alto rigor acadêmico</p><h2' not in s:
              s=s.replace(marker,block+marker,1)
          p.write_text(s)
          PY
      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-psychoanalysis-academic-rigor.yml
          git add apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx apps/painel-ldr/src/components/psychoanalysis-training-page.tsx
          git commit -m "feat: present psychoanalysis academic rigor progression"
          git push
