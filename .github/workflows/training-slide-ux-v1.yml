name: Training slide UX v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/training-slide-ux-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply slide-style lesson UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.do-mamao-ao-negocio.tsx')
          s=p.read_text()

          state_old='  const [selectedDay,setSelectedDay]=useState(1);\n'
          state_new='  const [selectedDay,setSelectedDay]=useState(1);\n  const [lessonStep,setLessonStep]=useState(0);\n'
          if state_old in s and 'const [lessonStep,setLessonStep]' not in s:
              s=s.replace(state_old,state_new,1)

          effect_marker='  useEffect(()=>{try{localStorage.setItem("ldr-training-theme",theme);localStorage.setItem("ldr-training-scale",String(scale));}catch{}},[theme,scale]);\n'
          effect_add=effect_marker+'  useEffect(()=>{setLessonStep(0);},[selectedDay]);\n'
          if effect_marker in s and 'setLessonStep(0);},[selectedDay]' not in s:
              s=s.replace(effect_marker,effect_add,1)

          go_old='  function goDay(day:number){if(day<1||day>unlockedDay)return;setSelectedDay(day);setArea("aula");window.scrollTo({top:0,behavior:"smooth"});}\n'
          go_new='  function goDay(day:number){if(day<1||day>unlockedDay)return;setSelectedDay(day);setLessonStep(0);setArea("aula");window.scrollTo({top:0,behavior:"smooth"});}\n'
          if go_old in s:
              s=s.replace(go_old,go_new,1)

          return_marker='  return <div className={`min-h-screen min-w-0 overflow-x-hidden rounded-3xl p-2 pb-24 transition-colors sm:p-4 ${shell}`} style={{fontSize:`${scale}rem`}}>\n'
          helper='''  const objectiveQuestions=currentLesson.questions.filter(q=>q.type==="objective");
  const writtenQuestions=currentLesson.questions.filter(q=>q.type==="written");
  const lessonSlides:any[]=[
    {kind:"intro",label:locale==="pt"?"Comece por aqui":locale==="fr"?"Commencez ici":locale==="es"?"Empieza aquí":"Start here",title:currentLesson.title,text:currentLesson.theme},
    ...currentLesson.theory.map((text,i)=>({kind:"theory",label:`${c.reading} · ${i+1}/${currentLesson.theory.length}`,title:currentLesson.theme,text})),
    {kind:"story",label:c.story,title:c.story,text:currentLesson.storyLens},
    {kind:"example",label:c.example,title:c.example,text:currentLesson.example},
    {kind:"field",label:c.field,title:c.field,text:currentLesson.activity},
    ...currentLesson.quiz.map((question,i)=>({kind:"quiz",label:`${c.quiz} · ${i+1}/${currentLesson.quiz.length}`,title:c.quiz,question,index:i})),
    ...objectiveQuestions.map((question,i)=>({kind:"objective",label:`${c.objective} · ${i+1}/${objectiveQuestions.length}`,title:c.questions,question,index:i})),
    ...writtenQuestions.map((question,i)=>({kind:"written",label:`${c.written} · ${i+1}/${writtenQuestions.length}`,title:c.questions,question,index:i})),
    {kind:"review",label:locale==="pt"?"Revisão final":locale==="fr"?"Révision finale":locale==="es"?"Revisión final":"Final review",title:locale==="pt"?"Pronto para concluir?":locale==="fr"?"Prêt à terminer ?":locale==="es"?"¿Listo para terminar?":"Ready to complete?"}
  ];
  const safeLessonStep=Math.min(Math.max(0,lessonStep),Math.max(0,lessonSlides.length-1));
  const activeSlide:any=lessonSlides[safeLessonStep];
  const lessonStepProgress=Math.round(((safeLessonStep+1)/Math.max(1,lessonSlides.length))*100);
  const objectiveDone=Object.values(currentState.objectiveAnswers??{}).filter(Boolean).length;
  const writtenDone=Object.values(currentState.writtenAnswers??{}).filter(v=>typeof v==="string"&&v.trim().length>=500&&v.length<=1000).length;
  const quizDone=Object.values(currentState.quizAnswers??{}).filter(v=>typeof v==="number").length;
  function moveLessonStep(delta:number){
    setLessonStep(v=>Math.min(Math.max(0,v+delta),lessonSlides.length-1));
    window.setTimeout(()=>document.getElementById("lesson-slide-card")?.scrollIntoView({behavior:"smooth",block:"start"}),30);
  }

'''
          if return_marker in s and 'const lessonSlides:any[]=' not in s:
              s=s.replace(return_marker,helper+return_marker,1)

          start='      {area==="aula"&&<>\n'
          end='\n      {area==="manual"&&<>'
          i=s.find(start)
          j=s.find(end,i)
          if i<0 or j<0:
              raise SystemExit('lesson area markers not found')

          block=r'''      {area==="aula"&&<>
        <section className={`rounded-3xl border p-4 ${card}`}>
          <div className="flex items-center justify-between gap-3">
            <button aria-label="Aula anterior" disabled={selectedDay<=1} onClick={()=>goDay(selectedDay-1)} className="grid h-11 w-11 shrink-0 place-items-center rounded-xl border disabled:opacity-30"><ChevronLeft className="h-5 w-5"/></button>
            <div className="min-w-0 text-center"><p className="text-xs font-black uppercase tracking-[.14em] text-[#a67618]">{c.day} {selectedDay} · {c.month} {currentLesson.month}</p><h2 className="truncate font-serif text-xl font-bold sm:text-2xl">{currentLesson.title}</h2></div>
            <button aria-label="Próxima aula" disabled={selectedDay>=unlockedDay} onClick={()=>goDay(selectedDay+1)} className="grid h-11 w-11 shrink-0 place-items-center rounded-xl border disabled:opacity-30"><ChevronRight className="h-5 w-5"/></button>
          </div>
        </section>

        <section id="lesson-slide-card" className={`scroll-mt-4 overflow-hidden rounded-[2rem] border shadow-sm ${card}`}>
          <div className="border-b border-[#d7ad54]/35 bg-[#5b0824] px-4 py-4 text-white sm:px-6">
            <div className="flex items-center justify-between gap-3 text-xs font-black uppercase tracking-[.14em] text-[#f2cf78]"><span>{activeSlide?.label}</span><span>{safeLessonStep+1}/{lessonSlides.length}</span></div>
            <div className="mt-3 h-2 overflow-hidden rounded-full bg-white/15"><div className="h-full rounded-full bg-[#d7ad54] transition-all duration-300" style={{width:`${lessonStepProgress}%`}}/></div>
          </div>

          <div className="min-h-[420px] p-5 sm:min-h-[460px] sm:p-8">
            {activeSlide?.kind==="intro"&&<div className="mx-auto flex max-w-3xl flex-col items-center justify-center py-8 text-center sm:py-14"><div className="grid h-16 w-16 place-items-center rounded-2xl bg-[#5b0824] text-[#f2cf78]"><GraduationCap className="h-8 w-8"/></div><p className="mt-5 text-xs font-black uppercase tracking-[.18em] text-[#a67618]">{c.day} {selectedDay}</p><h3 className="mt-2 font-serif text-3xl font-bold sm:text-4xl">{currentLesson.title}</h3><p className="mt-4 max-w-2xl text-base leading-7 opacity-75">{locale==="pt"?`Hoje vamos trabalhar ${currentLesson.theme}. Avance no seu ritmo; suas respostas são salvas enquanto você constrói a aula.`:locale==="fr"?`Aujourd’hui, nous allons travailler ${currentLesson.theme}. Avancez à votre rythme ; vos réponses sont enregistrées pendant le parcours.`:locale==="es"?`Hoy vamos a trabajar ${currentLesson.theme}. Avanza a tu ritmo; tus respuestas se guardan durante el recorrido.`:`Today we will work on ${currentLesson.theme}. Move at your own pace; your answers are saved as you progress.`}</p></div>}

            {activeSlide?.kind==="theory"&&<div className="mx-auto max-w-3xl"><div className="flex items-center gap-2 text-[#9e7119]"><BookOpen className="h-5 w-5"/><span className="text-xs font-black uppercase tracking-[.14em]">{activeSlide.label}</span></div><h3 className="mt-4 font-serif text-2xl font-bold sm:text-3xl">{currentLesson.theme}</h3><p className="mt-5 text-base leading-8 sm:text-lg">{activeSlide.text}</p><div className={`mt-6 rounded-2xl p-4 text-sm leading-6 ${soft}`}>{locale==="pt"?"Não precisa memorizar. Entenda a ideia e pense onde ela aparece no seu negócio.":locale==="fr"?"Pas besoin de mémoriser. Comprenez l’idée et observez où elle apparaît dans votre activité.":locale==="es"?"No necesitas memorizar. Entiende la idea y observa dónde aparece en tu negocio.":"You do not need to memorize this. Understand the idea and notice where it appears in your business."}</div></div>}

            {activeSlide?.kind==="story"&&<div className="mx-auto max-w-3xl"><p className="text-xs font-black uppercase tracking-[.15em] text-[#a67618]">{c.story}</p><h3 className="mt-2 font-serif text-3xl font-bold">{c.story}</h3><div className={`mt-6 rounded-3xl p-5 sm:p-6 ${soft}`}><p className="text-base leading-8 sm:text-lg">{activeSlide.text}</p></div></div>}

            {activeSlide?.kind==="example"&&<div className="mx-auto max-w-3xl"><p className="text-xs font-black uppercase tracking-[.15em] text-[#a67618]">{c.example}</p><h3 className="mt-2 font-serif text-3xl font-bold">{locale==="pt"?"Veja na prática":locale==="fr"?"Voyez en pratique":locale==="es"?"Míralo en la práctica":"See it in practice"}</h3><div className="mt-6 rounded-3xl border border-[#d7ad54]/60 p-5 sm:p-6"><p className="text-base leading-8 sm:text-lg">{activeSlide.text}</p></div></div>}

            {activeSlide?.kind==="field"&&<div className="mx-auto max-w-3xl"><div className="rounded-3xl bg-[#5b0824] p-6 text-white sm:p-8"><p className="text-xs font-black uppercase tracking-[.15em] text-[#f2cf78]">{c.field}</p><h3 className="mt-2 font-serif text-3xl font-bold">{locale==="pt"?"Agora leve para a realidade":locale==="fr"?"Passez maintenant à la réalité":locale==="es"?"Ahora llévalo a la realidad":"Now take it into reality"}</h3><p className="mt-5 text-base leading-8 text-[#f7eadd] sm:text-lg">{activeSlide.text}</p></div></div>}

            {activeSlide?.kind==="quiz"&&<div className="mx-auto max-w-3xl"><p className="text-xs font-black uppercase tracking-[.15em] text-[#a67618]">{activeSlide.label}</p><h3 className="mt-3 font-serif text-2xl font-bold sm:text-3xl">{activeSlide.question.prompt}</h3><div className="mt-6 grid gap-3">{activeSlide.question.options.map((opt:string,i:number)=>{const selected=currentState.quizAnswers[activeSlide.question.id];return <button key={opt} onClick={()=>updateDay(d=>({...d,quizAnswers:{...d.quizAnswers,[activeSlide.question.id]:i}}))} className={`min-h-14 rounded-2xl border p-4 text-left text-sm font-semibold transition sm:text-base ${selected===i?(i===activeSlide.question.correct?"border-emerald-500 bg-emerald-50 text-emerald-900":"border-rose-400 bg-rose-50 text-rose-900"):card}`}>{opt}</button>})}</div>{typeof currentState.quizAnswers[activeSlide.question.id]==="number"?<p className="mt-4 text-sm font-bold opacity-70">{currentState.quizAnswers[activeSlide.question.id]===activeSlide.question.correct?(locale==="pt"?"✓ Resposta correta":locale==="fr"?"✓ Bonne réponse":locale==="es"?"✓ Respuesta correcta":"✓ Correct answer"):(locale==="pt"?"Revise a ideia e tente compreender por quê.":locale==="fr"?"Revoyez l’idée et cherchez à comprendre pourquoi.":locale==="es"?"Revisa la idea e intenta comprender por qué.":"Review the idea and try to understand why.")}</p>:null}</div>}

            {activeSlide?.kind==="objective"&&<div className="mx-auto max-w-3xl"><p className="text-xs font-black uppercase tracking-[.15em] text-[#a67618]">{activeSlide.label}</p><h3 className="mt-3 font-serif text-2xl font-bold sm:text-3xl">{activeSlide.question.prompt}</h3>{activeSlide.question.options?.length?<div className="mt-6 grid gap-3">{activeSlide.question.options.map((opt:string)=><button key={opt} onClick={()=>updateDay(d=>({...d,objectiveAnswers:{...d.objectiveAnswers,[activeSlide.question.id]:opt}}))} className={`min-h-14 rounded-2xl border p-4 text-left text-sm font-semibold transition sm:text-base ${currentState.objectiveAnswers[activeSlide.question.id]===opt?"border-[#8a1739] bg-[#5b0824] text-white":card}`}>{opt}</button>)}</div>:<textarea value={currentState.objectiveAnswers[activeSlide.question.id]??""} onChange={e=>updateDay(d=>({...d,objectiveAnswers:{...d.objectiveAnswers,[activeSlide.question.id]:e.target.value}}))} className={`mt-6 min-h-32 w-full rounded-2xl border p-4 ${input}`}/>}<p className="mt-4 text-sm opacity-60">{objectiveDone}/7 {locale==="pt"?"respondidas":locale==="fr"?"répondues":locale==="es"?"respondidas":"answered"}</p></div>}

            {activeSlide?.kind==="written"&&<div className="mx-auto max-w-3xl"><p className="text-xs font-black uppercase tracking-[.15em] text-[#a67618]">{activeSlide.label}</p><h3 className="mt-3 font-serif text-2xl font-bold sm:text-3xl">{activeSlide.question.prompt}</h3><p className="mt-3 text-sm leading-6 opacity-65">{locale==="pt"?"Pesquise, teste e responda com base no seu negócio. A resposta precisa ter entre 500 e 1.000 caracteres.":locale==="fr"?"Recherchez, testez et répondez à partir de votre activité. La réponse doit contenir entre 500 et 1 000 caractères.":locale==="es"?"Investiga, prueba y responde desde tu negocio. La respuesta debe tener entre 500 y 1.000 caracteres.":"Research, test and answer from your business context. Your response must contain 500 to 1,000 characters."}</p><textarea maxLength={1000} value={currentState.writtenAnswers[activeSlide.question.id]??""} onChange={e=>updateDay(d=>({...d,writtenAnswers:{...d.writtenAnswers,[activeSlide.question.id]:e.target.value}}))} className={`mt-5 min-h-56 w-full rounded-2xl border p-4 leading-7 ${input}`} placeholder={locale==="pt"?"Escreva sua análise, evidências, teste ou decisão concreta…":locale==="fr"?"Écrivez votre analyse, preuves, test ou décision concrète…":locale==="es"?"Escribe tu análisis, evidencias, prueba o decisión concreta…":"Write your analysis, evidence, test or concrete decision…"}/><div className="mt-2 flex items-center justify-between text-xs font-bold"><span className={(currentState.writtenAnswers[activeSlide.question.id]?.length??0)>=500?"text-emerald-600":"opacity-60"}>{currentState.writtenAnswers[activeSlide.question.id]?.length??0}/1000</span><span className="opacity-60">{writtenDone}/3 {locale==="pt"?"válidas":locale==="fr"?"valides":locale==="es"?"válidas":"valid"}</span></div></div>}

            {activeSlide?.kind==="review"&&<div className="mx-auto max-w-3xl"><div className="text-center"><div className={`mx-auto grid h-16 w-16 place-items-center rounded-full ${currentComplete?"bg-emerald-100 text-emerald-700":"bg-[#fff0d0] text-[#9e7119]"}`}><CheckCircle2 className="h-8 w-8"/></div><p className="mt-4 text-xs font-black uppercase tracking-[.15em] text-[#a67618]">{activeSlide.label}</p><h3 className="mt-2 font-serif text-3xl font-bold">{activeSlide.title}</h3></div><div className="mt-7 grid gap-3 sm:grid-cols-3"><div className={`rounded-2xl p-4 text-center ${soft}`}><strong className="text-2xl">{quizDone}/3</strong><p className="mt-1 text-xs font-bold opacity-65">Quiz</p></div><div className={`rounded-2xl p-4 text-center ${soft}`}><strong className="text-2xl">{objectiveDone}/7</strong><p className="mt-1 text-xs font-bold opacity-65">{c.objective}</p></div><div className={`rounded-2xl p-4 text-center ${soft}`}><strong className="text-2xl">{writtenDone}/3</strong><p className="mt-1 text-xs font-bold opacity-65">{c.written}</p></div></div>{!currentComplete?<div className="mt-5 rounded-2xl border border-amber-300 bg-amber-50 p-4 text-sm leading-6 text-amber-900">{c.needAll}</div>:<div className="mt-5 rounded-2xl border border-emerald-300 bg-emerald-50 p-4 text-sm font-bold text-emerald-900">{locale==="pt"?"Tudo pronto. Você pode concluir esta aula.":locale==="fr"?"Tout est prêt. Vous pouvez terminer ce cours.":locale==="es"?"Todo está listo. Puedes completar esta clase.":"Everything is ready. You can complete this lesson."}</div>}<div className="mt-5 grid gap-3 sm:grid-cols-2"><button onClick={()=>persist(false)} disabled={save.isPending} className="min-h-12 rounded-2xl border border-[#8a1739] px-5 font-black text-[#8a1739] disabled:opacity-40">{c.saveDraft}</button><button onClick={()=>persist(true)} disabled={!currentComplete||save.isPending} className="min-h-12 rounded-2xl bg-[#5b0824] px-5 font-black text-white disabled:opacity-40">{c.finish}</button></div>{syncLabel?<p className="mt-3 text-center text-sm font-bold opacity-70">{syncLabel}</p>:null}</div>}
          </div>

          <div className={`border-t border-[#d7ad54]/35 p-4 sm:px-6 ${dark?"bg-[#1b1116]":"bg-[#fff8eb]"}`}>
            <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-3">
              <button disabled={safeLessonStep===0} onClick={()=>moveLessonStep(-1)} className="inline-flex min-h-12 items-center justify-center gap-2 rounded-2xl border border-[#d7ad54] px-4 font-bold disabled:opacity-30"><ChevronLeft className="h-4 w-4"/>{locale==="pt"?"Anterior":locale==="fr"?"Précédent":locale==="es"?"Anterior":"Previous"}</button>
              <span className="hidden text-xs font-black uppercase tracking-[.12em] opacity-50 sm:block">{lessonStepProgress}%</span>
              {safeLessonStep<lessonSlides.length-1?<button onClick={()=>moveLessonStep(1)} className="inline-flex min-h-12 items-center justify-center gap-2 rounded-2xl bg-[#5b0824] px-4 font-black text-white">{locale==="pt"?"Próximo":locale==="fr"?"Suivant":locale==="es"?"Siguiente":"Next"}<ChevronRight className="h-4 w-4"/></button>:<button onClick={()=>setLessonStep(0)} className="inline-flex min-h-12 items-center justify-center gap-2 rounded-2xl border border-[#d7ad54] px-4 font-bold">{c.review}<ChevronLeft className="h-4 w-4"/></button>}
            </div>
          </div>
        </section>

        <details className={`rounded-3xl border ${card}`}>
          <summary className="cursor-pointer list-none p-4 font-bold"><div className="flex items-center justify-between gap-3"><span>{locale==="pt"?"Ver aulas liberadas":locale==="fr"?"Voir les cours débloqués":locale==="es"?"Ver clases desbloqueadas":"View unlocked lessons"}</span><span className="text-xs opacity-55">{selectedDay}/{unlockedDay}</span></div></summary>
          <div className="border-t border-[#d7ad54]/30 p-4"><div className="grid grid-cols-6 gap-2 sm:grid-cols-10">{curriculum.map(l=>{const enabled=l.day<=unlockedDay;const done=isDayComplete(activities[String(l.day)]);return <button key={l.day} disabled={!enabled} onClick={()=>goDay(l.day)} title={`${c.day} ${l.day} · ${l.title}`} className={`grid aspect-square min-h-9 place-items-center rounded-xl border text-xs font-black ${selectedDay===l.day?"border-[#5b0824] bg-[#5b0824] text-white":done?"border-emerald-400 bg-emerald-50 text-emerald-700":enabled?card:"opacity-30"}`}>{done?<CheckCircle2 className="h-4 w-4"/>:enabled?l.day:<LockKeyhole className="h-3 w-3"/>}</button>})}</div></div>
        </details>
      </>}
'''
          s=s[:i]+block+s[j:]
          p.write_text(s)
          PY
      - name: Build
        working-directory: apps/painel-ldr
        run: npm ci && npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.do-mamao-ao-negocio.tsx
          git commit -m "feat: transformar 90 aulas em jornada dinâmica por etapas"
          git push origin main
