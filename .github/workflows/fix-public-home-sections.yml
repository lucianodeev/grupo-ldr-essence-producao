name: Fix public homepage sections

on:
  push:
    branches:
      - fix/public-home-sections-20260825

permissions:
  contents: write

jobs:
  fix-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-home-sections-20260825
          fetch-depth: 0

      - name: Move editorial blocks to public homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/luciano-empreendedor/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- ldr-public-v3-20260825 -->'
          anchor = '<!-- ===== PRÓXIMOS LANÇAMENTOS ===== -->'

          anchor_pos = text.find(anchor)
          if anchor_pos < 0:
              raise SystemExit('Public launches anchor not found; refusing to modify file.')

          canonical = None
          removed = 0
          search_from = 0
          while True:
              start = text.find(marker, search_from)
              if start < 0:
                  break
              first_section = text.find('<section', start)
              first_end = text.find('</section>', first_section)
              second_section = text.find('<section', first_end + len('</section>'))
              second_end = text.find('</section>', second_section)
              if min(first_section, first_end, second_section, second_end) < 0:
                  raise SystemExit('Could not safely delimit sample/book block; refusing to modify file.')
              end = second_end + len('</section>')
              block = text[start:end].strip()
              if canonical is None:
                  canonical = block
              text = text[:start] + text[end:]
              removed += 1
              search_from = start

          if canonical is None:
              raise SystemExit('Editorial block marker not found; refusing to modify file.')

          anchor_pos = text.find(anchor)
          if anchor_pos < 0:
              raise SystemExit('Launches anchor disappeared unexpectedly; refusing to modify file.')

          text = text[:anchor_pos] + canonical + '\n\n' + text[anchor_pos:]
          path.write_text(text, encoding='utf-8')
          print(f'Moved one canonical public block; removed {removed} misplaced copy/copies.')
          PY

      - name: Validate exact public placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t = Path('apps/luciano-empreendedor/index.html').read_text(encoding='utf-8')
          marker = '<!-- ldr-public-v3-20260825 -->'
          anchor = '<!-- ===== PRÓXIMOS LANÇAMENTOS ===== -->'
          count = t.count(marker)
          print('editorial_marker_count=', count)
          print('marker_position=', t.find(marker), 'launches_position=', t.find(anchor))
          if count != 1:
              raise SystemExit(f'Expected exactly one canonical editorial block, found {count}.')
          if not (0 <= t.find(marker) < t.find(anchor)):
              raise SystemExit('Canonical editorial block is not immediately in the public document before launches.')
          for token in ['id="library"', 'https://buy.stripe.com/', 'supabase', 'ldr-floating-btn-whatsapp', 'ldr-floating-btn-client']:
              present = token.lower() in t.lower()
              print(f'preservation_check {token}: {present}')
          print('Core placement validation passed.')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- apps/luciano-empreendedor/index.html; then
            echo "No code change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/luciano-empreendedor/index.html
          git commit -m "fix: place sample and book sections on public homepage"
          git push origin HEAD:fix/public-home-sections-20260825
