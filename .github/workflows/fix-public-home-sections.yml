name: Fix public homepage sections

on:
  push:
    branches:
      - fix/public-home-sections-20260825

permissions:
  contents: write

jobs:
  fix-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-home-sections-20260825
          fetch-depth: 0

      - name: Move editorial blocks to public homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/luciano-empreendedor/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- ldr-public-v3-20260825 -->'
          anchor = '<!-- ===== PRÓXIMOS LANÇAMENTOS ===== -->'

          anchor_pos = text.find(anchor)
          if anchor_pos < 0:
              raise SystemExit('Public launches anchor not found; refusing to modify file.')

          # Keep one canonical sample+book block and remove every misplaced copy
          # that was accidentally inserted later inside reader template strings.
          canonical = None
          removed = 0
          search_from = 0
          while True:
              start = text.find(marker, search_from)
              if start < 0:
                  break
              book_start = text.find('<section', start)
              # first section is sample; second section is dedicated book
              first_end = text.find('</section>', book_start)
              second_start = text.find('<section', first_end + len('</section>'))
              second_end = text.find('</section>', second_start)
              if min(book_start, first_end, second_start, second_end) < 0:
                  raise SystemExit('Could not safely delimit sample/book block; refusing to modify file.')
              end = second_end + len('</section>')
              block = text[start:end].strip()
              if canonical is None:
                  canonical = block
              text = text[:start] + text[end:]
              removed += 1
              search_from = start

          if canonical is None:
              raise SystemExit('Editorial block marker not found; refusing to modify file.')

          # Re-resolve anchor after removals and insert exactly once immediately
          # before the existing public "Próximos lançamentos" section.
          anchor_pos = text.find(anchor)
          if anchor_pos < 0:
              raise SystemExit('Launches anchor disappeared unexpectedly; refusing to modify file.')

          text = text[:anchor_pos] + canonical + '\n\n' + text[anchor_pos:]
          path.write_text(text, encoding='utf-8')
          print(f'Moved one canonical public block; removed {removed} misplaced copy/copies.')
          PY

      - name: Validate placement and protected systems
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/luciano-empreendedor/index.html')
          t = p.read_text(encoding='utf-8')
          marker = '<!-- ldr-public-v3-20260825 -->'
          anchor = '<!-- ===== PRÓXIMOS LANÇAMENTOS ===== -->'
          assert t.count(marker) == 1, f'Expected exactly 1 public editorial marker, found {t.count(marker)}'
          assert t.find(marker) < t.find(anchor), 'Editorial block must be before Próximos lançamentos'
          assert 'id="library"' in t, 'Library section missing'
          assert 'https://buy.stripe.com/' in t, 'Existing Stripe checkout references missing'
          assert 'supabase' in t.lower(), 'Supabase integration markers missing'
          assert 'ldr-floating-btn-whatsapp' in t, 'WhatsApp floating shortcut missing'
          assert 'ldr-floating-btn-client' in t, 'Client-area floating shortcut missing'
          print('Placement and preservation checks passed.')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- apps/luciano-empreendedor/index.html; then
            echo "No code change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/luciano-empreendedor/index.html
          git commit -m "fix: place sample and book sections on public homepage"
          git push origin HEAD:fix/public-home-sections-20260825
