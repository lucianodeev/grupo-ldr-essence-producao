name: one-time-run-eight-ebooks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-run-eight-ebooks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Load scoped patch from isolated branch
        run: |
          git fetch origin codex/add-eight-ebooks-20260914
          git show origin/codex/add-eight-ebooks-20260914:scripts/apply-eight-contemporary-ebooks.py > scripts/apply-eight-contemporary-ebooks.py
          git show origin/codex/add-eight-ebooks-20260914:scripts/apply-eight-contemporary-ebooks-wrapper.py > scripts/apply-eight-contemporary-ebooks-wrapper.py
      - name: Apply only the eight new ebooks
        run: python scripts/apply-eight-contemporary-ebooks-wrapper.py
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build Academy
        run: npm run build:painel
      - name: Commit only after successful build
        run: |
          rm -f scripts/apply-eight-contemporary-ebooks.py scripts/apply-eight-contemporary-ebooks-wrapper.py
          git rm .github/workflows/one-time-run-eight-ebooks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr
          git commit -m "feat: add eight new contemporary Academy ebooks"
          git push origin HEAD:main
