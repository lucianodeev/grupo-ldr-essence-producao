name: Padroniza ebook e destaques de serviços

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/padroniza-ebook-psicanalise-20260831.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alterações
        run: python .github/scripts/padroniza_ebook_psicanalise.py
      - name: Validar build
        working-directory: apps/painel-ldr
        run: npm install --no-audit --no-fund && npm run build
      - name: Publicar alterações no repositório
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name ldr-rh-campanhas
          git config user.email llucianouam@gmail.com
          git add apps/painel-ldr/src
          git commit -m "feat(panel): padroniza ebook e prioriza psicanalise e bem-estar"
          git push origin main
