name: Validar build do Painel LDR

on:
  push:
    branches: [main]
    paths:
      - 'apps/painel-ldr/**'
      - '.github/workflows/validate-painel-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:painel
