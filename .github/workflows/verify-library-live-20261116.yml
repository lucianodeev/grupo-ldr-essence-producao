name: Verify published library HTTP (read-only)
on:
  push:
    branches: [verify/library-live-20261116]
    paths: ['.github/workflows/verify-library-live-20261116.yml']
permissions:
  contents: read
jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify HTTPS and anonymous responses without login or writes
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          origin = "https://ldrecossistema.online"
          paths = ["/", "/cliente/biblioteca", "/cliente/cursos/assinatura/atendimento-ao-cliente-com-humanizacao-e-resultado"]
          markers = ["Núcleo fictício Horizonte", "Central fictícia Lume", "Serviço fictício Vértice"]
          results = []
          for path in paths:
              request = Request(origin + path, headers={"User-Agent": "LDR-release-readonly-check/1.0", "Cache-Control": "no-cache"})
              try:
                  response = urlopen(request, timeout=30)
              except HTTPError as error:
                  if path == "/" or error.code not in (401, 403):
                      raise
                  response = error
              with response:
                  status = response.code
                  final = urlsplit(response.geturl())
                  body = response.read(2000000).decode("utf-8", errors="replace")
                  assert final.scheme == "https", "HTTPS downgrade"
                  assert final.hostname in ("ldrecossistema.online", "www.ldrecossistema.online"), "Unexpected redirect host"
                  assert status == 200 if path == "/" else status in (200, 401, 403), "Unexpected HTTP status"
                  if path != "/":
                      assert not any(marker in body for marker in markers), "Teaching content exposed anonymously"
                  results.append({"path": path, "status": status, "finalPath": final.path, "contentType": response.headers.get("Content-Type"), "bytesRead": len(body.encode("utf-8")), "teachingMarkersExposed": False if path != "/" else None})
          print(json.dumps({"pass": True, "scope": "Public HTTPS and anonymous document responses only; no signed-in student, purchase or payment", "deployedCommit": "ed8aeab3acb67811703d3b124347522a512339ff", "results": results}, ensure_ascii=False))
          PY
