name: Sales mini-library showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-sales-mini-library-showcase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped Academy update
        run: python scripts/apply-premium-storefront-pricing-20260914.py

      - name: Validate diff
        run: git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Academy
        run: npm run build:painel

      - name: Commit after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/lib/psychoanalysis-ebooks.catalog.ts \
                  apps/painel-ldr/src/lib/client-portal.server.ts \
                  apps/painel-ldr/src/lib/fixed-brl-ebook-checkout.server.ts \
                  apps/painel-ldr/src/components/academy-accessibility-controls.tsx \
                  apps/painel-ldr/src/components/academy-university-home.tsx
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "feat(academy): premium storefront and normalized ebook pricing"
          git push

# trigger 2026-09-14 premium storefront
