name: Sales mini-library showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-sales-mini-library-showcase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply eBooks filter only
        run: python scripts/add-home-ebooks-filter-20260914.py

      - name: Validate scoped diff
        run: |
          git diff --check
          git diff -- apps/painel-ldr/src/components/academy-university-home.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Academy
        run: npm run build:painel

      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/academy-university-home.tsx
          git rm scripts/add-home-ebooks-filter-20260914.py
          git commit -m "feat(academy): add eBooks filter to main storefront"
          git push origin HEAD:main

# trigger ebooks-filter-20260914
