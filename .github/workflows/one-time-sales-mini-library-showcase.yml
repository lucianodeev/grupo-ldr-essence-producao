name: Sales mini-library showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-sales-mini-library-showcase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Psicanálise vs. Psiquiatria ebook integration
        run: python scripts/add-psicanalise-vs-psiquiatria-ebook-20260914.py

      - name: Validate scoped diff
        run: |
          git diff --check
          git diff --stat

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Academy
        run: npm run build:painel

      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/lib/psychoanalysis-ebooks.catalog.ts \
                  apps/painel-ldr/src/lib/digital-content.server.ts \
                  apps/painel-ldr/src/lib/digital-content.functions.ts \
                  'apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.$productKey.tsx' \
                  apps/painel-ldr/src/lib/client-portal.server.ts \
                  apps/painel-ldr/src/lib/client-portal.functions.ts \
                  apps/painel-ldr/src/components/digital-reader-v2.tsx \
                  apps/painel-ldr/src/lib/fixed-brl-ebook-checkout.server.ts \
                  apps/painel-ldr/supabase/migrations/20260914130500_add_psicanalise_vs_psiquiatria_ebook.sql
          git rm scripts/add-psicanalise-vs-psiquiatria-ebook-20260914.py
          git commit -m "feat(academy): add Psicanálise vs. Psiquiatria ebook"
          git push origin HEAD:main

# trigger psicanalise-vs-psiquiatria-20260914
