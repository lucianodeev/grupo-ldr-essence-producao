name: Fix psychoanalysis library integration
on:
  push:
    paths:
      - 'tools/fix_psychoanalysis_library_integration.py'
      - '.github/workflows/fix-psychoanalysis-library-integration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply library integration
        run: python tools/fix_psychoanalysis_library_integration.py
      - name: Commit integration
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete psychoanalysis library commerce and access"
          git push origin main
