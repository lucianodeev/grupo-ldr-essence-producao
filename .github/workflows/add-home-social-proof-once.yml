name: Add home social proof once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-home-social-proof-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert social proof on public home only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/index.tsx')
          s=p.read_text(encoding='utf-8')
          imp='import { SocialProofSection } from "@/components/social-proof-section";\n'
          anchor='import { hospitalImage } from "@/lib/story-hospital";\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor not found')
              s=s.replace(anchor, anchor+imp, 1)
          marker='        <section id="formacao"'
          if '<SocialProofSection locale={locale}/>' not in s:
              if marker not in s: raise SystemExit('formation marker not found')
              s=s.replace(marker, '        <SocialProofSection locale={locale}/>\n\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/index.tsx
          git diff --cached --quiet || git commit -m "feat: add real client social proof before training offer"
          git push
