name: Apply HIV Academy course 2026-09-15
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_hiv_academy_20260915.py'
      - '.github/workflows/apply-hiv-academy-20260915.yml'
permissions:
  contents: write
jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply additive HIV integration
        run: python tools/patch_hiv_academy_20260915.py
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm install --no-audit --no-fund
      - name: Build Academy
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Commit only after successful build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/painel-ldr/src/lib/academy-subscription-courses.catalog.ts \
            apps/painel-ldr/src/lib/hiv-science-formation.catalog.ts \
            apps/painel-ldr/src/lib/academy-professional-formations.catalog.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(academy): add HIV science course to both Academy fronts'
            git push origin main
          fi
