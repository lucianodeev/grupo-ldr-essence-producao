name: Academic Social V3 Editorial Build 2026-09-14
on:
  push:
    branches: [feature/rede-academica-social-v3-editorial-20260914]
    paths:
      - 'apps/painel-ldr/**'
      - 'tools/patch_academic_social_v3_editorial_20260914.py'
      - '.github/workflows/academic-social-v3-editorial-build-20260914.yml'
  workflow_dispatch:
concurrency:
  group: academic-social-v3-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply Social V3 targeted patch
        run: python tools/patch_academic_social_v3_editorial_20260914.py
      - name: Confirm patch is idempotent before build
        run: |
          python tools/patch_academic_social_v3_editorial_20260914.py
          git diff --exit-code -- apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/routes/_authenticated/admin.rede-academica.tsx apps/painel-ldr/src/components/academy-chatbot.tsx
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Build Academy
        working-directory: apps/painel-ldr
        run: npm run build
