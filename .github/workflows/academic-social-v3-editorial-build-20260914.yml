name: Academic Social V3 Editorial Build 2026-09-14
on:
  push:
    branches: [feature/rede-academica-social-v3-editorial-20260914]
    paths:
      - 'apps/painel-ldr/**'
      - 'tools/patch_academic_social_v3_editorial_20260914.py'
      - 'tools/patch_academic_social_v3_polish_20260914.py'
      - '.github/workflows/academic-social-v3-editorial-build-20260914.yml'
  workflow_dispatch:
concurrency:
  group: academic-social-v3-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply Social V3 targeted patches
        run: |
          python tools/patch_academic_social_v3_editorial_20260914.py
          python tools/patch_academic_social_v3_polish_20260914.py
      - name: Confirm patches are idempotent before build
        run: |
          python tools/patch_academic_social_v3_editorial_20260914.py
          python tools/patch_academic_social_v3_polish_20260914.py
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Build Academy
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Persist validated targeted integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.criar.tsx apps/painel-ldr/src/routes/_authenticated/admin.rede-academica.tsx apps/painel-ldr/src/components/academy-chatbot.tsx apps/painel-ldr/src/components/academic-social-v3-feed.tsx
          if ! git diff --cached --quiet; then
            git commit -m "feat(academy): persist Social V3 discovery and composer polish"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Confirm targeted integration is stable
        run: |
          python tools/patch_academic_social_v3_editorial_20260914.py
          python tools/patch_academic_social_v3_polish_20260914.py
          git diff --exit-code -- apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.criar.tsx apps/painel-ldr/src/routes/_authenticated/admin.rede-academica.tsx apps/painel-ldr/src/components/academy-chatbot.tsx apps/painel-ldr/src/components/academic-social-v3-feed.tsx
