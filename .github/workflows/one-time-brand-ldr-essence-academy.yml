name: One-time LDR Essence Academy brand migration
on:
  push:
    branches:
      - feat/ldr-essence-academy-personal-library
    paths:
      - '.github/workflows/one-time-brand-ldr-essence-academy.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/ldr-essence-academy-personal-library
      - name: Update visible Academy brand strings only
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('apps/painel-ldr/src')
          skip={'routeTree.gen.ts'}
          changed=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix not in {'.ts','.tsx'} or p.name in skip:
              continue
            s=p.read_text(encoding='utf-8')
            before=s
            s=s.replace('LDR ACADEMY','LDR ESSENCE ACADEMY')
            s=s.replace('LDR Academy','LDR Essence Academy')
            if s!=before:
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print(f'Updated {len(changed)} source files')
          for p in changed:
            print(p)
          PY
      - name: Commit brand updates to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: rename visible brand to LDR Essence Academy'
          git pull --rebase origin feat/ldr-essence-academy-personal-library
          git push origin HEAD:feat/ldr-essence-academy-personal-library
