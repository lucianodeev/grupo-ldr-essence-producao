name: Apply Professional 360 UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-professional-360-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 360 integration
        run: |
          python - <<'PY'
          from pathlib import Path

          # S8: preserve internal mode; network 360 mode is strictly scoped to its own professional account.
          p=Path('apps/painel-ldr/src/components/s8/panel.tsx')
          s=p.read_text(encoding='utf-8')
          old='export function S8Panel({ participantId }: { participantId?: string | null } = {}) {'
          new='export function S8Panel({ participantId, professionalAccountId }: { participantId?: string | null; professionalAccountId?: string | null } = {}) {'
          if old in s: s=s.replace(old,new)
          old='''      const { data, error } = await supabase\n        .from("participants")\n        .select("*")\n        .order("full_name", { ascending: true });'''
          new='''      let query = supabase.from("participants").select("*").order("full_name", { ascending: true });\n      if (professionalAccountId) query = query.eq("professional_account_id", professionalAccountId);\n      const { data, error } = await query;'''
          if old in s: s=s.replace(old,new)
          s=s.replace('.insert({ full_name: name, created_by: auth.user?.id ?? null })','.insert({ full_name: name, created_by: auth.user?.id ?? null, professional_account_id: professionalAccountId ?? null })')
          p.write_text(s,encoding='utf-8')

          # Public profiles: never expose a catalog service before service-level approval.
          p=Path('apps/painel-ldr/src/lib/professional-network.server.ts')
          s=p.read_text(encoding='utf-8')
          needle='.eq("professional_profile_id", profile.id).eq("active", true).order("sort_order")'
          s=s.replace(needle,'.eq("professional_profile_id", profile.id).eq("active", true).eq("approval_status", "approved").order("sort_order")',1)
          needle2='.eq("id", input.serviceId).eq("professional_profile_id", profile.id).eq("active", true).eq("booking_enabled", true).maybeSingle()'
          s=s.replace(needle2,'.eq("id", input.serviceId).eq("professional_profile_id", profile.id).eq("active", true).eq("approval_status", "approved").eq("booking_enabled", true).maybeSingle()')
          p.write_text(s,encoding='utf-8')

          # Marketplace professional dashboard: catalog and plan tools.
          p=Path('apps/painel-ldr/src/routes/profissional-painel.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('["/profissional-servicos","Meus Serviços",BriefcaseBusiness]','["/profissional-servicos","Meus Serviços",BriefcaseBusiness],["/profissional-catalogo-ldr","Serviços LDR que eu atendo",BriefcaseBusiness],["/profissional-ferramentas","Ferramentas do meu plano",GraduationCap]')
          s=s.replace('p.plan_code==="pro"?"border-primary":""','p.plan_code==="360"?"border-primary shadow-lg":""')
          marker='<button disabled={busy||!profileForm.displayName||!profileForm.professionalTitle||!profileForm.categoryId} onClick={submitProfile} className="mt-5 rounded-xl bg-primary px-5 py-3 font-black text-primary-foreground disabled:opacity-50">SALVAR E ENVIAR PARA ANÁLISE</button>'
          addition=marker+'<Link to="/profissional-catalogo-ldr" className="ml-0 mt-3 inline-block rounded-xl border border-primary px-5 py-3 font-black text-primary sm:ml-3">ESCOLHER SERVIÇOS LDR QUE EU ATENDO</Link>'
          if marker in s: s=s.replace(marker,addition)
          dash='</div></section>\n <section id="perfil"'
          tools='</div><div className="mt-3 rounded-2xl border bg-card p-4"><p className="text-xs font-black uppercase tracking-wide text-primary">FERRAMENTAS DO MEU PLANO</p><p className="mt-2 text-sm text-muted-foreground">{subscription?.subscription_plans?.plan_code==="360"?"Mentoria LDR e Sistema S8 estão incluídos no seu plano.":"Seu plano atual continua ativo. Mentoria LDR e Sistema S8 ficam disponíveis no Profissional 360 LDR."}</p><Link to="/profissional-ferramentas" className="mt-3 inline-block text-sm font-black text-primary underline">ABRIR FERRAMENTAS</Link></div></section>\n <section id="perfil"'
          if dash in s: s=s.replace(dash,tools,1)
          p.write_text(s,encoding='utf-8')

          # Meus Serviços: make the official catalog path obvious without removing custom-service support.
          p=Path('apps/painel-ldr/src/routes/profissional-servicos.tsx')
          s=p.read_text(encoding='utf-8')
          needle='<p className="mt-2 text-sm leading-6 text-muted-foreground">Cadastre serviços com preço, duração e modalidade. Valores são validados no servidor e o checkout só é ativado quando o perfil está aprovado e público.</p>'
          repl=needle+'<Link to="/profissional-catalogo-ldr" className="mt-4 inline-block rounded-xl bg-primary px-4 py-3 text-sm font-black text-primary-foreground">ESCOLHER SERVIÇOS JÁ EXISTENTES NO SITE</Link>'
          if needle in s: s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          # Sales page: third plan is the premium highlight; Pro remains a normal middle tier.
          p=Path('apps/painel-ldr/src/routes/para-profissionais.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('p.plan_code==="pro"?"border-primary shadow-lg":""','p.plan_code==="360"?"border-primary shadow-lg":""')
          s=s.replace('{p.plan_code==="pro"?<span className="rounded-full bg-primary px-3 py-1 text-xs font-black text-primary-foreground">MAIS RECURSOS</span>:null}','{p.plan_code==="360"?<span className="rounded-full bg-primary px-3 py-1 text-xs font-black text-primary-foreground">MAIS COMPLETO</span>:p.plan_code==="pro"?<span className="rounded-full border px-3 py-1 text-xs font-black text-primary">MAIS RECURSOS</span>:null}')
          p.write_text(s,encoding='utf-8')

          # Internal admin menu: direct access to service review queue.
          p=Path('apps/painel-ldr/src/routes/_authenticated/painel-profissional.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('{ to: "/painel-profissional/rede-profissionais", extra: "network" },','{ to: "/painel-profissional/rede-profissionais", extra: "network" },\n  { to: "/painel-profissional/rede-servicos", extra: "networkServices", superOnly: true },')
          s=s.replace('networkFinance: "Rede · Financeiro"','networkServices: "Rede · Serviços", networkFinance: "Rede · Financeiro"')
          s=s.replace('networkFinance: "Network · Finance"','networkServices: "Network · Services", networkFinance: "Network · Finance"')
          s=s.replace('networkFinance: "Réseau · Finance"','networkServices: "Réseau · Services", networkFinance: "Réseau · Finance"')
          s=s.replace('networkFinance: "Red · Finanzas"','networkServices: "Red · Servicios", networkFinance: "Red · Finanzas"')
          p.write_text(s,encoding='utf-8')

          checks=[
            ('apps/painel-ldr/src/components/s8/panel.tsx','professionalAccountId'),
            ('apps/painel-ldr/src/lib/professional-network.server.ts','approval_status'),
            ('apps/painel-ldr/src/routes/profissional-painel.tsx','/profissional-catalogo-ldr'),
            ('apps/painel-ldr/src/routes/profissional-painel.tsx','/profissional-ferramentas'),
            ('apps/painel-ldr/src/routes/para-profissionais.tsx','MAIS COMPLETO'),
            ('apps/painel-ldr/src/routes/_authenticated/painel-profissional.tsx','networkServices'),
          ]
          for path,text in checks:
            if text not in Path(path).read_text(encoding='utf-8'):
              raise SystemExit(f'Missing update {path}: {text}')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate build
        working-directory: apps/painel-ldr
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit safely
        run: |
          git restore apps/painel-ldr/package-lock.json 2>/dev/null || true
          if git diff --quiet; then exit 0; fi
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src
          git commit -m 'feat(network): integra plano 360, catalogo LDR e S8'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
