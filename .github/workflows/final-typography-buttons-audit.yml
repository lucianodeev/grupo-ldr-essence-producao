@media(max-width:760px){body{font-size:16px!important;line-height:1.6!important}.hero .subtitle,#palestraView .hero .subtitle,.section-subtitle,#palestraView .section-subtitle{font-size:1rem!important;line-height:1.6!important}.card-premium p,.product-card p,.card p,.info-item p{font-size:.96rem!important;line-height:1.58!important}.btn,a.btn,#palestraView .btn,.ldr-btn,.btn-form,.btn-whatsapp,.card-premium .btn,.ldr-v3-actions a{min-height:48px!important;padding:12px 18px!important;font-size:.95rem!important}.actions>.btn,.hero .actions>.btn{width:100%!important}}
@media(max-width:480px){body{font-size:16px!important;line-height:1.6!important}.hero h1,#palestraView .hero h1,#palestraView h1{font-size:clamp(1.7rem,7.2vw,2.05rem)!important;line-height:1.1!important}.section-title,#palestraView .section-title{font-size:clamp(1.45rem,6.2vw,1.85rem)!important;line-height:1.16!important}.hero .subtitle,#palestraView .hero .subtitle,.section-subtitle,#palestraView .section-subtitle{font-size:1rem!important}.card h2,.card h3,.product-card h2,.product-card h3,.card-premium h3,.ldr-training-fallback h3{font-size:1.18rem!important;line-height:1.22!important}.card-premium p,.product-card p,.card p,.info-item p{font-size:.95rem!important;line-height:1.58!important}}
