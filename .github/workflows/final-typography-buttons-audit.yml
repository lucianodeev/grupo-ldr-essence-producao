          bad=[]
          for href in p.hrefs:
              if href.startswith('#') and len(href)>1 and href[1:] not in ids and href[1:] not in routes: bad.append(href)
          print('pages onclick:',len(p.onclick),'links:',len(p.hrefs),'missing handlers:',missing,'bad fragments:',sorted(set(bad)))
          if missing or bad: sys.exit('Pages audit failed')
          PY

          grep -q 'typography-fix.css?v=20260905-ui1' index.html
          grep -q 'responsive-v3.css?v=20260905-ui1' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
