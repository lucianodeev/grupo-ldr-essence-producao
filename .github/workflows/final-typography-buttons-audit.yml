          for p,marker,block in [(typo,'LDR UI typography polish v5',typo_block),(resp,'LDR UI buttons & mobile readability v8',resp_block)]:
              s=p.read_text(encoding='utf-8')
              if marker not in s: p.write_text(s.rstrip()+block+'\n',encoding='utf-8')
          s=index.read_text(encoding='utf-8')
          s=re.sub(r'/typography-fix\.css\?v=[^"\']+', '/typography-fix.css?v=20260905-ui1', s)
          s=re.sub(r'/responsive-v3\.css\?v=[^"\']+', '/responsive-v3.css?v=20260905-ui1', s)
          index.write_text(s,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,sys
          s=Path('index.html').read_text(encoding='utf-8')
          ids=set(re.findall(r'\bid=["\']([^"\']+)',s))
          routes={'palestra','sobre','detalhes','lancamentos','inscricao','plataforma','jornada','experiencia','comprar','biblioteca','admin'}
