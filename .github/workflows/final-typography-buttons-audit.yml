          p=P(); p.feed(s)
          missing=[]
          for expr in p.onclick:
              for name in re.findall(r'\b([A-Za-z_$][\w$]*)\s*\(',expr):
                  if name in {'if','for','while','alert','confirm','setTimeout','setInterval'}: continue
                  pats=[rf'function\s+{re.escape(name)}\s*\(',rf'\b{name}\s*=\s*(?:async\s*)?\(?[^=]*=>',rf'window\.{re.escape(name)}\s*=']
