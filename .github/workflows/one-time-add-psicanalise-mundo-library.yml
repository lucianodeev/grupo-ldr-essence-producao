name: Add Revista Psicanalise no Mundo to Library

on:
  push:
    paths:
      - '.github/workflows/one-time-add-psicanalise-mundo-library.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch library storefront
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/components/library-storefront.tsx')
          s=p.read_text()
          marker='const ITEMS:Item[]=[\n'
          item='  {title:"Revista Psicanálise no Mundo",subtitle:"Psicanálise contemporânea, clínica, teoria, cultura e sociedade.",href:"/cliente/biblioteca/publicacoes/revista-psicanalise-no-mundo",icon:"🧠",price:"R$ 3,90 · € 3,90 / semana",tag:"revista psicanálise psicanalise mundo clínica teoria cultura sociedade",group:"banca",color:"#6b2145",badge:"NOVO · DESTAQUE"},\n'
          if 'Revista Psicanálise no Mundo' not in s:
              if marker not in s:
                  raise SystemExit('ITEMS marker not found')
              s=s.replace(marker, marker+item, 1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-add-psicanalise-mundo-library.yml
          git add apps/painel-ldr/src/components/library-storefront.tsx
          git commit -m "feat(library): destaca Revista Psicanálise no Mundo na biblioteca"
          git push origin main
