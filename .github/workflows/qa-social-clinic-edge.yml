name: QA Social Clinic Edge

on:
  push:
    branches:
      - fix/social-clinic-edge-fallback
    paths:
      - '.github/workflows/qa-social-clinic-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Patient submission
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/patient.json -w '%{http_code}' \
            -X POST 'https://sfrcsrzuoqdscflfuwik.supabase.co/functions/v1/social-clinic-submit' \
            -H 'content-type: application/json' \
            -H 'apikey: sb_publishable_nN4RVHqSvj84P-GtTJfKgw_QNUGa6Sb' \
            --data '{"kind":"patient","fullName":"QA Social Patient","email":"qa.social.patient.20260925@example.invalid","phone":"+32000000000","country":"BE","city":"QA","language":"pt","modality":"online","availability":"QA only","previousAnalysis":false,"reason":"Automated QA - delete after validation","acceptsSocialValue":true,"contactConsent":true,"privacyConsent":true,"website":""}')"
          cat /tmp/patient.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/patient.json
          grep -q '"protocol":"CSLDR-' /tmp/patient.json

      - name: Professional submission
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pro.json -w '%{http_code}' \
            -X POST 'https://sfrcsrzuoqdscflfuwik.supabase.co/functions/v1/social-clinic-submit' \
            -H 'content-type: application/json' \
            -H 'apikey: sb_publishable_nN4RVHqSvj84P-GtTJfKgw_QNUGa6Sb' \
            --data '{"kind":"professional","fullName":"QA Social Professional","email":"qa.social.pro.20260925@example.invalid","phone":"+32000000001","country":"BE","city":"QA","languages":"pt","education":"QA qualification only","experience":"Automated QA - delete after validation","modalities":"online","availability":"QA only","maxPatients":1,"acceptsCommission":true,"privacyConsent":true,"website":""}')"
          cat /tmp/pro.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/pro.json
          grep -q '"protocol":"CSPRO-' /tmp/pro.json
