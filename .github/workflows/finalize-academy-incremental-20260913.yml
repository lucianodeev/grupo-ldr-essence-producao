name: Finalize LDR Academy incremental 20260913
# one-shot audited finalizer
on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_academy_incremental_20260913.py'
      - '.github/workflows/finalize-academy-incremental-20260913.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply incremental audited patch
        run: python3 tools/finalize_academy_incremental_20260913.py
      - name: Install dependencies
        run: npm ci
      - name: Build painel-ldr
        run: npm run build:painel
      - name: Commit audited changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr
          if git diff --cached --quiet; then
            echo 'No app changes to commit.'
          else
            git commit -m 'fix: finalize LDR Academy paid-course rules and lesson specificity'
            git push origin main
          fi
