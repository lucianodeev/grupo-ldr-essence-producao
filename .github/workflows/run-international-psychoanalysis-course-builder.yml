name: Run international psychoanalysis course builder
on:
  push:
    paths:
      - 'tools/create_international_psychoanalysis_course.py'
      - '.github/workflows/run-international-psychoanalysis-course-builder.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/create_international_psychoanalysis_course.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/create_international_psychoanalysis_course.py
          git rm .github/workflows/run-international-psychoanalysis-course-builder.yml
          git rm -f .github/workflows/create-international-psychoanalysis-course.yml || true
          git add -A
          git commit -m "feat: add premium international psychoanalysis course"
          git pull --rebase origin main
          git push origin main
