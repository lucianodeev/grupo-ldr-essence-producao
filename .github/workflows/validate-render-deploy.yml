name: Validate Render deploy

on:
  push:
    branches:
      - deploy/render-preview
    paths:
      - 'apps/painel-ldr/**'
      - '.github/workflows/validate-render-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Render server
        working-directory: apps/painel-ldr
        env:
          SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_URL: https://sfrcsrzuoqdscflfuwik.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
        run: npm run build:render
      - name: Verify Render server output
        run: test -f apps/painel-ldr/.output/server/index.mjs
