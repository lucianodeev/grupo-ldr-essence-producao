name: Calendar OAuth direct validation
on:
  push:
    branches:
      - feat/central-empresas-ldr
    paths:
      - 'apps/painel-ldr/src/lib/google-calendar.server.ts'
      - 'scripts/agenda/calendar.test.mjs'
      - 'scripts/agenda/oauth-setup.test.mjs'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-setup.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-nonce.server.ts'
      - 'apps/painel-ldr/supabase/migrations/20261112000100_calendar_oauth_private_storage.sql'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-http.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-admin.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-storage.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-callback.server.ts'
      - 'scripts/agenda/oauth-storage-schema.test.mjs'
      - '.github/workflows/calendar-oauth-validation.yml'
  pull_request:
    paths:
      - 'apps/painel-ldr/src/lib/google-calendar.server.ts'
      - 'scripts/agenda/calendar.test.mjs'
      - 'scripts/agenda/oauth-setup.test.mjs'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-setup.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-nonce.server.ts'
      - 'apps/painel-ldr/supabase/migrations/20261112000100_calendar_oauth_private_storage.sql'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-http.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-admin.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-storage.server.ts'
      - 'apps/painel-ldr/src/lib/google-calendar-oauth-callback.server.ts'
      - 'scripts/agenda/oauth-storage-schema.test.mjs'
      - '.github/workflows/calendar-oauth-validation.yml'
  workflow_dispatch:
jobs:
  calendar-oauth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate direct Google OAuth calendar client (mocked, no secrets)
        run: node --experimental-strip-types --test scripts/agenda/calendar.test.mjs scripts/agenda/oauth-setup.test.mjs scripts/agenda/oauth-storage-schema.test.mjs
