name: Patch written orientation integration once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch library and master navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          lib=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=lib.read_text(encoding='utf-8')
          anchor='        {card("massage","Massoterapia","bg-[#0F5E7A]")}\n'
          entry='        {card("massage","Massoterapia","bg-[#0F5E7A]")}\n        <a href="/cliente/orientacao-psicanalitica" className="min-w-0 rounded-2xl bg-[#263b63] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">✍️</span><p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">Orientação Escrita</p></a>\n'
          if '/cliente/orientacao-psicanalitica' not in s:
              if anchor not in s: raise SystemExit('library card anchor missing')
              s=s.replace(anchor,entry,1)
              lib.write_text(s,encoding='utf-8')
          admin=Path('apps/painel-ldr/src/routes/_authenticated/admin.tsx')
          a=admin.read_text(encoding='utf-8')
          anchor2='    ["Graduações — Interessados", "/admin/interesses-graduacoes"],\n'
          entry2=anchor2+'    ["Orientações Psicanalíticas Escritas", "/admin/orientacoes-psicanaliticas"],\n'
          if '/admin/orientacoes-psicanaliticas' not in a:
              if anchor2 not in a: raise SystemExit('admin nav anchor missing')
              a=a.replace(anchor2,entry2,1)
              admin.write_text(a,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx apps/painel-ldr/src/routes/_authenticated/admin.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat(painel): integrate written orientation in library and master"
          git push
