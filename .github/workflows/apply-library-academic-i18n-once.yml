name: Apply library academic translations once
on:
  push:
    paths:
      - '.github/workflows/apply-library-academic-i18n-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Translate academic cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text()
          imp='import { libraryCardText, postgraduateCardTitle, undergraduateCardTitle } from "@/lib/library-card-i18n";'
          add='import { libraryAcademicCardText } from "@/lib/library-academic-card-i18n";'
          if add not in s:
              s=s.replace(imp, imp+'\n'+add, 1)
          if 'const ac=libraryAcademicCardText(locale);' not in s:
              s=s.replace('const ct=libraryCardText(locale);','const ct=libraryCardText(locale);\n  const ac=libraryAcademicCardText(locale);',1)
          marker='🎓 Pós-Graduações · Lançamento em breve'
          if marker in s:
              start=s.index(marker)
              end=s.find('</section>',start)
              if end!=-1:
                  chunk=s[start:end]
                  chunk=chunk.replace('undergraduateCardTitle(locale,course.key,course.title)','postgraduateCardTitle(locale,course.key,course.title)')
                  s=s[:start]+chunk+s[end:]
          pairs={
              'Seus conteúdos e próximos passos em um só lugar.':'{t.intro}',
              '🎓 Graduações · Em breve':'{ac.undergradSection}',
              'Futuras graduações LDR':'{ac.undergradTitle}',
              'Propostas acadêmicas preliminares em modelo Live Semipresencial. Conheça as grades e registre seu interesse no lançamento.':'{ac.undergradIntro}',
              '<b className="text-white">Duração prevista:</b>':'<b className="text-white">{ac.duration}</b>',
              ' anos · {course.semesters} semestres':' {ac.years} · {course.semesters} {ac.semesters}',
              '<b className="text-white">Modalidade:</b> 🔴 Live + 🏫 Semipresencial':'<b className="text-white">{ac.modality}</b> {ac.live}',
              '<b className="text-white">Valor:</b> a partir de R$ 99,90/mês*':'<b className="text-white">{ac.value}</b> {ac.from}',
              '>CONHECER A PROPOSTA</a>':'>{ac.know}</a>',
              '🎓 Pós-Graduações · Lançamento em breve':'{ac.postgradSection}',
              'Sua próxima especialização pode começar aqui.':'{ac.postgradTitle}',
              'Novas pós-graduações online estão sendo desenvolvidas para unir conhecimento, mercado e aplicação prática.':'{ac.postgradIntro}',
              '>DESTAQUE</span>':'>{ac.featured}</span>',
              '>Pós-Graduação · Em breve</p>':'>{ac.postgradLabel}</p>',
              '>Tenho interesse</a>':'>{ac.interested}</a>',
              '📚 Formações Profissionais':'{ac.professionalSection}',
              'Formações para desenvolver sua prática profissional':'{ac.professionalTitle}',
              'Acesse as formações já disponíveis na Biblioteca LDR sem alterar suas regras atuais de compra e acesso.':'{ac.professionalIntro}',
          }
          for old,new in pairs.items(): s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git commit -m "fix(painel): translate academic library cards"
          git push