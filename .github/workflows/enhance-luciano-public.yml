name: Enhance Luciano public site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-luciano-public.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply controlled public UX enhancement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/luciano-empreendedor/index.html')
          html = p.read_text(encoding='utf-8')
          marker = 'ldr-public-ux-20260825'
          if marker in html:
              print('Enhancement already present.')
              raise SystemExit(0)

          css = r'''<style id="ldr-public-ux-20260825">
          :root{--ldr-navy:#10233f;--ldr-blue:#173a67;--ldr-gold:#c7a45a;--ldr-cream:#f7f2e8;--ldr-wine:#4b101d;--ldr-wine-deep:#2b0a11}
          #site{background:linear-gradient(180deg,#f7f2e8 0%,#eef3f8 52%,#f7f2e8 100%)!important;color:#172033}
          #site .ldr-home-enhancement{font-family:Montserrat,Arial,sans-serif;padding:clamp(28px,5vw,72px) 20px}
          #site .ldr-wrap{max-width:1120px;margin:0 auto}
          #site .ldr-kicker{font-size:.76rem;text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:var(--ldr-gold)}
          #site .ldr-title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(2rem,4vw,3.8rem);line-height:1.05;margin:.35rem 0 1rem;color:var(--ldr-navy)}
          #site .ldr-lead{font-size:clamp(1rem,1.6vw,1.18rem);line-height:1.7;max-width:780px;color:#455064}
          #site .ldr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}
          #site .ldr-card{background:#fff;border:1px solid rgba(16,35,63,.12);border-radius:20px;padding:clamp(20px,3vw,32px);box-shadow:0 16px 40px rgba(16,35,63,.08)}
          #site .ldr-card h3{font-family:Georgia,'Times New Roman',serif;color:var(--ldr-navy);font-size:1.55rem;margin:0 0 10px}
          #site .ldr-card p{line-height:1.65;color:#566174;margin:.4rem 0}
          #site .ldr-editorial{margin-top:28px;background:linear-gradient(145deg,var(--ldr-wine),var(--ldr-wine-deep));border:2px solid rgba(199,164,90,.72);border-radius:28px;padding:clamp(26px,5vw,56px);color:var(--ldr-cream);box-shadow:0 24px 60px rgba(43,10,17,.22)}
          #site .ldr-editorial .ldr-title{color:var(--ldr-cream)}
          #site .ldr-editorial .ldr-kicker,#site .ldr-editorial strong{color:var(--ldr-gold)}
          #site .ldr-editorial p{color:#f1e8dc;line-height:1.75}
          #site .ldr-quote{font-size:clamp(1.25rem,2.3vw,2rem);text-align:center;margin:1.2rem auto;max-width:850px}
          #site .ldr-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
          #site .ldr-btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:13px 20px;font-weight:800;text-decoration:none;border:1px solid transparent;transition:.2s ease}
          #site .ldr-btn:hover{transform:translateY(-1px)}
          #site .ldr-btn-primary{background:var(--ldr-gold);color:#24190c}
          #site .ldr-btn-secondary{background:transparent;border-color:rgba(247,242,232,.55);color:var(--ldr-cream)}
          #site details.ldr-sample{margin-top:22px;border:1px solid rgba(199,164,90,.55);border-radius:18px;background:rgba(255,255,255,.055);overflow:hidden}
          #site details.ldr-sample summary{cursor:pointer;padding:17px 20px;font-weight:800;color:var(--ldr-gold);list-style:none}
          #site details.ldr-sample summary::-webkit-details-marker{display:none}
          #site .ldr-chapter{padding:4px 20px 22px;max-width:820px}
          #site .ldr-chapter h4{font-family:Georgia,'Times New Roman',serif;font-size:1.55rem;color:var(--ldr-cream);margin:.6rem 0 1rem}
          #site .ldr-chapter p{margin:.85rem 0}
          .ldr-floating{position:fixed;right:18px;bottom:18px;z-index:9998;display:flex;flex-direction:column;gap:10px;align-items:flex-end;font-family:Montserrat,Arial,sans-serif}
          .ldr-floating a{display:flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 17px;text-decoration:none;font-size:.88rem;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.18)}
          .ldr-floating .client{background:var(--ldr-navy);color:white;border:1px solid rgba(255,255,255,.25)}
          .ldr-floating .whatsapp{background:#25D366;color:#092d18}
          body:has(#library.open) .ldr-floating{display:none}
          @media(max-width:760px){#site .ldr-grid{grid-template-columns:1fr}.ldr-floating{right:12px;bottom:12px}.ldr-floating a{padding:11px 14px;font-size:.8rem}#site .ldr-home-enhancement{padding-left:14px;padding-right:14px}}
          </style>'''

          section = r'''<section class="ldr-home-enhancement" aria-labelledby="ldr-journey-title">
            <div class="ldr-wrap">
              <p class="ldr-kicker">Luciano Rodrigues Almeida · Grupo LDR Essence</p>
              <h2 id="ldr-journey-title" class="ldr-title">Ideias ganham força quando entram em movimento.</h2>
              <p class="ldr-lead">Conheça a trajetória, os conteúdos e a plataforma criada para conectar empreendedorismo, desenvolvimento profissional e experiências reais de recomeço.</p>
              <div class="ldr-grid">
                <article class="ldr-card"><p class="ldr-kicker">Sobre o autor</p><h3>Luciano Rodrigues Almeida</h3><p>Psicanalista, mentor, profissional de Gestão de RH e CEO do Grupo LDR Essence. Sua trajetória conecta empreendedorismo, escuta, desenvolvimento humano e construção de projetos.</p></article>
                <article class="ldr-card"><p class="ldr-kicker">O livro</p><h3>O Menino que Vendia Mamão</h3><p>Uma história real sobre coragem, empreendedorismo, escolhas e recomeços. O livro continua a jornada iniciada em <strong>A Coragem de Começar</strong>.</p><p><strong>Compra exclusiva pela Área do Cliente/Biblioteca.</strong></p></article>
              </div>
              <article class="ldr-editorial" id="amostra-gratis">
                <p class="ldr-kicker">Experiência editorial exclusiva</p><h2 class="ldr-title">A CORAGEM<br><strong>DE COMEÇAR</strong></h2>
                <p class="ldr-quote">“O segredo não está no dinheiro — está no movimento.”</p>
                <p style="text-align:center;letter-spacing:.12em;text-transform:uppercase;color:var(--ldr-gold)">Inspirado no eBook · O Menino que Vendia Mamão</p>
                <details class="ldr-sample"><summary>Ler gratuitamente o primeiro capítulo</summary><div class="ldr-chapter">
                  <p class="ldr-kicker">Amostra grátis · somente Capítulo 1</p><h4>Capítulo 1 — O menino que vendia mamão</h4>
                  <p>Antes de conhecer qualquer teoria de vendas, aprendi a oferecer. Ainda criança, vendia mamões na feira e bananas de porta em porta no interior da Bahia.</p>
                  <p>Eu não conhecia a palavra empreendedorismo. Era apenas um menino tentando ajudar, ganhar algum dinheiro e compreender o mundo. Cada porta me ensinava algo: algumas se abriam; outras permaneciam fechadas.</p>
                  <p>Aquele menino não sabia falar sobre resiliência, mas já a praticava. Mais tarde, venderia seu trabalho, apresentaria projetos e ofereceria escuta. O produto mudaria; a vontade de servir, não.</p>
                  <p>Se pudesse voltar àquela feira, eu diria: continue. Cada pessoa que você encontra está preparando a pessoa que um dia se tornará.</p>
                  <p><strong>Fim da amostra gratuita.</strong> Os próximos capítulos permanecem protegidos na Biblioteca.</p>
                </div></details>
                <div class="ldr-actions"><a class="ldr-btn ldr-btn-primary" href="https://painel.ldrrhestrategia.com/cliente/login">Entrar na Área do Cliente</a><a class="ldr-btn ldr-btn-secondary" href="#amostra-gratis">Conhecer o conteúdo</a></div>
              </article>
            </div>
          </section>'''

          floating = r'''<nav class="ldr-floating" aria-label="Acessos rápidos"><a class="client" href="https://painel.ldrrhestrategia.com/cliente/login">Área do Cliente</a><a class="whatsapp" href="https://wa.me/32492923605?text=Ol%C3%A1%2C%20vim%20pelo%20site%20Luciano%20Empreendedor" target="_blank" rel="noreferrer">WhatsApp</a></nav>'''

          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('Estrutura HTML inesperada; abortando sem alterar.')
          site_open = re.search(r'(<(?:div|main|section)[^>]*\bid=["\']site["\'][^>]*>)', html, flags=re.I)
          if not site_open:
              raise SystemExit('Container público #site não encontrado; abortando sem alterar.')
          html = html.replace('</head>', css + '\n</head>', 1)
          site_open = re.search(r'(<(?:div|main|section)[^>]*\bid=["\']site["\'][^>]*>)', html, flags=re.I)
          pos = site_open.end()
          html = html[:pos] + section + html[pos:]
          html = html.replace('</body>', floating + '\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          print('Enhancement applied.')
          PY
      - name: Verify protected library remains present
        run: |
          grep -q 'ldr-public-ux-20260825' apps/luciano-empreendedor/index.html
          grep -Eq 'id=["'"']library["'"']' apps/luciano-empreendedor/index.html
      - name: Commit result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/luciano-empreendedor/index.html
          git commit -m "feat: enhance Luciano public page with sample and quick access"
          git push origin main
