name: Central Empresas validation
on:
  push:
    branches:
      - feat/central-empresas-ldr
  pull_request:
    paths:
      - 'apps/painel-ldr/src/routes/empresas*.tsx'
      - '.github/workflows/central-empresas-validation.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application (Render mode)
        run: npm --prefix apps/painel-ldr run build:render
      - name: Typecheck
        run: npm --prefix apps/painel-ldr run typecheck
      - name: Unit tests
        run: npm --prefix apps/painel-ldr run test
