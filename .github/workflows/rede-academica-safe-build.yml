name: Validate Academic Network Integration

on:
  push:
    branches:
      - feature/rede-academica-20260914
    paths:
      - .github/workflows/rede-academica-safe-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rede-academica-20260914
          fetch-depth: 0

      - name: Apply scoped storefront/library/admin patch
        run: python3 scripts/patch-academic-network-cards-20260914.py

      - name: Validate scoped diff before build
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed={
            'apps/painel-ldr/src/components/academy-university-home.tsx',
            'apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx',
            'apps/painel-ldr/src/routes/_authenticated/admin.tsx',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit(f'Unexpected files changed by patch: {sorted(unexpected)}')
          print('Scoped patch validated:', sorted(changed))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Academy
        run: npm --prefix apps/painel-ldr run build

      - name: Commit validated integration to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/painel-ldr/src/components/academy-university-home.tsx \
            apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx \
            apps/painel-ldr/src/routes/_authenticated/admin.tsx \
            apps/painel-ldr/src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m 'feat(academy): integrate academic network cards and routes'
            git push origin HEAD:feature/rede-academica-20260914
          fi
