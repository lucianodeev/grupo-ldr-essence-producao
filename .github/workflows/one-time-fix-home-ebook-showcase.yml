name: one-time-fix-home-ebook-showcase

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-home-ebook-showcase.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Apply main home ebook showcase fix
        run: python scripts/fix-home-ebook-showcase.py
      - name: Validate diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Build Academy
        run: npm run build:painel
      - name: Commit only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/academy-university-home.tsx
          git rm scripts/fix-home-ebook-showcase.py .github/workflows/one-time-fix-home-ebook-showcase.yml
          git commit -m "fix(academy): show ebook showcase on main sales page"
          git push origin HEAD:main
