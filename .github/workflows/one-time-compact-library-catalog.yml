name: One-time compact academy library catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-compact-library-catalog.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reorganize library without changing validated commerce or content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s=p.read_text(encoding='utf-8')

          # Remove the two redundant catalog renderers from this page only.
          s=s.replace('import { FiveProfessionalFormationCards } from "@/components/five-professional-formation-cards";\n','')
          s=s.replace('import { LibraryStorefront } from "@/components/library-storefront";\n','')
          if 'professional-formations.catalog' not in s:
              s=s.replace('import { AcademicDrawers } from "@/components/academic-drawers";\n', 'import { AcademicDrawers } from "@/components/academic-drawers";\nimport { PROFESSIONAL_FORMATIONS, pfText } from "@/lib/professional-formations.catalog";\n')

          s=s.replace('    <LibraryStorefront locale={locale} progress={learning?.progress ?? []}/>\n\n','')
          s=s.replace('        <div id="formacoes-profissionais" className="scroll-mt-24"><FiveProfessionalFormationCards compact /></div>\n\n','')

          # Subscription copy must reflect the actual allowlist instead of claiming every paid item is included.
          s=s.replace('Uma única assinatura para acessar todos os conteúdos digitais pagos da biblioteca enquanto estiver ativa. Compras avulsas continuam com acesso vitalício.', 'Uma única assinatura para acessar os conteúdos digitais marcados como incluídos enquanto estiver ativa. Compras avulsas continuam com acesso vitalício.')
          s=s.replace('One subscription gives access to all paid digital library content while active. One-time purchases keep lifetime access.', 'One subscription gives access to the digital content marked as included while active. One-time purchases keep lifetime access.')
          s=s.replace("Un seul abonnement donne accès à tous les contenus numériques payants tant qu'il reste actif. Les achats à l'unité restent accessibles à vie.", "Un seul abonnement donne accès aux contenus numériques indiqués comme inclus tant qu'il reste actif. Les achats à l'unité restent accessibles à vie.")
          s=s.replace('Una sola suscripción da acceso a todos los contenidos digitales de pago mientras esté activa. Las compras individuales mantienen acceso de por vida.', 'Una sola suscripción da acceso a los contenidos digitales marcados como incluidos mientras esté activa. Las compras individuales mantienen acceso de por vida.')
          s=s.replace('Cursos, formações, treinamentos, eBooks e livros digitais incluídos', 'Cursos, formações, treinamentos, eBooks e livros marcados como incluídos')
          s=s.replace('Courses, training, eBooks and digital books included', 'Courses, training, eBooks and books marked as included')
          s=s.replace('Cours, formations, eBooks et livres numériques inclus', 'Cours, formations, eBooks et livres indiqués comme inclus')
          s=s.replace('Cursos, formaciones, eBooks y libros digitales incluidos', 'Cursos, formaciones, eBooks y libros marcados como incluidos')

          # Upgrade compact card helper with a discreet access badge.
          old='''  const card=(key:string,label:string,bg:string,icon="grad")=><button onClick={()=>setActive(active===key?null:key)} className={`min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm ${bg} ${active===key?"ring-2 ring-[#d6ad63]":""}`}>{icon==="book"?<BookOpen className="mx-auto h-5 w-5"/>:icon==="film"?<Film className="mx-auto h-5 w-5"/>:<GraduationCap className="mx-auto h-5 w-5"/>}<p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">{label}</p></button>;'''
          new='''  const card=(key:string,label:string,bg:string,icon="grad",status?:string)=><button onClick={()=>setActive(active===key?null:key)} className={`min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm ${bg} ${active===key?"ring-2 ring-[#d6ad63]":""}`}>{icon==="book"?<BookOpen className="mx-auto h-5 w-5"/>:icon==="film"?<Film className="mx-auto h-5 w-5"/>:<GraduationCap className="mx-auto h-5 w-5"/>}<p className="mt-2 text-[8px] font-black leading-none sm:text-[10px]">{label}</p>{status?<span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase tracking-wide text-white sm:text-[7px]">{status}</span>:null}</button>;'''
          if old not in s: raise SystemExit('compact card helper anchor not found')
          s=s.replace(old,new,1)

          # Status labels translated without changing the existing i18n architecture.
          anchor='''  const comments=learning?.comments?.filter((c:any)=>c.product_key)??[];\n'''
          status='''  const accessLabels=locale==="pt"?{included:"INCLUÍDO",single:"AVULSO",free:"GRÁTIS",editorial:"EDITORIAL"}:locale==="fr"?{included:"INCLUS",single:"À L’UNITÉ",free:"GRATUIT",editorial:"ÉDITORIAL"}:locale==="es"?{included:"INCLUIDO",single:"INDIVIDUAL",free:"GRATIS",editorial:"EDITORIAL"}:{included:"INCLUDED",single:"ONE-TIME",free:"FREE",editorial:"EDITORIAL"};\n  const includedProfessionalSlugs=new Set(["vendas-negociacao","marketing-digital","recrutamento-selecao","gestao-administrativa-financeira","comunicacao-oratoria"]);\n'''
          if status not in s:
              if anchor not in s: raise SystemExit('comments anchor not found')
              s=s.replace(anchor,anchor+status,1)

          # Label catalog drawer as the primary course/content menu and keep it expanded by default.
          s=s.replace('<details id="catalogo-ldr" className=', '<details id="catalogo-ldr" open className=',1)
          old_summary='''<summary className="cursor-pointer list-none px-5 py-4 text-sm font-black text-[#0b2341] [&::-webkit-details-marker]:hidden">+ Outros conteúdos e acessos</summary>'''
          new_summary='''<summary className="cursor-pointer list-none px-5 py-4 text-sm font-black text-[#0b2341] [&::-webkit-details-marker]:hidden">{locale==="pt"?"Cursos, conteúdos e acessos":locale==="fr"?"Cours, contenus et accès":locale==="es"?"Cursos, contenidos y accesos":"Courses, content and access"}</summary>'''
          if old_summary in s: s=s.replace(old_summary,new_summary,1)

          # Core cards: preserve existing behavior and add truthful access model badges.
          repl={
            '{card("ebook",ct.ebooks,"bg-[#5b0824]","book")}':'{card("ebook",ct.ebooks,"bg-[#5b0824]","book",accessLabels.included)}',
            '{card("book",ct.books,"bg-[#5b0824]","book")}':'{card("book",ct.books,"bg-[#5b0824]","book",accessLabels.included)}',
            '{card("training",ct.business,"bg-[#d6ad63]")}':'{card("training",ct.business,"bg-[#d6ad63]","grad",accessLabels.included)}',
            '{card("psycho",ct.psycho,"bg-[#5b2b86]")}':'{card("psycho",ct.psycho,"bg-[#5b2b86]","grad",accessLabels.included)}',
            '{card("brief",ct.brief,"bg-[#17645e]")}':'{card("brief",ct.brief,"bg-[#17645e]","grad",accessLabels.included)}',
            '{card("massage",ct.massage,"bg-[#0F5E7A]")}':'{card("massage",ct.massage,"bg-[#0F5E7A]","grad",accessLabels.included)}',
            '{card("business24",ct.business24,"bg-[#c85a24]")}':'{card("business24",ct.business24,"bg-[#c85a24]","grad",accessLabels.included)}',
            '{card("mentor",ct.mentorship,"bg-[#0b5cab]")}':'{card("mentor",ct.mentorship,"bg-[#0b5cab]","grad",accessLabels.included)}',
            '{card("leader",ct.leadership,"bg-[#0f5132]")}':'{card("leader",ct.leadership,"bg-[#0f5132]","grad",accessLabels.included)}',
            '{card("hr",ct.hr,"bg-[#047857]")}':'{card("hr",ct.hr,"bg-[#047857]","grad",accessLabels.included)}',
            '{card("ai","IA","bg-[#143d59]")}':'{card("ai","IA","bg-[#143d59]","grad",accessLabels.single)}',
            '{card("film","Filme","bg-[#35101e]","film")}':'{card("film","Filme","bg-[#35101e]","film")}',
          }
          for a,b in repl.items(): s=s.replace(a,b)

          # Editorial card gets the separate editorial status, preserving its destination.
          s=s.replace('<p className="mt-1 text-[7px] !text-white/80">{ct.editorialSub}</p></a>', '<p className="mt-1 text-[7px] !text-white/80">{ct.editorialSub}</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase text-white">{accessLabels.editorial}</span></a>',1)

          # Replace the single grouped free card with actual free course entry cards.
          s=s.replace('''        {card("free",ct.free,"bg-[#b85c2e]","book")}\n''','''        <a href="/cliente/cursos/organizar-carreira" className="min-w-0 rounded-2xl bg-[#b85c2e] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">💼</span><p className="mt-2 text-[8px] font-black leading-tight sm:text-[10px]">Carreira</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase">{accessLabels.free}</span></a>\n        <a href="/cliente/cursos/frances-negocios-a1" className="min-w-0 rounded-2xl bg-[#123f73] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">🇫🇷</span><p className="mt-2 text-[8px] font-black leading-tight sm:text-[10px]">Francês A1</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase">{accessLabels.free}</span></a>\n        <a href="/cliente/cursos/primeiros-socorros" className="min-w-0 rounded-2xl bg-[#b4232a] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">⛑️</span><p className="mt-2 text-[8px] font-black leading-tight sm:text-[10px]">Primeiros Socorros</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase">{accessLabels.free}</span></a>\n''',1)

          # Add the two existing advanced programs directly to the same compact menu.
          film_anchor='''        {card("film","Filme","bg-[#35101e]","film")}\n'''
          extra='''        <a href="/cliente/treinamentos/psicanalise-internacional" className="min-w-0 rounded-2xl bg-[#24476f] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">🌍</span><p className="mt-2 text-[8px] font-black leading-tight sm:text-[10px]">Psicanálise Internacional</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase">{accessLabels.single}</span></a>\n        <a href="/cliente/psicanalista-alta-performance" className="min-w-0 rounded-2xl bg-[#8a6a2d] px-1 py-4 text-center text-white shadow-sm"><span className="mx-auto block text-lg">📈</span><p className="mt-2 text-[8px] font-black leading-tight sm:text-[10px]">Alta Performance</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase">{accessLabels.single}</span></a>\n'''
          if extra not in s:
              if film_anchor not in s: raise SystemExit('film card anchor not found')
              s=s.replace(film_anchor,extra+film_anchor,1)

          # Every professional formation is now generated from the shared catalog. New entries in that catalog automatically appear here.
          grid_end='''        {card("film","Filme","bg-[#35101e]","film")}\n      </div>'''
          dynamic='''        {card("film","Filme","bg-[#35101e]","film")}\n        {PROFESSIONAL_FORMATIONS.map((f,i)=>{const ft=pfText(f,locale);const included=includedProfessionalSlugs.has(f.slug);const colors=["#0b2341","#5b0824","#17645e","#0F5E7A","#5b2b86","#047857","#9a4f13","#143d59","#263b63","#7a3f16","#0f5132"];return <a key={f.slug} href={f.learnerPath} className="min-w-0 rounded-2xl px-1 py-4 text-center text-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" style={{backgroundColor:colors[i%colors.length]}}><span className="mx-auto block text-lg">{f.icon}</span><p className="mt-2 text-[8px] font-black leading-tight sm:text-[10px]">{ft.short}</p><span className="mt-2 inline-flex rounded-full bg-white/15 px-1.5 py-0.5 text-[6px] font-black uppercase tracking-wide text-white sm:text-[7px]">{included?accessLabels.included:accessLabels.single}</span></a>})}\n      </div>'''
          if 'PROFESSIONAL_FORMATIONS.map((f,i)' not in s:
              if grid_end not in s: raise SystemExit('grid end anchor not found')
              s=s.replace(grid_end,dynamic,1)

          # State the IA commercial rule explicitly in its information panel without changing price or checkout.
          s=s.replace('15 módulos · 225 aulas · 5 projetos avaliativos + Projeto Final.</p>', '15 módulos · 225 aulas · 5 projetos avaliativos + Projeto Final.</p><p className="mt-2 text-xs font-bold text-[#143d59]">Compra avulsa · não incluído na assinatura Biblioteca LDR · acesso vitalício após compra.</p>',1)

          # Mark included core information panels, keeping all existing content and buttons.
          for heading in [
              'Do Mamão ao Negócio','Formação Online em Psicanálise','Formação Negócio em 24 Horas',
              'Formação em Terapia Breve Psicanalítica','Formação Completa em Massoterapia',
              'Formação em Mentoria Profissional e de Carreira','Formação em Liderança e Gestão de Pessoas']:
              needle=f'>{heading}</h3>'
              if needle in s:
                  s=s.replace(needle, needle+'<p className="mt-2 text-xs font-bold text-[#0b2341]">✓ Incluído na assinatura Biblioteca LDR · compra avulsa mantém acesso vitalício.</p>',1)

          # Move the compact catalog immediately after the hero, before subscription and academic drawers.
          start=s.find('    <details id="catalogo-ldr"')
          if start<0: raise SystemExit('catalog details not found')
          end=s.find('    </details>', start)
          if end<0: raise SystemExit('catalog details close not found')
          end += len('    </details>')
          block=s[start:end]
          s=s[:start]+s[end:]
          hero_end=s.find('    </section>', s.find('LDR Plataforma'))
          if hero_end<0: raise SystemExit('hero close not found')
          hero_end += len('    </section>')
          s=s[:hero_end]+'\n\n'+block+s[hero_end:]

          # The older large professional grid is redundant; keep code/data intact but do not render it.
          s=s.replace('<section className="rounded-[28px] border bg-[#fffdf8] p-5 shadow-sm sm:p-7">', '<section className="hidden rounded-[28px] border bg-[#fffdf8] p-5 shadow-sm sm:p-7">',1)

          p.write_text(s,encoding='utf-8')
          PY

          # quick structural assertions; full build is done by Vercel after push
          grep -q 'PROFESSIONAL_FORMATIONS.map' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          grep -q 'Cursos, conteúdos e acessos' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          ! grep -q '<FiveProfessionalFormationCards compact' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          ! grep -q '<LibraryStorefront locale=' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx

      - name: Commit final library organization and remove one-time workflow
        run: |
          git config user.name 'ldr-rh-campanhas'
          git config user.email 'llucianouam@gmail.com'
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git rm .github/workflows/one-time-compact-library-catalog.yml
          git commit -m 'feat: consolidate academy content into compact library menu'
          git push origin main
