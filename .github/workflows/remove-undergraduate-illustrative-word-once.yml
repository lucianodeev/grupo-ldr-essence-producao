name: Remove illustrative wording from undergraduate prices once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update undergraduate price wording only
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx'),
              Path('apps/painel-ldr/src/routes/_clientarea.cliente.graduacao.$courseKey.tsx'),
          ]
          changed = False
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              before = s
              s = s.replace('Valor ilustrativo:', 'Valor:')
              s = s.replace('valor ilustrativo:', 'valor:')
              s = s.replace('Valor meramente ilustrativo.', 'Valor de referência para pré-lançamento.')
              s = s.replace('valor meramente ilustrativo.', 'valor de referência para pré-lançamento.')
              s = s.replace('Valor ilustrativo de lançamento:', 'Valor de lançamento previsto:')
              if s != before:
                  p.write_text(s, encoding='utf-8')
                  changed = True

          if not changed:
              raise SystemExit('Nenhuma ocorrência de "ilustrativo" encontrada nos valores das graduações.')

          # Safety: keep regulatory disclaimer and no checkout/payment logic added.
          library = Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx').read_text(encoding='utf-8')
          assert 'A partir de R$ 99,90/mês' in library
          assert 'Graduações · Em breve' in library
          assert 'instituição de ensino superior devidamente credenciada' in library
          PY
      - name: Commit wording update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes
          git commit -m "fix(painel): remove illustrative wording from undergraduate prices"
          git push
