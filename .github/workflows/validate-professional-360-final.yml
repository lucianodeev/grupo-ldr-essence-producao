name: Validate Professional 360 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-professional-360-final.yml'
  workflow_dispatch:

# Validação final após catálogo LDR, plano 360, S8, administração de preços e termos.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/painel-ldr
        run: npm install --no-audit --no-fund
      - name: Build final main
        working-directory: apps/painel-ldr
        run: npm run build
