          mut_add='  const intlPsychoCheckout=useMutation({mutationFn:(m:"BR"|"INTL")=>intlPsychoCheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});'
          if mut_anchor in s and mut_add not in s:s=s.replace(mut_anchor,mut_anchor+'\n'+mut_add,1)
          ent_anchor='brief:owner||!!brief?.entitled,'
          if ent_anchor in s and 'intlPsycho:owner||!!intlPsycho?.entitled' not in s:s=s.replace(ent_anchor,ent_anchor+'intlPsycho:owner||!!intlPsycho?.entitled,',1)
          # Add compact dedicated block before storefront component when possible.
          marker='      <LibraryStorefront'
          block='''      <section className="mb-6 rounded-[26px] border border-[#1768a6]/30 bg-gradient-to-br from-[#eaf4ff] to-[#fffaf0] p-5 shadow-sm"><div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between"><div><span className="text-[10px] font-black uppercase tracking-[.16em] text-[#1768a6]">🌍 INTERNACIONAL · CURSO PREMIUM</span><h3 className="mt-2 font-serif text-2xl font-bold text-[#071c35]">Psicanálise Internacional, Neurodiversidade e Autismo</h3><p className="mt-2 text-sm text-[#586879]">6–12 meses · 2 encontros ao vivo/mês · pagamento único · fora da assinatura mensal.</p><p className="mt-2 text-sm font-black text-[#071c35]"><span className="mr-2 line-through opacity-40">R$ 697 / € 119</span>R$ 497 / € 89</p></div><div className="flex gap-2">{ent.intlPsycho?<a href="/cliente/treinamentos/psicanalise-internacional" className="rounded-xl bg-[#0d3b70] px-4 py-3 text-sm font-black text-white">{t.open}</a>:<button onClick={()=>intlPsychoCheckout.mutate(market)} className="rounded-xl bg-[#0d3b70] px-4 py-3 text-sm font-black text-white">{t.buy}</button>}<a href="/formacao-psicanalise-internacional" className="rounded-xl border border-[#1768a6]/30 bg-white px-4 py-3 text-sm font-black text-[#0d3b70]">Detalhes</a></div></div></section>\n'''
          if marker in s and '🌍 INTERNACIONAL · CURSO PREMIUM</span><h3' not in s:s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')

          # Remove workflow itself after use.
          Path('.github/workflows/create-international-psychoanalysis-course.yml').unlink()
