name: Create international psychoanalysis course
on:
  push:
    paths:
      - '.github/workflows/create-international-psychoanalysis-course.yml'
permissions:
  contents: write
jobs:
  build-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create course and patch catalog surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('apps/painel-ldr/src')

          curriculum=r'''export type InternationalPsychoanalysisLesson={id:string;title:string;summary:string;content:string[]};
          export type InternationalPsychoanalysisModule={id:number;title:string;focus:string;lessons:InternationalPsychoanalysisLesson[];deeper:{title:string;author:string;year:string;note:string}[];activity:string};

          type Def={title:string;focus:string;topics:string[];sources:string[]};
          const defs:Def[]=[
          {title:"Psicanálise no Cenário Internacional",focus:"História, circulação internacional, diferenças culturais e reconhecimento profissional.",topics:["História internacional da Psicanálise","Diferenças culturais na escuta","Psicanálise, Psicologia e Psiquiatria em diferentes países","Reconhecimento social e institucional","Comparação crítica entre sistemas profissionais"],sources:["Freud — textos técnicos e culturais","IPA e associações nacionais — documentos institucionais"]},
          {title:"Psicanálise na Europa",focus:"Mapear modelos europeus sem tratar a Europa como uma única jurisdição.",topics:["Profissões regulamentadas e atividades livres","Prática privada e instituições","Associações profissionais","Seguros e documentação","Limites de comparação entre países"],sources:["Portais oficiais nacionais","Comissão Europeia — informação institucional"]},
          {title:"Como Pesquisar as Regras de um País",focus:"Método documental para verificar requisitos oficiais antes de atuar.",topics:["Órgãos oficiais e registros","Como ler uma norma","Associações e fontes secundárias","Seguro e documentação","Matriz regulatória por país"],sources:["Portais governamentais","Registros profissionais oficiais"]},
          {title:"Ética na Atuação Internacional",focus:"Responsabilidade, competência, sigilo, encaminhamento e ética intercultural.",topics:["Competência profissional","Sigilo e consentimento","Encaminhamento","Conflitos de interesse","Ética intercultural"],sources:["Códigos éticos pertinentes","Literatura de ética clínica"]},
          {title:"GDPR e Proteção de Dados",focus:"Noções educacionais de proteção de dados aplicadas ao atendimento internacional.",topics:["Princípios do GDPR","Consentimento e bases legais","Prontuários e retenção","WhatsApp, e-mail e formulários","Direitos do titular e incidentes"],sources:["EDPB — European Data Protection Board","Regulamento Geral sobre a Proteção de Dados"]},
          {title:"Atendimento Online Internacional",focus:"Contratos, fuso horário, confidencialidade, emergência e organização digital.",topics:["Contrato e consentimento","Fuso horário e agenda","Pagamentos internacionais","Plano de emergência","Ambiente digital e confidencialidade"],sources:["Boas práticas de teleatendimento","Fontes oficiais de cada jurisdição"]},
          {title:"Construção de Carreira Internacional",focus:"Posicionamento, idiomas, autoridade e presença profissional internacional.",topics:["Posicionamento e nicho","Idiomas e comunicação","Site e presença digital","Autoridade profissional","Plano de carreira internacional"],sources:["Literatura de carreira","Fontes institucionais do país-alvo"]},
          {title:"Captação Ética de Clientes Internacionais",focus:"Networking, conteúdo, indicação e publicidade responsável.",topics:["Conteúdo e autoridade","Comunidades no exterior","Networking","Indicações e parcerias","Limites de publicidade"],sources:["Códigos de publicidade profissional","Literatura de marketing de serviços"]},
          {title:"Precificação Internacional",focus:"Preço, poder de compra, cancelamento, cobrança e sustentabilidade.",topics:["Preço e posicionamento","Real, euro e poder de compra","Política de cancelamento","Meios de pagamento","Sustentabilidade financeira"],sources:["Literatura de precificação","Referências de mercado sem promessa de resultado"]},
          {title:"Migração, Identidade e Sofrimento Psíquico",focus:"Luto migratório, pertencimento, idioma, discriminação e reconstrução de vida.",topics:["Luto migratório","Pertencimento e solidão","Choque cultural","Idioma e relações","Discriminação e reconstrução identitária"],sources:["Literatura sobre migração e saúde mental","Psicanálise e cultura"]},
          {title:"Introdução à Neurodiversidade",focus:"História, linguagem, identidade e crítica à patologização.",topics:["História da neurodiversidade","Modelos de deficiência","Identidade neurodivergente","Linguagem e autonomia","Críticas e limites do conceito"],sources:["Literatura de neurodiversidade","OMS — materiais sobre autismo e desenvolvimento"]},
          {title:"Psicanálise e Autismo",focus:"História das teorias, autores, críticas e limites científicos.",topics:["História psicanalítica do autismo","Autores clássicos e contemporâneos","Críticas históricas","Autismo e subjetividade","Limites científicos e interdisciplinaridade"],sources:["Freud e tradição psicanalítica","OMS e literatura contemporânea sobre autismo"]},
          {title:"Atendimento de Adultos Autistas",focus:"Diagnóstico tardio, relações, trabalho, identidade e adaptação do setting.",topics:["Diagnóstico tardio","Trabalho e vida adulta","Relações e pertencimento","Autonomia e suporte","Adaptação do setting"],sources:["Literatura clínica contemporânea","Perspectivas de adultos autistas"]},
          {title:"Comunicação e Sensorialidade",focus:"Comunicação verbal, não verbal, sensorialidade e ambiente clínico.",topics:["Hipersensibilidade e hipossensibilidade","Ambiente e previsibilidade","Comunicação verbal","Comunicação alternativa","Adaptação clínica"],sources:["Literatura de processamento sensorial","Comunicação aumentativa e alternativa"]},
          {title:"Trabalho Interdisciplinar",focus:"Integração ética com Psicologia, Psiquiatria, Medicina, TO, Fonoaudiologia e Educação.",topics:["Mapa da rede profissional","Encaminhamento","Comunicação entre profissionais","Limites de competência","Plano interdisciplinar"],sources:["Diretrizes interdisciplinares","Fontes profissionais oficiais"]},
          {title:"Autismo, Família e Cuidadores",focus:"Escuta familiar, autonomia, sobrecarga, comunicação e limites.",topics:["Escuta da família","Autonomia da pessoa autista","Sobrecarga do cuidador","Conflitos e comunicação","Ética e limites"],sources:["Literatura familiar","Perspectivas de pessoas autistas e cuidadores"]},
          {title:"Autismo e População LGBTQIAP+",focus:"Identidade, gênero, sexualidade, estigma e interseccionalidade.",topics:["Identidade e pertencimento","Gênero e sexualidade","Estigma e discriminação","Relações e suporte","Interseccionalidade"],sources:["Literatura LGBTQIAP+ e autismo","Direitos humanos e saúde mental"]},
          {title:"Autismo em Contexto Internacional",focus:"Migração, idioma, serviços, educação, trabalho e diferenças culturais.",topics:["Migração e autismo","Idioma e comunicação","Acesso a serviços","Educação e trabalho","Rede de apoio internacional"],sources:["Fontes oficiais locais","Literatura internacional sobre autismo"]},
          {title:"Caso Clínico Internacional Integrado",focus:"Raciocínio clínico com hipóteses concorrentes, limites e encaminhamento.",topics:["Dados versus hipóteses","Formulação clínica","Hipóteses concorrentes","Decisão ética","Plano de encaminhamento"],sources:["Casos clínicos fictícios","Literatura de raciocínio clínico"]},
          {title:"Construção de Carreira Internacional na Prática",focus:"Adaptação, presença profissional, erros, ajustes e planejamento.",topics:["Adaptação profissional","Presença e reputação","Atendimento a brasileiros no exterior","Erros e ajustes","Plano de crescimento"],sources:["Experiência profissional contextualizada","Fontes oficiais do país-alvo"]},
          {title:"Projeto Final — Plano de Internacionalização Profissional",focus:"Síntese aplicada: país-alvo, regras, posicionamento, preço, proteção de dados e plano de 90 dias.",topics:["Escolha do país e público","Dossiê regulatório","Posicionamento e proposta","Preço, dados e riscos","Plano de ação de 90 dias"],sources:["Fontes oficiais do país escolhido","Referências acadêmicas utilizadas ao longo do curso"]},
          ];

          const makeLessons=(m:number,d:Def):InternationalPsychoanalysisLesson[]=>d.topics.map((title,i)=>({
            id:`ipna-m${m}-l${i+1}`,
            title,
            summary:d.focus,
            content:[
              `PROBLEMA CENTRAL — Como ${title.toLowerCase()} deve ser analisado sem transformar uma hipótese clínica, histórica ou regulatória em certeza universal?`,
              `OBJETIVO — Compreender ${title.toLowerCase()} dentro do eixo “${d.title}”, distinguindo fatos verificáveis, conceitos, inferências e limites de competência.`,
              `FUNDAMENTAÇÃO — Estude o tema em contexto histórico e profissional. Localize a origem de cada conceito, o campo ao qual pertence e o problema que pretendia responder.`,
              `LEITURA CRÍTICA — Compare pelo menos duas perspectivas. Identifique convergências, divergências, pressupostos e situações em que cada leitura se torna insuficiente.`,
              `PESQUISA E EVIDÊNCIA — Para artigos contemporâneos, registre pergunta, método, amostra, resultados, limitações e se a conclusão é realmente sustentada pelos dados. Para normas, registre órgão, país, data, escopo e fonte oficial.`,
              `LIMITE EPISTEMOLÓGICO — Formulações psicanalíticas devem ser apresentadas como construções teóricas e clínicas quando esse for seu estatuto; não devem ser convertidas automaticamente em fatos neurobiológicos, jurídicos ou diagnósticos.`,
              `ESTUDO DE CASO — Analise uma situação fictícia internacional relacionada a ${title.toLowerCase()}. Separe dados observáveis, relato do cliente, hipótese principal, hipótese concorrente, informação ausente e decisão provisória.`,
              `DECISÃO ÉTICA — Escreva o que faria, o que não faria, quando buscaria supervisão e quando encaminharia para outro profissional ou serviço.`,
              `ARGUMENTAÇÃO — Redija uma tese de 200 a 350 palavras, apresente a melhor objeção possível à sua tese e responda sem apelar apenas à autoridade de um autor.`,
              `FONTES — ${d.sources.join(' · ')}. Sempre que houver questão legal ou regulatória, priorize a versão oficial e atualizada do país analisado.`,
              `SÍNTESE — Termine a unidade com três colunas: “o que sei”, “o que estou inferindo” e “o que ainda preciso verificar”.`,
            ]
          }));

          export const internationalPsychoanalysisModules:InternationalPsychoanalysisModule[]=defs.map((d,i)=>({
            id:i+1,title:d.title,focus:d.focus,lessons:makeLessons(i+1,d),
            deeper:d.sources.map((s,j)=>({title:s,author:j===0?"Fonte principal":"Fonte complementar",year:"consulta atual",note:"Localize edição, documento ou página oficial atualizada e registre a data de consulta."})),
            activity:`AVALIAÇÃO DO MÓDULO — Produza uma análise argumentada sobre “${d.title}” contendo tese, contraponto, limite epistemológico, aplicação prática, decisão ética e referências comentadas.`
          }));
          export const INTERNATIONAL_PSYCHOANALYSIS_TOTAL_LESSONS=internationalPsychoanalysisModules.reduce((n,m)=>n+m.lessons.length,0);
          export const INTERNATIONAL_PSYCHOANALYSIS_TOTAL_MODULES=internationalPsychoanalysisModules.length;
          '''
          (root/'content/international-psychoanalysis-course.ts').write_text(curriculum,encoding='utf-8')

          functions=r'''import { createServerFn } from "@tanstack/react-start";
          import { requireSupabaseAuth } from "@/integrations/supabase/auth-middleware";
          function emailOf(claims:Record<string,unknown>):string|null{const v=claims["email"];return typeof v==="string"?v:null;}
          export const clientInternationalPsychoanalysisOffer=createServerFn({method:"GET"}).middleware([requireSupabaseAuth]).handler(async({context})=>{const {getInternationalPsychoanalysisOffer}=await import("@/lib/international-psychoanalysis-commerce.server");return getInternationalPsychoanalysisOffer(context.userId,emailOf(context.claims));});
          export const clientCreateInternationalPsychoanalysisCheckout=createServerFn({method:"POST"}).middleware([requireSupabaseAuth]).inputValidator((data:{market:"BR"|"INTL"})=>data).handler(async({context,data})=>{const {createInternationalPsychoanalysisCheckout}=await import("@/lib/international-psychoanalysis-commerce.server");return createInternationalPsychoanalysisCheckout(context.userId,emailOf(context.claims),data.market);});
          '''
          (root/'lib/international-psychoanalysis-commerce.functions.ts').write_text(functions,encoding='utf-8')

          server=r'''import { getRequest } from "@tanstack/react-start/server";
          import { supabaseAdmin } from "@/integrations/supabase/client.server";
          import { resolveClient } from "@/lib/client-portal.server";
          import { hasOwnerDigitalAccess } from "@/lib/owner-digital-access.server";
          const PRODUCT_KEY="curso_psicanalise_internacional_neurodiversidade_autismo";
          const PRODUCT_SLUG="psicanalise-internacional-neurodiversidade-autismo";
          const TITLE="Psicanálise Internacional, Neurodiversidade e Autismo";
          const PRICE_BRL=49_700, PRICE_EUR=8_900, REGULAR_BRL=69_700, REGULAR_EUR=11_900;
          const TOTAL_LESSONS=105, MINIMUM_DAYS=180, MAXIMUM_MONTHS=12;
          type Market="BR"|"INTL"; const db=supabaseAdmin as any;
          function fail(m:string):never{throw new Error(m)}
          async function customerFor(userId:string,email:string|null){const c=await resolveClient(userId,email);if(c.status!=="ok")fail("Acesso do cliente não disponível.");return c.customer;}
          function matches(o:any){const m=(o?.metadata??{}) as Record<string,unknown>;const key=typeof m.product_key==="string"?m.product_key:"";return (o?.catalog_key===PRODUCT_KEY||key===PRODUCT_KEY||key===PRODUCT_SLUG)&&m.source!=="library_subscription";}
          async function paidOrder(customerId:string){const {data,error}=await db.from("orders").select("id,catalog_key,payment_status,metadata,created_at").eq("customer_id",customerId).eq("payment_status","pago").order("created_at",{ascending:false});if(error)fail("Não foi possível verificar a compra.");return (data??[]).find(matches)??null;}
          function appOrigin(){const r=getRequest();return process.env.CLIENT_PANEL_URL?.replace(/\/$/,"")||(r?new URL(r.url).origin:"https://painel.ldrrhestrategia.com");}
          function daysSince(v:string|null|undefined){if(!v)return 0;const t=Date.parse(v);return Number.isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/86400000)):0;}
          async function ensureProgram(){const {data:e}=await db.from("training_programs").select("id,slug,title,status").eq("slug",PRODUCT_SLUG).maybeSingle();if(e){if(e.status!=="published")await db.from("training_programs").update({status:"published"}).eq("id",e.id);return {...e,status:"published"};}const {data,error}=await db.from("training_programs").insert({slug:PRODUCT_SLUG,title:TITLE,description:"Curso livre avançado, 100% online, com duração estimada de 6 a 12 meses e dois encontros ao vivo por mês.",status:"published"}).select("id,slug,title,status").single();if(error||!data)throw error??new Error("Falha ao preparar o curso.");return data;}
          async function ensureEnrollment(customerId:string,entitled:boolean){if(!entitled)return null;try{const t=await ensureProgram();let {data:e}=await db.from("training_enrollments").select("id,enrolled_at,progress_percent,certificate_available_at").eq("training_id",t.id).eq("customer_id",customerId).eq("active",true).maybeSingle();if(!e){const r=await db.from("training_enrollments").insert({training_id:t.id,customer_id:customerId,active:true}).select("id,enrolled_at,progress_percent,certificate_available_at").single();e=r.data??null;}return e;}catch(error){console.warn("international psychoanalysis enrollment skipped",error);return null;}}
          async function savedProgress(customerId:string){const {data}=await db.from("library_progress").select("progress_percent,current_location,updated_at").eq("customer_id",customerId).eq("product_key",PRODUCT_KEY).maybeSingle();return data??null;}
          export async function getInternationalPsychoanalysisOffer(userId:string,email:string|null){const customer=await customerFor(userId,email);const order=await paidOrder(customer.id);const owner=hasOwnerDigitalAccess(email,userId);const entitled=Boolean(order)||owner;const enrollment=await ensureEnrollment(customer.id,entitled);const progress=await savedProgress(customer.id);const enrolledAt=(enrollment?.enrolled_at??order?.created_at??null) as string|null;const elapsedDays=owner?MINIMUM_DAYS:daysSince(enrolledAt);const progressPercent=Number(progress?.progress_percent??enrollment?.progress_percent??0);const certificateEligible=entitled&&elapsedDays>=MINIMUM_DAYS&&progressPercent>=100;return {productKey:PRODUCT_KEY,slug:PRODUCT_SLUG,title:TITLE,priceBrlCents:PRICE_BRL,priceEurCents:PRICE_EUR,regularPriceBrlCents:REGULAR_BRL,regularPriceEurCents:REGULAR_EUR,specialOfferActive:true,entitled,lifetimeAccess:true,includedInLibrarySubscription:false,minimumMonths:6,maximumMonths:MAXIMUM_MONTHS,minimumDays:MINIMUM_DAYS,liveSessionsPerMonth:2,totalModules:21,totalLessons:TOTAL_LESSONS,enrolledAt,elapsedDays,progressPercent,certificateEligible,certificateAvailableAt:certificateEligible?new Date().toISOString():enrollment?.certificate_available_at??null,customerName:customer.fullName??customer.email??"Aluno"};}
          export async function createInternationalPsychoanalysisCheckout(userId:string,email:string|null,market:Market){const customer=await customerFor(userId,email);const offer=await getInternationalPsychoanalysisOffer(userId,email);if(offer.entitled)fail("Este curso já está disponível para sua conta.");const amount=market==="BR"?PRICE_BRL:PRICE_EUR,currency=market==="BR"?"BRL":"EUR";const metadata={product_key:PRODUCT_KEY,training_slug:PRODUCT_SLUG,market,auth_user_id:userId,access_kind:"one_time_only"};const {data:order,error}=await db.from("orders").insert({order_number:"",customer_id:customer.id,contact_email:customer.email,contact_phone:customer.phone,service_type:"produto_digital",title:TITLE,description:"Curso premium independente · pagamento único · acesso vitalício aos conteúdos digitais · não incluído na assinatura",quantity:1,amount_cents:amount,currency,payment_status:"pendente",status:"novo",priority:"media",catalog_key:PRODUCT_KEY,metadata}).select("id").single();if(error||!order)fail("Não foi possível iniciar o pedido.");const secret=process.env.STRIPE_SECRET_KEY;if(!secret){await db.from("orders").delete().eq("id",order.id);fail("Pagamento temporariamente indisponível.");}const p=new URLSearchParams();p.set("mode","payment");p.set("line_items[0][price_data][currency]",currency.toLowerCase());p.set("line_items[0][price_data][unit_amount]",String(amount));p.set("line_items[0][price_data][product_data][name]",TITLE);p.set("line_items[0][quantity]","1");p.set("success_url",`${appOrigin()}/cliente/treinamentos/psicanalise-internacional?payment=success&session_id={CHECKOUT_SESSION_ID}`);p.set("cancel_url",`${appOrigin()}/formacao-psicanalise-internacional?payment=cancel`);p.set("client_reference_id",userId);p.set("metadata[order_id]",order.id);p.set("metadata[product_key]",PRODUCT_KEY);p.set("metadata[training_slug]",PRODUCT_SLUG);p.set("metadata[user_id]",userId);p.set("metadata[market]",market);p.set("payment_intent_data[metadata][order_id]",order.id);p.set("payment_intent_data[metadata][product_key]",PRODUCT_KEY);if(customer.email)p.set("customer_email",customer.email);let response:Response;try{response=await fetch("https://api.stripe.com/v1/checkout/sessions",{method:"POST",headers:{Authorization:`Bearer ${secret}`,"Content-Type":"application/x-www-form-urlencoded"},body:p});}catch{await db.from("orders").delete().eq("id",order.id);fail("Não foi possível abrir o checkout.");}const session=(await response.json()) as {id?:string;url?:string};if(!response.ok||!session.id||!session.url){await db.from("orders").delete().eq("id",order.id);fail("Não foi possível abrir o checkout.");}await db.from("orders").update({stripe_checkout_session_id:session.id,metadata}).eq("id",order.id);return {url:session.url};}
          '''
          (root/'lib/international-psychoanalysis-commerce.server.ts').write_text(server,encoding='utf-8')

          public_component=r'''import { Link } from "@tanstack/react-router";
          import { BookOpen, Clock3, GraduationCap, MessageCircle, ShieldCheck, Video } from "lucide-react";
          import { LanguageSelect } from "@/lib/i18n";
          import { internationalPsychoanalysisModules, INTERNATIONAL_PSYCHOANALYSIS_TOTAL_LESSONS } from "@/content/international-psychoanalysis-course";
          const WA="https://wa.me/32492923605?text=Ol%C3%A1%2C%20quero%20saber%20mais%20sobre%20Psican%C3%A1lise%20Internacional%2C%20Neurodiversidade%20e%20Autismo.";
          export function InternationalPsychoanalysisPage(){return <div className="min-h-screen bg-[#f5f8fc] text-[#071c35]"><header className="sticky top-0 z-40 border-b border-[#d6ad63]/40 bg-[#071c35]/95 text-white backdrop-blur"><div className="mx-auto flex max-w-6xl items-center justify-between px-4 py-3"><Link to="/" className="font-serif text-lg font-bold">LDR Academy</Link><div className="flex items-center gap-2"><a href={WA} target="_blank" rel="noopener noreferrer" className="hidden rounded-full border border-white/20 px-3 py-2 text-xs font-bold sm:inline-flex"><MessageCircle className="mr-2 h-4 w-4"/>Dúvidas</a><LanguageSelect/></div></div></header><main className="mx-auto max-w-6xl space-y-12 px-4 py-8 sm:px-6">
          <section className="overflow-hidden rounded-[2rem] border border-[#d6ad63] bg-gradient-to-br from-[#06172d] via-[#0d3b70] to-[#1768a6] p-6 text-white shadow-2xl sm:p-10"><span className="inline-flex rounded-full bg-[#d6ad63] px-3 py-1.5 text-[11px] font-black uppercase tracking-[.14em] text-[#071c35]">🌍 INTERNACIONAL · CURSO PREMIUM</span><h1 className="mt-5 max-w-5xl font-serif text-4xl font-bold leading-tight sm:text-6xl">Psicanálise Internacional, Neurodiversidade e Autismo</h1><p className="mt-4 max-w-4xl text-lg leading-8 text-white/82">Psicanálise, autismo, neurodiversidade e construção de carreira internacional em um percurso avançado de 6 a 12 meses.</p><div className="mt-6 flex flex-wrap gap-2 text-xs font-bold">{["100% online","6–12 meses","2 encontros ao vivo/mês","21 módulos",`${INTERNATIONAL_PSYCHOANALYSIS_TOTAL_LESSONS} unidades`,`Alto rigor acadêmico","Acesso vitalício"].map(x=><span key={x} className="rounded-full bg-white/10 px-3 py-2">{x}</span>)}</div><div className="mt-7 grid gap-3 sm:grid-cols-2 lg:max-w-3xl"><div className="rounded-2xl bg-white/10 p-5"><p className="text-xs font-black uppercase text-[#f4d78f]">OFERTA ESPECIAL · Brasil</p><p className="mt-2 text-lg text-white/55 line-through">R$ 697</p><p className="text-4xl font-black">R$ 497</p></div><div className="rounded-2xl bg-white/10 p-5"><p className="text-xs font-black uppercase text-[#f4d78f]">OFERTA ESPECIAL · Europa</p><p className="mt-2 text-lg text-white/55 line-through">€ 119</p><p className="text-4xl font-black">€ 89</p></div></div><div className="mt-6 flex flex-col gap-3 sm:flex-row"><a href="/cliente/treinamentos/psicanalise-internacional" className="rounded-xl bg-[#d6ad63] px-5 py-3 text-center text-sm font-black text-[#071c35]">CONHECER E ACESSAR O CURSO</a><a href={WA} target="_blank" rel="noopener noreferrer" className="rounded-xl border border-white/25 px-5 py-3 text-center text-sm font-black">FALAR PELO WHATSAPP</a></div><p className="mt-4 text-xs text-white/65">Produto independente. Não incluído na assinatura mensal da LDR Academy.</p></section>
          <section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">{[[GraduationCap,"21 módulos","Percurso internacional, clínico e profissional."],[BookOpen,`${INTERNATIONAL_PSYCHOANALYSIS_TOTAL_LESSONS} unidades`,"Leitura crítica, casos, pesquisa e produção escrita."],[Clock3,"6–12 meses","Percurso estruturado com acesso vitalício ao conteúdo digital."],[Video,"2 encontros/mês","Casos, dúvidas, artigos, ética e carreira internacional."]].map(([I,t,d]:any)=><article key={t} className="rounded-3xl border border-[#bdd0e3] bg-white p-5 shadow-sm"><I className="h-7 w-7 text-[#1768a6]"/><h2 className="mt-3 font-serif text-2xl font-bold">{t}</h2><p className="mt-2 text-sm leading-6 text-[#5b6b7c]">{d}</p></article>)}</section>
