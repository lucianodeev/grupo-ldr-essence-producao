name: Wire extra product cards v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-extra-product-cards-v3-20260908.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Wire renderer into GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove any stale v2/v3 includes first, then add one clean relative include.
          import re
          s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*extra-product-cards-v[23]\.js[^"\']*["\'][^>]*></script>\s*','\n',s,flags=re.I)
          inc='<script defer src="./extra-product-cards-v3.js?v=20260908-final"></script>'
          if '</body>' not in s:
              raise SystemExit('body close tag not found')
          s=s.replace('</body>',inc+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'extra-product-cards-v3.js?v=20260908-final' index.html
          test -f extra-product-cards-v3.js

      - name: Commit gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix pages: carregar renderer v3 de treinamento e filme'
            git push origin HEAD:gh-pages
          fi
