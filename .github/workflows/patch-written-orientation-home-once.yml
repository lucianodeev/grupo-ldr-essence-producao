name: Patch written orientation home once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add written orientation service to sales home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/painel-ldr/src/components/library-sales-home-access-choice.tsx')
          s=p.read_text(encoding='utf-8')
          if '/cliente/orientacao-psicanalitica' in s:
              raise SystemExit('orientation service already present on sales home')
          anchor='''    <section id="formacoes" className="bg-white py-14"><div className="mx-auto max-w-7xl px-4 sm:px-6"><h2 className="font-serif text-3xl sm:text-4xl">{t.formations}</h2><div className="mt-8 grid gap-6 lg:grid-cols-2">'''
          card='''    <section className="mx-auto max-w-7xl px-4 pt-10 sm:px-6"><article className="overflow-hidden rounded-[30px] border-2 border-[#263b63]/30 bg-gradient-to-br from-[#eef2ff] via-white to-[#f8f3e9] p-7 shadow-sm"><div className="grid gap-6 lg:grid-cols-[1fr_auto] lg:items-center"><div><span className="inline-flex rounded-full bg-[#263b63] px-3 py-1 text-[10px] font-black uppercase tracking-[.14em] text-white">NOVO SERVIÇO · POR TEXTO</span><p className="mt-4 text-xs font-black uppercase tracking-[.18em] text-[#263b63]">ORIENTAÇÃO PSICANALÍTICA ESCRITA</p><h2 className="mt-2 font-serif text-3xl sm:text-4xl">Orientação breve, privada e por escrito</h2><p className="mt-3 max-w-3xl text-sm leading-7 text-slate-600">Converse por texto com um psicanalista em um espaço privado, com fundamentação psicanalítica e científica quando pertinente. O tempo fica pausado enquanto você aguarda a resposta do profissional.</p><div className="mt-4 flex flex-wrap gap-2 text-xs font-black text-[#263b63]"><span className="rounded-full bg-[#263b63]/10 px-3 py-2">10 min · € 0,90 / R$ 5,35 no 1º mês</span><span className="rounded-full bg-[#263b63]/10 px-3 py-2">30 min · € 1,00 / R$ 5,95 no 1º mês</span><span className="rounded-full bg-[#263b63]/10 px-3 py-2">60 min · € 1,90 / R$ 11,30 no 1º mês</span></div><p className="mt-3 text-xs leading-5 text-slate-500">Promoção válida por 30 dias a partir da primeira compra. Depois, € 0,90 a cada 2 minutos, com pacotes disponíveis. Não substitui atendimento de urgência, médico ou psiquiátrico.</p></div><Link to="/cliente/orientacao-psicanalitica" className="rounded-xl bg-[#263b63] px-6 py-4 text-center text-sm font-black text-white shadow-sm">INICIAR ORIENTAÇÃO</Link></div></article></section>\n\n'''
          if anchor not in s:
              raise SystemExit('home anchor missing')
          s=s.replace(anchor,card+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit home card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/components/library-sales-home-access-choice.tsx
          git commit -m "feat(painel): add written orientation to sales home"
          git push
