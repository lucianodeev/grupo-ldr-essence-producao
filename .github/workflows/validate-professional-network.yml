name: Validate LDR Essence Professional Network

on:
  push:
    branches: [main]
    paths:
      - 'apps/painel-ldr/src/lib/professional-*.ts'
      - 'apps/painel-ldr/src/lib/platform-fee*.ts'
      - 'apps/painel-ldr/src/routes/profissional*.tsx'
      - 'apps/painel-ldr/src/routes/profissionais*.tsx'
      - 'apps/painel-ldr/src/routes/para-profissionais.tsx'
      - 'apps/painel-ldr/src/routes/clinica-social*.tsx'
      - 'apps/painel-ldr/src/routes/_authenticated/admin.clinica-social.tsx'
      - 'apps/painel-ldr/src/routes/api/stripe/webhook.ts'
      - 'apps/painel-ldr/src/routes/_authenticated/painel-profissional*.tsx'
      - '.github/workflows/validate-professional-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Lint changed professional route
        id: lint
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: >-
          npx eslint src/routes/profissional-onboarding.tsx
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
          --max-warnings=1
      - name: TypeScript route validation
        id: types
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: >-
          npx esbuild src/routes/profissional-onboarding.tsx
          --bundle --loader:.tsx=tsx --jsx=automatic --format=esm
          --outfile=/tmp/profissional-onboarding.js --external:*
      - name: Financial tests
        id: tests
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: npm test
      - name: Production build
        id: build
        continue-on-error: true
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Quality gate
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPE_RESULT: ${{ steps.types.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "lint=$LINT_RESULT typecheck=$TYPE_RESULT tests=$TEST_RESULT build=$BUILD_RESULT"
          test "$LINT_RESULT" = success
          test "$TYPE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BUILD_RESULT" = success
