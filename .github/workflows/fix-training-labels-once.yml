name: Fix training labels once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-training-labels-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Padronizar labels e bust de cache
        run: |
          python - <<'PY'
          from pathlib import Path
          route = Path('apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx')
          s = route.read_text(encoding='utf-8')
          pairs = [
              ('{product.entitled ? "Disponível" : "Compra necessária"}', '{product.entitled ? "Acesso liberado" : "Disponível para compra"}'),
              ('{trainingOffer?.entitled ? "Disponível" : "Já disponível"}', '{trainingOffer?.entitled ? "Acesso liberado" : "Disponível para compra"}'),
          ]
          for old,new in pairs:
              if old not in s:
                  raise SystemExit(f'Marcador não encontrado: {old}')
              s = s.replace(old,new)
          route.write_text(s,encoding='utf-8')

          index = Path('apps/luciano-empreendedor/index.html')
          i = index.read_text(encoding='utf-8')
          old = '/training-card-v1.js?v=20260902'
          if old in i:
              i = i.replace(old, '/training-card-v1.js?v=20260902c')
              index.write_text(i,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx apps/luciano-empreendedor/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix treinamento: padronizar estados da Biblioteca e limpar cache público'
          git push origin main
