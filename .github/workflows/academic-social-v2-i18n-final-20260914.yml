name: Academic Social V2 I18n Final Build 2026-09-14
on:
  push:
    branches: [fix/rede-academica-i18n-final-20260914]
    paths:
      - 'apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica*'
      - 'apps/painel-ldr/src/lib/academic-social-v2.server.ts'
      - 'tools/patch_academic_social_v2_i18n_finalize_20260914.py'
      - '.github/workflows/academic-social-v2-i18n-final-20260914.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply final targeted integration patch
        run: python tools/patch_academic_social_v2_i18n_finalize_20260914.py
      - name: Install dependencies
        working-directory: apps/painel-ldr
        run: npm ci
      - name: Build Academy
        working-directory: apps/painel-ldr
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/painel-ldr/src/routes/_clientarea.cliente.rede-academica.tsx apps/painel-ldr/src/lib/academic-social-v2.server.ts
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "fix(academy): finalize social i18n navigation and profile media"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Confirm clean generated integration
        run: git status --short
