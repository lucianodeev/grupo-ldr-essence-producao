name: One-time library visual polish
on:
  push:
    paths:
      - '.github/workflows/one-time-library-visual-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mobile-safe library visual polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('apps/painel-ldr/public/ldr/covers')
          root.mkdir(parents=True,exist_ok=True)
          covers={
            'frances-negocios.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2341"/><stop offset="1" stop-color="#14518b"/></linearGradient></defs><rect width="360" height="520" rx="28" fill="url(#g)"/><rect x="34" y="42" width="292" height="170" rx="20" fill="#fff" opacity=".08"/><g transform="translate(95 60)"><rect width="56" height="120" fill="#153f8f"/><rect x="56" width="56" height="120" fill="#fff"/><rect x="112" width="56" height="120" fill="#e64b4b"/></g><text x="180" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">FRANCÊS</text><text x="180" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#e7eef8">PARA NEGÓCIOS</text><rect x="70" y="370" width="220" height="48" rx="24" fill="#d6ad63"/><text x="180" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#162232">CURSO GRATUITO</text></svg>''',
            'terapia-breve.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35101e"/><stop offset="1" stop-color="#7d2747"/></linearGradient></defs><rect width="360" height="520" rx="28" fill="url(#g)"/><circle cx="180" cy="150" r="92" fill="none" stroke="#e9b9c8" stroke-width="8"/><path d="M146 105c-32 18-40 58-23 88 16 29 49 39 76 22 27-16 37-52 21-81-15-28-47-41-74-29zm10 20c17-10 39-2 48 15 10 18 4 40-12 50-17 10-39 4-49-14-10-18-4-41 13-51z" fill="#e9b9c8" opacity=".88"/><text x="180" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#fff">FORMAÇÃO EM</text><text x="180" y="340" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#fff">TERAPIA BREVE</text><text x="180" y="380" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#fff">PSICANALÍTICA</text></svg>''',
            'coragem-comecar.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071426"/><stop offset=".58" stop-color="#173f6b"/><stop offset="1" stop-color="#d18a35"/></linearGradient></defs><rect width="360" height="520" rx="28" fill="url(#g)"/><circle cx="180" cy="340" r="85" fill="#f2b64d" opacity=".85"/><path d="M165 270h30v150h-30z" fill="#10151d"/><circle cx="180" cy="245" r="24" fill="#10151d"/><text x="180" y="88" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">A CORAGEM</text><text x="180" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">DE COMEÇAR</text><text x="180" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">DO SONHO À REALIDADE</text></svg>''',
            'ldr-ciencia.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#221c47"/><stop offset="1" stop-color="#51448d"/></linearGradient></defs><rect width="360" height="360" rx="28" fill="url(#g)"/><circle cx="180" cy="130" r="75" fill="none" stroke="#9ed0ff" stroke-width="6"/><path d="M125 130h110M180 75v110M142 94c46 24 70 60 76 103M218 94c-46 24-70 60-76 103" stroke="#9ed0ff" stroke-width="4" fill="none"/><text x="180" y="260" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#fff">LDR Ciência</text></svg>''',
            'revista-negocios.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b1d6b"/><stop offset="1" stop-color="#241037"/></linearGradient></defs><rect width="360" height="360" rx="28" fill="url(#g)"/><rect x="70" y="70" width="220" height="160" rx="18" fill="#fff" opacity=".08"/><path d="M120 205l38-48 33 28 50-71" stroke="#d6ad63" stroke-width="10" fill="none"/><text x="180" y="275" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">Revista Negócios</text></svg>''',
            'jornal-europa.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143d59"/><stop offset="1" stop-color="#24476f"/></linearGradient></defs><rect width="360" height="360" rx="28" fill="url(#g)"/><circle cx="180" cy="130" r="70" fill="#173d77" stroke="#8ab4ff" stroke-width="5"/><g fill="#ffd84d">'''+''.join([f'<circle cx="{180+58*__import__("math").cos(i*__import__("math").pi/6):.1f}" cy="{130+58*__import__("math").sin(i*__import__("math").pi/6):.1f}" r="5"/>' for i in range(12)])+'''</g><text x="180" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">Jornal Europa</text></svg>''',
            'formacao-ia.svg':'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d2b3f"/><stop offset="1" stop-color="#14518b"/></linearGradient></defs><rect width="360" height="360" rx="28" fill="url(#g)"/><rect x="110" y="70" width="140" height="120" rx="32" fill="#d8f1ff"/><circle cx="152" cy="126" r="12" fill="#14518b"/><circle cx="208" cy="126" r="12" fill="#14518b"/><path d="M150 160h60" stroke="#14518b" stroke-width="8" stroke-linecap="round"/><path d="M180 70V42M110 128H82M250 128h28" stroke="#d6ad63" stroke-width="8" stroke-linecap="round"/><text x="180" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff">Formação em IA</text></svg>'''
          }
          for name,svg in covers.items():
              (root/name).write_text(svg,encoding='utf-8')

          p=Path('apps/painel-ldr/src/components/library-storefront.tsx')
          s=p.read_text(encoding='utf-8')

          helper='''\nconst PROGRESS_META:Record<string,{title:string;href:string;cover:string;free?:boolean}>={\n  curso_gratuito_frances_negocios_a1:{title:"Francês para Negócios",href:"/cliente/cursos/frances-negocios-a1",cover:"/ldr/covers/frances-negocios.svg",free:true},\n  formacao_terapia_breve_psicanalitica:{title:"Formação em Terapia Breve Psicanalítica",href:"/cliente/treinamentos/terapia-breve-psicanalitica",cover:"/ldr/covers/terapia-breve.svg"},\n  ebook_coragem_comecar:{title:"eBook A Coragem de Começar",href:"/cliente/biblioteca/ebook_coragem_comecar",cover:"/ldr/covers/coragem-comecar.svg"},\n};\nconst NOVELTY_COVERS:Record<string,string>={\n  "LDR Ciência":"/ldr/covers/ldr-ciencia.svg",\n  "Revista Negócios":"/ldr/covers/revista-negocios.svg",\n  "Jornal Europa":"/ldr/covers/jornal-europa.svg",\n  "Formação em IA":"/ldr/covers/formacao-ia.svg",\n};\nfunction progressLabel(locale:Locale,free:boolean){return free?(locale==="pt"?"CURSO GRATUITO":locale==="fr"?"COURS GRATUIT":locale==="es"?"CURSO GRATUITO":"FREE COURSE"):(locale==="pt"?"EM ANDAMENTO":locale==="fr"?"EN COURS":locale==="es"?"EN CURSO":"IN PROGRESS");}\nfunction ContinueCard({x,locale}:{x:any;locale:Locale}){\n  const meta=PROGRESS_META[x.product_key]||{title:(x.title||String(x.product_key||"").replaceAll("_"," ")),href:x.href||"/cliente/biblioteca",cover:"/ldr/covers/formacao-ia.svg"};\n  const pct=Math.max(0,Math.min(100,Number(x.progress_percent)||0));\n  return <a href={meta.href} className="group grid min-w-0 grid-cols-[88px_minmax(0,1fr)] gap-4 rounded-[24px] border border-slate-200 bg-white p-3 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md sm:grid-cols-[110px_minmax(0,1fr)] sm:p-4">\n    <img src={meta.cover} alt="" className="h-[122px] w-[88px] rounded-2xl object-cover shadow-sm sm:h-[150px] sm:w-[110px]"/>\n    <div className="min-w-0 self-center">\n      <span className="inline-flex max-w-full rounded-full bg-[#f8edd6] px-2.5 py-1 text-[9px] font-black uppercase tracking-[.08em] text-[#a66f12]">{progressLabel(locale,!!meta.free)}</span>\n      <h3 className="mt-2 line-clamp-2 break-normal font-serif text-[20px] leading-tight text-[#0b2341] sm:text-2xl">{meta.title}</h3>\n      <p className="mt-1 line-clamp-2 break-normal text-xs leading-5 text-slate-500 sm:text-sm">{x.current_location||""}</p>\n      <div className="mt-3 flex items-center gap-3"><div className="h-2 flex-1 overflow-hidden rounded-full bg-slate-100"><div className={`h-full ${pct>0?"bg-[#c08b25]":"bg-[#14518b]"}`} style={{width:`${pct}%`}}/></div><span className="shrink-0 text-xs font-black text-[#0b2341]">{pct}%</span></div>\n      <div className="mt-3 flex items-center justify-end"><span className="inline-flex rounded-full bg-[#14518b] px-4 py-2 text-[11px] font-black text-white">{locale==="pt"?"CONTINUAR →":locale==="fr"?"CONTINUER →":locale==="es"?"CONTINUAR →":"CONTINUE →"}</span></div>\n    </div>\n  </a>;\n}\nfunction NoveltyCard({item,locale,t}:{item:Item;locale:Locale;t:(typeof COPY)[Locale]}){\n  const cover=NOVELTY_COVERS[item.title];\n  return <a href={item.href} className="group flex min-w-0 flex-col overflow-hidden rounded-[24px] border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg">\n    <div className="relative aspect-[16/10] overflow-hidden bg-[#071426]">{cover?<img src={cover} alt="" className="h-full w-full object-cover"/>:<div className="flex h-full items-center justify-center text-5xl">{item.icon}</div>}<span className="absolute right-3 top-3 rounded-full bg-[#d6ad63] px-2.5 py-1 text-[9px] font-black text-[#281605]">{locale==="pt"?"NOVO":locale==="fr"?"NOUVEAU":locale==="es"?"NUEVO":"NEW"}</span></div>\n    <div className="flex flex-1 flex-col p-4"><h3 className="break-normal font-serif text-xl leading-tight text-[#0b2341]">{item.title}</h3><p className="mt-2 line-clamp-2 break-normal text-sm leading-5 text-slate-500">{item.subtitle}</p>{item.price&&<p className="mt-3 break-normal text-sm font-black leading-5 text-[#0b2341]">{item.price}</p>}<span className="mt-4 inline-flex w-full justify-center rounded-xl bg-[#14518b] px-4 py-2.5 text-xs font-black text-white">{t.open}</span></div>\n  </a>;\n}\n'''
          if 'const PROGRESS_META:' not in s:
              marker='export function LibraryStorefront({locale,progress}:{locale:Locale;progress?:any[]}){'
              if marker not in s: raise SystemExit('LibraryStorefront marker not found')
              s=s.replace(marker,helper+'\n'+marker,1)

          new_continue='''    {!searching && progress?.length ? <section id="continuar" className="scroll-mt-24">\n      <Heading icon={<GraduationCap className="h-7 w-7"/>} title={locale==="pt"?"Continue de onde parou":locale==="fr"?"Reprenez où vous en étiez":locale==="es"?"Continúa donde lo dejaste":"Continue where you left off"} desc={locale==="pt"?"Seus últimos conteúdos acessados. Retome seu aprendizado.":locale==="fr"?"Vos derniers contenus consultés. Reprenez votre apprentissage.":locale==="es"?"Tus últimos contenidos consultados. Retoma tu aprendizaje.":"Your latest content. Resume your learning."} label={t.seeAll}/>\n      <div className="grid min-w-0 gap-3">{progress.slice().sort((a:any,b:any)=>new Date(b.updated_at).getTime()-new Date(a.updated_at).getTime()).slice(0,3).map((x:any)=><ContinueCard key={x.id||x.product_key} x={x} locale={locale}/>)}</div>\n    </section>:null}\n\n'''
          s,n=re.subn(r'    \{!searching && progress\?\.length \? <section id="continuar".*?    </section>:null\}\n\n',new_continue,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'continue section replacement failed: {n}')

          new_nov='''    {!searching ? <section id="novidades" className="scroll-mt-24">\n      <Heading icon={<Sparkles className="h-7 w-7"/>} title={locale==="pt"?"Novidades na Biblioteca":locale==="fr"?"Nouveautés de la Bibliothèque":locale==="es"?"Novedades en la Biblioteca":"New in the Library"} desc={locale==="pt"?"Publicações e conteúdos para descobrir agora.":locale==="fr"?"Publications et contenus à découvrir maintenant.":locale==="es"?"Publicaciones y contenidos para descubrir ahora.":"Fresh publications and content to discover now."} label={t.seeAll}/>\n      <div className="grid min-w-0 grid-cols-1 gap-4 min-[520px]:grid-cols-2 lg:grid-cols-4">{[ITEMS[2],ITEMS[3],ITEMS[4],ITEMS[8]].filter(Boolean).map(item=><NoveltyCard key={item.title} item={item} locale={locale} t={t}/>)}</div>\n    </section>:null}\n\n'''
          s,n=re.subn(r'    \{!searching \? <section id="novidades".*?    </section>:null\}\n\n',new_nov,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'novidades section replacement failed: {n}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit polished library UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/painel-ldr/src/components/library-storefront.tsx apps/painel-ldr/public/ldr/covers
          git diff --cached --quiet && exit 0
          git commit -m 'fix(painel): polish library mobile cards and progress covers'
          git pull --rebase origin main
          git push origin HEAD:main
