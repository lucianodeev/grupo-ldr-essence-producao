name: Validate Render custom domain blueprint

on:
  push:
    branches:
      - feat/render-custom-domain-blueprint
    paths:
      - 'render.yaml'
      - '.github/workflows/validate-render-domain-blueprint.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse render.yaml
        run: ruby -e "require 'yaml'; y=YAML.load_file('render.yaml'); abort('missing service') unless y['services']&.any?{|s| s['name']=='ldr-ecossistema-validacao' && s['domains']&.include?('ldracademy.online') }"
      - name: Check service invariants
        run: |
          grep -Fq 'name: ldr-ecossistema-validacao' render.yaml
          grep -Fq 'branch: main' render.yaml
          grep -Fq 'region: frankfurt' render.yaml
          grep -Fq 'domains:' render.yaml
          grep -Fq -- '- ldracademy.online' render.yaml
          grep -Fq 'renderSubdomainPolicy: enabled' render.yaml
