name: Check domain cutover credentials

on:
  push:
    branches:
      - ops/check-domain-cutover-secrets
    paths:
      - '.github/workflows/check-domain-cutover-secrets.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Report credential availability
        shell: bash
        run: |
          test -n "$RENDER_API_KEY" && echo "RENDER_API_KEY=configured" || echo "RENDER_API_KEY=missing"
          test -n "$RENDER_TOKEN" && echo "RENDER_TOKEN=configured" || echo "RENDER_TOKEN=missing"
          test -n "$VERCEL_TOKEN" && echo "VERCEL_TOKEN=configured" || echo "VERCEL_TOKEN=missing"
          test -n "$VERCEL_ACCESS_TOKEN" && echo "VERCEL_ACCESS_TOKEN=configured" || echo "VERCEL_ACCESS_TOKEN=missing"
