name: LDR Recovery Synthetic Catalog Tests
on:
  push:
    branches:
      - fix/ldr-recovery-platform-catalog-reconcile-20261112
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile scripts/agenda/recovery/prepare.py tests/test_recovery_catalog_reconcile.py
      - name: Synthetic-only regression tests (no secrets, database, or production access)
        run: python -m unittest discover -s tests -p test_recovery_catalog_reconcile.py -v
