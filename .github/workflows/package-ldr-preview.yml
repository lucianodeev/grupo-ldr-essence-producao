name: Package LDR Preview

on:
  push:
    paths:
      - '.github/workflows/package-ldr-preview.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify app
        run: |
          test -f apps/painel-ldr/package.json
          test -d apps/painel-ldr/src

      - name: Package painel-ldr
        run: |
          mkdir -p /tmp/ldr-preview
          rsync -a \
            --exclude node_modules \
            --exclude .vercel \
            --exclude dist \
            apps/painel-ldr/ /tmp/ldr-preview/
          cd /tmp/ldr-preview
          zip -qr "$GITHUB_WORKSPACE/ldr-painel-preview.zip" .

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: ldr-painel-preview
          path: ldr-painel-preview.zip
          if-no-files-found: error
          retention-days: 3
