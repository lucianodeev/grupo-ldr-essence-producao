name: Apply psychoanalysis 1200h requirements
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/expand-training-lessons-v1.yml
permissions:
  contents: write
jobs:
  apply-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply psychoanalysis patch
        run: python tools/psychoanalysis_1200h_forum_requirements_v10.py
      - name: Validate production build
        run: |
          corepack enable
          npm install --no-audit --no-fund
          npm run build --workspace apps/painel-ldr
      - name: Commit validated changes
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src/lib/psychoanalysis-commerce.server.ts \
                  apps/painel-ldr/src/lib/training-forum.server.ts \
                  apps/painel-ldr/src/components/psychoanalysis-training-page.tsx \
                  apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.tsx \
                  apps/painel-ldr/src/routes/_clientarea.cliente.treinamentos.psicanalise.certificado.tsx \
                  apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add psychoanalysis 1200h requirements and forum fixes"
          git push origin main
