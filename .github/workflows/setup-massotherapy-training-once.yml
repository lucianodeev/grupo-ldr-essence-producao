name: Setup massotherapy training once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build massotherapy formation and integrate platform
        run: |
          python - <<'PY'
          from pathlib import Path

          root=Path('apps/painel-ldr/src')
          (root/'content').mkdir(parents=True,exist_ok=True)
          (root/'lib').mkdir(parents=True,exist_ok=True)
          (root/'components').mkdir(parents=True,exist_ok=True)
          (root/'routes').mkdir(parents=True,exist_ok=True)

          curriculum = r'''export type MassotherapyLesson={id:string;title:string;summary:string;content:string[]};
export type MassotherapyModule={id:number;title:string;focus:string;lessons:MassotherapyLesson[];activity:string};

type Spec={id:number;title:string;focus:string;blocks:string[]};
const specs:Spec[]=[
{id:1,title:"Fundamentos, Ética e Biossegurança",focus:"História, ética, biossegurança, ambiente profissional, ergonomia e acolhimento.",blocks:["História da massagem, evolução das técnicas, perfil profissional, ética, limites de atuação e legislação aplicável","Higiene pessoal, mãos, EPIs quando indicados, desinfecção de macas, ambiente e descarte de materiais","Preparação da sala, iluminação, música, cromoterapia como recurso de bem-estar, aromaterapia introdutória e óleos/cremes","Ergonomia, postura, biomecânica, prevenção de lesões ocupacionais e alongamento do profissional","Acolhimento, comunicação, consentimento, privacidade, primeiro contato e registro básico"]},
{id:2,title:"Anatomia Humana Essencial",focus:"Planos, eixos, ossos, articulações e referências anatômicas úteis à prática segura.",blocks:["Planos e eixos do corpo, posição, direção, divisões corporais, células e tecidos","Sistema esquelético: funções, crânio, face e coluna cervical, torácica, lombar e sacro","Tórax, costelas, esterno, cintura escapular, braços e mãos","Pelve, membros inferiores, pernas, pés e referências ósseas palpáveis","Articulações, cartilagens, ligamentos, líquido sinovial e limites de mobilidade"]},
{id:3,title:"Fisiologia e Biomecânica Muscular",focus:"Pele, circulação, linfa, sistema nervoso, músculos e fáscia.",blocks:["Pele: epiderme, derme, circulação sanguínea, coração, artérias, veias e retorno venoso","Sistema linfático, linfa, linfonodos, sistema nervoso central/periférico e receptores sensoriais","Fisiologia da contração muscular e resposta ao toque","Músculos da face, pescoço, trapézio, dorsais e peitorais","Deltoide, bíceps, tríceps, glúteos, quadríceps, isquiotibiais, panturrilha e fáscia"]},
{id:4,title:"Massagem Relaxante Clássica / Sueca",focus:"Effleurage, pétrissage, fricção, percussão, vibração e sequência integrada.",blocks:["Benefícios de bem-estar, indicações, contraindicações e deslizamento superficial/profundo","Amassamento, pétrissage, fricção e aquecimento tecidual","Tapotement, vibração, ritmo, intensidade e adequação de pressão","Sequência de costas e membros inferiores em decúbito ventral","Sequência de membros superiores, decúbito dorsal e estrutura de sessão de 60 minutos"]},
{id:5,title:"Drenagem Linfática Manual",focus:"Fundamentos, manobras suaves, direcionamento do fluxo e segurança.",blocks:["Diferenças entre drenagem e massagem, princípios associados a Vodder/Leduc, indicações e contraindicações","Pressão correta, bombeamentos, captação e evacuação com toque suave","Sequência em membros inferiores","Abdômen, flancos e membros superiores","Pescoço, face e integração de protocolo corporal com consentimento e limites profissionais"]},
{id:6,title:"Massagem Estética e Modeladora",focus:"Fundamentos estéticos, manobras, acessórios e cosmetologia básica.",blocks:["Tecido adiposo, fibroedema geloide, flacidez e limites da massagem estética","Ritmo, hiperemia, amassamento, pinçamento e deslizamento vigoroso","Rolos, pantalas e acessórios manuais","Ventosas estéticas e bambuterapia aplicada à estética","Cosmetologia básica, cafeína, centella asiática, frio/calor e protocolo seguro"]},
{id:7,title:"Medicina Tradicional Chinesa e Shiatsu",focus:"Conceitos tradicionais da MTC e prática corporal de Shiatsu sem equipará-los à anatomia biomédica.",blocks:["Qi, Yin/Yang e Cinco Elementos como conceitos tradicionais","Doze meridianos principais e leitura energética tradicional","Pressão com polegares, palmas e cotovelos","Postura, respiração e ergonomia no Shiatsu","Sequências tradicionais em decúbito ventral e dorsal"]},
{id:8,title:"Reflexologia",focus:"Mapas tradicionais, técnicas podais, palmares, auriculares e faciais voltadas ao relaxamento e bem-estar.",blocks:["História, zonas reflexas e mapas tradicionais dos pés","Técnica de caminhada com polegar e prática podal","Mapas palmares e autoaplicação segura","Noções de auriculoterapia com sementes, sem diagnóstico ou promessa terapêutica","Reflexologia facial e protocolos integrados de relaxamento"]},
{id:9,title:"Terapias de Spa e Bem-Estar",focus:"Pedras quentes, bambuterapia, pindas e candle massage com segurança térmica.",blocks:["Pedras quentes, basalto, aquecedores, higienização e segurança","Deslizamentos com pedras e controle rigoroso de temperatura","Bambuterapia: escolha, assepsia e aplicação para bem-estar","Pindas: preparo, aquecimento, ervas e cuidados","Candle massage com cosméticos apropriados e ritual de Spa seguro"]},
{id:10,title:"Massagem Desportiva",focus:"Fisiologia do exercício, preparação, recuperação, mobilidade e limites profissionais.",blocks:["Fibras musculares, fadiga, recuperação e fisiologia do exercício","Abordagem pré-atividade: estímulo, aquecimento e segurança","Abordagem entre atividades e adequação individual","Pós-atividade: conforto, recuperação e redução de percepção de tensão sem alegações de remoção de toxinas","Alongamentos passivos, noções de FNP, mobilidade e sinais de lesão para encaminhamento"]},
{id:11,title:"Liberação Miofascial e Pontos-Gatilho",focus:"Fáscia, técnicas manuais, pontos sensíveis e ferramentas básicas com prudência.",blocks:["Anatomia da fáscia, tecido conjuntivo e restrições de movimento","Liberação superficial, profunda, mãos cruzadas e rolamento da pele","Pontos sensíveis, dor referida e avaliação sem diagnóstico","Pressão sustentada, dosagem, conforto e reavaliação","Ventosas deslizantes, Gua Sha e noções básicas de IASTM com contraindicações"]},
{id:12,title:"Populações Especiais e Condições de Saúde",focus:"Gestantes, idosos, bebês e red flags com adaptações e encaminhamento.",blocks:["Gestação: alterações, posicionamento, conforto, contraindicações e quando solicitar liberação médica","Idosos: pele, fragilidade, osteoporose, artrose e adaptação de pressão","Shantala: vínculo, conforto, higiene, segurança e orientação a responsáveis","Condições musculoesqueléticas como hérnia de disco, ciatalgia e fibromialgia: limites e encaminhamento","Câncer, pós-operatório, trombose, febre, infecção, lesões e sinais de alerta: quando não massagear"]},
{id:13,title:"Avaliação e Anamnese",focus:"Entrevista, observação postural, avaliação palpatória e plano de atendimento.",blocks:["Ficha de anamnese, entrevista, histórico de saúde, medicamentos e contraindicações","Observação postural de assimetrias, hiperlordose, hipercifose e escoliose sem diagnóstico médico","Avaliação palpatória de tensão, textura, sensibilidade, temperatura e edema aparente","Escolha de técnicas e objetivos de bem-estar","Plano de atendimento, registro de evolução, frequência sugerida e critérios de encaminhamento"]},
{id:14,title:"Prática Clínica Orientada",focus:"Estudos de caso fictícios e fluxo completo de atendimento sem simular supervisão presencial inexistente.",blocks:["Caso fictício: desconforto lombar e limites de atuação","Caso fictício: tensão cervical e estresse","Caso fictício: fadiga e cliente fisicamente ativo","Fluxo de atendimento: receber, acolher, anamnese, contraindicações e escolha de técnica","Execução, finalização, registro, autocuidado básico e retorno quando apropriado"]},
{id:15,title:"Empreendedorismo, Marketing e Gestão",focus:"Formalização, finanças, marketing, vendas, fidelização e experiência do cliente.",blocks:["Formalização profissional, obrigações locais, requisitos sanitários e consulta às regras vigentes","Custos, materiais, lavanderia, energia, precificação e fluxo de caixa","Instagram, TikTok, Google, perfil empresarial, conteúdo, fotos e publicidade ética","Pacotes, recorrência, fidelidade, parcerias, academias, espaços de beleza e empresas","Experiência do cliente, pós-venda, satisfação, relacionamento, organização e avaliação final"]},
];
const variants=["Fundamentos e conceitos essenciais","Anatomia e aplicação profissional","Prática segura passo a passo","Revisão, estudo de caso e tomada de decisão"];
function lesson(moduleId:number,index:number,block:string,variant:string):MassotherapyLesson{
 const n=index+1;
 return {id:`m${moduleId}-l${n}`,title:`${block} — ${variant}`,summary:`Aula ${n} do módulo ${moduleId}: estudo aplicado de ${block.toLowerCase()}.`,content:[
  `INTRODUÇÃO — Esta aula apresenta ${block.toLowerCase()} dentro do escopo profissional da massoterapia, priorizando segurança, consentimento, conforto e limites de atuação.`,
  `OBJETIVOS — Ao final, o aluno deverá reconhecer os conceitos centrais, explicar sua aplicação prática, identificar riscos e saber quando interromper o atendimento ou encaminhar a outro profissional.`,
  `CONTEÚDO PRINCIPAL — ${block}. O tema deve ser compreendido em conjunto com anatomia, fisiologia, biossegurança e comunicação profissional, sem confundir massoterapia com diagnóstico médico ou fisioterapêutico.`,
  `APLICAÇÃO PRÁTICA — Treine a sequência de forma lenta e controlada, organize o ambiente, explique o procedimento, peça consentimento e ajuste pressão, ritmo, temperatura ou posicionamento de acordo com o conforto do cliente.`,
  `PONTOS DE ATENÇÃO — Observe dor intensa, alteração súbita de sensibilidade, edema importante, febre, infecção, lesão aguda, mal-estar, uso de medicamentos relevantes ou qualquer sinal incompatível com um atendimento seguro.`,
  `CONTRAINDICAÇÕES E LIMITES — Na dúvida, não execute a técnica. Situações pós-operatórias, oncológicas, vasculares, gestacionais ou com suspeita de lesão exigem avaliação e/ou liberação de profissional de saúde quando aplicável.`,
  `BOAS PRÁTICAS — Higienize mãos e materiais, preserve privacidade, registre informações relevantes, evite promessas de cura, mantenha comunicação clara e respeite a legislação do local de atuação.`,
  `RESUMO E REVISÃO — Escreva três pontos aprendidos, uma contraindicação importante e uma adaptação prática. Pergunta de revisão: qual sinal faria você interromper esta técnica e encaminhar o cliente?`
 ]};
}
export const massotherapyModules:MassotherapyModule[]=specs.map(spec=>{
 const lessons=spec.blocks.flatMap((block,bi)=>variants.map((variant,vi)=>lesson(spec.id,bi*4+vi,block,variant)));
 return {...spec,lessons,activity:`Atividade do módulo ${spec.id}: elabore um protocolo seguro para um caso fictício, descrevendo anamnese, técnica escolhida, adaptações, contraindicações, consentimento e critérios de encaminhamento.`};
});
export const MASSOTHERAPY_TOTAL_LESSONS=massotherapyModules.reduce((s,m)=>s+m.lessons.length,0);
export const MASSOTHERAPY_TOTAL_MODULES=massotherapyModules.length;
'''
          (root/'content/massotherapy-curriculum.ts').write_text(curriculum,encoding='utf-8')

          commerce = r'''import { getRequest } from "@tanstack/react-start/server";
import { supabaseAdmin } from "@/integrations/supabase/client.server";
import { resolveClient } from "@/lib/client-portal.server";
import { hasOwnerDigitalAccess } from "@/lib/owner-digital-access.server";
const PRODUCT_KEY="formacao_massoterapia";
const PRODUCT_SLUG="formacao-completa-massoterapia";
const TITLE="Formação Completa em Massoterapia";
const PRICE_BRL=29_999, PRICE_EUR=4_990, TOTAL_LESSONS=300, TOTAL_HOURS=1200, MINIMUM_DAYS=150, MAXIMUM_MONTHS=12;
type Market="BR"|"INTL"; const db=supabaseAdmin as any;
function fail(message:string):never{throw new Error(message)}
async function customerFor(userId:string,email:string|null){const ctx=await resolveClient(userId,email);if(ctx.status!=="ok")fail("Acesso do cliente não disponível.");return ctx.customer;}
function appOrigin(){const request=getRequest();return process.env.CLIENT_PANEL_URL?.replace(/\/$/,"")||(request?new URL(request.url).origin:"https://painel.ldrrhestrategia.com");}
function daysSince(v:string|null|undefined){if(!v)return 0;const t=Date.parse(v);return Number.isFinite(t)?Math.max(0,Math.floor((Date.now()-t)/86400000)):0;}
function matches(order:any){const m=(order?.metadata??{}) as Record<string,unknown>;const key=typeof m.product_key==="string"?m.product_key:"";return order?.catalog_key===PRODUCT_KEY||key===PRODUCT_KEY||key===PRODUCT_SLUG;}
async function paidOrder(customerId:string){const {data,error}=await db.from("orders").select("id,catalog_key,payment_status,metadata,created_at").eq("customer_id",customerId).eq("payment_status","pago").order("created_at",{ascending:false});if(error)fail("Não foi possível verificar o acesso.");return (data??[]).find(matches)??null;}
async function ensureProgram(){const {data:existing}=await db.from("training_programs").select("id,slug,status").eq("slug",PRODUCT_SLUG).maybeSingle();if(existing){if(existing.status!=="published")await db.from("training_programs").update({status:"published",description:"Formação profissional livre em Massoterapia com 15 módulos, 300 aulas e 1.200 horas. Percurso recomendado de 6 a 12 meses, sem encontros ao vivo nesta etapa."}).eq("id",existing.id);return existing;}const {data,error}=await db.from("training_programs").insert({slug:PRODUCT_SLUG,title:TITLE,description:"Formação profissional livre em Massoterapia com 15 módulos, 300 aulas e 1.200 horas. Percurso recomendado de 6 a 12 meses, sem encontros ao vivo nesta etapa.",status:"published"}).select("id").single();if(error||!data)throw error??new Error("Falha ao preparar a formação.");return data;}
async function ensureEnrollment(customerId:string,entitled:boolean){if(!entitled)return null;try{const training=await ensureProgram();let {data:e}=await db.from("training_enrollments").select("id,enrolled_at,progress_percent,certificate_available_at").eq("training_id",training.id).eq("customer_id",customerId).eq("active",true).maybeSingle();if(!e){const r=await db.from("training_enrollments").insert({training_id:training.id,customer_id:customerId,active:true,product_key:PRODUCT_KEY}).select("id,enrolled_at,progress_percent,certificate_available_at").single();e=r.data;}return e;}catch(error){console.warn("massotherapy enrollment skipped",error);return null;}}
async function savedProgress(customerId:string){const {data}=await db.from("library_progress").select("progress_percent,current_location,updated_at").eq("customer_id",customerId).eq("product_key",PRODUCT_KEY).maybeSingle();return data??null;}
export async function getMassotherapyOffer(userId:string,email:string|null){const customer=await customerFor(userId,email);const order=await paidOrder(customer.id);const owner=hasOwnerDigitalAccess(email,userId);const entitled=Boolean(order)||owner;const enrollment=await ensureEnrollment(customer.id,entitled);const progress=await savedProgress(customer.id);const enrolledAt=(enrollment?.enrolled_at??order?.created_at??null) as string|null;const elapsedDays=owner?MINIMUM_DAYS:daysSince(enrolledAt);const maxUnlockedLesson=owner?TOTAL_LESSONS:Math.min(TOTAL_LESSONS,(elapsedDays+1)*2);const progressPercent=Number(progress?.progress_percent??enrollment?.progress_percent??0);const certificateEligible=entitled&&elapsedDays>=MINIMUM_DAYS&&progressPercent>=100;return {productKey:PRODUCT_KEY,slug:PRODUCT_SLUG,title:TITLE,priceBrlCents:PRICE_BRL,priceEurCents:PRICE_EUR,entitled,lifetimeAccess:true,minimumMonths:6,maximumMonths:MAXIMUM_MONTHS,minimumDays:MINIMUM_DAYS,liveSessionsIncluded:0,totalModules:15,totalLessons:TOTAL_LESSONS,totalHours:TOTAL_HOURS,enrolledAt,elapsedDays,maxUnlockedLesson,progressPercent,certificateEligible,certificateAvailableAt:certificateEligible?new Date().toISOString():enrollment?.certificate_available_at??null,customerName:customer.fullName??customer.full_name??customer.email??"Aluno"};}
export async function createMassotherapyCheckout(userId:string,email:string|null,market:Market){const customer=await customerFor(userId,email);const offer=await getMassotherapyOffer(userId,email);if(offer.entitled)fail("Esta formação já está disponível para sua conta.");const amountCents=market==="BR"?PRICE_BRL:PRICE_EUR;const currency=market==="BR"?"BRL":"EUR";const metadata={product_key:PRODUCT_KEY,training_slug:PRODUCT_SLUG,market,auth_user_id:userId};const {data:order,error}=await db.from("orders").insert({order_number:"",customer_id:customer.id,contact_email:customer.email,contact_phone:customer.phone,service_type:"produto_digital",title:TITLE,description:"Formação Completa em Massoterapia · pagamento único · acesso vitalício ao conteúdo digital",quantity:1,amount_cents:amountCents,currency,payment_status:"pendente",status:"novo",priority:"media",catalog_key:PRODUCT_KEY,metadata}).select("id").single();if(error||!order)fail("Não foi possível iniciar o pedido.");const secret=process.env.STRIPE_SECRET_KEY;if(!secret){await db.from("orders").delete().eq("id",order.id);fail("Pagamento temporariamente indisponível.");}const params=new URLSearchParams();params.set("mode","payment");params.set("line_items[0][price_data][currency]",currency.toLowerCase());params.set("line_items[0][price_data][unit_amount]",String(amountCents));params.set("line_items[0][price_data][product_data][name]",TITLE);params.set("line_items[0][quantity]","1");params.set("success_url",`${appOrigin()}/cliente/biblioteca?payment=success&product=massoterapia&session_id={CHECKOUT_SESSION_ID}`);params.set("cancel_url",`${appOrigin()}/cliente/biblioteca?payment=cancel&product=massoterapia`);params.set("client_reference_id",userId);params.set("metadata[order_id]",order.id);params.set("metadata[product_key]",PRODUCT_KEY);params.set("metadata[training_slug]",PRODUCT_SLUG);params.set("metadata[user_id]",userId);params.set("metadata[market]",market);params.set("payment_intent_data[metadata][order_id]",order.id);params.set("payment_intent_data[metadata][product_key]",PRODUCT_KEY);if(customer.email)params.set("customer_email",customer.email);let response:Response;try{response=await fetch("https://api.stripe.com/v1/checkout/sessions",{method:"POST",headers:{Authorization:`Bearer ${secret}`,"Content-Type":"application/x-www-form-urlencoded"},body:params});}catch{await db.from("orders").delete().eq("id",order.id);fail("Não foi possível abrir o checkout.");}const session=(await response.json()) as {id?:string;url?:string};if(!response.ok||!session.id||!session.url){await db.from("orders").delete().eq("id",order.id);fail("Não foi possível abrir o checkout.");}await db.from("orders").update({stripe_checkout_session_id:session.id,metadata}).eq("id",order.id);return {url:session.url};}
'''
          (root/'lib/massotherapy-commerce.server.ts').write_text(commerce,encoding='utf-8')

          functions = r'''import { createServerFn } from "@tanstack/react-start";
import { requireSupabaseAuth } from "@/integrations/supabase/auth-middleware";
function emailOf(claims:Record<string,unknown>):string|null{const value=claims["email"];return typeof value==="string"?value:null;}
export const clientMassotherapyOffer=createServerFn({method:"GET"}).middleware([requireSupabaseAuth]).handler(async({context})=>{const {getMassotherapyOffer}=await import("@/lib/massotherapy-commerce.server");return getMassotherapyOffer(context.userId,emailOf(context.claims));});
export const clientCreateMassotherapyCheckout=createServerFn({method:"POST"}).middleware([requireSupabaseAuth]).inputValidator((data:{market:"BR"|"INTL"})=>data).handler(async({context,data})=>{const {createMassotherapyCheckout}=await import("@/lib/massotherapy-commerce.server");return createMassotherapyCheckout(context.userId,emailOf(context.claims),data.market);});
'''
          (root/'lib/massotherapy-commerce.functions.ts').write_text(functions,encoding='utf-8')

          learner = r'''import { createFileRoute, Link } from "@tanstack/react-router";
import { useMutation, useQuery } from "@tanstack/react-query";
import { useServerFn } from "@tanstack/react-start";
import { CheckCircle2, ChevronLeft, ChevronRight, LockKeyhole, Sparkles } from "lucide-react";
import { useEffect, useState } from "react";
import { massotherapyModules, MASSOTHERAPY_TOTAL_LESSONS } from "@/content/massotherapy-curriculum";
import { clientMassotherapyOffer, clientCreateMassotherapyCheckout } from "@/lib/massotherapy-commerce.functions";
import { clientSaveProgress } from "@/lib/learning.functions";
export const Route=createFileRoute("/_clientarea/cliente/treinamentos/massoterapia")({component:MassotherapyTrainingExperience});
type Saved={completed:string[];module:number;lesson:number;answers:Record<string,string>}; const EMPTY:Saved={completed:[],module:0,lesson:0,answers:{}}; const KEY="ldr-massotherapy-training-v1";
function loadState():Saved{if(typeof window==="undefined")return EMPTY;try{const p=JSON.parse(localStorage.getItem(KEY)||"");return {...EMPTY,...p,answers:p.answers??{},completed:Array.isArray(p.completed)?p.completed:[]};}catch{return EMPTY;}}
function MassotherapyTrainingExperience(){const offerFn=useServerFn(clientMassotherapyOffer),checkoutFn=useServerFn(clientCreateMassotherapyCheckout),saveProgressFn=useServerFn(clientSaveProgress);const {data:offer,isLoading}=useQuery({queryKey:["massotherapy-offer"],queryFn:()=>offerFn({})});const checkout=useMutation({mutationFn:(market:"BR"|"INTL")=>checkoutFn({data:{market}}),onSuccess:r=>{window.location.href=r.url;}});const [state,setState]=useState<Saved>(EMPTY),[answer,setAnswer]=useState("");useEffect(()=>setState(loadState()),[]);const mod=massotherapyModules[Math.min(state.module,massotherapyModules.length-1)],lesson=mod.lessons[Math.min(state.lesson,mod.lessons.length-1)];const maxUnlocked=Math.max(2,Math.min(MASSOTHERAPY_TOTAL_LESSONS,Number(offer?.maxUnlockedLesson??2)));const currentGlobalIndex=massotherapyModules.slice(0,state.module).reduce((s,m)=>s+m.lessons.length,0)+state.lesson;const nextLocked=currentGlobalIndex+1>=maxUnlocked;useEffect(()=>setAnswer(state.answers[`m${mod.id}`]??""),[mod.id,state.answers]);const progress=Math.round((state.completed.length/MASSOTHERAPY_TOTAL_LESSONS)*100);const persist=(next:Saved)=>{setState(next);try{localStorage.setItem(KEY,JSON.stringify(next));}catch{}const pct=Math.round((next.completed.length/MASSOTHERAPY_TOTAL_LESSONS)*100);const m=massotherapyModules[Math.min(next.module,massotherapyModules.length-1)],l=m.lessons[Math.min(next.lesson,m.lessons.length-1)];saveProgressFn({data:{productKey:"formacao_massoterapia",progressPercent:pct,currentLocation:`Módulo ${massotherapyModules.indexOf(m)+1} · ${l.title}`}}).catch(()=>undefined);};const markDone=()=>persist({...state,completed:state.completed.includes(lesson.id)?state.completed:[...state.completed,lesson.id]});const next=()=>{const completed=state.completed.includes(lesson.id)?state.completed:[...state.completed,lesson.id];if(state.lesson<mod.lessons.length-1)return persist({...state,completed,lesson:state.lesson+1});if(state.module<massotherapyModules.len