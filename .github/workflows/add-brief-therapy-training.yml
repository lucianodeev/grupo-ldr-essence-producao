name: Add brief therapy training
on:
  push:
    paths:
      - '.github/workflows/add-brief-therapy-training.yml'
permissions:
  contents: write
jobs:
  build-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create Formação em Terapia Breve Psicanalítica
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('apps/painel-ldr/src')

          modules=[
          ("História, Epistemologia e Pioneiros", "Fundamentos históricos, epistemológicos e autores centrais da tradição psicodinâmica breve.", [
          "O que define a Psicoterapia Breve Analítica?","O mito da \"psicanálise incompleta\" ou superficial.","Freud e os primeiros tratamentos breves (O caso Katharina e Gustav Mahler).","Sándor Ferenczi: A Técnica Ativa e a elasticidade da clínica.","Otto Rank e a ansiedade de separação: O uso pioneiro do limite de tempo.","A Escola de Chicago: Franz Alexander e Thomas French.","O conceito de Experiência Emocional Corretiva.","A flexibilidade do enquadre clínico segundo Alexander.","Michael Balint e a Terapia Focal (Clínica Tavistock, Londres).","David Malan: Sistematização, triângulos e critérios de seleção.","Peter Sifneos e a STAPP (Psicoterapia Provocadora de Ansiedade).","Habib Davanloo e a ISTDP (Psicoterapia Dinâmica Breve Intensiva).","A Escola Argentina: Pichon-Rivière e a psicanálise social.","Héctor Fiorini: A Teoria e Técnica de Psicoterapias.","Eduardo Braier e a Psicoterapia Breve de Orientação Psicanalítica.","A introdução da Terapia Breve no Brasil (Ryad Simon, Maurício Knobel).","Diferenças Estruturais 1: Objetivos (Reestruturação vs. Resolução Focal).","Diferenças Estruturais 2: Tempo, Regressão e Postura do Analista.","A inserção da Terapia Breve nas instituições e saúde pública.","Revisão do Módulo: O estado da arte da Terapia Breve hoje."]),
          ("Avaliação, Psicodiagnóstico e Triagem", "Avaliação inicial, indicação, contraindicação e formulação psicodinâmica responsável.", [
          "A função da Primeira Entrevista na modalidade breve.","Diferenças entre anamnese médica e entrevista psicodinâmica.","O mapeamento da ansiedade: Como o paciente chega à clínica.","Critérios de Indicação: Quem se beneficia da Terapia Breve?","Capacidade de insight e mentalização (Teste de avaliação na sessão).","Tolerância à frustração e força do Ego.","A importância de investigar o histórico de relações afetivas (Sifneos).","Critérios de Contraindicação Absoluta (Psicoses agudas, risco de suicídio).","Critérios de Contraindicação Relativa (Transtornos de personalidade severos).","O conceito de \"Ansiedade Sinal\" vs. \"Ansiedade Inundante\".","Como investigar o Fator Desencadeante (O que aconteceu há 3 meses?).","Avaliação dos mecanismos de defesa predominantes.","O uso de testes projetivos na avaliação inicial (Visão geral).","A entrevista de devolução: Como comunicar o diagnóstico ao paciente.","O teste de intervenção: Como o paciente reage à primeira interpretação?","Entrevistas conjuntas (inclusão de familiares na fase de avaliação).","A diferença entre o diagnóstico psiquiátrico (DSM/CID) e o psicodinâmico.","Estudo de Caso 1: Paciente ideal para Terapia Breve.","Estudo de Caso 2: Paciente com contraindicação clínica.","Fechamento da avaliação e preparação para o contrato."]),
          ("A Teoria e a Formulação do Foco", "Construção, negociação e revisão do foco terapêutico como bússola do processo breve.", [
          "O que é o Foco Terapêutico? Definições clássicas e contemporâneas.","A estrutura do Foco de Fiorini: Motivo, Gatilho e Conflito.","O Motivo de Consulta: A escuta atenta da queixa manifesta.","Investigando o Gatilho: A crise vital e a ruptura do equilíbrio.","O Conflito Subjacente: Conectando o sintoma atual à história infantil.","A \"Dobradiça\" Clínica: Onde o passado encontra o presente.","Foco de Conflito (Neuroses) vs. Foco de Déficit (Falhas narcísicas).","Como construir a Hipótese Psicodinâmica Básica.","Negociação do Foco: O foco do terapeuta x O foco do paciente.","A técnica da \"Negligência Seletiva\": O que deixar de fora da sessão.","Atenção Seletiva: Como reconduzir o paciente ao eixo do trabalho.","O Triângulo do Conflito de Malan (Defesa, Ansiedade, Sentimento Oculto).","O Triângulo das Pessoas de Malan (Passado, Atual, Terapeuta).","A sobreposição dos Triângulos na formulação do caso.","Reformulação do foco: O que fazer quando surgem dados novos?","Focos comuns: Luto não elaborado e perdas simbólicas.","Focos comuns: Transições de ciclo vital (nascimento, aposentadoria, divórcio).","Exercício Prático 1: Extraindo o foco de um discurso confuso.","Exercício Prático 2: Redigindo a hipótese psicodinâmica.","Revisão: O Foco como a bússola do tratamento breve"]),
          ("Contrato, Enquadre (Setting) e Limite de Tempo", "Contrato, setting, metas e uso clínico responsável do limite de tempo.", [
          "O conceito de Enquadre (Setting) na psicanálise e suas adaptações.","A importância da previsibilidade para o ego em crise.","Como propor o contrato terapêutico ao paciente.","O estabelecimento de metas realistas e alcançáveis.","O limite de tempo como intervenção clínica (Efeito catalisador).","Modelos de tempo: Terapias de prazo fixo (12, 24 sessões) vs. Prazo flexível.","O manejo das faltas e atrasos na Terapia Breve.","Honorários, frequência das sessões e regras de funcionamento.","A ilusão de atemporalidade na psicanálise clássica vs. A realidade do fim.","Como a data de término mobiliza a ansiedade de separação desde o início.","Aliança de Trabalho: Construindo uma equipe contra o sintoma.","O contrato narcísico e o rebaixamento de expectativas idealizadas.","O que fazer quando o paciente quer mudar o foco no meio do processo?","A flexibilidade do enquadre segundo Fiorini.","O uso de medicação concomitante e o contato com psiquiatras.","O \"Setting Interno\" do terapeuta breve.","Contratos de renovação: É possível prorrogar a Terapia Breve?","Como lidar com o paciente que rompe o contrato (Drop-out).","Exercício Prático: Role-play da formulação do contrato.","Revisão: O contrato como âncora do processo."]),
          ("O Papel Ativo do Terapeuta", "Atividade clínica, presença, perguntas, cortes e ética da intervenção diretiva.", [
          "A transição do analista silencioso para o terapeuta ativo.","O que significa \"Atividade\" na Terapia Breve? (Não é dar conselhos).","O conceito de \"Ego Auxiliar\" (Fiorini).","A escuta continente e a postura empática imediata.","Quando e como interromper o paciente (O corte construtivo).","A arte de fazer perguntas: Interrogatório vs. Investigação analítica.","O silêncio na Terapia Breve: Quando é útil e quando é iatrogênico.","A dosagem da ansiedade: Apoiando o ego vs. Desafiando defesas.","O uso do humor e da criatividade na clínica focal.","O terapeuta como modelo de identificação saudável.","A transparência e a autenticidade do terapeuta.","O risco da postura ativa: Invasão, autoritarismo e doutrinação.","O cansaço do terapeuta: O desgaste na clínica intensiva.","A \"assimetria operativa\" na relação terapêutica.","A comunicação não verbal do terapeuta.","Como adaptar o nível de linguagem ao paciente.","O conceito de \"Validação Empática\" antes da interpretação.","O manejo de pacientes muito passivos ou dependentes.","Exercício Prático: Treinamento de intervenções ativas.","Revisão: A ética da intervenção diretiva."]),
          ("O Manejo da Transferência e Contratransferência", "Transferência, contratransferência, aqui-e-agora, supervisão e limites éticos.", [
          "O conceito de Transferência em Freud e sua evolução.","Transferência na Terapia Breve vs. Neurose de Transferência clássica.","O estímulo intencional da Transferência Positiva (Malan e Alexander).","Como utilizar a figura do \"Mago\" ou \"Curador\" a favor do tratamento.","Identificação e manejo precoce da Transferência Negativa.","A transferência erotizada: Como neutralizar sem rejeitar o paciente.","A transferência hostil e os ataques ao enquadre.","O \"Aqui-e-Agora\": Trabalhando a relação na sala de sessão.","O triângulo das pessoas (Malan) aplicado à transferência.","Como evitar a dependência crônica do paciente.","A interpretação transferencial: Quando usar e quando evitar.","Contratransferência: A resposta emocional do terapeuta.","O uso da contratransferência como bússola diagnóstica.","Os perigos da identificação projetiva no terapeuta.","O narcisismo do terapeuta e o desejo de curar (Furor Curandis).","A resistência do terapeuta ao término (Não querer dar alta).","Transferências cruzadas em terapias de casal.","A supervisão como espaço de elaboração contratransferencial.","Análise de Caso: Impasses transferenciais graves.","Revisão: A relação terapêutica como laboratório emocional."]),
          ("Intervenções Clínicas I – Nível de Apoio e Clarificação", "Apoio, assinalamento, clarificação, confrontação e intervenções de base.", [
          "A classificação das intervenções terapêuticas (Fiorini e Braier).","Intervenções de Apoio: Quando e como validar o sofrimento.","O limite do apoio: Evitando a gratificação infantil.","Assinalamentos: Apontando o não verbal e as contradições leves.","A técnica da Interrogação Reflexiva.","Clarificação: Iluminando os pontos cegos do discurso.","Como resumir e devolver o conteúdo ao paciente (Paráfrase clínica).","A Informação Clínica: Quando o terapeuta deve psicoeducar.","Confrontação: O choque de realidade empático.","Como confrontar defesas sem gerar ruptura na aliança.","O uso de metáforas e analogias na Terapia Breve.","O \"Diálogo Socrático\" adaptado à psicanálise.","Intervenções diretivas de controle de crise (Situações agudas).","A sugestão psicanalítica (O legado de Ferenczi).","O trabalho com sonhos na Terapia Breve: Restrição ao foco.","O manejo de sintomas agudos (Ataques de pânico na sessão).","O uso da escrita e de tarefas intersessões (Visão integrativa).","Exercício Prático: Diferenciando Assinalamento, Clarificação e Confrontação.","Role-play: Manejando digressões defensivas.","Revisão: O arsenal técnico de base."]),
          ("Intervenções Clínicas II – A Interpretação Focal", "Timing, profundidade, construção e avaliação da interpretação focal.", [
          "A Interpretação Psicanalítica: Definição e mecanismos.","A diferença entre a interpretação clássica e a Interpretação Focal.","O Timing da interpretação: Quando o paciente está pronto?","A profundidade da interpretação: Interpretando próximo à consciência.","Interpretações genéticas (Passado) vs. Interpretações atuais (Presente).","A Interpretação Mutativa (Strachey).","O trabalho de elaboração (Working-through) em tempo reduzido.","Como construir uma interpretação eficaz.","A Experiência Emocional Corretiva na prática (Alexander).","Interpretando a transferência dentro do foco.","O uso de \"Construções\" em Terapia Breve (Preenchendo lacunas históricas).","Reações à interpretação: Como avaliar se foi bem-sucedida?","O que fazer quando o paciente rejeita a interpretação.","O silêncio após a interpretação.","O perigo das interpretações intelectuais ou \"selvagens\".","Interpretando ganhos secundários do sintoma.","A relação entre a interpretação e a alta terapêutica.","Análise de transcrições de sessões: Dissecando a interpretação.","Exercício Prático: Formulando interpretações a partir de vinhetas.","Revisão: A interpretação como bisturi do foco."]),
          ("Defesas e Resistências", "Reconhecimento das resistências e manejo ético dos mecanismos de defesa.", [
          "O conceito de Resistência (O paradoxo do paciente que não quer mudar).","Os mecanismos de defesa do Ego (Ana Freud).","Resistência na Terapia Breve vs. Psicanálise Clássica.","Identificação de defesas primitivas (Cisão, Projeção, Negação).","Identificação de defesas neuróticas (Recalque, Racionalização, Isolamento).","A intelectualização como barreira para o insight emocional.","O Acting Out (Atuação) e o ataque ao enquadre.","O paciente que chega atrasado, falta ou esquece de pagar.","O paciente que só fala de terceiros (Evitação de si mesmo).","O \"voo para a saúde\": A melhora súbita para fugir da terapia.","Como intervir na resistência sem ser persecutório.","A resistência do paciente hiper-adaptado (O \"falso self\").","O silêncio resistente vs. O silêncio elaborativo.","A sedução como resistência.","Chorar para não pensar: A descarga emocional defensiva.","Resistência à terminação (O retorno dos sintomas no final).","O manejo da agressividade e da desvalorização do terapeuta.","Exercício Prático: Mapeando defesas em casos clínicos.","Role-play: Quebrando a racionalização.","Revisão: Transformando o obstáculo em material de trabalho."]),
          ("O Triângulo do Conflito e das Pessoas – Modelo Tavistock", "Aprofundamento do modelo de Malan, seus triângulos, aplicações e limites.", [
          "Introdução profunda ao pensamento de David Malan.","A contribuição da Clínica Tavistock para a saúde mental.","O Triângulo do Conflito detalhado: Ansiedade, Defesa e Impulso oculto.","O Triângulo das Pessoas detalhado: Outro, Pai/Mãe, Terapeuta (O/P/T).","O link O-P: Conectando os problemas atuais com o passado.","O link O-T: Conectando os problemas atuais com o terapeuta.","O link P-T: Conectando o passado com a transferência.","A interpretação \"T-P-O\": A interpretação completa de Malan.","Como a ISTDP (Davanloo) radicaliza os triângulos.","O desbloqueio do inconsciente: Desafiando a defesa agressivamente.","A liberação de emoções reprimidas (Raiva, culpa, tristeza).","Somatização no triângulo do conflito: Onde o corpo fala.","Casos de sucesso do modelo Malan (Análise do livro Psychotherapy and the Single Patient).","Limitações e críticas ao modelo dos triângulos.","Como integrar Malan e Fiorini na mesma prática.","Exercício Prático: Desenhando os triângulos com histórias reais.","A formulação do caso clínico usando os dois triângulos.","Vídeos ou áudios simulados de sessões no modelo Tavistock.","Role-play: Interpretando o link T-P (Transferência e Passado).","Revisão: A precisão geométrica da interpretação clínica."]),
          ("Clínica das Crises e Lutos", "Crises, lutos, risco, rede de apoio e limites da modalidade breve.", [
          "Teoria da Crise (Caplan): Homeostase, ruptura e reorganização.","Diferença entre Terapia Breve e Intervenção em Crise (Primeiros Socorros Psicológicos).","A psicodinâmica do trauma e do estresse agudo.","O processo normal de luto (Freud: Luto e Melancolia).","O luto complicado, bloqueado ou patológico.","O foco terapêutico no luto: Elaborando a perda.","A culpa do sobrevivente e a raiva direcionada ao objeto perdido.","Crises de transição do ciclo vital (Síndrome do ninho vazio).","Crises de identidade e transições profissionais.","A ruptura conjugal (Divórcio) como foco.","Diagnósticos graves e doenças crônicas (Luto da saúde).","O manejo de pacientes com ideação suicida na Terapia Breve.","O uso de redes de apoio familiar e institucional.","A técnica de esvaziamento emocional em crises agudas.","A resiliência e o crescimento pós-traumático.","A reconstrução da narrativa do paciente após a crise.","Estudo de Caso: Luto paralisado há 5 anos.","Estudo de Caso: Crise adaptativa após demissão.","Limites da modalidade breve em traumas severos (TEPT complexo).","Revisão: O foco focado na restauração do funcionamento."]),
          ("Terapia Breve e Psicossomática", "Relações entre sofrimento psíquico, simbolização, corpo e trabalho multidisciplinar.", [
          "A história da Psicossomática (Groddeck, Marty, Escola de Paris).","O salto do mental para o corpo: A via de descarga somática.","O conceito de Alexitimia (A incapacidade de ler emoções).","O pensamento operatório: Pacientes concretos e sem fantasia.","Como avaliar a capacidade de simbolização na triagem.","O sintoma físico como \"Motivo de Consulta\".","Construindo o foco: A conexão entre o gatilho vital e o surto físico.","Doenças autoimunes, dermatológicas e gastrointestinais na clínica.","A técnica de tradução: Do sintoma corporal para o conflito emocional.","Manejo de defesas em pacientes psicossomáticos (A negação severa).","O trabalho em equipe multidisciplinar (Terapeuta e Médico).","Os ganhos secundários da doença crônica.","Hipocondria vs. Psicossomática na Terapia Breve.","O holding e a continência materna na clínica.","Adaptando o modelo de Malan aos sintomas físicos.","A resistência do paciente: \"Meu problema é só físico, não mental\".","Estudo de Caso: Crises de asma e separação conjugal.","Estudo de Caso: Fibromialgia e raiva reprimida.","Expectativas realistas: Alívio emocional vs. Cura médica.","Revisão: O corpo como palco do conflito focal."]),
          ("Terapia Breve de Casal e Família", "Foco vincular, contrato, neutralidade ativa, risco e manejo de configurações familiares.", [
          "Psicanálise das configurações vinculares (Pichon-Rivière).","A transição da patologia individual para o pacto conjugal inconsciente.","O conceito de \"Foco Conjugal\" ou \"Foco Familiar\".","Triagem de casais: Quando indicar e quando contraindicar Terapia Breve.","O contrato terapêutico com múltiplas pessoas na sala.","A postura do terapeuta: Neutralidade ativa e evitação de coalizões.","O sintoma do filho como porta-voz da crise do casal.","Focos comuns em casais: Infidelidade, sexualidade, finanças, parentalidade.","A técnica de clarificação da comunicação distorcida.","O manejo de segredos na Terapia Breve de Casal.","Transferência e Contratransferência na dinâmica conjugal.","O luto do casamento: Terapia Breve para facilitar o divórcio.","Violência doméstica: Limites éticos e contraindicações da Terapia Breve.","A família como sistema defensivo.","Sessões individuais intercaladas: Vantagens e riscos.","A interpretação focalizada no vínculo, não no indivíduo.","Estudo de Caso: Casal em crise após o nascimento do primeiro filho.","Estudo de Caso: A síndrome do ninho vazio afetando o casamento.","Encerramento na terapia vincular: Avaliando a nova homeostase.","Revisão: A complexidade triádica elevada ao cubo."]),
          ("O Processo de Encerramento e Alta", "Término, separação, avaliação de resultados, recaídas, encaminhamentos e follow-up.", [
          "O fim está no começo: A presença da alta desde a primeira sessão.","A técnica de encerramento em terapias com prazo limite vs. prazo flexível.","O luto da separação terapêutica (Reativação de lutos passados).","A ansiedade de separação do paciente e a regressão final.","A resistência do terapeuta ao fim (Contratransferência na alta).","O retorno dos sintomas originais nas últimas sessões (Voo para a doença).","Avaliação dos Resultados: O que mudou no foco?","Avaliação de Resultados: O que não mudou e precisa ser aceito?","A diferença entre alta, interrupção e abandono.","A consolidação dos insights (Revisão da jornada).","Prevenção de recaídas: Antecipando futuras crises.","A \"criança transferencial\": O desejo de adotar o paciente.","Sessões de Follow-up (Acompanhamento pós-alta a cada 3 ou 6 meses).","Encaminhamentos: Quando a Terapia Breve deve virar longo prazo?","A alta como experiência emocional corretiva (Uma separação saudável).","Rituais de encerramento na prática clínica.","O que fazer quando o limite de tempo chega, mas o paciente está em crise?","Análise das fantasias inconscientes sobre a cura e o término.","Exercício Prático: O discurso de alta e a devolutiva final.","Revisão: A Terapia Breve como um fragmento significativo da vida do paciente."]),
          ("Supervisão, Casos Clínicos e Prática Avançada", "Supervisão, erros técnicos, ética, instituições, pesquisa e integração final.", [
          "A função da supervisão na formação do terapeuta breve.","Erro Técnico 1: Perda do foco terapêutico (Como recuperar).","Erro Técnico 2: Postura passiva (O terapeuta que não corta).","Erro Técnico 3: Postura agressiva (Interpretações persecutórias).","Erro Técnico 4: Complacência com resistências destrutivas.","A redação de relatos de caso e diários clínicos.","Supervisão em Grupo: Apresentação de Casos pelos Alunos - Parte 1.","Supervisão em Grupo: Apresentação de Casos - Parte 2.","Supervisão em Grupo: Apresentação de Casos - Parte 3.","Supervisão em Grupo: Apresentação de Casos - Parte 4.","Ética e sigilo na prática e na publicação de casos.","A inserção da Terapia Breve em Hospitais e Clínicas-Escola.","O uso da Terapia Breve em Plantão Psicológico.","Desafios contemporâneos: Terapia Breve Online (Manejo do enquadre virtual).","Pesquisa em psicoterapia psicanalítica: Eficácia baseada em evidências.","Construção da identidade profissional do Psicoterapeuta Breve.","A importância da análise pessoal do terapeuta.","Integração Final: A Teoria de Fiorini, Malan e Alexander.","Revisão Geral do Curso (Dos fundamentos à alta).","Encerramento do Curso: O limite como potência de vida."])
          ]

          assert len(modules)==15 and all(len(x[2])==20 for x in modules)

          # Curriculum with structured reading content for every lesson.
          out=[]
          out.append('export type BriefTherapyLesson={id:string;title:string;summary:string;content:string[]};')
          out.append('export type BriefTherapyModule={id:number;title:string;focus:string;lessons:BriefTherapyLesson[];deeper:{title:string;author:string;year:string;note:string}[];activity:string};')
          out.append('const safety=(title:string)=>/suic|psicose|violência|medica|trauma|crise aguda|doença|asma|fibromialgia|pânico/i.test(title)?"Atenção ética: este conteúdo é educacional. Situações de risco, urgência, violência ou quadros que exijam avaliação médica, psicológica ou psiquiátrica devem ser encaminhados aos profissionais e serviços competentes. Não se deve interromper medicação nem substituir avaliação profissional regulamentada.":null;')
          out.append('const lesson=(m:number,i:number,title:string,focus:string):BriefTherapyLesson=>{const extra=safety(title);return {id:`tb-m${m}-l${i}`,title,summary:focus,content:[`Objetivo de aprendizagem: compreender “${title}” dentro do eixo do módulo e relacioná-lo aos fundamentos da Terapia Breve Psicanalítica.`,`Desenvolvimento: estude o conceito em seu contexto histórico e clínico, distinguindo hipótese psicodinâmica, observação clínica e diagnóstico regulamentado. Relacione o tema ao foco terapêutico, ao enquadre e aos limites do trabalho breve.`,`Aplicação reflexiva: pense em uma vinheta clínica hipotética e identifique quais perguntas ajudariam a compreender o caso sem transformar conceitos em rótulos ou fórmulas prontas.`,`Síntese: registre os pontos centrais, limites, dúvidas e uma pergunta para supervisão ou encontro ao vivo.`].concat(extra?[extra]:[])};};')
          out.append('export const briefTherapyModules:BriefTherapyModule[]=[')
          refs=[
            ("Teoria e Técnica de Psicoterapias","Héctor Fiorini","1973"),
            ("Short-Term Anxiety-Provoking Psychotherapy","Peter Sifneos","1972"),
            ("Individual Psychotherapy and the Science of Psychodynamics","David Malan","1979"),
            ("Psicoterapia Breve de Orientação Psicanalítica","Eduardo Braier","1984"),
          ]
          for mi,(title,focus,titles) in enumerate(modules,1):
              arr=json.dumps(titles,ensure_ascii=False)
              r=refs[(mi-1)%len(refs)]
              out.append('{id:%d,title:%s,focus:%s,lessons:%s.map((t,i)=>lesson(%d,i+1,t,%s)),deeper:[{title:%s,author:%s,year:%s,note:"Leitura de aprofundamento relacionada ao eixo do módulo; consulte edição legal disponível em sua região."}],activity:%s},' % (mi,json.dumps(title,ensure_ascii=False),json.dumps(focus,ensure_ascii=False),arr,mi,json.dumps(focus,ensure_ascii=False),json.dumps(r[0],ensure_ascii=False),json.dumps(r[1],ensure_ascii=False),json.dumps(r[2]),json.dumps('Elabore uma síntese crítica do módulo e aplique os conceitos a uma vinheta hipotética, explicitando limites éticos, hipóteses e questões que exigiriam supervisão.',ensure_ascii=False)))
          out.append('];')
          out.append('export const BRIEF_THERAPY_TOTAL_LESSONS=briefTherapyModules.reduce((n,m)=>n+m.lessons.length,0);')
          out.append('export const BRIEF_THERAPY_TOTAL_MODULES=briefTherapyModules.length;')
          (root/'content/brief-therapy-curriculum.ts').write_text('\n'.join(out),encoding='utf-8')

          # Commerce: preserve proven psychoanalysis architecture and change only course identity/counters.
