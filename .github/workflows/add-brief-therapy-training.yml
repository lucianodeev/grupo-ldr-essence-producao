          s=s.replace('  const {data:psycho}=useQuery({queryKey:["psycho-offer"],queryFn:()=>psychoFn({})});','  const {data:psycho}=useQuery({queryKey:["psycho-offer"],queryFn:()=>psychoFn({})});\n  const {data:brief}=useQuery({queryKey:["brief-therapy-offer"],queryFn:()=>briefFn({})});',1)
          s=s.replace('  const psychoCheckout=useMutation({mutationFn:(m:"BR"|"INTL")=>psychoCheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});','  const psychoCheckout=useMutation({mutationFn:(m:"BR"|"INTL")=>psychoCheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});\n  const briefCheckout=useMutation({mutationFn:(m:"BR"|"INTL")=>briefCheckoutFn({data:{market:m}}),onSuccess:r=>location.href=r.url});',1)
          s=s.replace('psycho:owner||!!psycho?.entitled,mentor:', 'psycho:owner||!!psycho?.entitled,brief:owner||!!brief?.entitled,mentor:',1)
          s=s.replace('const buyFormation=(kind:"psycho"|"mentor"|"leader",','const buyFormation=(kind:"psycho"|"brief"|"mentor"|"leader",',1)
          s=s.replace('{card("psycho","Psicanálise","bg-[#5b2b86]")}','{card("psycho","Psicanálise","bg-[#5b2b86]")}\n        {card("brief","Terapia Breve","bg-[#17645e]")}',1)
          active_marker=':active==="psycho"?<div><h3 className="font-serif text-xl text-[#32155c]">Formação Online em Psicanálise</h3><p className="mt-2 text-sm text-muted-foreground">14 módulos · 220 unidades · percurso formativo completo.</p>{ent.psycho?<a href="/cliente/treinamentos/psicanalise" className="mt-4 inline-flex w-full justify-center rounded-xl bg-[#5b2b86] px-4 py-3 font-black text-white">Acessar formação</a>:buyFormation("psycho",psychoCheckout,"bg-[#5b2b86]")}</div>'
          brief_active=':active==="brief"?<div><h3 className="font-serif text-xl text-[#103d3a]">Formação em Terapia Breve Psicanalítica</h3><p className="mt-2 text-sm text-muted-foreground">15 módulos · 300 aulas · 1.200 horas · 6 encontros ao vivo.</p>{ent.brief?<a href="/cliente/treinamentos/terapia-breve-psicanalitica" className="mt-4 inline-flex w-full justify-center rounded-xl bg-[#17645e] px-4 py-3 font-black text-white">Acessar formação</a>:buyFormation("brief",briefCheckout,"bg-[#17645e]")}</div>'
          if brief_active not in s:
              if active_marker not in s: raise SystemExit('library active marker missing')
              s=s.replace(active_marker,active_marker+brief_active,1)
          prof_marker='<article className="rounded-2xl border border-[#d9c6ea] bg-[#fbf7ff] p-5"><span className="text-[10px] font-black uppercase tracking-[.12em] text-[#5b2b86]">Psicanálise</span><h3 className="mt-2 font-serif text-xl text-[#32155c]">Formação Online em Psicanálise</h3><p className="mt-2 text-sm text-muted-foreground">14 módulos · 220 unidades · percurso formativo completo.</p>{ent.psycho?<a href="/cliente/treinamentos/psicanalise" className="mt-4 inline-flex w-full justify-center rounded-xl bg-[#5b2b86] px-4 py-3 text-sm font-black text-white">Acessar formação</a>:buyFormation("psycho",psychoCheckout,"bg-[#5b2b86]")}</article>'
          prof_new='<article className="rounded-2xl border border-[#9fc9bf] bg-[#f1faf7] p-5"><span className="text-[10px] font-black uppercase tracking-[.12em] text-[#17645e]">Terapia Breve · 1.200h</span><h3 className="mt-2 font-serif text-xl text-[#103d3a]">Formação em Terapia Breve Psicanalítica</h3><p className="mt-2 text-sm text-muted-foreground">15 módulos · 300 aulas · 1.200 horas · 6 encontros ao vivo.</p>{ent.brief?<a href="/cliente/treinamentos/terapia-breve-psicanalitica" className="mt-4 inline-flex w-full justify-center rounded-xl bg-[#17645e] px-4 py-3 text-sm font-black text-white">Acessar formação</a>:buyFormation("brief",briefCheckout,"bg-[#17645e]")}</article>'
          if prof_new not in s:
              if prof_marker not in s: raise SystemExit('library professional marker missing')
              s=s.replace(prof_marker,prof_marker+'\n        '+prof_new,1)
          s=s.replace('md:grid-cols-2 xl:grid-cols-4">\n        <article className="relative rounded-2xl','md:grid-cols-2 xl:grid-cols-5">\n        <article className="relative rounded-2xl',1)
          comment_marker='<option value="formacao_psicanalise">Psicanálise</option>'
          if 'formacao_terapia_breve_psicanalitica' not in s:
              s=s.replace(comment_marker,comment_marker+'\n          <option value="formacao_terapia_breve_psicanalitica">Terapia Breve Psicanalítica</option>',1)
          p.write_text(s,encoding='utf-8')

          # Verify exact course shape before commit.
          curriculum=(root/'content/brief-therapy-curriculum.ts').read_text(encoding='utf-8')
          assert curriculum.count('lessons:')==15
          assert 'BRIEF_THERAPY_TOTAL_LESSONS' in curriculum
          assert 'formacao_terapia_breve_psicanalitica' in (root/'lib/library-subscription.server.ts').read_text(encoding='utf-8')
          assert 'Formação em Terapia Breve Psicanalítica' in (root/'components/library-sales-home.tsx').read_text(encoding='utf-8')
          assert 'Formação em Terapia Breve Psicanalítica' in p.read_text(encoding='utf-8')
          PY
