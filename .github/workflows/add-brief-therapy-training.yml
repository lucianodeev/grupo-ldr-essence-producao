name: Add brief therapy training
on:
  push:
    paths:
      - '.github/workflows/add-brief-therapy-training.yml'
permissions:
  contents: write
jobs:
  build-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Recover course builder from archived commit
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          source=subprocess.check_output(['git','show','a6b0dd45449656984830f496a122beb9f1969627:.github/workflows/add-brief-therapy-training.yml'],text=True)
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/add_brief_therapy.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python /tmp/add_brief_therapy.py
      - name: Validate generated files
        run: |
          grep -q 'formacao_terapia_breve_psicanalitica' apps/painel-ldr/src/lib/library-subscription.server.ts
          grep -q 'Formação em Terapia Breve Psicanalítica' apps/painel-ldr/src/components/library-sales-home.tsx
          grep -q 'Formação em Terapia Breve Psicanalítica' apps/painel-ldr/src/routes/_clientarea.cliente.biblioteca.tsx
          grep -q 'BRIEF_THERAPY_TOTAL_LESSONS' apps/painel-ldr/src/content/brief-therapy-curriculum.ts
      - name: Commit course
        run: |
          git config user.name "ldr-rh-campanhas"
          git config user.email "llucianouam@gmail.com"
          git add apps/painel-ldr/src
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add brief psychoanalytic therapy training"
          git push origin main
