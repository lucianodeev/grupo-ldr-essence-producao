name: Validate brief therapy build
on:
  push:
    paths:
      - '.github/workflows/validate-brief-therapy-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install for validation
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build panel
        run: npm run build:painel
