name: Validate brief therapy build
on:
  push:
    paths:
      - '.github/workflows/validate-brief-therapy-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/painel-ldr/pnpm-lock.yaml
      - name: Install
        working-directory: apps/painel-ldr
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: apps/painel-ldr
        run: pnpm build
